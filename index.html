“动词（た形）＋ことに”“二类形容词な/一类形容词+ことに”用于表示说话人的心情，前接内容为说话人对主句内容进行主观评价的词语。","cat":"emote","examples":[{"jp":"残念なことに、彼は留学をやめてしまった。","r":"ざんねんなことに、かれはりゅうがくをやめてしまった。","zh":"遗憾的是，他放弃了留学。"},{"jp":"嬉しいことに、合格の知らせが届いた。","r":"うれしいことに、ごうかくのしらせがとどいた。","zh":"令人高兴的是，收到了及格的喜讯。"}]},{"id":"g189","level":"N3","pattern":"～（よう）とする","meaning":"“动词（意志形）+とする”有两种用法，一是表示动作意图或尝试实现某动作，主语多为具有意志的人或动物。","cat":"desire","note":"二是以“ようとしている”的形式表示事情即将发生时的状态，多用于表示自然现象等无意志的动作。","examples":[{"jp":"彼は本を読もうとして、図書館へ行った。","r":"かれはほんをよもうとして、としょかんへいった。","zh":"他想读书，于是去了图书馆。"},{"jp":"夕日が沈もうとしている。","r":"ゆうひがしずもうとしている。","zh":"夕阳正要落下。"}]},{"id":"g190","level":"N3","pattern":"～を～にした～/～を～とした～","meaning":"在“AをBにした+名词”和“AをBとした+名词”两个表达中，B使用“もと、中心、基準”等表示来源、材料或基准等的名词，A表示B的内容。","cat":"view","examples":[{"jp":"この会社は若者を中心としたチームで運営されている。","r":"このかいしゃはわかものをちゅうしんとしたチームでうんえいされている。","zh":"这家公司以年轻人为中心的团队来运营。"},{"jp":"この料理は魚を主にしたもので、あっさりしている。","r":"このりょうりはさかなをおもにしたもので、あっさりしている。","zh":"这道菜以鱼为主，口味清淡。"}]},{"id":"g191","level":"N3","pattern":"～うちに","meaning":"“简体小句+うちに”“名詞の/二类形容词な＋うちに”表示在一定的时间里发生了某动作。","cat":"time","note":"否定形式为“～ないうちに”。","examples":[{"jp":"暗くならないうちに、帰りましょう。","r":"くらくならないうちに、かえりましょう。","zh":"趁天没黑，回去吧。"},{"jp":"若いうちに、いろいろな経験をしたい。","r":"わかいうちに、いろいろなけいけんをしたい。","zh":"想趁年轻多积累各种经验。"},{"jp":"最初は大人しい人だと思っていたが、一緒に仕事をするうちに、実はよくしゃべる人だということが分かってきた。","r":"さいしょはおとなしいひとだとおもっていたが、いっしょにしごとをするうちに、じつはよくしゃべるひとだということがわかってきた。","zh":"起初以为是个文静的人，一起工作的过程中发现他其实很健谈。","src":"2023年7月真题"}],"srcs":["2023年7月真题"]},{"id":"g192","level":"N3","pattern":"～申し上げる","meaning":"动词“申し上げる”是“言う”的自谦语，是抬高对方地位的表达方式。","cat":"honor","note":"还有以“ご/お＋动词（去ます形）+申し上げる”的形式抬高动作接受者的用法。","examples":[{"jp":"ご希望を申し上げてください。","r":"ごきぼうをもうしあげてください。","zh":"请说说您的愿望。"},{"jp":"この度はお世話になりましたことを、心から感謝申し上げます。","r":"このたびはおせわになりましたことを、こころからかんしゃもうしあげます。","zh":"此次承蒙多方关照，在此衷心感谢。"}]},{"id":"g193","level":"N3","pattern":"～次第","meaning":"“动词去ます形”后续“次第”，表示一有动作发生，就立刻进行后一个动作，与“～たら、すぐに”相同。","cat":"time","formation":"动词ます形去ます + 次第","examples":[{"jp":"資料が揃い次第、お知らせします。","r":"しりょうがそろいしだい、おしらせします。","zh":"资料一齐就通知您。"},{"jp":"会議が終わり次第、報告書を送ります。","r":"かいぎがおわりしだい、ほうこくしょをおくります。","zh":"会议一结束，就发送报告书。"}]},{"id":"g194","level":"N3","pattern":"～にひびが入る","meaning":"意为陶器、玻璃、骨头等较硬的物体上出现了裂痕，也比喻人际关系出现了不和谐。","cat":"state","examples":[{"jp":"不注意で、コップにひびが入ってしまった。","r":"ふちゅういで、コップにひびがはいってしまった。","zh":"一不留神，杯子上裂了道缝。"},{"jp":"意見の対立で、二人の関係にひびが入った。","r":"いけんのたいりつで、ふたりのかんけいにひびがはいった。","zh":"由于意见对立，两人的关系出现了裂痕。"}]},{"id":"g195","level":"N3","pattern":"～いいですよ","meaning":"“いいです”除了表示“好”的意思外，还表示“拒绝对方提议”的意思，是拒绝的委婉、礼貌的表达方式。","cat":"emote","examples":[{"jp":"「もう少しコーヒーはいかがですか。」「いいえ、いいですよ。」","r":"「もうすこしコーヒーはいかがですか。」「いいえ、いいですよ。」","zh":"“再添点咖啡怎么样？”“不用了，谢谢。”"},{"jp":"「手伝いましょうか。」「いいえ、いいですよ。大丈夫です。」","r":"「てつだいましょうか。」「いいえ、いいですよ。だいじょうぶです。」","zh":"“要我帮忙吗？”“不用了，谢谢，没事的。”"}]},{"id":"g196","level":"N2","pattern":"～限り","meaning":"“限り”前接表示时间的名词，强调仅限于该时间为止，后续还可接“で”。","cat":"limit","examples":[{"jp":"今日限りで、この店は閉店します。","r":"きょうかぎりで、このみせはへいてんします。","zh":"这家店今天为止就关门了。"},{"jp":"今回限りで、特別に値引きいたします。","r":"こんかいかぎりで、とくべつにねびきいたします。","zh":"仅限这次，予以特别折扣。"}]},{"id":"g197","level":"N3","pattern":"～つつある","meaning":"“动词去ます形”后续“つつある”表示情况逐渐发生变化或动作朝着完成的方向发展。","cat":"change","formation":"动词ます形去ます + つつ/つつある","examples":[{"jp":"悪いと知りつつ、嘘をついた。","r":"わるいとしりつつ、うそをついた。","zh":"明知不好却撒了谎。"},{"jp":"経済は回復しつつある。","r":"けいざいはかいふくしつつある。","zh":"经济正在恢复。"}]},{"id":"g198","level":"N2","pattern":"～には～とある","meaning":"“～には，[引用内容]＋とある”表示引用，即书或文章中记载着该引用内容，是书面表达。","cat":"quote","examples":[{"jp":"この本には、昔の町の様子が写っているとある。","r":"このほんには、むかしのまちのようすがうつっているとある。","zh":"这本书里写着过去城镇的样子。"},{"jp":"案内書には、開館時間は午前9時からとある。","r":"あんないしょには、かいかんじかんはごぜんくじからとある。","zh":"说明册上写着开馆时间是上午九点起。"}]},{"id":"g199","level":"N2","pattern":"～ならびに","meaning":"表示列举，基本用法与“と”相同，列举对象为三个以上时，用“A、B、C…、ならびにX”的形式，只能连接同类事物，是书面语。","cat":"conj","examples":[{"jp":"理事長ならびに教職員の皆様をご紹介します。","r":"りじちょうならびにきょうしょくいんのみなさまをごしょうかいします。","zh":"介绍理事长以及全体教职员工。"},{"jp":"取締役ならびに監査役の任期は2年です。","r":"とりしまりやくならびにかんさやくのにんきはにねんです。","zh":"董事及监事的任期为两年。"}]},{"id":"g200","level":"N2","pattern":"～に伴って","meaning":"“动词简体形+のに伴って”“名词+に伴って”，表示伴随某个重大事件连带发生了另外的事件。","cat":"state","examples":[{"jp":"経済の発展に伴って、人々の生活も豊かになった。","r":"けいざいのはってんにともなって、ひとびとのせいかつもゆたかになった。","zh":"随着经济发展，人们的生活也富裕起来。"},{"jp":"台風の接近に伴って、風が強くなってきた。","r":"たいふうのせっきんにともなって、かぜがつよくなってきた。","zh":"随着台风临近，风越来越大。"}]},{"id":"g201","level":"N2","pattern":"～のもと（で）","meaning":"“もと”表示位置靠下的部位，“名词+のもと”可以表示支配关系，影响关系以及状况等。","cat":"view","examples":[{"jp":"専門家の指導のもとで、研究を進めている。","r":"せんもんかのしどうのもとで、けんきゅうをすすめている。","zh":"在专家的指导下推进研究。"},{"jp":"この事業は政府の支援のもとに行われている。","r":"このじぎょうはせいふのしえんのもとにおこなわれている。","zh":"这项事业是在政府支持下进行的。"}]},{"id":"g202","level":"N2","pattern":"～のもとになる","meaning":"表示成为某物体的原料的某种东西。","cat":"view","examples":[{"jp":"米は、酒の原料のもとになる。","r":"こめは、さけのげんりょうのもとになる。","zh":"大米是酿酒的基本原料。"},{"jp":"失敗は成功のもとになると言われる。","r":"しっぱいはせいこうのもとになるといわれる。","zh":"人们说失败是成功之母。"}]},{"id":"g203","level":"N2","pattern":"～一方（で）、～","meaning":"“动词（基本形）+一方（で）,～”表示有两个不同的动作同时进行，且没有主次之分。","cat":"conj","examples":[{"jp":"彼は仕事をする一方で、ボランティア活動も続けている。","r":"かれはしごとをするいっぽうで、ボランティアかつどうもつづけている。","zh":"他一面工作，一面坚持做志愿活动。"},{"jp":"会社に勤める一方で、大学院にも通っている。","r":"かいしゃにつとめるいっぽうで、だいがくいんにもかよっている。","zh":"他在公司上班的同时，还在读研究生。"}]},{"id":"g204","level":"N2","pattern":"～と同時に","meaning":"“动词简体形/一类形容词+と同時に”与“二类形容词/名词+であると同時に”都表示两个不同事件同时成立，前后句可用不同主语。","cat":"conj","examples":[{"jp":"結婚すると同時に、海外へ引っ越した。","r":"けっこんするとどうじに、かいがいへひっこした。","zh":"结婚的同时，搬去了海外。"},{"jp":"この商品は品質がいいと同時に、値段も手頃だ。","r":"このしょうひんはひんしつがいいとどうじに、ねだんもてごろだ。","zh":"这个商品质量好，价格也合适。"}]},{"id":"g205","level":"N2","pattern":"～と思ったら、～","meaning":"“动词（た形）+と思ったら”表示动作一发生就出现了意外的事情。","cat":"time","examples":[{"jp":"電車が発車したと思ったら、急に止まった。","r":"でんしゃがはっしゃしたとおもったら、きゅうにとまった。","zh":"刚以为电车发车了，突然又停了。"},{"jp":"彼が来たと思ったら、また帰ってしまった。","r":"かれがきたとおもったら、またかえってしまった。","zh":"刚以为他来了，又回去了。"}]},{"id":"g206","level":"N2","pattern":"～だらけ","meaning":"“名词+だらけ”表示“～很多”“满是～”“沾满了～”等意思，通常为不好的事物。","cat":"limit","examples":[{"jp":"古い部屋は、ほこりだらけだった。","r":"ふるいへやは、ほこりだらけだった。","zh":"旧房间里满是灰尘。"},{"jp":"この書類は、ミスだらけだ。","r":"このしょるいは、ミスだらけだ。","zh":"这份文件错误百出。"}]},{"id":"g207","level":"N2","pattern":"～というより（も）","meaning":"“简体小句+というより（も）”表示用更确切的说法来表达主张或者为自己的表达换一种说法，后续常接副词“むしろ”，“与其…倒不如”。","cat":"reverse","examples":[{"jp":"彼は先生というより、むしろ友人のようだ。","r":"かれはせんせいというより、むしろゆうじんのようだ。","zh":"与其说他是老师，倒不如说更像朋友。"},{"jp":"この問題は難しいというより、面倒だ。","r":"このもんだいはむずかしいというより、めんどうだ。","zh":"这个问题与其说难，不如说麻烦。"}]},{"id":"g208","level":"N2","pattern":"～ばかりで（は）なく～","meaning":"“简体小句/名词+ばかりで（は）なく”表示不仅仅是这种要素，还有其他的。","cat":"conj","examples":[{"jp":"彼は日本語が話せるばかりではなく、読むこともできる。","r":"かれはにほんごがはなせるばかりではなく、よむこともできる。","zh":"他不仅会说日语，也能读。"},{"jp":"この店は味がいいばかりでなく、雰囲気も良い。","r":"このみせはあじがいいばかりでなく、ふんいきもよい。","zh":"这家店不仅味道好，氛围也好。"}]},{"id":"g209","level":"N2","pattern":"～に関わる","meaning":"用“名词1+に関わる+名词2”的形式，表示名词2是和名词1联系在一起的。","cat":"quote","examples":[{"jp":"人の命に関わる問題なので、真剣に考えなければならない。","r":"ひとのいのちにかかわるもんだいなので、しんけんにかんがえなければならない。","zh":"因为是关乎人命的问题，必须认真对待。"},{"jp":"この仕事は会社の信用に関わる。","r":"このしごとはかいしゃのしんようにかかわる。","zh":"这项工作关系到公司的信誉。"}]},{"id":"g210","level":"N2","pattern":"～を境に","meaning":"“Aを境にB”用以表示以某件事为分水岭，前后状况变化很大。","cat":"time","examples":[{"jp":"結婚を境に、彼の生活は大きく変わった。","r":"けっこんをさかいに、かれのせいかつはおおきくかわった。","zh":"以结婚为分水岭，他的生活发生了很大变化。"},{"jp":"この事件を境に、二人は疎遠になった。","r":"このじけんをさかいに、ふたりはそえんになった。","zh":"以这次事件为转折，两人变得疏远了。"}]},{"id":"g211","level":"N2","pattern":"～ずつ","meaning":"表示在某动作反复进行时，一次动作所实现的数量或份量。","cat":"count","note":"如“2人ずつ座る（每两个人一起坐）”。","examples":[{"jp":"一人ずつ順番に自己紹介をしてください。","r":"ひとりずつじゅんばんにじこしょうかいをしてください。","zh":"请一个一个按顺序做自我介绍。"},{"jp":"毎日少しずつ貯金している。","r":"まいにちすこしずつちょきんしている。","zh":"每天一点一点地存钱。"}]},{"id":"g212","level":"N2","pattern":"～必ずしも～ない","meaning":"表示部分否定或不强烈的否定。","cat":"negative","note":"含有与预想不同，并非总是如此的含义。","examples":[{"jp":"大学生は必ずしもみんな勉強熱心とは限らない。","r":"だいがくせいはかならずしもみんなべんきょうねっしんとはかぎらない。","zh":"大学生未必都用功。"},{"jp":"値段が高いものが、必ずしもいいとは限らない。","r":"ねだんがたかいものが、かならずしもいいとはかぎらない。","zh":"贵的东西未必就好。"}]},{"id":"g213","level":"N2","pattern":"～をはじめ","meaning":"“名词+を+はじめ～”表示列举出最具代表性的要素。","cat":"limit","examples":[{"jp":"東京をはじめ、全国各地で地震が観測された。","r":"とうきょうをはじめ、ぜんこくかくちでじしんがかんそくされた。","zh":"以东京为首，全国各地都观测到了地震。"},{"jp":"社長をはじめ、社員全員が出席した。","r":"しゃちょうをはじめ、しゃいんぜんいんがしゅっせきした。","zh":"以社长为代表，全体员工都出席了。"}]},{"id":"g214","level":"N2","pattern":"～といっても過言ではない","meaning":"“简体小句+といっても過言ではない”表示不夸张，不夸大。","cat":"reverse","note":"“過言”意为“过分夸大的表达。”","examples":[{"jp":"この本は私の人生を変えたと言っても過言ではない。","r":"このほんはわたしのじんせいをかえたといってもかごんではない。","zh":"说这本书改变了我的人生也不为过。"},{"jp":"彼はこの分野の第一人者だと言っても過言ではない。","r":"かれはこのぶんやのだいいちにんしゃだといってもかごんではない。","zh":"说他是这个领域的第一人也毫不夸张。"}]},{"id":"g215","level":"N2","pattern":"～お伝えいただく","meaning":"“お/ご＋动词去ます形＋いただく”是自己获益的表达方式“～してもらう”的自谦语。","cat":"honor","examples":[{"jp":"お忙しいところ、ご連絡をお伝えいただきありがとうございます。","r":"おいそがしいところ、ごれんらくをおつたえいただきありがとうございます。","zh":"百忙之中承蒙转告，非常感谢。"},{"jp":"彼からお礼の言葉をお伝えいただきました。","r":"かれからおれいのことばをおつたえいただきました。","zh":"承蒙您转达了他的感谢。"}]},{"id":"g216","level":"N2","pattern":"～ながら（も）","meaning":"“动词去ます形”/形容词+ながら（も）除了表示同时进行外还有转折的用法。","cat":"reverse","formation":"动词ます形／い形词干／名词 + ながらも","note":"表示转折时后面多加“も”。","examples":[{"jp":"狭いながらも、楽しい我が家だ。","r":"せまいながらも、たのしいわがやだ。","zh":"虽然狭小，却是快乐的家。"},{"jp":"病気ながらも、最後まで働いた。","r":"びょうきながらも、さいごまではたらいた。","zh":"虽然生病，还是工作到最后。"},{"jp":"彼はまだ小さいながらも、きちんと挨拶する。","r":"かれはまだちいさいながらも、きちんとあいさつする。","zh":"他虽然还小，却能规规矩矩地打招呼。"},{"jp":"狭いながらも、ここが私の家だ。","r":"せまいながらも、ここがわたしのいえだ。","zh":"虽然小，但这里是我的家。"}]},{"id":"g217","level":"N2","pattern":"～ままに","meaning":"“动词（基本形）/表示动作或意志的名词+ままに”表示顺从该动作或意志。","cat":"state","note":"和“とおりに”意思相同。","examples":[{"jp":"風の吹くままに、木の葉が舞い落ちる。","r":"かぜのふくままに、このはがまいおちる。","zh":"树叶随风飘落。"},{"jp":"彼は言われるままに、書類にサインした。","r":"かれはいわれるままに、しょるいにサインした。","zh":"他照着别人的话在文件上签了字。"}]},{"id":"g218","level":"N2","pattern":"～なしで","meaning":"“名词+なしで”表示在不具备本来该有或某种必须物品的状态下做某事。","cat":"limit","note":"与“抜きで”意思相近。","examples":[{"jp":"地図なしで、この町を歩くのは難しい。","r":"ちずなしで、このまちをあるくのはむずかしい。","zh":"没有地图在这个城市走很难。"},{"jp":"予約なしで、その店に入れなかった。","r":"よやくなしで、そのみせにはいれなかった。","zh":"没有预约，没能进那家店。"}]},{"id":"g219","level":"N2","pattern":"～に加え（て）","meaning":"“名词+に加え（て）”表示添加、附加。","cat":"conj","examples":[{"jp":"給料に加えて、賞与も年2回支給される。","r":"きゅうりょうにくわえて、しょうよもねんにかいしきゅうされる。","zh":"除工资外，每年还发两次奖金。"},{"jp":"経験に加えて、資格も必要だ。","r":"けいけんにくわえて、しかくもひつようだ。","zh":"除经验外，还需要资格证。"}]},{"id":"g220","level":"N3","pattern":"～たびに","meaning":"“动词（基本形）/名词の+たびに”表示“如果发生某件事，就会出现另一件事”或者“某个时刻总会发生某事”。","cat":"count","formation":"动词辞书形/名词の + たびに","examples":[{"jp":"この写真を見るたびに、子どもの頃を思い出す。","r":"このしゃしんをみるたびに、こどものころをおもいだす。","zh":"每次看到这张照片，就会想起小时候。"},{"jp":"彼は会うたびに、新しい本の話をする。","r":"かれはあうたびに、あたらしいほんのはなしをする。","zh":"他每次见面都说起新书的事。"}]},{"id":"g221","level":"N2","pattern":"～次第で","meaning":"“名词+次第で”意为“（随名词而变化）与各种各样的状况想适应”。","cat":"cond","examples":[{"jp":"成績次第で、奨学金がもらえるかどうか決まる。","r":"せいせきしだいで、しょうがくきんがもらえるかどうかきまる。","zh":"能否获得奖学金，取决于成绩。"},{"jp":"当日の天気次第で、予定が変わります。","r":"とうじつのてんきしだいで、よていがかわります。","zh":"行程将根据当天的天气而变。"}]},{"id":"g222","level":"N2","pattern":"～以来","meaning":"“动词（て形）+以来”表示“某个事情之后一直…”。","cat":"time","note":"也用“表示过去时间的名词+以来”的形式。","examples":[{"jp":"日本に来て以来、ずっと日本語を勉強している。","r":"にほんにきていらい、ずっとにほんごをべんきょうしている。","zh":"来日本以后，一直在学日语。"},{"jp":"卒業して以来、一度も会っていない。","r":"そつぎょうしていらい、いちどもあっていない。","zh":"毕业以后，一次也没见过。"}]},{"id":"g223","level":"N2","pattern":"～からこそ","meaning":"“名词/二类形容词+だからこそ”“动词/一类形容词+からこそ”用于强调理由或原因，多用于好的事情。","cat":"reason","formation":"动词／い形／な形／名词 + だ + からこそ","examples":[{"jp":"困難だからこそ、成長できるのだ。","r":"こんなんだからこそ、せいちょうできるのだ。","zh":"正因为困难，才能成长。"},{"jp":"君のことを心配しているからこそ、こう言っているんだ。","r":"きみのことをしんぱいしているからこそ、こういっているんだ。","zh":"正因为担心你，才这么说。"}]},{"id":"g224","level":"N2","pattern":"～に面する","meaning":"“名词（场所）+に面する”意思是与名词表示的场所相对、面对面，或者面向该场所。","cat":"view","examples":[{"jp":"このホテルは海に面していて、眺めがいい。","r":"このホテルはうみにめんしていて、ながめがいい。","zh":"这家酒店面向大海，景色很好。"},{"jp":"私の部屋は公園に面している。","r":"わたしのへやはこうえんにめんしている。","zh":"我的房间面向公园。"}]},{"id":"g225","level":"N2","pattern":"～から～にかけて","meaning":"表示时间或场所的范围，为大致范围，多用于比较大的单位。","cat":"time","examples":[{"jp":"今日は午後から夜にかけて雨が降るでしょう。","r":"きょうはごごからよるにかけてあめがふるでしょう。","zh":"今天从下午到夜里会下雨吧。"},{"jp":"東北地方から北海道にかけて、大雪の恐れがあります。","r":"とうほくちほうからほっかいどうにかけて、おおゆきのおそれがあります。","zh":"从东北地区到北海道，可能有暴雪。"}]},{"id":"g226","level":"N2","pattern":"～を通じて","meaning":"“时间名词+を通じて”表示某段时期，通常为相对集中的一段时间。","cat":"time","examples":[{"jp":"この一年を通じて、彼は毎日練習を続けた。","r":"このいちねんをとおじて、かれはまいにちれんしゅうをつづけた。","zh":"这一年里，他每天都坚持练习。"},{"jp":"生涯を通じて、彼は平和のために働いた。","r":"しょうがいをとおじて、かれはへいわのためにはたらいた。","zh":"他一生都为和平而努力。"}]},{"id":"g227","level":"N1","pattern":"～ならでは（の）","meaning":"“名词+ならでは”表示“除此以外体验不到、无法实现”的意思。","cat":"limit","formation":"名词 + ならでは（の + 名词）","note":"用于好的、有价值的事物。","examples":[{"jp":"この味は、老舗ならではのものだ。","r":"このあじは、しにせならではのものだ。","zh":"这种味道，只有老字号才有。"},{"jp":"彼ならではの斬新な発想が、企画を成功に導いた。","r":"かれならではのざんしんなはっそうが、きかくをせいこうにみちびいた。","zh":"只有他才有的崭新构思，引领企划走向成功。"},{"jp":"彼ならではのすばらしい作品だった。","r":"かれならではのすばらしいさくひんだった。","zh":"那是只有他才能创作出的杰作。"},{"jp":"この職人ならではの技が光っている。","r":"このしょくにんならではのわざがひかっている。","zh":"这是只有这位工匠才有的手艺，熠熠生辉。"}]},{"id":"g228","level":"N2","pattern":"～にわたる","meaning":"直接接在表示期间或区间的词语后，表示数量之多。","cat":"time","note":"范围更大时可用“～から～にわたる”的形式。","examples":[{"jp":"この工事は、5年にわたって行われた。","r":"このこうじは、ごねんにわたっておこなわれた。","zh":"这项工程历时五年。"},{"jp":"長期間にわたる交渉が、ようやく成立した。","r":"ちょうきかんにわたるこうしょうが、ようやくせいりつした。","zh":"长期谈判终于达成。"}]},{"id":"g229","level":"N2","pattern":"～なんて～んだろう","meaning":"“なんて”是“なんという”的口语说法。","cat":"emote","note":"“なんて+一类形容词+んだろう”“なんて+二类形容词/名词+なんだろう”表示感叹程度之深。","examples":[{"jp":"彼のピアノの腕前は、なんて上手なんだろう。","r":"かれのピアノのうでまえは、なんてじょうずなんだろう。","zh":"他的钢琴弹得多好啊。"},{"jp":"この景色は、なんて美しいんだろう。","r":"このけしきは、なんてうつくしいんだろう。","zh":"这景色多么美啊。"}]},{"id":"g230","level":"N2","pattern":"～がちだ","meaning":"“动词去ます形+がち”构成二类形容词的形式，表示有某种倾向，一般不用于褒义。","cat":"state","examples":[{"jp":"彼は最近、遅刻しがちだ。","r":"かれはさいきん、ちこくしがちだ。","zh":"他最近常常迟到。"},{"jp":"この時計は、すぐに壊れがちだ。","r":"このとけいは、すぐにこわれがちだ。","zh":"这块表容易坏。"}]},{"id":"g231","level":"N2","pattern":"～こそ","meaning":"“名词+こそ”表示在众多事物中，特别强调“こそ”前的内容，就是这个而不是其他。","cat":"limit","examples":[{"jp":"今日こそ、早く帰ろう。","r":"きょうこそ、はやくかえろう。","zh":"今天一定要早点回家。"},{"jp":"これこそ、私が探していた本だ。","r":"これこそ、わたしがさがしていたほんだ。","zh":"这正是我一直在找的书。"}]},{"id":"g232","level":"N2","pattern":"～以上（は）～","meaning":"“动词简体形+以上（は）”表示认定某种事态为事实，并以此为理由。","cat":"cond","formation":"动词普通形／い形／な形 + 以上（は）","examples":[{"jp":"約束した以上、必ず行かなければならない。","r":"やくそくしたいじょう、かならずいかなければならない。","zh":"既然约好了，就必须去。"},{"jp":"学生である以上、校則を守るべきだ。","r":"がくせいであるいじょう、こうそくをまもるべきだ。","zh":"既然是学生，就该遵守校规。"}]},{"id":"g233","level":"N2","pattern":"～わけだ","meaning":"“わけだ”表示合乎逻辑的结果。","cat":"guess","note":"经常以“～というわけだ”的形式使用。否定形式“わけではない”则是对依据某种情况推导出来的结果的否定。","examples":[{"jp":"彼は毎日練習している。努力家なわけだ。","r":"かれはまいにちれんしゅうしている。どりょくかなわけだ。","zh":"他每天都练习，难怪是个努力的人。"},{"jp":"今朝は雨が降った。道が濡れているわけだ。","r":"けさはあめがふった。みちがぬれているわけだ。","zh":"今早下了雨，难怪路上是湿的。"}]},{"id":"g234","level":"N2","pattern":"～といい，～といい","meaning":"“名词+といい、名词+といい”表示从众多事物中选取两个最具代表性的事例加以叙述，语感在于强调所举事例。","cat":"conj","examples":[{"jp":"この店は料理といい、雰囲気といい、申し分ない。","r":"このみせはりょうりといい、ふんいきといい、もうしぶんない。","zh":"这家店菜也好，氛围也好，无可挑剔。"},{"jp":"彼女は顔といい、性格といい、理想の女性だ。","r":"かのじょはかおといい、せいかくといい、りそうのじょせいだ。","zh":"她相貌也好，性格也好，是理想的女性。"}]},{"id":"g235","level":"N2","pattern":"～を超す","meaning":"“～を超す”与“～を超える”意思相同，表示内容、数量等超过。","cat":"count","note":"“超す”多用于书面语","examples":[{"jp":"参加者は千人を超す見込みだ。","r":"さんかしゃはせんにんをこすみこみだ。","zh":"预计参加人数将超过一千人。"},{"jp":"この作品の売り上げは、10万冊を超した。","r":"このさくひんのうりあげは、じゅうまんさつをこした。","zh":"这部作品的销量超过了十万册。"}]},{"id":"g236","level":"N3","pattern":"～といったもの","meaning":"用于从诸多事物中举例说明。","cat":"conj","formation":"名词 + といった + 名词","examples":[{"jp":"ピアノやバイオリンといった楽器を習っている。","r":"ピアノやバイオリンといったがっきをならっている。","zh":"在学钢琴和小提琴之类的乐器。"},{"jp":"東京や大阪といった大都市に人口が集中している。","r":"とうきょうやおおさかといっただいとしにじんこうがしゅうちゅうしている。","zh":"人口集中在东京和大阪之类的大都市。"}]},{"id":"g237","level":"N2","pattern":"～はもちろん","meaning":"“名词+はもちろん”表示“当然”“不用说”“自不待言”等意思。","cat":"limit","note":"书面语用“～は無論（のこと）”的形式。","examples":[{"jp":"料理はもちろん、デザートもおいしかった。","r":"りょうりはもちろん、デザートもおいしかった。","zh":"菜就不用说了，甜点也很好吃。"},{"jp":"日本語はもちろん、英語も話せます。","r":"にほんごはもちろん、えいごもはなせます。","zh":"日语自不必说，英语也会说。"}]},{"id":"g238","level":"N2","pattern":"～きれない","meaning":"“动词去ます形+きる”表示将动作、事件彻底完成，用于动作实现起来有困难或者比较重要时。","cat":"potential","formation":"动词ます形 + きる／きれない","note":"否定形式“きれない”表示动作或者行为不能完成。","examples":[{"jp":"長編小説を読みきった。","r":"ちょうへんしょうせつをよみきった。","zh":"把长篇小说读完了。"},{"jp":"こんなにたくさんは食べきれない。","r":"こんなにたくさんはたべきれない。","zh":"这么多可吃不完。"}]},{"id":"g239","level":"N2","pattern":"～に応じた/～に応じて","meaning":"使用“名词+に応じた+名词”“名词+に応じて+动词”的形式，表示因具体情况而异，是书面语。","cat":"view","examples":[{"jp":"年齢に応じた健康管理が必要だ。","r":"ねんれいにあわせたけんこうかんりがひつようだ。","zh":"需要根据年龄进行相应的健康管理。"},{"jp":"収入に応じて、税額が決まる。","r":"しゅうにゅうにおうじて、ぜいがくがきまる。","zh":"税额根据收入而定。"}]},{"id":"g240","level":"N2","pattern":"～から見ると","meaning":"前接名词，表示从某种立场上审视，考虑问题，有时还用“～から見れば”“～から見て”。","cat":"view","examples":[{"jp":"子供の立場から見ると、この規則は厳しすぎる。","r":"こどものたちばからみると、このきそくはきびしすぎる。","zh":"从小孩的立场看，这条规则太严格了。"},{"jp":"外国人の目から見ると、日本の習慣は面白い。","r":"がいこくじんのめからみると、にほんのしゅうかんはおもしろい。","zh":"在外国人看来，日本的风俗很有趣。"}]},{"id":"g241","level":"N2","pattern":"～に即した/～に即して","meaning":"使用“名词+に即した+名词”“名词+にに即して+动词”，表示因具体情况而异，只接在表示事态、状态，以及诸如“法律”“計画”等作为判断，处理依据的名词后。","cat":"view","examples":[{"jp":"法律に即した対応が求められる。","r":"ほうりつにそくしたたいおうがもとめられる。","zh":"要求依照法律作出应对。"},{"jp":"現実に即して、計画を修正した。","r":"げんじつにそくして、けいかくをしゅうせいした。","zh":"根据现实修改了计划。"}]},{"id":"g242","level":"N2","pattern":"～もあれば～もある","meaning":"表示从众多例子中仅举其中两例。","cat":"conj","examples":[{"jp":"彼には長所もあれば、短所もある。","r":"かれにはちょうしょもあれば、たんしょもある。","zh":"他既有长处，也有短处。"},{"jp":"この町には、新しい店もあれば、古い店もある。","r":"このまちには、あたらしいみせもあれば、ふるいみせもある。","zh":"这个城市既有新店，也有老店。"}]},{"id":"g243","level":"N2","pattern":"～だけあって","meaning":"“AだけあってB”意为“正是因为A，B也是顺理成章的”。","cat":"reason","note":"A多为积极的评价。接续为“动词简体形/一类形容词简体形/名词+だけあって”“二类形容词+なだけあって”。","examples":[{"jp":"さすが有名な店だけあって、味が違う。","r":"さすがゆうめいなみせだけあって、あじがちがう。","zh":"不愧是有名的店，味道果然不同。"},{"jp":"彼は留学経験者だけあって、英語が上手だ。","r":"かれはりゅうがくけいけんしゃだけあって、えいごがじょうずだ。","zh":"他有留学经验，英语果然很好。"}]},{"id":"g244","level":"N2","pattern":"～ったら","meaning":"“动词て形/名词+ったら”，表示特别提出，并以其为话题。","cat":"quote","note":"多表示说话人轻微的责难态度，或把某行为作为话题提出来。","examples":[{"jp":"君ったら、また約束を忘れたのか。","r":"きみったら、またやくそくをわすれたのか。","zh":"你这家伙，又忘了约定吗？"},{"jp":"あの子ったら、何度言っても片づけない。","r":"あのこったら、なんどいってもかたづけない。","zh":"那孩子呀，说多少遍都不收拾。"}]},{"id":"g245","level":"N2","pattern":"～ざるをえない/～しかない","meaning":"“动词去ない形+ざるをえない”，表示从常识或目前状况来判断，是别无选择的。","cat":"oblig","note":"“する”变为“せざるをえない”。多用作书面语。","examples":[{"jp":"こうなっては、あきらめざるをえない。","r":"こうなっては、あきらめざるをえない。","zh":"事已至此，只能放弃。"},{"jp":"お金がないから、電車に乗るしかない。","r":"おかねがないから、でんしゃにのるしかない。","zh":"因为没有钱，只能坐电车。"}]},{"id":"g246","level":"N2","pattern":"～にもかかわらず","meaning":"“AにもかかわらずB”与“AのにB”意思相同，为书面表达。","cat":"reverse","note":"表示按照常理来说，前项成立后项就不能成立，而事实却是尽管A成立，可是B也同时成立。","examples":[{"jp":"雨にもかかわらず、大勢の人が集まった。","r":"あめにもかかわらず、おおぜいのひとがあつまった。","zh":"尽管下雨，还是聚集了很多人。"},{"jp":"彼は体調が悪いにもかかわらず、出勤した。","r":"かれはたいちょうがわるいにもかかわらず、しゅっきんした。","zh":"他尽管身体不舒服，还是去上班了。"}]},{"id":"g247","level":"N3","pattern":"～どころか","meaning":"“动词基本形+どころか”“名词/形容词+どころか”表示举出成为话题的事件，后面强调比这个事件更难以想象或截然相反的内容。","cat":"reverse","formation":"动词普通形/い形容词/な形容词/名词 + どころか","examples":[{"jp":"彼は英語どころか、フランス語も話せる。","r":"かれはえいごどころか、フランスごもはなせる。","zh":"他岂止英语，连法语也会说。"},{"jp":"病気どころか、元気いっぱいだ。","r":"びょうきどころか、げんきいっぱいだ。","zh":"哪里是生病，精神饱满。"}]},{"id":"g248","level":"N2","pattern":"～に（も）なりかねない","meaning":"“名词+に（も）なりかねない”表示可能会发生不好的事情。","cat":"guess","note":"多用于书面语。","examples":[{"jp":"このままでは、事故になりかねない。","r":"このままでは、じこになりかねない。","zh":"照这样下去，说不定会出事故。"},{"jp":"無理をすると、体を壊しかねない。","r":"むりをすると、からだをこわしかねない。","zh":"勉强下去，可能会累坏身体。"}]},{"id":"g249","level":"N2","pattern":"～に合う","meaning":"“名词+に合う”含有适合、性质相符的意思。","cat":"view","examples":[{"jp":"この服は私の体に合っている。","r":"このふくはわたしのからだにあっている。","zh":"这件衣服合我的身。"},{"jp":"この部屋は用途に合った広さだ。","r":"このへやはようとにあったひろさだ。","zh":"这个房间的大小符合用途。"}]},{"id":"g250","level":"N2","pattern":"～ことで","meaning":"“动词简体形+こと”后续“で”可表示原因、理由、方法、手段等，而实际表示何种意思由具体语境决定。","cat":"reason","examples":[{"jp":"毎日運動することで、健康を保っている。","r":"まいにちうんどうすることで、けんこうをたもっている。","zh":"通过每天运动来保持健康。"},{"jp":"辞書を引くことで、新しい言葉を覚えられる。","r":"じしょをひくことで、あたらしいことばをおぼえられる。","zh":"通过查词典，可以记住新词。"}]},{"id":"g251","level":"N2","pattern":"～なしに（は）/～なしで（は）/～なくして","meaning":"“A+なしに（は）/なしで（は）/なくして+B”表示A是实现B的必不可少的条件。","cat":"cond","note":"A是表示动作的名词，B是表示不可能或否定的表达方式。","examples":[{"jp":"許可なしに、この部屋に入ることはできません。","r":"きょかなしに、このへやにはいることはできません。","zh":"未经许可，不能进入这个房间。"},{"jp":"彼の協力なくしては、この計画は成り立たない。","r":"かれのきょうりょくなくしては、このけいかくはなりたたない。","zh":"没有他的协助，这个计划就无法实现。"}]},{"id":"g252","level":"N2","pattern":"～をもとにする","meaning":"“名词+もとにする”表示进行某种行为时的判断依据或判断素材。","cat":"view","formation":"名词 + をもとに","note":"文章中也常以“～をもとに”的形式出现。","examples":[{"jp":"この映画は実話をもとにしている。","r":"このえいがはじつわをもとにしている。","zh":"这部电影以真实故事为基础。"},{"jp":"データをもとに判断すべきだ。","r":"データをもとにはんだんすべきだ。","zh":"应该以数据为依据来判断。"}]},{"id":"g253","level":"N2","pattern":"～まい","meaning":"“动词基本形+まい”有两种用法，一种表示否定推测，与“ないだろうか”意思相同，另一种表示否定意志，与“しないつもりだ”意思相同。","cat":"guess","examples":[{"jp":"彼はもう来ないだろう。来まい。","r":"かれはもうこないだろう。こまい。","zh":"他大概不会来了吧，不会来的。"},{"jp":"後悔しまいと決心して、決断した。","r":"こうかいしまいとけっしんして、けつだんした。","zh":"下定决心不后悔，做出了决断。"}]},{"id":"g254","level":"N2","pattern":"～ずにはいられない","meaning":"“动词去ない形+ずにはいられない”表示出于自己的欲望等内在因素而去那样做，或者自然而然地成为那样的情况，不表示必然义务。","cat":"emote","formation":"动词ない形（去ない）+ ずにはいられない","note":"“する”变成“せ”+ずにはいられない。","examples":[{"jp":"悲しくて泣かずにはいられなかった。","r":"かなしくてなかずにはいられなかった。","zh":"悲伤得忍不住哭了起来。"},{"jp":"面白くて笑わずにはいられない。","r":"おもしろくてわらわずにはいられない。","zh":"太有趣了，忍不住笑起来。"}]},{"id":"g255","level":"N2","pattern":"～に反して、～","meaning":"意为与某事物相对或相反，常和“予想”“期待”等与想法、思考相关的名词搭配使用。","cat":"reverse","examples":[{"jp":"予想に反して、試験は簡単だった。","r":"よそうにはんして、しけんはかんたんだった。","zh":"与预想相反，考试很简单。"},{"jp":"期待に反して、彼は成功しなかった。","r":"きたいにはんして、かれはせいこうしなかった。","zh":"与期待相反，他并没有成功。"}]},{"id":"g256","level":"N2","pattern":"～までもない","meaning":"与“动词基本形+必要がない”意思相同，但更明确强调没有必要的理由。","cat":"oblig","formation":"动词辞书形 + までもない","examples":[{"jp":"言うまでもなく、健康は一番大切だ。","r":"いうまでもなく、けんこうはいちばんたいせつだ。","zh":"不用说，健康最重要。"},{"jp":"わざわざ行くまでもない、電話で十分だ。","r":"わざわざいくまでもない、でんわでじゅうぶんだ。","zh":"不必特意去，打电话就足够了。"},{"jp":"その相談は社長が乗り出すまでもない。","r":"そのそうだんはしゃちょうがのりだすまでもない。","zh":"那件事用不着社长亲自出马。"},{"jp":"言うまでもなく、健康が何より大切だ。","r":"いうまでもなく、けんこうがなによりたいせつだ。","zh":"不用说，健康比什么都重要。"}]},{"id":"g257","level":"N2","pattern":"～に決まっている","meaning":"“简体小句/名词/二类形容词+に決まっている”表示说话人根据经验或客观情况的判断，对于自己没有直接确认的事情下断言。","cat":"guess","examples":[{"jp":"あんなに練習したんだから、勝つに決まっている。","r":"あんなにれんしゅうしたんだから、かつにきまっている。","zh":"练了那么多，肯定会赢。"},{"jp":"そんな無理をすれば、疲れるに決まっている。","r":"そんなむりをすれば、つかれるにきまっている。","zh":"那么勉强自己，肯定会累。"},{"jp":"仕事において、ミスはしないほうがいいに決まっている。しかし、人間である以上、ミスは避けられないものだ。","r":"しごとにおいて、ミスはしないほうがいいにきまっている。しかし、にんげんであるいじょう、ミスはさけられないものだ。","zh":"工作上，当然是不犯错误为好。然而，既然是人，错误就难以避免。","src":"2023年12月真题"}],"srcs":["2023年12月真题"]},{"id":"g258","level":"N2","pattern":"～うえで","meaning":"“AうえでB”有两种用法，一是前接动词基本形，表示“为了A，在此之前先做B”。","cat":"time","note":"二是前接动词“た形”，表示先做A，然后做B，有为某事做准备的意思。","examples":[{"jp":"引っ越すうえで、新しい家具をそろえなければならない。","r":"ひっこすうえで、あたらしいかぐをそろえなければならない。","zh":"为了搬家，必须先准备好新家具。"},{"jp":"結論を出したうえで、もう一度報告します。","r":"けつろんをだしたうえで、もういちどほうこくします。","zh":"得出结论之后，再报告一次。"}]},{"id":"g259","level":"N2","pattern":"～とはいうものの","meaning":"“简体小句+ものの”“二类形容词+なものの”表示转折关系，多用于书面语。","cat":"reverse","note":"“とはいうものの”还可做连词，独立于句首。","examples":[{"jp":"高いとはいうものの、品質は確かだ。","r":"たかいとはいうものの、ひんしつはたしかだ。","zh":"虽说贵，但质量确实可靠。"},{"jp":"難しいとはいうものの、やりがいのある仕事だ。","r":"むずかしいとはいうものの、やりがいのあるしごとだ。","zh":"虽说难，但这是一份很有价值的工作。"}]},{"id":"g260","level":"N2","pattern":"～にあたって","meaning":"“AにあたってB”表示“在…之际”。","cat":"time","note":"前多接动词基本性和名词。","examples":[{"jp":"開会にあたって、一言ご挨拶申し上げます。","r":"かいかいにあたって、ひとことごあいさつもうしあげます。","zh":"值此开幕之际，请允许我说几句致辞。"},{"jp":"出発にあたって、日程を確認しておこう。","r":"しゅっぱつにあたって、にっていをかくにんしておこう。","zh":"出发之前，先确认一下行程吧。"}]},{"id":"g261","level":"N2","pattern":"～が望ましい","meaning":"“望ましい”意为“希望…”“最好…”，是正式的书面语，可用于委婉的命令。","cat":"oblig","note":"前多接“が”，使用“～が望ましい”的形式。","examples":[{"jp":"早めの対応が望ましい。","r":"はやめのたいおうがのぞましい。","zh":"最好尽早应对。"},{"jp":"参加者は、事前に登録することが望ましい。","r":"さんかしゃは、じぜんにとうろくすることがのぞましい。","zh":"参加者最好事先登记。"}]},{"id":"g262","level":"N2","pattern":"～に先立って","meaning":"“Aに先立ってB”意为在A之前先进行B动作，用于B是为A做准备或练习的场合，是很正式的表达。","cat":"time","examples":[{"jp":"本番に先立って、リハーサルを行う。","r":"ほんばんにさきだって、リハーサルをおこなう。","zh":"在正式演出之前进行彩排。"},{"jp":"開会に先立って、理事会が開かれた。","r":"かいかいにさきだって、りじかいがひらかれた。","zh":"在大会召开之前，先开了理事会。"}]},{"id":"g263","level":"N2","pattern":"～をかける","meaning":"“Aをかける”表示做事情时要花费A，A可以是表示时间、金钱、工夫等的名词。","cat":"count","examples":[{"jp":"この仕事には、かなりの時間をかけた。","r":"このしごとには、かなりのじかんをかけた。","zh":"这项工作花了相当多的时间。"},{"jp":"彼は成功するまで、多くの努力をかけた。","r":"かれはせいこうするまで、おおくのどりょくをかけた。","zh":"他为了成功付出了很多努力。"}]},{"id":"g264","level":"N3","pattern":"～にしたがって","meaning":"“动词基本形/名词+にしたがって”表示随动作的或状况的发展而发生变化。","cat":"state","formation":"动词辞书形/名词 + にしたがって／につれて","examples":[{"jp":"時間が経つにつれて、痛みが和らいできた。","r":"じかんがたつにつれて、いたみがやわらいできた。","zh":"随着时间推移，疼痛减轻了。"},{"jp":"都市が発展するにしたがって、人口も増えた。","r":"としがはってんするにしたがって、じんこうもふえた。","zh":"随着城市发展，人口也增加了。"}]},{"id":"g265","level":"N2","pattern":"～にすぎない","meaning":"“动词简体形/名词+にすぎない”用于限定行为、事件、数量等，表示没什么大不了的。","cat":"limit","formation":"动词普通形／名词 + にすぎない","examples":[{"jp":"これは始まりにすぎない。","r":"これははじまりにすぎない。","zh":"这不过是开始而已。"},{"jp":"彼は一作家にすぎない。","r":"かれはいっさっかにすぎない。","zh":"他不过是个作家。"}]},{"id":"g266","level":"N2","pattern":"～にほかならない","meaning":"前接名词意为“绝对是…”“除…以外难以考虑”，表示强烈的断定。","cat":"limit","formation":"动词普通形／名词 + にほかならない","examples":[{"jp":"これは努力の結果にほかならない。","r":"これはどりょくのけっかにほかならない。","zh":"这正是努力的结果。"},{"jp":"この問題の原因は、早すぎる判断にほかならない。","r":"このもんだいのげんいんは、はやすぎるはんだんにほかならない。","zh":"这个问题的原因正是过早的判断。"}]},{"id":"g267","level":"N2","pattern":"～くせに","meaning":"“AくせにB”表示不具备进行B的必要条件，常常带有批评A的语气。","cat":"reverse","note":"接续为“简体小句/名词の/二类形容词词な+くせに”。","examples":[{"jp":"できないくせに、できると言う。","r":"できないくせに、できるという。","zh":"明明不会，却说会。"},{"jp":"知っているくせに、知らないふりをする。","r":"しっているくせに、しらないふりをする。","zh":"明明知道，却装作不知道。"}]},{"id":"g268","level":"N3","pattern":"～どころではない","meaning":"前接动词或名词，表示强烈否定或没有空余做某事，接形容词时表示强烈否定。","cat":"reverse","formation":"动词辞书形/名词 + どころではない","examples":[{"jp":"仕事が忙しくて、旅行どころではない。","r":"しごとがいそがしくて、りょこうどころではない。","zh":"工作太忙，根本顾不上旅行。"},{"jp":"今は食事するどころではない。","r":"いまはしょくじするどころではない。","zh":"现在根本不是吃饭的时候。"}]},{"id":"g269","level":"N2","pattern":"～て仕方がない","meaning":"表示感情、感觉自然产生、无法控制。","cat":"emote","note":"口语中也用“～てしょうがない”。","examples":[{"jp":"試験のことを考えると、心配で仕方がない。","r":"しけんのことをかんがえると、しんぱいでしかたがない。","zh":"一想到考试，就担心得不得了。"},{"jp":"彼のことが気になって仕方がない。","r":"かれのことがきになってしかたがない。","zh":"总是放不下他的事。"}]},{"id":"g270","level":"N2","pattern":"～なりに","meaning":"“名词（表示人的名词）+なりに”意为“站在～的立场上”。","cat":"view","note":"常用“～は（も）～なりに”的表达方式。","examples":[{"jp":"私は私なりに将来のことを真剣に考えているつもりだ。","r":"わたしはわたしなりにしょうらいのことをしんけんにかんがえているつもりだ。","zh":"我打算按自己的方式认真考虑将来的事。"},{"jp":"子供なりに一生懸命考えた答えだ。","r":"こどもなりにいっしょうけんめいかんがえたこたえだ。","zh":"这是孩子按自己的方式拼命想出的答案。"}]},{"id":"g271","level":"N3","pattern":"～おそれがある","meaning":"“动词基本形/名词の+おそれがある”表示不希望发生的事、不好的事有可能出现，是一种客观推测。","cat":"guess","formation":"名词の/动词辞书形 + おそれがある","examples":[{"jp":"このままでは、台風が直撃するおそれがある。","r":"このままでは、たいふうがちょくげきするおそれがある。","zh":"这样下去，台风有可能直接袭击。"},{"jp":"早く治療しないと、悪化するおそれがある。","r":"はやくちりょうしないと、あっかするおそれがある。","zh":"不早点治疗的话，有恶化的危险。"}]},{"id":"g272","level":"N2","pattern":"～かたわら","meaning":"用“AかたわらB”的形式表示A和B同时进行。","cat":"state","note":"A是职业或本职等主要活动或行为，B是次要行为。","examples":[{"jp":"彼は勉学のかたわら、アルバイトをしている。","r":"かれはべんがくのかたわら、アルバイトをしている。","zh":"他一面学习，一面打工。"},{"jp":"彼女は仕事のかたわら、週末に陶芸を習っている。","r":"かのじょはしごとのかたわら、しゅうまつにとうげいをならっている。","zh":"她工作之余，周末还在学陶艺。"}]},{"id":"g273","level":"N2","pattern":"～をもって","meaning":"“时间名词+をもって”一般表示成为分水岭的时间，常用于表示某种状态结束的时间。","cat":"time","examples":[{"jp":"あの小説家は名文をもって知られる。","r":"あのしょうせつかはめいぶんをもってしられる。","zh":"那位小说家以优美的文笔著称。"},{"jp":"以上をもって、会議を終わります。","r":"いじょうをもって、かいぎをおわります。","zh":"以上，会议到此结束。"},{"jp":"体育館は老朽化のため、本年3月15日をもって閉館しました。長年のご利用、ありがとうございました。","r":"たいいくかんはろうきゅうかのため、ほんねんさんがつじゅうごにちをもってへいかんしました。ながねんのごりよう、ありがとうございました。","zh":"体育馆因老化，于今年3月15日闭馆。感谢多年使用。","src":"2022年12月真题"}],"srcs":["2022年12月真题"]},{"id":"g274","level":"N2","pattern":"～に際して","meaning":"“动作性名词（三类动词的汉字部分）+に際して”用于表示某事的起始时刻或进行过程中的某时刻，为书面语。","cat":"time","examples":[{"jp":"出発に際して、皆様にご挨拶いたします。","r":"しゅっぱつにさいして、みなさまにごあいさついたします。","zh":"值此出发之际，向各位致意。"},{"jp":"採用に際して、最終面接を行います。","r":"さいようにさいして、さいしゅうめんせつをおこないます。","zh":"录用时，会进行最终面试。"}]},{"id":"g275","level":"N2","pattern":"～ところがある","meaning":"多用于描述人的性格、为人等，而且大多时候用于负面描述。","cat":"view","note":"表示其他部分没有问题，但后句这一部分不好。","examples":[{"jp":"彼は優秀だが、頑固なところがある。","r":"かれはゆうしゅうだが、がんこなところがある。","zh":"他很优秀，但有固执的一面。"},{"jp":"この製品は使いやすいが、少し重いところがある。","r":"このせいひんはつかいやすいが、すこしおもいところがある。","zh":"这个产品好用，但有点偏重。"}]},{"id":"g276","level":"N1","pattern":"～に限らず","meaning":"“不限于，不仅”的意思。","cat":"limit","note":"前接名词，主要用于书面语。","examples":[{"jp":"この店は平日に限らず、週末もいつも混んでいる。","r":"このみせはへいじつにかぎらず、しゅうまつもいつもこんでいる。","zh":"这家店不仅平日，周末也总是很拥挤。"},{"jp":"学生に限らず、誰でも参加できる。","r":"がくせいにかぎらず、だれでもさんかできる。","zh":"不仅学生，谁都可以参加。"}]},{"id":"g277","level":"N1","pattern":"もはや","meaning":"“已经”的意思。","cat":"time","note":"副词，是“もう”的书面语，常用于事物发生很大变化的上下文中。","examples":[{"jp":"彼はもはや子供ではない。立派な大人だ。","r":"かれはもはやこどもではない。りっぱなおとなだ。","zh":"他已经不是孩子了，是个堂堂正正的大人。"},{"jp":"もうこの問題は、もはや解決できない。","r":"もうこのもんだいは、もはやかいけつできない。","zh":"这个问题已经无法解决了。"}]},{"id":"g278","level":"N1","pattern":"～といってもいい","meaning":"用于阐述近乎言过其实的见解。","cat":"guess","note":"“可以说”的意思。","examples":[{"jp":"彼はこの分野の第一人者だと言ってもいい。","r":"かれはこのぶんやのだいいちにんしゃだといってもいい。","zh":"可以说他是这个领域的第一人。"},{"jp":"この町は、まるで公園だと言ってもいいほど緑が多い。","r":"このまちは、まるでこうえんだといってもいいほどみどりがおおい。","zh":"这个城市绿意之多，几乎可以说像公园一样。"}]},{"id":"g279","level":"N1","pattern":"“見える”和“見られる”","meaning":"「見える」用于肉眼直接能够确认的事物，是“能看到”“看得见”的意思。","cat":"potential","note":"“見られる”除了表示满足条件才能看见的含义外，还有表示自然现象的用法。","examples":[{"jp":"晴れた日には、富士山が見える。","r":"はれたひには、ふじさんがみえる。","zh":"晴天时，能看见富士山。"},{"jp":"最近の調査によると、若者の旅行離れが見られる。","r":"さいきんのちょうさによると、わかもののりょこうばなれがみられる。","zh":"根据最近的调查，可以看到年轻人疏远旅行的现象。"},{"jp":"部長、ABC銀行の山下さんが見えました。応接室でお待ちです。","r":"ぶちょう、ABCぎんこうのやましたさんがみえました。おうせつしつでおまちです。","zh":"部长，ABC银行的山下先生来了。正在会客室等候。","src":"2023年12月真题"}],"srcs":["2023年12月真题"]},{"id":"g280","level":"N1","pattern":"一旦","meaning":"“暂且”的意思。","cat":"time","note":"表示①暂时中断此前进行的事，待做完其他事后，在回过头来继续做。②表示此前一直持续的状态暂时停止，过了一段时间后有重新开始。","examples":[{"jp":"一旦休憩して、また続けましょう。","r":"いったんきゅうけいして、またつづけましょう。","zh":"先歇一会儿，再继续吧。"},{"jp":"一旦決めたら、最後までやり遂げるべきだ。","r":"いったんきめたら、さいごまでやりとげるべきだ。","zh":"一旦决定了，就应该坚持到底。"}]},{"id":"g281","level":"N1","pattern":"～も～ば、～も～","meaning":"相当于汉语的“又……又……”“也……也……”。","cat":"conj","note":"可替换为“～も～し、～も～”","examples":[{"jp":"彼は勉強もできれば、スポーツもできる。","r":"かれはべんきょうもできれば、スポーツもできる。","zh":"他学习也好，运动也好。"},{"jp":"この部屋は広くもあれば、日当たりもいい。","r":"このへやはひろくもあれば、ひあたりもいい。","zh":"这个房间既宽敞，采光又好。"}]},{"id":"g282","level":"N1","pattern":"せめて","meaning":"在自己希望的事情难以实现时，用以提出最底线的条件。","cat":"desire","note":"副词，句尾多用表达愿望要求、请求的表达。相当于汉语的“至少”的意思。","examples":[{"jp":"せめて最後まで、やり遂げたい。","r":"せめてさいごまで、やりとげたい。","zh":"至少想坚持到最后。"},{"jp":"せめて一言、お礼を言いたかった。","r":"せめてひとこと、おれいをいいたかった。","zh":"至少想说一句感谢的话。"}]},{"id":"g283","level":"N1","pattern":"～たところ","meaning":"表示以某件事的发生为契机，或某件事发生的同时又发生了另外一件事。","cat":"time","note":"前接动词的“た”形，后句也多用过去式。可译为“在……之后”。","examples":[{"jp":"店に電話したところ、今日は休みだった。","r":"みせにでんわしたところ、きょうはやすみだった。","zh":"打电话到店里，结果今天休息。"},{"jp":"調べてみたところ、その噂は間違いだった。","r":"しらべてみたところ、そのうわさはまちがいだった。","zh":"调查了一下，发现那个传闻是错的。"},{"jp":"忙しくて引っ越しの荷造りができずにいたところ、荷造りを全部やってくれるサービスがあると友人が教えてくれた。","r":"いそがしくてひっこしのにづくりができずにいたところ、にづくりをぜんぶやってくれるサービスがあるとゆうじんがおしえてくれた。","zh":"正忙着没法打包搬家行李的时候，朋友告诉我有一项可以全部代劳的服务。","src":"2023年7月真题"}],"srcs":["2023年7月真题"]},{"id":"g284","level":"N1","pattern":"にしてみたら","meaning":"表示“按照该人的想法或站在其角度的意思”。","cat":"view","note":"后续成分为该人的感受或想法。可译为“在……看来”。","examples":[{"jp":"親にしてみたら、子供の成長が何より嬉しいだろう。","r":"おやにしてみたら、こどものせいちょうがなによりうれしいだろう。","zh":"在父母看来，孩子的成长最让他们高兴吧。"},{"jp":"彼にしてみたら、この仕事は簡単なのだろう。","r":"かれにしてみたら、このしごとはかんたんなのだろう。","zh":"在他看来，这份工作大概很简单吧。"}]},{"id":"g285","level":"N1","pattern":"ということは","meaning":"用于以对方的话或某种信息为基础，经过自己思考引出推断。","cat":"quote","note":"可译为“也就是说”。","examples":[{"jp":"明日が締め切りだということは、今日中にやらなければならない。","r":"あしたがしめきりだということは、きょうじゅうにやらなければならない。","zh":"也就是说，明天是截止日期，今天之内必须做完。"},{"jp":"彼が来ないということは、何かあったのかもしれない。","r":"かれがこないということは、なにかあったのかもしれない。","zh":"他没来，也就是说可能出了什么事。"}]},{"id":"g286","level":"N1","pattern":"～つもりで","meaning":"①接在动词基本型及“ない”形后，表示打算做某事的意图。","cat":"desire","note":"②接在动词“た”形“～ている”形及表状态动词基本型之后，表示自己的想法。","examples":[{"jp":"自分が合格したつもりで、次の準備を始めた。","r":"じぶんがごうかくしたつもりで、つぎのじゅんびをはじめた。","zh":"当作自己已经合格，开始准备下一步。"},{"jp":"彼は学生のつもりで、ずっと勉強している。","r":"かれはがくせいのつもりで、ずっとべんきょうしている。","zh":"他把自己当作学生，一直在学习。"},{"jp":"私としては泣かせるつもりはなかったのだが、妻は私の一言に感動したらしく、泣かれてしまった。","r":"わたしとしてはなかせるつもりはなかったのだが、つまはわたしのひとことにかんどうしたらしく、なかれてしまった。","zh":"我本来没打算让她哭的，妻子似乎被我的话感动，竟哭了起来。","src":"2022年7月真题"}],"srcs":["2022年7月真题"]},{"id":"g287","level":"N1","pattern":"～ていく/～てくる","meaning":"接在表移动的动词“て”形之后，表示空间移动的方向。","cat":"change","note":"表示“……去……来”。","examples":[{"jp":"鳥が南の方へ飛んでいく。","r":"とりがみなみのほうへとんでいく。","zh":"鸟儿向南方飞去。"},{"jp":"彼女は笑顔でこちらに向かって歩いてくる。","r":"かのじょはえがおでこちらにむかってあるいてくる。","zh":"她面带笑容朝这边走来。"}]},{"id":"g288","level":"N1","pattern":"～だの、～だの","meaning":"常用于“名词1＋だの＋名词2＋だの”“小句1（简体形式）＋だの＋小句2（简体形式）＋だの”两个句型，表示列举。","cat":"conj","note":"可译为“……啦……啦”。","examples":[{"jp":"彼は、やれ給料が安いだの、休みが少ないだのと文句がある。","r":"かれは、やれきゅうりょうがやすいだの、やすみがすくないだのともんくがある。","zh":"他老是抱怨，一会儿说工资低啦，一会儿说休息日少啦。"},{"jp":"高いだの安いだのと、文句ばかり言っている。","r":"たかいだのやすいだのと、もんくばかりいっている。","zh":"一会儿说贵啦一会儿说便宜啦，光发牢骚。"}]},{"id":"g289","level":"N1","pattern":"“傾向にある”和“傾向がある","meaning":"表示“事态向某一方倾斜”的意思。","cat":"change","note":"前者有变化、发展的意思，而后者倾向于陈述状态。","examples":[{"jp":"近年、この地域の人口は減少傾向にある。","r":"きんねん、このちいきのじんこうはげんしょうけいこうにある。","zh":"近年来，这个地区的人口呈减少趋势。"},{"jp":"彼にはやや楽観的な傾向がある。","r":"かれにはややらっかんてきなけいこうがある。","zh":"他有些乐观的倾向。"}]},{"id":"g290","level":"N1","pattern":"～には当たらない","meaning":"表示“与……不相当”，多用“名词/一类动词/二类动词的基本型には当たらない”","cat":"compare","examples":[{"jp":"彼が謝ったからといって、許すには当たらない。","r":"かれがあやまったからといって、ゆるすにはあたらない。","zh":"不能因为他道了歉就该原谅。"},{"jp":"一度の失敗で悲観するには当たらない。","r":"いちどのしっぱいでひかんするにはあたらない。","zh":"不必因一次失败就悲观。"}]},{"id":"g291","level":"N1","pattern":"～からなる","meaning":"多用于书面语，表示“有……构成”的意思。","cat":"count","examples":[{"jp":"この組織は、50人のメンバーからなる。","r":"このそしきは、ごじゅうにんのメンバーからなる。","zh":"这个组织由五十名成员组成。"},{"jp":"この本は、10の章からなっている。","r":"このほんは、じゅうのしょうからなっている。","zh":"这本书由十章构成。"}]},{"id":"g292","level":"N1","pattern":"～とみられる","meaning":"“动词（简体形式）/名词＋とみられる”，表示以观察到的事情、事实为基础，由此进行推测。","cat":"guess","note":"可译为“有可能、有望”。","examples":[{"jp":"彼は次の大会で優勝するものとみられる。","r":"かれはつぎのたいかいでゆうしょうするものとみられる。","zh":"预计他将在下届大赛中夺冠。"},{"jp":"この計画は来年実施されるものとみられている。","r":"このけいかくはらいねんじっしされるものとみられている。","zh":"这项计划预计明年实施。"}]},{"id":"g293","level":"N1","pattern":"～に見る/～に見られる","meaning":"用“名1＋に＋名2＋を見る”表示“名2的特征表现在名1”的意思，这里的“に”与表示场所的“に”用法相同。","cat":"view","note":"表示“可看出”的意思。","examples":[{"jp":"この地域には、古い町並みの美しさを見ることができる。","r":"このちいきには、ふるいまちなみのうつくしさをみることができる。","zh":"在这一带，可以看到古街风貌之美。"},{"jp":"彼の発言には、誠実さが見られる。","r":"かれのはつげんには、せいじつさがみられる。","zh":"从他的发言中可以看出真诚。"}]},{"id":"g294","level":"N1","pattern":"～は～に限られる","meaning":"常用“名1＋は＋名2＋に限られる”，“名1所做的事限于名2”的意思。","cat":"limit","examples":[{"jp":"参加できるのは、30歳以下の方に限られる。","r":"さんかできるのは、さんじゅっさいいかのかたにかぎられる。","zh":"能参加的仅限于三十岁以下的人。"},{"jp":"開館時間は、午前9時から午後5時までに限られる。","r":"かいかんじかんは、ごぜんくじからごごごじまでにかぎられる。","zh":"开馆时间仅限于上午九点到下午五点。"}]},{"id":"g295","level":"N1","pattern":"～というより（は）、～ということだ","meaning":"“小句1（简体形式）＋というより（は）、小句2（简体形式）＋ということだ”表示“对小句1的轻微否定，与小句1相比小句2的状态更强。","cat":"reverse","note":"”“与其说……不如说……”。的意思。","examples":[{"jp":"彼は学生というより、むしろ研究者ということだ。","r":"かれはがくせいというより、むしろけんきゅうしゃということだ。","zh":"与其说他是学生，不如说是研究者。"},{"jp":"これは失敗というより、むしろ教訓ということだ。","r":"これはしっぱいというより、むしろきょうくんということだ。","zh":"与其说这是失败，不如说是一次教训。"}]},{"id":"g296","level":"N1","pattern":"～ことのないように","meaning":"“不要那样”的意思，常用“动词基本型＋ことのないように”的形式。","cat":"negative","examples":[{"jp":"同じ失敗を繰り返すことのないように、気をつけてください。","r":"おなじしっぱいをくりかえすことのないように、きをつけてください。","zh":"请注意不要再犯同样的错误。"},{"jp":"迷惑をかけることのないように、静かにしてください。","r":"めいわくをかけることのないように、しずかにしてください。","zh":"请保持安静，不要打扰别人。"}]},{"id":"g297","level":"N1","pattern":"～たいものだ","meaning":"表达说话者的愿望，类似表达有“～てほしいものだ”。","cat":"desire","note":"“想”的意思。","examples":[{"jp":"一度は世界を旅してみたいものだ。","r":"いちどはせかいをたびしてみたいものだ。","zh":"真想去周游世界一次。"},{"jp":"若いうちに、もっと勉強しておきたかったものだ。","r":"わかいうちに、もっとべんきょうしておきたかったものだ。","zh":"真想趁年轻时多学点东西。"}]},{"id":"g298","level":"N1","pattern":"“あの”和“その”","meaning":"①信息共享时用“ア”②信息不明确时用“ソ”","cat":"demo","examples":[{"jp":"「さっき話したあの人、覚えていますか。」「ええ、あの先生ですね。」","r":"「さっきはなしたあのひと、おぼえていますか。」「ええ、あのせんせいですね。」","zh":"“刚才说到的那个人，你记得吗？”“嗯，是那位老师吧。”"},{"jp":"「田中さんという人を知っていますか。」「その人には会ったことがありません。」","r":"「たなかさんというひとをしっていますか。」「そのひとにはあったことがありません。」","zh":"“你认识一个叫田中的人吗？”“没见过那个人。”"}]},{"id":"g299","level":"N1","pattern":"敬语表达方式","meaning":"①动词以外的敬语表达方式。","cat":"honor","note":"在对方持有物品或动作的名词、形容词前加“お”。名词二类形容词词干及汉字词前加“ご”。②“お＋动词ます形去掉‘ます’的形式＋になる”敬语表达形式。“ご＋サ变动词词干＋になる”的敬语表达形式。③与被动同形的“～れる（一类动词）”“～られる（二类动词）”“サ变动词”的尊他语表达方式。④表达尊敬意义的特殊动词。如“召し上がる”“いらっしゃる”等。⑤“お＋动词ます形去掉‘ます’的形式＋ください”敬语表达形式。“ご＋サ变动词词干＋ください”的敬语表达形式。⑥“动词て形＋いただく”“お＋动词ます形去掉‘ます’的形式＋いただく”敬语表达形式。“ご＋サ变动词词干＋いただく”的敬语表达形式。","examples":[{"jp":"社長はまもなくご到着になります。","r":"しゃちょうはまもなくごとうちゃくになります。","zh":"社长马上就到。"},{"jp":"お荷物は私がお持ちいたします。","r":"おにもつはわたしがおもちいたします。","zh":"您的行李由我来拿。"}]},{"id":"g300","level":"N1","pattern":"～わりに（は）","meaning":"表示以它前面所给出的条件，实际所达到的程度低于或高于人们的推论。","cat":"compare","note":"常用“名词＋の＋わりに”“二类形容词＋な＋わりに”“动词/一类形容词（简体形式）＋わりに”的句型。表示“虽然”的意思。","examples":[{"jp":"彼は年齢のわりに、若く見える。","r":"かれはねんれいのわりに、わかくみえる。","zh":"他看起来比实际年龄年轻。"},{"jp":"この料理は値段のわりに、量が多い。","r":"このりょうりはねだんのわりに、りょうがおおい。","zh":"这道菜按价格来说，分量很足。"}]},{"id":"g301","level":"N1","pattern":"～かねる","meaning":"表示“即使想这么做也不能”的意思。","cat":"potential","note":"接续为“动词ます形去掉ます＋かねる”，语气比较委婉、郑重。","examples":[{"jp":"この席は遠くて聞きづらい。","r":"このせきはとおくてききづらい。","zh":"这个座位太远，很难听清。"},{"jp":"そのご意見には賛成しかねます。","r":"そのごいけんにはさんせいしかねます。","zh":"对您那个意见，我很难赞成。"}]},{"id":"g302","level":"N1","pattern":"～をめぐって","meaning":"表示“以……为中心”“与……相关联”的意思。","cat":"quote","examples":[{"jp":"この問題をめぐって、様々な意見が出た。","r":"このもんだいをめぐって、さまざまないけんがでた。","zh":"围绕这个问题，出现了各种意见。"},{"jp":"土地の利用方法をめぐって、議論が続いている。","r":"とちのりようほうほうをめぐって、ぎろんがつづいている。","zh":"围绕土地的利用方法，争论仍在继续。"}]},{"id":"g303","level":"N1","pattern":"～はもとより","meaning":"列举事项时，先把理所当然的事项用“～はもとより”举出来，后面再推而广之。","cat":"limit","note":"多用于书面语，表示“自不必说”的意思。","examples":[{"jp":"国内はもとより、海外でも有名になった。","r":"こくないはもとより、かいがいでもゆうめいになった。","zh":"不仅国内，在海外也出了名。"},{"jp":"品質はもとより、デザインも優れている。","r":"ひんしつはもとより、デザインもすぐれている。","zh":"质量自不必说，设计也很出色。"}]},{"id":"g304","level":"N1","pattern":"～に及ぶ","meaning":"谈到事态的影响及程度之大时用“～に及ぶ”的说法。","cat":"time","note":"主要接在数字后面，有时也用于广度、大小等具体内容。表示“达到”的意思。","examples":[{"jp":"被害額は、1億円に及ぶ。","r":"ひがいがくは、いちおくえんにおよぶ。","zh":"损失金额高达一亿日元。"},{"jp":"参加者は、1000人に及んだ。","r":"さんかしゃは、せんにんにおよんだ。","zh":"参加者达到了一千人。"}]},{"id":"g305","level":"N1","pattern":"～ならではの～","meaning":"表示“非它不可的……”，常用句型“名词＋ならではの～”。","cat":"limit","examples":[{"jp":"この旅館ならではの、心のこもったおもてなしだ。","r":"このりょかんならではの、こころのこもったおもてなしだ。","zh":"这是这家旅馆特有的诚挚款待。"},{"jp":"職人ならではの繊細な技が光っている。","r":"しょくにんならではのせんさいなわざがひかっている。","zh":"工匠特有的精湛技艺熠熠生辉。"}]},{"id":"g306","level":"N1","pattern":"思わず","meaning":"副词，表示“情不自禁”“不知不觉”的意思。","cat":"emote","examples":[{"jp":"その光景を見て、思わず涙が出た。","r":"そのこうけいをみて、おもわずなみだがでた。","zh":"看到那景象，不由得流下了眼泪。"},{"jp":"彼の冗談に、思わず笑ってしまった。","r":"かれのじょうだんに、おもわずわらってしまった。","zh":"听到他的玩笑，忍不住笑了出来。"}]},{"id":"g307","level":"N1","pattern":"～ずくめ","meaning":"“名词＋ずくめ”表示“类似情况有很多”“没有例外”。","cat":"limit","examples":[{"jp":"黒ずくめのファッションが流行した。","r":"くろずくめのファッションがりゅうこうした。","zh":"一身黑色的打扮流行了起来。"},{"jp":"今日は朝からいいことずくめだ。","r":"きょうはあさからいいことずくめだ。","zh":"今天从早上开始就净是好事。"}]},{"id":"g308","level":"N1","pattern":"～た後/のち、～","meaning":"表示前项事件之后又发生了后项的动作、事态。","cat":"time","note":"这里的“後”既可以读作“のち”，又可以读作“あと”。但“～た後で”的“”只读“あと”。“……之后”的意思。","examples":[{"jp":"会議が終わった後、レポートを提出した。","r":"かいぎがおわったあと、レポートをていしゅつした。","zh":"会议结束后，提交了报告。"},{"jp":"地震の後、しばらく余震が続いた。","r":"じしんののち、しばらくよしんがつづいた。","zh":"地震过后，余震持续了一段时间。"}]},{"id":"g309","level":"N1","pattern":"～にとどまらず","meaning":"表示不限定对象。","cat":"limit","note":"“不仅”的意思。","examples":[{"jp":"この作品は国内にとどまらず、海外でも高く評価された。","r":"このさくひんはこくないにとどまらず、かいがいでもたかくひょうかされた。","zh":"这部作品不仅在国内，在海外也获得了高度评价。"},{"jp":"この運動は若者にとどまらず、中高年にも広がっている。","r":"このうんどうはわかものにとどまらず、ちゅうこうねんにもひろがっている。","zh":"这项运动不仅年轻人，也扩展到了中老年人。"}]},{"id":"g310","level":"N1","pattern":"～に応えて","meaning":"表示“采取所期待、要求的行动”的意思。","cat":"guess","note":"前接名词。","examples":[{"jp":"客の要望に応えて、新商品を開発した。","r":"きゃくのようぼうにこたえて、しんしょうひんをかいはつした。","zh":"应顾客的要求，开发了新商品。"},{"jp":"市民の声に応えて、駅にエレベーターが設置された。","r":"しみんのこえにこたえて、えきにエレベーターがせっちされた。","zh":"回应市民的呼声，车站安装了电梯。"}]},{"id":"g311","level":"N1","pattern":"“～といわれる”、“といわれている”「不明确指出主体的例子」","meaning":"两者均表示“人们都那样说”的意思。","cat":"guess","note":"这些表达往往不明确指出动作主体。可翻译为“人们都说”。","examples":[{"jp":"この地方は、冬は雪が多いといわれている。","r":"このちほうは、ふゆはゆきがおおいといわれている。","zh":"据说这一带冬天雪很多。"},{"jp":"彼は、若い頃から才能があったといわれている。","r":"かれは、わかいころからさいのうがあったといわれている。","zh":"据说他从年轻时起就很有才能。"}]},{"id":"g312","level":"N1","pattern":"～こともあって","meaning":"“小句（简体形式）＋こともあって”是表示只举出其中之一加以叙述，暗含其他原因的用法。","cat":"reason","note":"“因为”的意思。","examples":[{"jp":"連休で観光客が多いこともあって、ホテルは満室だった。","r":"れんきゅうでかんこうきゃくがおおいこともあって、ホテルはまんしつだった。","zh":"因为连休观光客多，酒店都客满了。"},{"jp":"彼は経験も豊かなこともあって、頼りになる。","r":"かれはけいけんもゆたかなこともあって、たよりになる。","zh":"他经验丰富，所以很可靠。"}]},{"id":"g313","level":"N1","pattern":"～にも増して","meaning":"表示“比……更加”的意思，与表示时间的名词一起使用。","cat":"compare","examples":[{"jp":"今年は去年にも増して、暑い夏になっている。","r":"ことしはきょねんにもまして、あついなつになっている。","zh":"今年比去年更热。"},{"jp":"彼女は以前にも増して、美しくなった。","r":"かのじょはいぜんにもまして、うつくしくなった。","zh":"她比以前更漂亮了。"}]},{"id":"g314","level":"N1","pattern":"～きる","meaning":"解说;接续为“动词ます形去ます＋きる”的形式。","cat":"potential","note":"表示①某种状态程度很高，即“完全……”“极其……”②将某种行为进行到底，即“把……做完”。","examples":[{"jp":"彼は最後まで走りきった。","r":"かれはさいごまではしりきった。","zh":"他一直跑到了最后。"},{"jp":"その知らせを聞いて、彼は疲れきった顔をした。","r":"そのしらせをきいて、かれはつかれきったかおをした。","zh":"听到那个消息，他露出一副精疲力竭的表情。"}]},{"id":"g315","level":"N1","pattern":"～を数える","meaning":"表示“合计数量为……”，主要用于强调数量之多。","cat":"count","examples":[{"jp":"この美術館の収蔵品は、5000点を数える。","r":"このびじゅつかんのしゅうぞうひんは、ごせんてんをかぞえる。","zh":"这家美术馆的藏品多达五千件。"},{"jp":"彼のファンは、全国に数十万人を数える。","r":"かれのファンは、ぜんこくにすうじゅうまんにんをかぞえる。","zh":"他的粉丝在全国多达数十万人。"}]},{"id":"g316","level":"N1","pattern":"～に関係なく","meaning":"常用“A＋に関係なく＋B”的句型，表示“A对B的实现没有影响。","cat":"negative","note":"”","examples":[{"jp":"天候に関係なく、試合は行われます。","r":"てんこうにかんけいなく、しあいはおこなわれます。","zh":"无论天气如何，比赛都会举行。"},{"jp":"年齢に関係なく、誰でも挑戦できる。","r":"ねんれいにかんけいなく、だれでもちょうせんできる。","zh":"不论年龄，谁都可以挑战。"}]},{"id":"g317","level":"N1","pattern":"～ないまでも、～","meaning":"前面接动词的否定形式，表示“即使不……，也……”。","cat":"cond","examples":[{"jp":"億万長者だとは言わないまでも、彼はかなりのお金持ちらしい。","r":"おくまんちょうじゃだとはいわないまでも、かれはかなりのおかねもちらしい。","zh":"即使不能说他是亿万富翁，他似乎也相当有钱。"},{"jp":"毎日でないまでも、週に三回は運動したい。","r":"まいにちでないまでも、しゅうにさんかいはうんどうしたい。","zh":"即便不能每天，也希望一周运动三次。"}]},{"id":"g318","level":"N1","pattern":"あえて","meaning":"副词，表示“不顾困难而有意地”。","cat":"desire","examples":[{"jp":"あえて反対意見を言うことにした。","r":"あえてはんたいいけんをいうことにした。","zh":"我决定特意提出反对意见。"},{"jp":"彼はあえて難しい道を選んだ。","r":"かれはあえてむずかしいみちをえらんだ。","zh":"他特意选择了艰难的道路。"}]},{"id":"g319","level":"N1","pattern":"～と並ぶ～","meaning":"表示“与……比肩”的意思。","cat":"compare","note":"前面列举比较对象，后面表明比较的内容。","examples":[{"jp":"この店は、老舗に並ぶほどの人気だ。","r":"このみせは、しにせにならぶほどのにんきだ。","zh":"这家店的人气可与老字号媲美。"},{"jp":"彼の実力は、プロに並ぶものだ。","r":"かれのじつりょくは、プロにならぶものだ。","zh":"他的实力可与专业选手比肩。"}]},{"id":"g320","level":"N1","pattern":"～抜く","meaning":"“动词ます形去掉ます＋抜く”。","cat":"potential","note":"表示①“……到底”②“彻底……”“极其……”。","examples":[{"jp":"彼は最後まで考え抜いて、結論を出した。","r":"かれはさいごまでかんがえぬいて、けつろんをだした。","zh":"他深思熟虑之后，得出了结论。"},{"jp":"この山道を、最後まで歩き抜くのは大変だ。","r":"このやまみちを、さいごまであるきぬくのはたいへんだ。","zh":"要一口气走完这条山路很辛苦。"}]},{"id":"g321","level":"N1","pattern":"～込む","meaning":"接续为“动词ます形去掉ます＋込む”。","cat":"state","note":"表示①动作者本人“进入”（中心动词为自动词）②作为动作的结果“进入”（中心动词为他动词）③充分进行④保持状态","examples":[{"jp":"彼は部屋に飛び込んできた。","r":"かれはへやにとびこんできた。","zh":"他冲进了房间。"},{"jp":"この問題について、じっくり考え込んでしまった。","r":"このもんだいについて、じっくりかんがえこんでしまった。","zh":"关于这个问题，陷入了沉思。"}]},{"id":"g322","level":"N1","pattern":"かけがえのない","meaning":"表示“没有可替换的东西”“十分宝贵”。","cat":"limit","examples":[{"jp":"家族はかけがえのない存在だ。","r":"かぞくはかけがえのないそんざいだ。","zh":"家人是无可替代的存在。"},{"jp":"この一枚の写真は、私にとってかけがえのない宝物だ。","r":"このいちまいのしゃしんは、わたしにとってかけがえのないたからものだ。","zh":"这张照片对我来说是无可替代的宝贝。"}]},{"id":"g323","level":"N1","pattern":"～ものなら","meaning":"“动词的可能形式＋ものなら”表示说话人或文章作者提出一种很难实现的假设，其后多为表示愿望的说法。","cat":"cond","note":"“假如”的意思。","examples":[{"jp":"もう一度若返れるものなら、悔いなく生きたい。","r":"もういちどわかがえれるものなら、くいなくいきたい。","zh":"如果能重返青春，我想不留遗憾地活。"},{"jp":"できるものなら、時間を戻したい。","r":"できるものなら、じかんをもどしたい。","zh":"如果可能的话，真想让时间倒流。"}]},{"id":"g324","level":"N1","pattern":"～てみせる","meaning":"表示①“把自己做的事展示给别人看”，②“表明自己的强烈意志或决心。","cat":"desire","note":"”","examples":[{"jp":"ばかにしないでください。今度、勝ってみせます。","r":"ばかにしないでください。こんど、かってみせます。","zh":"别小看我。这次一定赢给你看。"},{"jp":"必ず夢を叶えてみせる。","r":"かならずゆめをかなえてみせる。","zh":"我一定要实现梦想给你看。"}]},{"id":"g325","level":"N1","pattern":"もう少しで～ところだった","meaning":"“动词基本型＋ところだった”表示与现实相反的假设。","cat":"time","note":"“差点儿……”的意思。","examples":[{"jp":"もう少しで電車に乗り遅れるところだった。","r":"もうすこしででんしゃにのりおくれるところだった。","zh":"差点没赶上电车。"},{"jp":"もう少しで大事な書類をなくすところだった。","r":"もうすこしでだいじなしょるいをなくすところだった。","zh":"差点弄丢了重要文件。"}]},{"id":"g326","level":"N1","pattern":"～に達する/～に上る「数值表达方式」","meaning":"二者都是说明数值的表达方式，表示说话人对该数值的评价。","cat":"count","note":"都是“达到”的意思。“～に達する”表示该数值或数量达到了一定的地步或级别。“～に上る”则表示作为结果该数量是一个较大的数值。","examples":[{"jp":"今年の入場者数は、10万人に達した。","r":"ことしのにゅうじょうしゃすうは、じゅうまんにんにたっした。","zh":"今年入场人数达到了十万人。"},{"jp":"事故による死者は、30人に上った。","r":"じこによるししゃは、さんじゅうにんにのぼった。","zh":"事故造成的死亡人数多达三十人。"}]},{"id":"g327","level":"N1","pattern":"～ず","meaning":"“～ず”是书面语，意思语“～ないで”相同，接续为“动词ない形去ない＋ず”的形式。","cat":"negative","note":"サ变动词在后续接“ず”时变成“せず”的形式。“不……”的意思。","examples":[{"jp":"彼は一言も言わずに、部屋を出ていった。","r":"かれはひとこともいわずに、へやをでていった。","zh":"他一言不发地走出了房间。"},{"jp":"休まずに働き続けた。","r":"やすまずにはたらきつづけた。","zh":"一刻不停地工作。"}]},{"id":"g328","level":"N1","pattern":"目の当たりにする","meaning":"表示“直接看到”。","cat":"emote","note":"多用于人们较少能看到的灾难或事故情况。","examples":[{"jp":"私は事故の現場を目の当たりにした。","r":"わたしはじこのげんばをまのあたりにした。","zh":"我亲眼目睹了事故现场。"},{"jp":"彼は自然の驚異を目の当たりにして、言葉を失った。","r":"かれはしぜんのきょういをまのあたりにして、ことばをうしなった。","zh":"他亲眼目睹了自然的威力，说不出话来。"}]},{"id":"g329","level":"N1","pattern":"～ばかりは","meaning":"前接名词，表示限定，“别的且不论，就只……”意思。","cat":"limit","examples":[{"jp":"他のことはともかく、この点ばかりは譲れない。","r":"ほかのことはともかく、このてんばかりはゆずれない。","zh":"其他事情暂且不论，唯有这一点不能让步。"},{"jp":"失敗は許されない。今回ばかりは絶対に成功させたい。","r":"しっぱいはゆるされない。こんかいばかりはぜったいにせいこうさせたい。","zh":"不能失败，唯有这次一定要成功。"}]},{"id":"g330","level":"N1","pattern":"～（よ）うがない","meaning":"“动词ます形去掉ます＋（よ）うがない”“サ变动词＋の＋しようがない”，表示“虽然想那样，但是做不到”。","cat":"potential","examples":[{"jp":"彼の気持ちは、知りようがない。","r":"かれのきもちは、しりようがない。","zh":"他的想法无从得知。"},{"jp":"相手が誠実すぎて、断りようがない。","r":"あいてがせいじつすぎて、ことわりようがない。","zh":"对方过于诚恳，让人无法拒绝。"}]},{"id":"g331","level":"N1","pattern":"なるべく","meaning":"副词，表示“如果可能的话希望那样做”“希望如此”。","cat":"desire","examples":[{"jp":"なるべく早く返事をお願いします。","r":"なるべくはやくへんじをおねがいします。","zh":"请尽量早点答复。"},{"jp":"なるべく多くの人に参加してほしい。","r":"なるべくおおくのひとにさんかしてほしい。","zh":"希望尽可能多的人参加。"}]},{"id":"g332","level":"N1","pattern":"～に恵まれた～","meaning":"前接名词，表示幸运地获得了很好地机会、才干、环境等。","cat":"view","note":"“被……眷顾”的意思。","examples":[{"jp":"彼は才能に恵まれた音楽家だ。","r":"かれはさいのうにめぐまれたおんがくかだ。","zh":"他是一位天赋过人的音乐家。"},{"jp":"この国は美しい自然に恵まれている。","r":"このくにはうつくしいしぜんにめぐまれている。","zh":"这个国家拥有美丽的自然。"}]},{"id":"g333","level":"N1","pattern":"～にも～","meaning":"前接含疑问词的动词小句，表示在疑问词所包含的所有场合后续部分都成立。","cat":"cond","note":"其中“にも”前的动词要用基本型。","examples":[{"jp":"彼は何を聞いても、答えにもならない。","r":"かれはなにをきいても、こたえにもならない。","zh":"无论问他什么，都得不到回答。"},{"jp":"誰が何と言おうとも、決心は変わらない。","r":"だれがなんといおうとも、けっしんはかわらない。","zh":"无论谁说什么，决心都不会改变。"}]},{"id":"g334","level":"N1","pattern":"仮に～とする","meaning":"表示“假设～”“假定～”。","cat":"cond","note":"“とする”前多用动词的た形。","examples":[{"jp":"仮にこの計画が失敗したとしても、やり直せる。","r":"かりにこのけいかくがしっぱいしたとしても、やりなおせる。","zh":"假设这个计划失败了，也还能重来。"},{"jp":"仮に10万円あったとしたら、何に使う？","r":"かりにじゅうまんえんあったとしたら、なににつかう？","zh":"假如有十万日元，你会用来做什么？"}]},{"id":"g335","level":"N1","pattern":"～を除くと、～","meaning":"“除く”是动词，意思是“除去”，多用于书面语。","cat":"limit","note":"“～を除くと、～”前接名词。","examples":[{"jp":"一部の商品を除くと、全て割引になります。","r":"いちぶのしょうひんをのぞくと、すべてわりびきになります。","zh":"除部分商品外，全部打折。"},{"jp":"彼を除くと、この仕事ができる人はいない。","r":"かれをのぞくと、このしごとができるひとはいない。","zh":"除他以外，没人能做这份工作。"}]},{"id":"g336","level":"N1","pattern":"すなわち","meaning":"用于将名词替换为其他说法，意思相当于“即”“换言之”。","cat":"quote","examples":[{"jp":"彼は作家である。すなわち、文章を書くことを生業としている。","r":"かれはさっかである。すなわち、ぶんしょうをかくことをなりわいとしている。","zh":"他是作家，也就是说，以写文章为生。"},{"jp":"地球の表面積の約7割、すなわち海が占めている。","r":"ちきゅうのひょうめんせきのやくななわり、すなわちうみがしめている。","zh":"地球表面约七成，即海洋所占。"}]},{"id":"g337","level":"N1","pattern":"～は言うに及ばず","meaning":"相当于“不要说……”，是书面语表达。","cat":"limit","examples":[{"jp":"日本は言うに及ばず、世界各国からも参加があった。","r":"にほんはいうにおよばず、せかいかっこくからもさんかがあった。","zh":"别说日本，世界各国也都参加了。"},{"jp":"大人は言うに及ばず、子供にも人気がある。","r":"おとなはいうにおよばず、こどもにもにんきがある。","zh":"别说大人，也很受孩子欢迎。"}]},{"id":"g338","level":"N1","pattern":"～てはならない","meaning":"“动词て形＋はならない”式表示禁止的表达方式。","cat":"order","note":"此句型为书面语表达。“不能、不得”的含义。","examples":[{"jp":"このような間違いをしてはならない。","r":"このようなまちがいをしてはならない。","zh":"绝不能犯这样的错误。"},{"jp":"人の秘密を勝手に話してはならない。","r":"ひとのひみつをかってにはなしてはならない。","zh":"不能随便说别人的秘密。"}]},{"id":"g339","level":"N1","pattern":"～（よ）うにも～ない","meaning":"“动词意志形＋にも＋动词可能形式的ない形”意思是“尽量必要却无法办到”“想做却做不到”。","cat":"potential","examples":[{"jp":"彼に相談しようにも、連絡先がわからない。","r":"かれにそうだんしようにも、れんらくさきがわからない。","zh":"想找他商量，却不知道联系方式。"},{"jp":"足が痛くて、歩こうにも歩けない。","r":"あしがいたくて、あるこうにもあるけない。","zh":"脚疼，想走也走不了。"}]},{"id":"g340","level":"N1","pattern":"～たきり","meaning":"“动词た形＋きり”意思是“在实施前一动作、行为后，没有实施下一步的相应行为或动作”。","cat":"time","examples":[{"jp":"彼は一度行ったきり、戻ってこない。","r":"かれはいちどいったきり、もどってこない。","zh":"他走了一趟之后就再没回来。"},{"jp":"あの日を最後に、彼とは会ったきりだ。","r":"あのひをさいごに、かれとはあったきりだ。","zh":"以那天为最后，就再没见过他了。"}]},{"id":"g341","level":"N1","pattern":"～極まりない","meaning":"意思是“极为……”。","cat":"limit","note":"前接名词或二类形容词。用于特别有意外性的词语，多表示不好的意思。","examples":[{"jp":"彼のしたことは、卑劣極まる。","r":"かれのしたことは、ひれつきわまる。","zh":"他的所作所为极其卑鄙。"},{"jp":"無事に帰国できて、感激の極みです。","r":"ぶじにきこくできて、かんげきのきわみです。","zh":"平安回国，感激之至。"},{"jp":"先日レストランに行ったとき、店員の失礼な態度に大変不快極まりない思いをした。","r":"せんじつレストランにいったとき、てんいんのしつれいなたいどにたいへんふかいきわまりないおもいをした。","zh":"前几天去餐厅时，店员失礼的态度让我感到极其不快。","src":"2023年12月真题"}],"srcs":["2023年12月真题"]},{"id":"g342","level":"N1","pattern":"～途中で","meaning":"“名词＋の＋途中で”“动词基本型＋途中で”的形式，表示某种行为正在进行期间发生了别的行为。","cat":"time","note":"“在……的中途”的意思。","examples":[{"jp":"仕事の途中で、電話がかかってきた。","r":"しごとのとちゅうで、でんわがかかってきた。","zh":"工作途中来了一通电话。"},{"jp":"会議の途中で、資料が足りないことに気づいた。","r":"かいぎのとちゅうで、しりょうがたりないことにきづいた。","zh":"会议途中发现资料不够。"}]},{"id":"g343","level":"N1","pattern":"“反面、～”和“他方、～”","meaning":"“反面”表示“同一事物存在不同的两个方面”，可以用在句中连接下文，还可以用在句首。","cat":"reverse","note":"用于句中时，使用“小句（简体形）＋反面”的形式。语法“他方”一般采用“一方～、他方～”的形式，是对照两方面情况时使用的连词，多数情况下前后主语不同。","examples":[{"jp":"この薬はよく効く反面、副作用もある。","r":"このくすりはよくきくはんめん、ふくさようもある。","zh":"这种药很有效，但另一方面也有副作用。"},{"jp":"都会は便利な反面、ストレスも多い。","r":"とかいはべんりなはんめん、ストレスもおおい。","zh":"城市方便，可另一方面压力也大。"}]},{"id":"g344","level":"N1","pattern":"～向けて","meaning":"前接名词，表示“朝着……方向”，“以……为对象或目标”。","cat":"purpose","examples":[{"jp":"彼は世界平和に向けて、活動している。","r":"かれはせかいへいわにむけて、かつどうしている。","zh":"他正为实现世界和平而活动。"},{"jp":"この会社は若い人に向けた商品を開発している。","r":"このかいしゃはわかいひとにむけたしょうひんをかいはつしている。","zh":"这家公司开发面向年轻人的商品。"}]},{"id":"g345","level":"N1","pattern":"～に伴い","meaning":"表示“由于一方面的变化，另一方面也跟着变化”。","cat":"state","note":"使用“名词＋に伴い”“动词基本型＋（の）＋に伴い”的句型。“随着……”的意思。","examples":[{"jp":"人口の増加に伴い、交通量も増えている。","r":"じんこうのぞうかにともない、こうつうりょうもふえている。","zh":"随着人口增加，交通量也在增加。"},{"jp":"経済の発展に伴い、環境問題も深刻化した。","r":"けいざいのはってんにともない、かんきょうもんだいもしんこくかした。","zh":"随着经济发展，环境问题也日益严重。"}]},{"id":"g346","level":"N1","pattern":"～についで","meaning":"前接名词，表示“紧随其后”“紧接着”。","cat":"time","examples":[{"jp":"東京に次いで、大阪が人口の多い都市だ。","r":"とうきょうについで、おおさかがじんこうのおおいとしだ。","zh":"继东京之后，大阪是人口多的城市。"},{"jp":"社長に次いで、専務が権限を持っている。","r":"しゃちょうについで、せんむがけんげんをもっている。","zh":"仅次于社长，专务拥有权限。"}]},{"id":"g347","level":"N1","pattern":"～済み","meaning":"部分サ变动词词干后接“済み”表示已经完成。","cat":"tense","note":"“……完”的意思。","examples":[{"jp":"この書類は、処理済みです。","r":"このしょるいは、しょりずみです。","zh":"这份文件已处理完毕。"},{"jp":"お支払いは、完了済みでございます。","r":"おしはらいは、かんりょうずみでございます。","zh":"款项已经支付完毕。"}]},{"id":"g348","level":"N1","pattern":"～（よ）うというものだ","meaning":"用“动词意志形＋というもの”的形式表示“以……为目的（想出来的东西）”。","cat":"desire","examples":[{"jp":"学生にやる気を出させようというものだ。","r":"がくせいにやるきをださせようというものだ。","zh":"这是一种旨在激发学生学习热情的做法。"},{"jp":"環境を守ろうというものだ。","r":"かんきょうをまもろうというものだ。","zh":"这是为保护环境而提出的主张。"}]},{"id":"g349","level":"N1","pattern":"～が見込める","meaning":"“～を見込める”的意思是“预测推算”。","cat":"guess","note":"“～が見込める”是其可能形式。","examples":[{"jp":"来年の売り上げは、大きく伸びることが見込める。","r":"らいねんのうりあげは、おおきくのびることがみこめる。","zh":"预计明年的销售额会有大幅增长。"},{"jp":"この地域の成長は、今後も続くことが見込める。","r":"このちいきのせいちょうは、こんごもつづくことがみこめる。","zh":"预计这一地区的增长今后仍将持续。"}]},{"id":"g350","level":"N1","pattern":"ご覧にいれる","meaning":"“ご覧にいれる”是“”的自谦形式。","cat":"honor","note":"表示“给……看”的意思。","examples":[{"jp":"新製品のサンプルをご覧に入れます。","r":"しんせいひんのサンプルをごらんにいれます。","zh":"请您看看新产品的样品。"},{"jp":"次回の会議の資料をご覧に入れます。","r":"じかいのかいぎのしりょうをごらんにいれます。","zh":"请您过目下次会议的资料。"}]},{"id":"g351","level":"N1","pattern":"いまいち","meaning":"表示“与本来期待的结果或状况稍有差距”，既可以做副词，又可以做名词。","cat":"compare","note":"“差一点儿”的意思。","examples":[{"jp":"この映画は、いまいち面白くなかった。","r":"このえいがは、いまいちおもしろくなかった。","zh":"这部电影不太有意思。"},{"jp":"彼の説明は、いまいちよくわからなかった。","r":"かれのせつめいは、いまいちよくわからなかった。","zh":"他的说明我有点没太听懂。"}]},{"id":"g352","level":"N1","pattern":"～とはいえ～","meaning":"表示用于在承认前项叙述的同时，叙述与之相反的事项。","cat":"reverse","formation":"名词/动词/い形容词普通体 + とはいえ","note":"相当于汉语的“虽说……但是……”。","examples":[{"jp":"春とはいえ、朝晩はまだ肌寒い。","r":"はるとはいえ、あさばんはまだはださむい。","zh":"虽说是春天，早晚还是微寒。"},{"jp":"準備万端とはいえ、いざ本番となると緊張するものだ。","r":"じゅんびばんたんとはいえ、いざほんばんとなるときんちょうするものだ。","zh":"虽说准备周全，一旦正式上场还是会紧张。"},{"jp":"4月になったとはいえ、まだ寒い日もある。","r":"しがつになったとはいえ、まださむいひもある。","zh":"虽说已到四月，但仍有寒冷的日子。"},{"jp":"便利になったとはいえ、やはり値段が高い。","r":"べんりになったとはいえ、やはりねだんがたかい。","zh":"虽说变得方便了，但价格还是高。"}]},{"id":"g353","level":"N1","pattern":"いかんなく","meaning":"表示“把一切毫无保留地”的意思。","cat":"state","note":"前面多为能力、才能、经验等名词。","examples":[{"jp":"彼は自らの才能をいかんなく発揮した。","r":"かれはみずからのさいのうをいかんなくはっきした。","zh":"他尽情施展了自己的才能。"},{"jp":"この試合で、彼は実力をいかんなく見せつけた。","r":"このしあいで、かれはじつりょくをいかんなくみせつけた。","zh":"这场比赛中，他充分展示了实力。"}]},{"id":"g354","level":"N1","pattern":"こんな（に）～ことはない","meaning":"表示程度非常高，“没有比……再……的了”。","cat":"compare","note":"“～”部分一般为表示情感的一类形容词、二类形容词以及动词。","examples":[{"jp":"家族と過ごすほど、嬉しいことはない。","r":"かぞくとすごすほど、うれしいことはない。","zh":"没有比和家人在一起更开心的事了。"},{"jp":"彼に会えるほど、楽しみなことはない。","r":"かれにあえるほど、たのしみなことはない。","zh":"没有比能见到他更让人期待的事了。"}]},{"id":"g355","level":"N1","pattern":"～ようによっては","meaning":"接在“动词ます形去掉ます”的形式后，表示“根据不同的做法会产生不同的结果”。","cat":"cond","examples":[{"jp":"説明の仕方によっては、誤解を招く恐れがある。","r":"せつめいのしかたによっては、ごかいをまねくおそれがある。","zh":"根据说明方式的不同，可能会引起误解。"},{"jp":"やりようによっては、この計画は成功するかもしれない。","r":"やりようによっては、このけいかくはせいこうするかもしれない。","zh":"如果方法得当，这个计划也许会成功。"}]},{"id":"g356","level":"N1","pattern":"たとえ～だけでも～","meaning":"表示“即使……也……”的意思。","cat":"cond","examples":[{"jp":"たとえ少しだけでも、練習を続けることが大切だ。","r":"たとえすこしだけでも、れんしゅうをつづけることがたいせつだ。","zh":"哪怕只是一点点，坚持练习很重要。"},{"jp":"たとえ一日だけでも、休みがほしい。","r":"たとえいちにちだけでも、やすみがほしい。","zh":"哪怕只有一天，也想休息。"}]},{"id":"g357","level":"N1","pattern":"～て間もない","meaning":"接在动词て形后，用于修饰后面的名词。","cat":"time","note":"“……不久之后”的意思。","examples":[{"jp":"彼は入社して間もない新人だ。","r":"かれはにゅうしゃしてまもないしんじんだ。","zh":"他是刚进公司不久的新人。"},{"jp":"開店して間もない店は、混んでいることが多い。","r":"かいてんしてまもないみせは、こんでいることがおおい。","zh":"刚开张不久的店往往很拥挤。"}]},{"id":"g358","level":"N1","pattern":"～ともなると、～","meaning":"“名词＋ともなると、～”表示时间或人、物处于区别于其他的特别状态。","cat":"cond","note":"“一旦到了……就……”的意思。","examples":[{"jp":"世界的な俳優ともなると、さすがに演技力が違うようだ。","r":"せかいてきなはいゆうともなると、さすがにえんぎりょくがちがうようだ。","zh":"一旦成了世界级演员，演技果然就不一样了。"},{"jp":"夏休みともなれば、観光地はどこも混む。","r":"なつやすみともなれば、かんこうちはどこもこむ。","zh":"一到暑假，旅游景点哪里都拥挤。"}]},{"id":"g359","level":"N1","pattern":"～をよそに、～","meaning":"书面语，表示“不顾”的意思。","cat":"reverse","formation":"名词 + をよそに","examples":[{"jp":"親の心配をよそに、彼は毎晩遅くまで遊び歩いている。","r":"おやのしんぱいをよそに、かれはまいばんおそくまであそびあるいている。","zh":"他不顾父母的担心，每晚都玩到很晚。"},{"jp":"周囲の反対をよそに、彼女は独断で計画を進めた。","r":"しゅういのはんたいをよそに、かのじょはどくだんでけいかくをすすめた。","zh":"她无视周围的反对，独断地推进了计划。"},{"jp":"大学は学生の反対運動をよそに、学費の値上げを強行した。","r":"だいがくはがくせいのはんたいうんどうをよそに、がくひのねあげをきょうこうした。","zh":"大学无视学生的抗议运动，强行提高了学费。"},{"jp":"彼は家族の心配をよそに、海外へ旅立っていった。","r":"かれはかぞくのしんぱいをよそに、かいがいへたびだっていった。","zh":"他不顾家人的担心，动身去了海外。"}]},{"id":"g360","level":"N1","pattern":"～はおろか、～","meaning":"表示“不用说的事情”“当然的事情”，强调后项事情的表达方式，不用于论文等客观性文章。","cat":"limit","examples":[{"jp":"事故でけがをして、走ることはおろか歩くこともできない。","r":"じこでけがをして、はしることはおろかあるくこともできない。","zh":"因为事故受伤，别说跑了，连走路都不行。"},{"jp":"彼は漢字はおろか、ひらがなも読めない。","r":"かれはかんじはおろか、ひらがなもよめない。","zh":"他别说是汉字，连平假名都不会读。"}]},{"id":"g361","level":"N1","pattern":"～てもかまわない","meaning":"前接动词て形，表示“别管……”的意思。","cat":"order","examples":[{"jp":"この書類は、明日までに提出してもかまわない。","r":"このしょるいは、あしたまでにていしゅつしてもかまわない。","zh":"这份文件明天之前交也没关系。"},{"jp":"質問があれば、いつ聞いてもかまいません。","r":"しつもんがあれば、いつきいてもかまいません。","zh":"有问题的话，随时问都可以。"}]},{"id":"g362","level":"N1","pattern":"～てならない","meaning":"表示“那种情绪不可抑制”，接在表自发意义的动词及表示情感的一类形容词和二类形容词后。","cat":"emote","examples":[{"jp":"彼の成長を見ると、嬉しくてならない。","r":"かれのせいちょうをみると、うれしくてならない。","zh":"看到他的成长，高兴得不得了。"},{"jp":"この問題を考えると、心配でならない。","r":"このもんだいをかんがえると、しんぱいでならない。","zh":"一想到这个问题，就担心得不行。"}]},{"id":"g363","level":"N1","pattern":"～により～","meaning":"意思与“～によって”相同，但书面语色彩更强些。","cat":"reason","note":"“根据”的意思。","examples":[{"jp":"天気予報により、明日は雨だそうです。","r":"てんきよほうにより、あしたはあめだそうです。","zh":"根据天气预报，明天有雨。"},{"jp":"調査結果により、対策を立てる。","r":"ちょうさけっかにより、たいさくをたてる。","zh":"根据调查结果制定对策。"}]},{"id":"g364","level":"N1","pattern":"なぜ～かというと～からだ/なぜかというと～からだ","meaning":"在陈述某事项相关的理由时，使句子简短结束，并实现对理由的强调。","cat":"reason","note":"“为什么……呢？这是因为……”","examples":[{"jp":"なぜ彼が遅れるかというと、電車が止まったからだ。","r":"なぜかれがおくれるかというと、でんしゃがとまったからだ。","zh":"他为什么迟到呢？因为电车停了。"},{"jp":"なぜこの本を選んだかというと、評判が良かったからだ。","r":"なぜこのほんをえらんだかというと、ひょうばんがよかったからだ。","zh":"为什么选这本书？因为口碑好。"},{"jp":"健康的な生活を送るためには睡眠時間を十分にとる必要があるが、ただ長く眠ればいいかというと、そうではない。","r":"けんこうてきなせいかつをおくるためにはすいみんじかんをじゅうぶんにとるひつようがあるが、ただながくねむればいいかというと、そうではない。","zh":"过健康的生活需要充足的睡眠时间，但要说睡得多就行，却并非如此。","src":"2022年7月真题"}],"srcs":["2022年7月真题"]},{"id":"g365","level":"N1","pattern":"～によらず","meaning":"前接名词，表示“与……无关”。","cat":"negative","examples":[{"jp":"天候によらず、大会は開催されます。","r":"てんこうによらず、たいかいはかいさいされます。","zh":"不论天气如何，大会都会举行。"},{"jp":"年齢によらず、参加は可能です。","r":"ねんれいによらず、さんかはかのうです。","zh":"不论年龄，都可以参加。"}]},{"id":"g366","level":"N1","pattern":"～に限り","meaning":"“Aに限り，B”意思是“把范围仅仅现定于……”，表示B部分的状态只有在A的条件下才能成立。","cat":"limit","examples":[{"jp":"今週に限り、全商品20％引きです。","r":"こんしゅうにかぎり、ぜんしょうひんにじゅっパーセントびきです。","zh":"仅限本周，全部商品打八折。"},{"jp":"初回に限り、入会金は無料です。","r":"しょかいにかぎり、にゅうかいきんはむりょうです。","zh":"仅限首次，免收入会费。"}]},{"id":"g367","level":"N1","pattern":"～あたり","meaning":"接在表示单位的名词后，表示在该单位的范围内，相当于“每……”。","cat":"count","examples":[{"jp":"来週あたりでき上がると思います。","r":"らいしゅうあたりできあがるとおもいます。","zh":"我想大致下周就能完成。"},{"jp":"その質問の答えは、部長あたりが知っているだろう。","r":"そのしつもんのこたえは、ぶちょうあたりがしっているだろう。","zh":"那个问题的答案，部长之类的人大概知道吧。"}]},{"id":"g368","level":"N1","pattern":"～のに対して、～","meaning":"针对某个事项，对比两种不同情况时使用。","cat":"reverse","note":"接续形式为“小句（简体形式）＋の＋に対し”“名词/二类形容词＋である＋の＋に対して”或“名词/二类形容词＋な＋の＋に対して”的形式。“与此相对”的意思。","examples":[{"jp":"兄が活発なのに対して、弟はおとなしい。","r":"あにがかっぱつなのに対して、おとうとはおとなしい。","zh":"哥哥活泼，与之相对弟弟很文静。"},{"jp":"昨年と比べて、今年は売上が伸びたのに対して、利益は減った。","r":"さくねんとくらべて、ことしはうりあげがのびたのに対して、りえきはへった。","zh":"与去年相比，今年销售额增长，而利润却减少了。"}]},{"id":"g369","level":"N1","pattern":"～を余儀なくされる","meaning":"表示自己并不想这么做，但因各种原因不得不这么做。","cat":"oblig","formation":"名词 + を余儀なくされる（被迫）／を余儀なくさせる（迫使）","note":"“不得不……”的意思。","examples":[{"jp":"台風により、出発の延期を余儀なくされた。","r":"たいふうにより、しゅっぱつのえんきをよぎなくされた。","zh":"因台风，被迫延期出发。"},{"jp":"社長は担当者に責任を取らせ、辞任を余儀なくさせた。","r":"しゃちょうはたんとうしゃにせきにんをとらせ、じにんをよぎなくさせた。","zh":"社长让负责人承担责任，迫使其辞职。"},{"jp":"震災で家を失った人々は避難所暮らしを余儀なくされた。","r":"しんさいでいえをうしなったひとびとはひなんじょぐらしをよぎなくされた。","zh":"因震灾失去家园的人们被迫在避难所生活。"},{"jp":"大雨のため、試合の中止を余儀なくされた。","r":"おおあめのため、しあいのちゅうしをよぎなくされた。","zh":"由于大雨，比赛被迫中止。"}]},{"id":"g370","level":"N1","pattern":"～（よ）う","meaning":"动词的意志形可以表示说话人的推测，主要用于书面语。","cat":"guess","examples":[{"jp":"彼も行こうと思っているだろう。","r":"かれもいこうとおもっているだろう。","zh":"他也打算去吧。"},{"jp":"明日は晴れよう。","r":"あしたははれよう。","zh":"明天大概会晴吧。"}]},{"id":"g371","level":"N1","pattern":"～を機に","meaning":"表示“以……为契机”。","cat":"time","note":"接续为“名词＋を機に”“动词（简体形式）＋の＋を機に”。","examples":[{"jp":"引っ越しを機に、生活習慣を改めた。","r":"ひっこしをきに、せいかつしゅうかんをあらためた。","zh":"以搬家为契机，改变了生活习惯。"},{"jp":"この出会いを機に、彼の人生は変わった。","r":"このであいをきに、かれのじんせいはかわった。","zh":"以这次相遇为契机，他的人生改变了。"},{"jp":"長く使っていた古い冷蔵庫を、引っ越しを機に買い替えた。","r":"ながくつかっていたふるいれいぞうこを、ひっこしをきにかいかえた。","zh":"借着搬家之机，换掉了用了很久的旧冰箱。","src":"2023年12月真题"}],"srcs":["2023年12月真题"]},{"id":"g372","level":"N1","pattern":"～を強いる","meaning":"表示“强迫别人做某事”。","cat":"view","examples":[{"jp":"不況が、多くの企業にリストラを強いられた。","r":"ふきょうが、おおくのきぎょうにリストラをしいられた。","zh":"萧条迫使许多企业裁员。"},{"jp":"過密なスケジュールが、社員に長時間労働を強いていた。","r":"かみつなスケジュールが、しゃいんにちょうじかんろうどうをしいていた。","zh":"排得过满的日程迫使员工长时间劳动。"}]},{"id":"g373","level":"N1","pattern":"～と～では","meaning":"用于两项事物进行比较，并能发现较大差异。","cat":"compare","examples":[{"jp":"東京と地方とでは、物価がかなり違う。","r":"とうきょうとちほうとでは、ぶっかがかなりちがう。","zh":"东京和地方相比，物价差别很大。"},{"jp":"都会と田舎とでは、生活のリズムが大きく異なる。","r":"とかいといなかとでは、せいかつのリズムがおおきくことなる。","zh":"城市和乡村相比，生活节奏差别很大。"}]},{"id":"g374","level":"N1","pattern":"お手数をおかけしました","meaning":"“お手数”表示做某事需要的动作、工作和数量，用于请求对方协助或对对方的帮助表示感谢。","cat":"honor","note":"“给您添麻烦了”的意思。","examples":[{"jp":"お手数をおかけしましたが、本当にありがとうございます。","r":"おてすうをおかけしましたが、ほんとうにありがとうございます。","zh":"给您添麻烦了，非常感谢。"},{"jp":"お手数をおかけして申し訳ありませんが、もう一度お願いします。","r":"おてすうをおかけしてもうしわけありませんが、もういちどおねがいします。","zh":"抱歉给您添麻烦了，麻烦再来一次。"}]},{"id":"g375","level":"N1","pattern":"～てからというもの","meaning":"表示某个行为、发生某种变化后一直持续的某种状态。","cat":"time","note":"“从那以后”的意思。","examples":[{"jp":"祖母が死んでからというもの、祖父はお酒ばかり飲んでいる。","r":"そぼがしんでからというもの、そふはおさけばかりのんでいる。","zh":"自从祖母去世以后，祖父就整天喝酒。"},{"jp":"スマホを買ってからというもの、本を読まなくなった。","r":"スマホをかってからというもの、ほんをよまなくなった。","zh":"自从买了智能手机，就不怎么读书了。"},{"jp":"学生時代はずっとサッカーをしていたのだが、社会人になってからというもの、運動する機会がすっかり減ってしまった。","r":"がくせいじだいはずっとサッカーをしていたのだが、しゃかいじんになってからというもの、うんどうするきかいがすっかりへってしまった。","zh":"学生时代一直在踢足球，可自从成了社会人，运动的机会就大为减少了。","src":"2022年12月真题"}],"srcs":["2022年12月真题"]},{"id":"g376","level":"N1","pattern":"さながら","meaning":"与“まるで”一样，表示比喻，意思是“正如……”。","cat":"compare","note":"接续为“さながら＋名词＋のようだ/のように”“名词＋さながらに＋动词”。","examples":[{"jp":"夜空の星は、さながら宝石のようだ。","r":"よぞらのほしは、さながらほうせきのようだ。","zh":"夜空中的星星宛如宝石。"},{"jp":"満開の桜は、さながら雪のようだ。","r":"まんかいのさくらは、さながらゆきのようだ。","zh":"盛开的樱花宛如飘雪。"}]},{"id":"g377","level":"N1","pattern":"～といったところだ","meaning":"意思是“可以表达为……”，多于“まるで”“さながら”等搭配使用，用于某种比喻或改换一种更通俗的说法。","cat":"quote","examples":[{"jp":"私の成績ではその大学には、合格ラインぎりぎりといったところだ。","r":"わたしのせいせきではそのだいがくには、ごうかくラインぎりぎりといったところだ。","zh":"以我的成绩进那所大学，大概也就刚好够合格线。"},{"jp":"毎日の勉強時間は、二時間といったところだ。","r":"まいにちのべんきょうじかんは、にじかんといったところだ。","zh":"每天的学习时间，最多也就是两个小时左右。"}]},{"id":"g378","level":"N1","pattern":"どうやら","meaning":"表示“不太确定但总觉得……”。","cat":"guess","note":"多用于“どうやら～らしい/ようだ”的形式。","examples":[{"jp":"どうやら、明日は雨が降りそうだ。","r":"どうやら、あしたはあめがふりそうだ。","zh":"看来明天要下雨。"},{"jp":"彼はどうやら、その計画を知っているらしい。","r":"かれはどうやら、そのけいかくをしっているらしい。","zh":"他似乎知道那个计划。"}]},{"id":"g379","level":"N1","pattern":"～がたい","meaning":"“动词ます形去掉ます＋がたい”意思是“难以进行某种动作。","cat":"potential","note":"”","examples":[{"jp":"彼の言葉は、信じがたいものだった。","r":"かれのことばは、しんじがたいものだった。","zh":"他的话令人难以置信。"},{"jp":"この状況は、とても耐えがたい。","r":"このじょうきょうは、とてもたえがたい。","zh":"这种状况让人难以忍受。"}]},{"id":"g380","level":"N1","pattern":"～てこそ","meaning":"“动词/动词可能形式的て形＋こそ”后接正面评价内容，表示“因做了某事才有意义，才产生好的结果。","cat":"cond","note":"”","examples":[{"jp":"努力してこそ、成功が得られる。","r":"どりょくしてこそ、せいこうがえられる。","zh":"正因为努力，才能获得成功。"},{"jp":"実際に経験してこそ、本当の理解ができる。","r":"じっさいにけいけんしてこそ、ほんとうのりかいができる。","zh":"亲身经历才能真正理解。"},{"jp":"この漫画が大好きで、つらいときに読み返してこそ元気をもらっている。","r":"このまんががだいすきで、つらいときに よみかえしてこそげんきをもらっている。","zh":"我非常喜欢这部漫画，正因为是在难过时重读，才从中获得力量。","src":"2023年12月真题"}],"srcs":["2023年12月真题"]},{"id":"g381","level":"N1","pattern":"～と思いきや","meaning":"接续为“名词＋と思いきや”“小句（简体形式）＋と思いきや”，表示“以为……，但实际上不是”的意思。","cat":"reverse","note":"强调结果出乎意料。","examples":[{"jp":"田中先生が作るテストだから難しいと思いきや、案外易しかった。","r":"たなかせんせいがつくるテストだからむずかしいとおもいきや、あんがいやさしかった。","zh":"原以为田中老师出的考卷很难，没想到却意外地容易。"},{"jp":"雨がやむかと思いきや、ますます激しくなった。","r":"あめがやむかとおもいきや、ますますはげしくなった。","zh":"原以为雨会停，没想到反而下得更大了。"}]},{"id":"g382","level":"N1","pattern":"～とも、～","meaning":"用于书面语，表示逆接的假定条件。","cat":"cond","note":"接续为“动词意志形＋とも”、一类形容词将词尾的“い”变为“く”＋とも，动词ない形也用“～なくとも”的形式。“即使、即便”的意思。","examples":[{"jp":"たとえ雨が降ろうとも、試合は行われる。","r":"たとえあめがふろうとも、しあいはおこなわれる。","zh":"即使下雨，比赛也会举行。"},{"jp":"いくら急ごうとも、間に合わない。","r":"いくらいそごうとも、まにあわない。","zh":"再怎么赶，也来不及。"}]},{"id":"g383","level":"N1","pattern":"～を怠る","meaning":"“名词＋怠る”的意思是“不做自己必须做的事情”。","cat":"oblig","examples":[{"jp":"安全確認を怠ると、事故につながる。","r":"あんぜんかくにんをおこたると、じこにつながる。","zh":"疏忽安全检查，会导致事故。"},{"jp":"彼は毎日の連絡を怠っている。","r":"かれはまいにちのれんらくをおこたっている。","zh":"他疏于每日联系。"}]},{"id":"g384","level":"N1","pattern":"一口に～といっても、～","meaning":"表示提到的词语所表达的含义深而广。","cat":"quote","note":"“虽说都是……，但……”的意思。","examples":[{"jp":"一口に旅行といっても、そのスタイルは様々だ。","r":"ひとくちにりょこうといっても、そのスタイルはさまざまだ。","zh":"虽说都叫旅行，但方式各不相同。"},{"jp":"一口に日本語が上手といっても、レベルは人それぞれだ。","r":"ひとくちににほんごがじょうずといっても、レベルはひとそれぞれだ。","zh":"虽说都叫日语好，但水平因人而异。"}]},{"id":"g385","level":"N1","pattern":"～に対応する","meaning":"表示“根据状况的变化及对象采取相应的行动。","cat":"view","note":"”状况的变化及对象用“に”表示。“应对……”的意思。","examples":[{"jp":"変化する市場に対応する必要がある。","r":"へんかするしじょうにたいおうするひつようがある。","zh":"需要应对不断变化的市场。"},{"jp":"顧客の要望に対応して、サービスを改善した。","r":"こきゃくのようぼうにたいおうして、サービスをかいぜんした。","zh":"根据顾客的要求，改善了服务。"}]},{"id":"g386","level":"N1","pattern":"～べき～","meaning":"“动词基本型＋べき＋名词”表示“适当”“有那样做的价值”。","cat":"oblig","examples":[{"jp":"これは、読むべき価値のある本だ。","r":"これは、よむべきかちのあるほんだ。","zh":"这是一本值得一读的书。"},{"jp":"彼は尊敬すべき人物だ。","r":"かれはそんけいすべきじんぶつだ。","zh":"他是值得尊敬的人物。"}]},{"id":"g387","level":"N1","pattern":"～は～に（は）欠かせない","meaning":"“欠かせない”以可能形式的否定形式表示“必要”的意思。","cat":"oblig","note":"这个语法表示不可欠缺的意思。","examples":[{"jp":"水は、生活に欠かせないものだ。","r":"みずは、せいかつにかかせないものだ。","zh":"水是生活中不可或缺的东西。"},{"jp":"経験は、この仕事に欠かせない。","r":"けいけんは、このしごとにかかせない。","zh":"经验对于这份工作必不可少。"}]},{"id":"g388","level":"N1","pattern":"～に優しい","meaning":"表示温和对待，从而引申出比喻不会产生不良影响的用法。","cat":"view","note":"“对……有益”的意思。","examples":[{"jp":"この製品は、環境に優しい。","r":"このせいひんは、かんきょうにやさしい。","zh":"这个产品对环境友好。"},{"jp":"彼は目上の人にも優しい態度で接する。","r":"かれはめうえのひとにもやさしいたいどでせっする。","zh":"他对长辈也态度和善。"}]},{"id":"g389","level":"N1","pattern":"～にしても","meaning":"前接名词，表示“从某一角度考虑问题也……”的意思。","cat":"cond","examples":[{"jp":"忙しいにしても、連絡くらいはしてほしい。","r":"いそがしいにしても、れんらくくらいはしてほしい。","zh":"就算再忙，也希望至少联系一下。"},{"jp":"値段が高いにしても、品質が良ければ買う。","r":"ねだんがたかいにしても、ひんしつがよければかう。","zh":"即使贵，只要质量好就买。"}]},{"id":"g390","level":"N1","pattern":"遅かれ早かれ","meaning":"相当于汉语的“迟早”的意思。","cat":"time","examples":[{"jp":"遅かれ早かれ、この問題は解決しなければならない。","r":"おそかれはやかれ、このもんだいはかいけつしなければならない。","zh":"这个问题迟早必须解决。"},{"jp":"彼の失敗は、遅かれ早かれ明らかになるだろう。","r":"かれのしっぱいは、おそかれはやかれあきらかになるだろう。","zh":"他的失败迟早会真相大白。"}]},{"id":"g391","level":"N1","pattern":"一向～ない","meaning":"与否定形式一起使用，表示“完全（不）……”。","cat":"negative","examples":[{"jp":"何度注意しても、彼は一向に直らない。","r":"なんどちゅういしても、かれはいっこうになおらない。","zh":"提醒了多少次，他也毫无改进。"},{"jp":"新しい薬を飲んでも、症状は一向に良くならない。","r":"あたらしいくすりをのんでも、しょうじょうはいっこうによくならない。","zh":"吃了新药，症状也毫无好转。"}]},{"id":"g392","level":"N1","pattern":"～ならまだしも","meaning":"“名词/动词基本型＋ならまだしも”，表示“前面的事还能应付，后面的事项就难对付了。","cat":"cond","note":"”","examples":[{"jp":"単なる冗談ならまだしも、彼の話はたまに人を傷つける。","r":"たんなるじょうだんならまだしも、かれのはなしはたまにひとをきずつける。","zh":"如果只是玩笑倒也罢了，他的话有时会伤人。"},{"jp":"遅刻一回ならまだしも、三回も続くのは問題だ。","r":"ちこくいっかいならまだしも、さんかいもつづくのはもんだいだ。","zh":"迟到一次还好，连续迟到三次就是问题了。"}]},{"id":"g393","level":"N1","pattern":"この分だと、～","meaning":"表示“这样下去的话，……”。","cat":"guess","examples":[{"jp":"この分だと、今年は豊作になりそうだ。","r":"このぶんだと、ことしはほうさくになりそうだ。","zh":"照这样下去，今年看来会丰收。"},{"jp":"この分だと、締め切りに間に合いそうだ。","r":"このぶんだと、しめきりにまにあいそうだ。","zh":"照这样看，应该能赶上截止日期。"}]},{"id":"g394","level":"N2","pattern":"～っぱなしにする","meaning":"“动词ます形去ます＋っぱなしにする”，表示动作结束后维持在该状态。","cat":"state","formation":"动词ます形 + っぱなし","note":"“一直……”的意思。","examples":[{"jp":"テレビをつけっぱなしにしないで。","r":"テレビをつけっぱなしにしないで。","zh":"别让电视一直开着。"},{"jp":"水を出しっぱなしにするのはもったいない。","r":"みずをだしっぱなしにするのはもったいない。","zh":"一直开着水龙头太浪费。"}]},{"id":"g395","level":"N1","pattern":"～まま","meaning":"接续为“一类形容词＋まま”“二类形容词＋な＋まま”“动词た形/ない形＋まま”“名词＋の＋まま”，表示该状态保持不变。","cat":"state","note":"“依旧，仍旧”的意思。“～に連なる”和“～につながる”“連なる”有三个含义。①排成一列没有间断。②为某集体的一员③出席某会议。“つながる”也有三个意思。①几个互相分开的事物聚集到一起，成了一个事物。②两个以上的事物由于某种关系而联系到了一起。③几个事物连成一串的状态。","examples":[{"jp":"窓を開けたまま、寝てしまった。","r":"まどをあけたまま、ねてしまった。","zh":"开着窗就睡着了。"},{"jp":"靴を履いたまま、部屋に入ってはいけない。","r":"くつをはいたまま、へやにはいってはいけない。","zh":"不能穿着鞋进房间。"},{"jp":"高校に入学して、特に入りたいクラブもなかったので、友人に誘われるまま、テニス部に入った。","r":"こうこうににゅうがくして、とくにはいりたいクラブもなかったので、ゆうじんにさそわれるまま、テニスぶにはいった。","zh":"上高中后没什么特别想加入的社团，就顺着朋友的邀请进了网球部。","src":"2022年12月真题"}],"srcs":["2022年12月真题"]},{"id":"g396","level":"N1","pattern":"あながち～ない","meaning":"“あながち”与句尾否定形式相呼应，表示“某主张或判断不能完全肯定”。","cat":"negative","examples":[{"jp":"彼の言うことも、あながち間違いではない。","r":"かれのいうことも、あながちまちがいではない。","zh":"他说的话也不完全错。"},{"jp":"この説は、あながち否定できない。","r":"このせつは、あながちひていできない。","zh":"这种说法也不能完全否定。"}]},{"id":"g397","level":"N1","pattern":"“～を～として”“～を～に”","meaning":"“名1を名2とする”与“名1を名2にする”都表示“把名1按照名2的性质来对待”。","cat":"view","note":"可译为“把……当做……”。","examples":[{"jp":"この写真を思い出として、大切にしている。","r":"このしゃしんをおもいでとして、たいせつにしている。","zh":"把这张照片当作回忆珍藏着。"},{"jp":"彼は私を先生として、尊敬している。","r":"かれはわたしをせんせいとして、そんけいしている。","zh":"他把我当作老师来尊敬。"}]},{"id":"g398","level":"N1","pattern":"～させられる（使役被动形式）","meaning":"使役形式表达的内容进一步加上被动叫做“使役被动形式”。","cat":"passive","note":"表示自己本不希望做某事，但被迫做了某事。","examples":[{"jp":"子供の頃、ピアノを練習させられた。","r":"こどものころ、ピアノをれんしゅうさせられた。","zh":"小时候被迫练钢琴。"},{"jp":"会議のたびに、長時間話を聞かせられる。","r":"かいぎのたびに、ちょうじかんはなしをきかせられる。","zh":"每次开会都被迫听长篇大论。"}]},{"id":"g399","level":"N1","pattern":"～を受けて、～","meaning":"用于听取了针对自己的意见后，在此基础上经过研究采取行动。","cat":"reason","note":"可译为“根据，接受”。","examples":[{"jp":"住民の意見を受けて、計画を修正した。","r":"じゅうみんのいけんをうけて、けいかくをしゅうせいした。","zh":"根据居民的意见，修改了计划。"},{"jp":"上司の指示を受けて、作業を進めた。","r":"じょうしのしじをうけて、さぎょうをすすめた。","zh":"按照上司的指示推进工作。"}]},{"id":"g400","level":"N1","pattern":"～か否かで～","meaning":"书面语，表示“以是否……为理由”。","cat":"cond","examples":[{"jp":"経験があるか否かで、採用が決まる。","r":"けいけんがあるかいなかで、さいようがきまる。","zh":"是否录用，取决于有无经验。"},{"jp":"賛成か否かで、今後の方針が変わる。","r":"さんせいかいなかで、こんごのほうしんがかわる。","zh":"赞成与否，将决定今后的方针。"}]},{"id":"g401","level":"N1","pattern":"～まみれ","meaning":"接在名词后面，表示整体都沾满的意思。","cat":"limit","note":"带有因此被弄脏，或呈现不好状态的意思。可译为“满是，沾满”。","examples":[{"jp":"先日父は家の蔵から、ほこりまみれの家系図を見つけ出した。","r":"せんじつちちはうちのくらから、ほこりまみれのかけいずをみつけだした。","zh":"前几天，父亲从家里的仓库找出了一份满是灰尘的家谱。"},{"jp":"子供たちは泥まみれになって遊んでいる。","r":"こどもたちはどろまみれになってあそんでいる。","zh":"孩子们玩得满身是泥。"}]},{"id":"g402","level":"N1","pattern":"だが","meaning":"连词。表示转折，主要用于书面语。","cat":"conj","note":"“可是”的意思。","examples":[{"jp":"確かに便利だ。だが、値段が高すぎる。","r":"たしかにべんりだ。だが、ねだんがたかすぎる。","zh":"确实方便。可是，价格太贵了。"},{"jp":"彼の意見はもっともだ。だが、実行は難しい。","r":"かれのいけんはもっともだ。だが、じっこうはむずかしい。","zh":"他的意见很有道理。但实行起来很难。"}]},{"id":"g403","level":"N1","pattern":"～に満たない","meaning":"“名词”表示达不到高名词所示基准或数值。","cat":"count","note":"“不满”的意思。","examples":[{"jp":"この地域の人口は、1万人に満たない。","r":"このちいきのじんこうは、いちまんにんにみたない。","zh":"这个地区的人口不足一万人。"},{"jp":"平均点は、合格ラインに満たなかった。","r":"へいきんてんは、ごうかくラインにみたなかった。","zh":"平均分没有达到合格线。"}]},{"id":"g404","level":"N1","pattern":"～ほど～ない","meaning":"表示“没有比……更……了”","cat":"compare","examples":[{"jp":"健康ほど、大切なものはない。","r":"けんこうほど、たいせつなものはない。","zh":"没有比健康更重要的了。"},{"jp":"家族ほど、心強い存在はいない。","r":"かぞくほど、こころづよいそんざいはいない。","zh":"没有比家人更让人安心的存在了。"}]},{"id":"g405","level":"N1","pattern":"難儀する","meaning":"多以“名词＋に/で難儀する”“动词て形＋難儀する”的形式出现，表示颇费周折的意思。","cat":"state","examples":[{"jp":"古い機械の扱いに、難儀した。","r":"ふるいきかいのあつかいに、なんぎした。","zh":"摆弄旧机器费了不少周折。"},{"jp":"道に迷って、帰り道に難儀した。","r":"みちにまよって、かえりみちになんぎした。","zh":"迷了路，回去的路上吃了不少苦头。"}]},{"id":"g406","level":"N1","pattern":"～たとしても、～","meaning":"“动词た形＋としても～”相当于汉语的“即使……也……”。","cat":"cond","examples":[{"jp":"たとえ失敗したとしても、後悔はしない。","r":"たとえしっぱいしたとしても、こうかいはしない。","zh":"即使失败了，也不后悔。"},{"jp":"たとえ反対されたとしても、意見を貫く。","r":"たとえはんたいされたとしても、いけんをつらぬく。","zh":"即使遭到反对，也要坚持自己的意见。"}]},{"id":"g407","level":"N1","pattern":"～（よ）うとしない","meaning":"“动词意志形”相当于汉语的“不想……”“不肯……”。","cat":"negative","examples":[{"jp":"彼は、なかなか謝ろうとしない。","r":"かれは、なかなかあやまろうとしない。","zh":"他迟迟不肯道歉。"},{"jp":"疲れているのに、彼は休もうとしない。","r":"つかれているのに、かれはやすもうとしない。","zh":"明明累了，他却不肯休息。"}]},{"id":"g408","level":"N1","pattern":"息をつく","meaning":"①大口喘气②喘口气（放松）","cat":"state","examples":[{"jp":"ゴールに着いて、やっと息をついた。","r":"ゴールについて、やっといきをついた。","zh":"到达终点，终于喘了口气。"},{"jp":"忙しい日々の中でも、時々息をつく時間を持ちたい。","r":"いそがしいひびのなかでも、ときどきいきをつくじかんをもちたい。","zh":"即使在忙碌的日子里，也想不时有喘口气的时间。"}]},{"id":"g409","level":"N1","pattern":"～と題する","meaning":"意思是“以……为标题的……”。","cat":"quote","examples":[{"jp":"この本は、「未来への道」と題する小説だ。","r":"このほんは、「みらいへのみち」とだいするしょうせつだ。","zh":"这本书是一部题为《通往未来之路》的小说。"},{"jp":"彼は「環境と私たち」と題する講演を行った。","r":"かれは「かんきょうとわたしたち」とだいするこうえんをおこなった。","zh":"他作了题为《环境与我们》的演讲。"}]},{"id":"g410","level":"N1","pattern":"～を務める","meaning":"表示“担当某项职务”的意思，多用“～を務める”的形式。","cat":"view","examples":[{"jp":"彼は会長を務めている。","r":"かれはかいちょうをつとめている。","zh":"他担任会长。"},{"jp":"彼女は、この番組の司会を務めている。","r":"かのじょは、このばんぐみのしかいをつとめている。","zh":"她担任这个节目的主持人。"}]},{"id":"g411","level":"N1","pattern":"～や（否や）","meaning":"表示“一……立刻”的意思。","cat":"time","note":"多用“动词基本型＋や（否や）”的形式。","examples":[{"jp":"彼は家に着くや否や、荷物を置いて出かけた。","r":"かれはいえにつくやいなや、にもつをおいてでかけた。","zh":"他一到家，放下行李就出门了。"},{"jp":"ベルが鳴るや否や、教室を飛び出した。","r":"ベルがなるやいなや、きょうしつをとびだした。","zh":"铃声一响，就冲出了教室。"}]},{"id":"g412","level":"N1","pattern":"なんの～も～","meaning":"“なんの”可写成“何の”用“なんの～も～ない”的形式强调否定。","cat":"negative","examples":[{"jp":"彼はなんの罪もないのに、疑われている。","r":"かれはなんのつみもないのに、うたがわれている。","zh":"他明明无罪，却受到怀疑。"},{"jp":"この件には、なんの関係もない。","r":"このけんには、なんのかんけいもない。","zh":"这件事与我毫无关系。"}]},{"id":"g413","level":"N1","pattern":"～ほかない/～ほかはない","meaning":"表示“除了……没有别的办法”，前面多接动词的基本型。","cat":"oblig","examples":[{"jp":"こうなっては、謝るほかない。","r":"こうなっては、あやまるほかない。","zh":"事已至此，只能道歉。"},{"jp":"頼る人がいなければ、自分でやるほかはない。","r":"たよるひとがいなければ、じぶんでやるほかはない。","zh":"没有可依靠的人，就只能自己做。"}]},{"id":"g414","level":"N1","pattern":"わりに","meaning":"副词，表示程度稍微超过预想。","cat":"compare","note":"“比较的”的意思。","examples":[{"jp":"この映画は、わりに面白かった。","r":"このえいがは、わりにおもしろかった。","zh":"这部电影还算有趣。"},{"jp":"値段のわりに、品質は良い。","r":"ねだんのわりに、ひんしつはよい。","zh":"按价格来说，质量算不错。"}]},{"id":"g415","level":"N1","pattern":"こうして","meaning":"用于承前启后，叙述后项。","cat":"conj","note":"多用在讲故事或回忆时用作归纳。“就这样”的意思。","examples":[{"jp":"こうして、彼の長い一日が終わった。","r":"こうして、かれのながいいちにちがおわった。","zh":"就这样，他漫长的一天结束了。"},{"jp":"こうして、二人は再会を果たした。","r":"こうして、ふたりはさいかいをはたした。","zh":"就这样，两人得以重逢。"}]},{"id":"g416","level":"N2","pattern":"～ことか","meaning":"表示感动或感叹。","cat":"emote","formation":"动词／い形／な形普通形 + ことか","note":"以“小句（简体形式）＋ことか”的形式，多于“どんなに”搭配使用。","examples":[{"jp":"あの時どんなに嬉しかったことか。","r":"あのときどんなにうれしかったことか。","zh":"那时多么高兴啊。"},{"jp":"彼がどれほど苦労したことか、想像もできない。","r":"かれがどれほどくろうしたことか、そうぞうもできない。","zh":"他吃了多少苦，难以想象。"}]},{"id":"g417","level":"N1","pattern":"～のゆえに","meaning":"多用于书面语，用“名词/二类形容词＋（の）ゆえに”的形式，表示“由于……”“因为……”。","cat":"reason","note":"也用“动词/一类形容词（简体形式）＋（が）ゆえに”。","examples":[{"jp":"年齢のゆえに、参加を断られた。","r":"ねんれいのゆえに、さんかをことわられた。","zh":"因为年龄原因，被拒绝了参加。"},{"jp":"彼は貧しいがゆえに、大学に行けなかった。","r":"かれはまずしいがゆえに、だいがくにいけなかった。","zh":"他因贫穷而上不了大学。"}]},{"id":"g418","level":"N1","pattern":"～に過ぎる","meaning":"表示“过于……”的意思。","cat":"compare","examples":[{"jp":"彼は自信過剰に過ぎる。","r":"かれはじしんかじょうにすぎる。","zh":"他过于自信。"},{"jp":"この商品は、安価に過ぎて信頼できない。","r":"このしょうひんは、あんかにすぎてしんらいできない。","zh":"这个商品过于便宜，让人无法信赖。"}]},{"id":"g419","level":"N1","pattern":"またの～","meaning":"“また”是副词，用“またの＋名词”的形式，表示别的、下次、其他的意思。","cat":"time","examples":[{"jp":"またの機会に、ゆっくりお話ししましょう。","r":"またのきかいに、ゆっくりおはなししましょう。","zh":"下次有机会再慢慢聊吧。"},{"jp":"またのお越しを、心よりお待ちしております。","r":"またのおこしを、こころよりおまちしております。","zh":"衷心期待您下次光临。"}]},{"id":"g420","level":"N1","pattern":"逆に～","meaning":"“逆に”用作副词，表示与预想或期待的相反，可译为“反而”。","cat":"reverse","examples":[{"jp":"薬を飲んだら、逆に具合が悪くなった。","r":"くすりをのんだら、ぎゃくにぐあいがわるくなった。","zh":"吃了药，反而更不舒服了。"},{"jp":"注意したつもりが、逆に彼を怒らせてしまった。","r":"ちゅういしたつもりが、ぎゃくにかれをおこらせてしまった。","zh":"本是好意提醒，反而惹恼了他。"}]},{"id":"g421","level":"N1","pattern":"～とは思ってもみなかった/～なんて考えてもみなかった","meaning":"表示对已经形成的实际情况以前完全没有想到的意思。","cat":"emote","note":"用于“动词/一类形容词（简体形式）＋とは思ってもみなかった/～なんて考えてもみなかった“名词/二类形容词＋だ＋とは思ってもみなかった/なんて考えてもみなかった”的形式。可译为“没想到”。","examples":[{"jp":"彼がここまで有名になるとは、思ってもみなかった。","r":"かれがここまでゆうめいになるとは、おもってもみなかった。","zh":"没想到他会出名到这种地步。"},{"jp":"こんなに早く決着がつくなんて、考えてもみなかった。","r":"こんなにはやくけっちゃくがつくなんて、かんがえてもみなかった。","zh":"没想到这么快就有了结果。"}]},{"id":"g422","level":"N1","pattern":"～ばこそ","meaning":"使用“动词ば形＋こそ”的形式，强调理由。","cat":"reason","note":"句尾多伴随“～のだ”，“正因为”的意思。","examples":[{"jp":"お金があればこそ、留学できるのです。","r":"おかねがあればこそ、りゅうがくできるのです。","zh":"正因为有钱，才能留学。"},{"jp":"健康であればこそ、仕事に打ち込めるのだ。","r":"けんこうであればこそ、しごとにうちこめるのだ。","zh":"正因为健康，才能全身心投入工作。"}]},{"id":"g423","level":"N1","pattern":"あっての","meaning":"因为有…才有…／没有…就没有…","cat":"reason","formation":"名词 + あっての + 名词","examples":[{"jp":"今の安定した生活も若い時の苦労あってのものです。","r":"いまのあんていしたせいかつもわかいときのくろうあってのものです。","zh":"如今安定的生活，也是因为有年轻时的辛苦打拼。"},{"jp":"この成功は、長年の努力あってのものだ。","r":"このせいこうは、ながねんのどりょくあってのものだ。","zh":"这次成功是靠多年的努力才取得的。"},{"jp":"会社の成長は、社員一人ひとりの力あってのものだ。","r":"かいしゃのせいちょうは、しゃいんひとりひとりのちからあってのものだ。","zh":"公司的成长，是靠每一位员工的力量才有的。","src":"2023年12月真题"}],"note":"表示前面的存在是后面成立的前提，多用于书面语。","srcs":["2023年12月真题"]},{"id":"g424","level":"N1","pattern":"いかんで／いかんでは／いかんによって","meaning":"根据…／取决于…／要看…","cat":"cond","formation":"名词 + いかん（で／では／によって）","examples":[{"jp":"成績が伸びるかどうかは、本人の今後の努力いかんだ。","r":"せいせきがのびるかどうかは、ほんにんのこんごのどりょくいかんだ。","zh":"成绩能否提高，要看本人今后的努力。"},{"jp":"合格できるかどうかは、試験当日の出来いかんにかかっている。","r":"ごうかくできるかどうかは、しけんとうじつのできいかんにかかっている。","zh":"能否合格，取决于考试当天的发挥。"}],"note":"いかんで后面可能有两种结果，いかんでは后面一般只是一种结果。"},{"id":"g425","level":"N1","pattern":"いかんによらず／いかんにかかわらず","meaning":"不管…／不论…","cat":"reverse","formation":"名词 + のいかんによらず／にかかわらず","examples":[{"jp":"結果のいかんにかかわらず、必ず報告してください。","r":"けっかのいかんにかかわらず、かならずほうこくしてください。","zh":"不管结果如何，请务必报告。"},{"jp":"理由のいかんによらず、遅刻は認められない。","r":"りゆうのいかんによらず、ちこくはみとめられない。","zh":"无论什么理由，迟到都不被允许。"}],"note":"いかんせん＝无奈；いかんともしがたい＝怎么也不好办。"},{"id":"g426","level":"N1","pattern":"动词意志形＋が／と","meaning":"无论…都…／不管…","cat":"reverse","formation":"动词意志形 + が／と","examples":[{"jp":"彼が困ろうが、私には関係がない。","r":"かれがこまろうが、わたしにはかんけいがない。","zh":"他无论多为难，都与我无关。"},{"jp":"雨が降ろうが風が吹こうが、試合は行われる。","r":"あめがふろうがかぜがふこうが、しあいはおこなわれる。","zh":"无论刮风下雨，比赛都会照常举行。"}],"note":"后面的情况与前面的条件无关。"},{"id":"g427","level":"N1","pattern":"动词意志形＋が／と＋同一动词＋まいが／まいと","meaning":"是…还是…／不管…是否…","cat":"reverse","formation":"动词意志形 + が／と + 同一动词 + まいが／まいと","examples":[{"jp":"親が反対しようとしまいと、私は彼と結婚します。","r":"おやがはんたいしようとしまいと、わたしはかれとけっこんします。","zh":"不管父母反对与否，我都要和他结婚。"},{"jp":"周りが認めようが認めまいが、私は自分の信念を貫く。","r":"まわりがみとめようがみとめまいが、わたしはじぶんのしんねんをつらぬく。","zh":"不管周围的人承认与否，我都要坚持自己的信念。"}]},{"id":"g428","level":"N1","pattern":"动词意志形＋にも＋同一动词ない形","meaning":"即使想…也不能…","cat":"negative","formation":"动词意志形 + にも + 同一动词ない形","examples":[{"jp":"仕事が終わらないから、帰ろうにも帰れない。","r":"しごとがおわらないから、かえろうにもかえれない。","zh":"因为工作还没做完，想回也回不去。"},{"jp":"お金がなくて、買おうにも買えない。","r":"おかねがなくて、かおうにもかえない。","zh":"因为没有钱，想买也买不起。"}]},{"id":"g429","level":"N1","pattern":"限りだ","meaning":"…极了／无比…","cat":"emote","formation":"形容动词词干／い形容词 + 限りだ","examples":[{"jp":"こんなに盛大な結婚式を挙げることができて、羨ましい限りです。","r":"こんなにせいだいなけっこんしきをあげることができて、うらやましいかぎりです。","zh":"能举办如此盛大的婚礼，真是羡慕极了。"},{"jp":"久しぶりに家族に会えて、嬉しい限りだ。","r":"ひさしぶりにかぞくにあえて、うれしいかぎりだ。","zh":"久违地与家人重逢，真是高兴极了。"}]},{"id":"g430","level":"N1","pattern":"（た）が最後","meaning":"一旦…就…／…之后…就…","cat":"time","formation":"动词た形 + が最後","examples":[{"jp":"彼はスピーチを始めたが最後、長々と話が続いて終わらない。","r":"かれはスピーチをはじめたがさいご、ながながとはなしがつづいておわらない。","zh":"他一旦开始演讲，就会滔滔不绝地说个不停。"},{"jp":"このゲームを始めたが最後、やめられなくなる。","r":"このゲームをはじめたがさいご、やめられなくなる。","zh":"一旦开始玩这个游戏，就再也停不下来了。"}],"note":"后项多为难以收拾的消极结果。"},{"id":"g431","level":"N1","pattern":"かたがた","meaning":"…（的）同时／顺便…","cat":"purpose","formation":"名词 + かたがた","examples":[{"jp":"散歩かたがた、買い物をする。","r":"さんぽかたがた、かいものをする。","zh":"一边散步，顺便买东西。"},{"jp":"ご挨拶かたがた、お伺いいたしました。","r":"ごあいさつかたがた、おうかがいいたしました。","zh":"借着问候之便，前来拜访。"}],"note":"前后两个动作的时间带相同；ついでに的前后时间带不同。"},{"id":"g432","level":"N1","pattern":"がてら","meaning":"…（的同时）顺便…／借…之便…","cat":"purpose","formation":"名词／动词ます形 + がてら","examples":[{"jp":"遊びがてら、建設中の別荘を見に行こう。","r":"あそびがてら、けんせつちゅうのべっそうをみにいこう。","zh":"趁游玩之际，顺便去看看正在建造的别墅吧。"},{"jp":"買い物がてら、駅前の新しいカフェに寄った。","r":"かいものがてら、えきまえのあたらしいカフェによった。","zh":"买东西时顺路去了车站前新开的咖啡店。"}]},{"id":"g433","level":"N1","pattern":"が早いか","meaning":"一…就立即…","cat":"time","formation":"动词连体形 + が早いか","examples":[{"jp":"ベルが鳴るが早いか、彼女は受話器を取った。","r":"ベルがなるがはやいか、かのじょはじゅわきをとった。","zh":"铃一响，她马上就拿起了听筒。"},{"jp":"ドアが開くが早いか、子供たちは外へ飛び出していった。","r":"ドアがひらくがはやいか、こどもたちはそとへとびだしていった。","zh":"门一开，孩子们就冲了出去。"}],"note":"不适用于自然现象的发生，不能用于意志和推量；表示一次性行为。"},{"id":"g434","level":"N1","pattern":"からある／からする／からの","meaning":"多达…以上／足有…","cat":"compare","formation":"数量词 + からある／からする／からの","examples":[{"jp":"ここから東京までは、100キロからある。","r":"ここからとうきょうまでは、ひゃっキロからある。","zh":"从这里到东京有一百多公里。"},{"jp":"この指輪は、百万円からするだろう。","r":"このゆびわは、ひゃくまんえんからするだろう。","zh":"这枚戒指恐怕要值一百万日元吧。"}],"note":"からある用于距离、重量、高度；からする用于金额；からの用于人数。"},{"id":"g435","level":"N1","pattern":"きらいがある","meaning":"有点儿…／总爱…／有…的倾向","cat":"guess","formation":"动词连体形 + きらいがある／名词 + のきらいがある","examples":[{"jp":"彼は人の話を聞かないきらいがある。","r":"かれはひとのはなしをきかないきらいがある。","zh":"他有点听不进别人的话。"},{"jp":"この論文は、説明が長すぎるきらいがある。","r":"このろんぶんは、せつめいがながすぎるきらいがある。","zh":"这篇论文有解释过于冗长的倾向。"}],"note":"多用于不好的倾向，不能用于回数和自然现象。"},{"id":"g436","level":"N1","pattern":"ごとき／ごとく／ごとし","meaning":"像…一样／如…","cat":"compare","formation":"名词 + のごとき／ごとく／ごとし","examples":[{"jp":"王者のごとき振る舞いに、人々は反感を抱いた。","r":"おうじゃのごときふるまいに、ひとびとははんかんをいだいた。","zh":"对他像王者一样的举止，众人怀有反感。"},{"jp":"彼は風のごとく走り去った。","r":"かれはかぜのごとくはしりさった。","zh":"他如风一般飞驰而去。"}],"note":"ごとく修饰动词相当于ように，ごとき修饰名词相当于ような，ごとし是终止形。"},{"id":"g437","level":"N1","pattern":"ことだから／こととて／ことだし","meaning":"正因为…所以…／由于…","cat":"reason","formation":"体言 + のこととて／ことだから","examples":[{"jp":"10年ぶりのこととて、すぐにはわからなかった。","r":"じゅうねんぶりのこととて、すぐにはわからなかった。","zh":"因为相隔十年，所以没能立刻认出来。"},{"jp":"慣れない土地のことだから、少し不安だ。","r":"なれないとちのことだから、すこしふあんだ。","zh":"因为是不熟悉的土地，所以有点不安。"}],"note":"表示“即使是…（であっても）”时只能用こととて。"},{"id":"g438","level":"N1","pattern":"ことなく／ことなしに（は）","meaning":"不…而…／没有…","cat":"negative","formation":"动词连体形 + ことなく／ことなしに","examples":[{"jp":"日曜日も休むことなしに働いた。","r":"にちようびもやすむことなしにはたらいた。","zh":"星期天也不休息地工作。"},{"jp":"彼は一度も弱音を吐くことなく、最後まで走り抜いた。","r":"かれはいちどもよわねをはくことなく、さいごまではしりぬいた。","zh":"他从没叫过一声苦，一直跑到了最后。"}],"note":"ことなしには、ことなくして（は）表示“（如果）不…就不能…”。"},{"id":"g439","level":"N1","pattern":"始末だ","meaning":"（消极的）结果／落得…的下场","cat":"state","formation":"动词连体形 + 始末だ","examples":[{"jp":"事業を始めたが失敗して、借金だけが残る始末だった。","r":"じぎょうをはじめたがしっぱいして、しゃっきんだけがのこるし

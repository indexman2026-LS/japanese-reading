まつだった。","zh":"事业刚开始就失败了，结果只剩下债务。"},{"jp":"彼は怒りすぎて、机を叩く始末だ。","r":"かれはおこりすぎて、つくえをたたくしまつだ。","zh":"他气到极点，竟落得拍桌子（的下场）。"}],"note":"表示事情、经过的结果，一般指不好的结果。"},{"id":"g440","level":"N1","pattern":"ずにはおかない／ないではおかない","meaning":"必定…／必然…","cat":"oblig","formation":"动词未然形 + ずにはおかない","examples":[{"jp":"神は罪を犯したものには、罰を与えずにはおかない。","r":"かみはつみをおかしたものには、ばつをあたえずにはおかない。","zh":"神对犯了罪的人必定会给予惩罚。"},{"jp":"その映画は、見る者を感動させずにはおかない。","r":"そのえいがは、みるものをかんどうさせずにはおかない。","zh":"那部电影必定会让观众感动。"}],"note":"与“ずにはいられない（不由得…）”相区别。"},{"id":"g441","level":"N1","pattern":"ずにはすまない／ないではすまない","meaning":"不得不…／不…不行","cat":"oblig","formation":"动词未然形 + ずにはすまない","examples":[{"jp":"学校の規則を破った私は、反省文を書かずにはすまない。","r":"がっこうのきそくをやぶったわたしは、はんせいぶんをかかずにはすまない。","zh":"违反了校规的我，不得不写检讨书。"},{"jp":"お世話になった恩人には、お礼を言わずにはすまない。","r":"おせわになったおんじんには、おれいをいわずにはすまない。","zh":"对关照过自己的恩人，不能不道谢。"}],"note":"与“ずにはいられない（不由得…）”相区别，此处指不得不做。"},{"id":"g442","level":"N1","pattern":"すら／さえ","meaning":"连…都…／甚至…","cat":"limit","formation":"名词（+ 助词） + すら／さえ","examples":[{"jp":"あの子は、自分の名前すら書けない。","r":"あのこは、じぶんのなまえすらかけない。","zh":"那个孩子连自己的名字都不会写。"},{"jp":"彼は忙しくて、食事をする時間さえなかった。","r":"かれはいそがしくて、しょくじをするじかんさえなかった。","zh":"他忙得连吃饭的时间都没有。"}],"note":"すら带有轻视口气，多用于不好的情况；さえ好坏皆可用。"},{"id":"g443","level":"N1","pattern":"そばから","meaning":"刚…就…／紧接着…","cat":"time","formation":"动词连体形 + そばから","examples":[{"jp":"春の雪は冬の雪と違って、降るそばから溶けてしまって、積もらない。","r":"はるのゆきはふゆのゆきとちがって、ふるそばからとけてしまって、つもらない。","zh":"春雪不同于冬雪，一边下一边就化了，积不起来。"},{"jp":"掃除するそばから、子供が散らかす。","r":"そうじするそばから、こどもがちらかす。","zh":"刚打扫完，孩子又弄乱了。"}],"note":"表示重复性的行为；が早いか表示一次性的行为。"},{"id":"g444","level":"N1","pattern":"ただ…のみだ／ただ…だけだ","meaning":"仅仅…／只有…","cat":"limit","formation":"动词连体形 + のみだ／だけだ","examples":[{"jp":"ただ女性のみが子供を産むことができる。","r":"ただじょせいのみがこどもをうむことができる。","zh":"只有女性才能生孩子。"},{"jp":"今はただ祈るのみだ。","r":"いまはただいのるのみだ。","zh":"现在唯有祈祷。"}]},{"id":"g445","level":"N1","pattern":"ただ…のみならず／ただ…だけでなく","meaning":"不仅…而且…","cat":"conj","formation":"动词连体形 + のみならず／だけでなく","examples":[{"jp":"彼はただ外見のみならず、性格もいい。","r":"かれはただがいけんのみならず、せいかくもいい。","zh":"他不仅外表好，性格也好。"},{"jp":"この本はただ面白いのみならず、ためになる。","r":"このほんはただおもしろいのみならず、ためになる。","zh":"这本书不仅有趣，而且有益。"}]},{"id":"g446","level":"N1","pattern":"たところで","meaning":"即使…也…","cat":"reverse","formation":"动词た形 + ところで","examples":[{"jp":"何回やったところで、勝てないよ。相手は強すぎるんだから。","r":"なんかいやったところで、かてないよ。あいてはつよすぎるんだから。","zh":"即使做多少次也赢不了，因为对手太强了。"},{"jp":"今さら後悔したところで、時間は戻らない。","r":"いまさらこうかいしたところで、じかんはもどらない。","zh":"事到如今再后悔，时间也不会倒流。"}],"note":"句末一般接否定，表示前面的条件即使成立也不起作用。"},{"id":"g447","level":"N1","pattern":"だに","meaning":"连…都…／仅…","cat":"limit","formation":"动词连体形 + だに","examples":[{"jp":"彼のことは、もうすっかり忘れた。夢にだに見ない。","r":"かれのことは、もうすっかりわすれた。ゆめにだにみない。","zh":"他的事我早已忘光，连梦里都不曾出现。"},{"jp":"あの日の光景は、思い出すだに胸が痛む。","r":"あのひのこうけいは、おもいだすだにむねがいたむ。","zh":"那天的一幕，光是想起就心痛。"}],"note":"后接否定较多，也可用于“连想都不敢想”等。"},{"id":"g448","level":"N1","pattern":"たりとも","meaning":"即使…也…","cat":"limit","formation":"数量词 + たりとも","examples":[{"jp":"父から送金してもらったお金は、1円たりとも無駄にはできない。","r":"ちちからそうきんしてもらったおかねは、いちえんたりともむだにはできない。","zh":"父亲寄来的钱，一分也不能浪费。"},{"jp":"一瞬たりとも目を離すな。","r":"いっしゅんたりともめをはなすな。","zh":"一刻也不能移开目光。"}],"note":"后接否定，文末也常用表示禁止的“な”。"},{"id":"g449","level":"N1","pattern":"たるもの（者）","meaning":"身为…就…／作为…","cat":"view","formation":"名词 + たるもの","examples":[{"jp":"「男たる者、女の前で涙は流せない」と彼は強がりを言った。","r":"「おとこたるもの、おんなのまえでなみだはながせない」とかれはつよがりをいった。","zh":"他逞强地说：“身为男人，不能在女人面前流泪。”"},{"jp":"学生たるもの、勉強を第一に考えるべきだ。","r":"がくせいたるもの、べんきょうをだいいちにかんがえるべきだ。","zh":"身为学生，应该把学习放在第一位。"}],"note":"たるもの表示“作为…，应该或必须…”；ともあろうものが表示“身为…竟然…”。"},{"id":"g450","level":"N1","pattern":"っぱなし","meaning":"一直…着不管／放任…","cat":"state","formation":"动词ます形 + っぱなし","examples":[{"jp":"玄関のドアを開けっぱなしにしないでください。虫が入ってくるから。","r":"げんかんのドアをあけっぱなしにしないでください。むしがはいってくるから。","zh":"请不要把玄关的门一直开着，虫子会进来的。"},{"jp":"テレビをつけっぱなしにして寝てしまった。","r":"テレビをつけっぱなしにしてねてしまった。","zh":"开着电视就睡着了。"},{"jp":"自転車の鍵が見当たらないと思ったら、昨日はいていたズボンのポケットに入れっぱなしだった。","r":"じてんしゃのかぎがみあたらないとおもったら、きのうはいていたズボンのポケットにいれっぱなしだった。","zh":"找不到自行车的钥匙，原来是一直放在昨天穿的裤子口袋里。","src":"2022年12月真题"}],"note":"多用于不好的情况，前面不接名词和否定形。","srcs":["2022年12月真题"]},{"id":"g451","level":"N1","pattern":"AつBつ","meaning":"一会儿…一会儿…／互相…","cat":"state","formation":"动词ます形 + つ + 动词ます形（相反动词） + つ","examples":[{"jp":"Aさんと私の成績は毎回抜きつ抜かれつで、お互いにいいライバルだ。","r":"Aさんとわたしのせいせきはまいかいぬきつぬかれつで、おたがいにいいライバルだ。","zh":"我和小A的成绩每次都是你追我赶，是很好的竞争对手。"},{"jp":"二人は持ちつ持たれつの関係だ。","r":"ふたりはもちつもたれつのかんけいだ。","zh":"两人是互相扶持、彼此帮助的关系。"}],"note":"如行きつ戻りつ、浮きつ沈みつ、持ちつ持たれつ。"},{"id":"g452","level":"N1","pattern":"…であれ／…であろうと","meaning":"不管…／即使…","cat":"reverse","formation":"名词 + であれ／であろうと","examples":[{"jp":"お金持ちであれ悩みはある。","r":"おかねもちであれなやみはある。","zh":"即使是有钱人，也有烦恼。"},{"jp":"結果がどうであれ、最後までやるしかない。","r":"けっかがどうであれ、さいごまでやるしかない。","zh":"不管结果如何，只能坚持到最后。"}]},{"id":"g453","level":"N1","pattern":"…であれ…であれ","meaning":"无论…还是…","cat":"reverse","formation":"名词 + であれ + 名词 + であれ","examples":[{"jp":"男であれ女であれ、不況の今は就職することは難しい。","r":"おとこであれおんなであれ、ふきょうのいまはしゅうしょくすることはむずかしい。","zh":"无论男女，在不景气的现在找工作都很难。"},{"jp":"晴れであれ雨であれ、明日の遠足は決行する。","r":"はれであれあめであれ、あしたのえんそくはけっこうする。","zh":"无论晴雨，明天的远足都照常举行。"}]},{"id":"g454","level":"N1","pattern":"…でなくて何だろう／…といわずして…だ","meaning":"这不是…又是什么…／不…又怎能…","cat":"emote","formation":"体言 + でなくて何だろう","examples":[{"jp":"最近とてもさびしい。これがホームシックでなくて何だろう。","r":"さいきんとてもさびしい。これがホームシックでなくてなんだろう。","zh":"最近非常寂寞。这不是想家又是什么呢？"},{"jp":"こんなに苦しいのは、努力不足でなくて何だろう。","r":"こんなにくるしいのは、どりょくぶそくでなくてなんだろう。","zh":"这么痛苦，不是努力不够又是什么呢？"}],"note":"一般用于书面语。"},{"id":"g455","level":"N1","pattern":"ではあるまいし／ではあるまいに","meaning":"又不是…所以…","cat":"reason","formation":"体言 + ではあるまいし","examples":[{"jp":"赤ちゃんではあるまいし、自分のことは自分でしなさい。","r":"あかちゃんではあるまいし、じぶんのことはじぶんでしなさい。","zh":"又不是小孩子，自己的事情自己做。"},{"jp":"学生ではあるまいし、そんな簡単な問題がわからないはずがない。","r":"がくせいではあるまいし、そんなかんたんなもんだいがわからないはずがない。","zh":"又不是学生，这种简单的问题不可能不会。"}]},{"id":"g456","level":"N1","pattern":"てやまない","meaning":"衷心…／非常…","cat":"emote","formation":"动词て形 + やまない","examples":[{"jp":"事業の成功を祈ってやまない。","r":"じぎょうのせいこうをいのってやまない。","zh":"衷心祝愿事业成功。"},{"jp":"皆様のご健康をお祈りしてやみません。","r":"みなさまのごけんこうをおいのりしてやみません。","zh":"衷心祝愿大家身体健康。"}]},{"id":"g457","level":"N1","pattern":"と相まって","meaning":"与…相结合／加上…","cat":"reason","formation":"名词 + と相まって","examples":[{"jp":"昨日は日曜だったので、好天と相まって人出が多かった。","r":"きのうはにちようだったので、こうてんとあいまってひとでがおおかった。","zh":"昨天是星期天，加上天气晴好，外出的人很多。"},{"jp":"若さと経験が相まって、彼は見事な演技を見せた。","r":"わかさとけいけんがあいまって、かれはみごとなえんぎをみせた。","zh":"年轻与经验相结合，他展现了精彩的表演。"},{"jp":"旅館の窓から見えた山々は紅葉で鮮やかに色づいており、澄んだ青空と相まって、なんとも美しかった。","r":"りょかんのまどからみえたやまやまはこうようであざやかにいろづいており、すんだあおぞらとあいまって、なんともうつくしかった。","zh":"从旅馆窗户望见的群山红叶正艳，与澄澈的蓝天相映，美不胜收。","src":"2022年7月真题"}],"note":"一般用于好的事情，不适用于不好的事情。","srcs":["2022年7月真题"]},{"id":"g458","level":"N1","pattern":"とあって","meaning":"正因为是…／因为…","cat":"reason","formation":"动词连体形／体言 + とあって","examples":[{"jp":"今朝は寒かったとあって、出勤する人たちは皆、厚いコートを着ている。","r":"けさはさむかったとあって、しゅっきんするひとたちはみな、あついコートをきている。","zh":"正因为今早很冷，上班的人们都穿着厚外套。"},{"jp":"人気の店とあって、開店前から行列ができている。","r":"にんきのみせとあって、かいてんまえからぎょうれつができている。","zh":"因为是有名的店，开店前就排起了长队。"}],"note":"表示已经发生的事，句末不用でしょう、かもしれない等推量。"},{"id":"g459","level":"N1","pattern":"とあっては、とあれば","meaning":"如果…就…／假如…","cat":"cond","formation":"动词连体形／体言 + とあっては／とあれば","examples":[{"jp":"社長の命令とあっては、聞かないわけにはいかない。","r":"しゃちょうのめいれいとあっては、きかないわけにはいかない。","zh":"如果是社长的命令，就不能不听。"},{"jp":"彼女の頼みとあれば、断れない。","r":"かのじょのたのみとあれば、ことわれない。","zh":"如果是她的请求，就无法拒绝。"}],"note":"とあっては常与“しないわけにはいかない”“するほかない”等呼应。"},{"id":"g460","level":"N1","pattern":"AといいBといい／AといわずBといわず","meaning":"不论…还是…／…也好…也好","cat":"conj","formation":"名词 + といい + 名词 + といい","examples":[{"jp":"そのレストランは料理といいサービスといい、申し分なかった。","r":"そのレストランはりょうりといいサービスといい、もうしぶんなかった。","zh":"那家餐厅无论是菜还是服务都无可挑剔。"},{"jp":"山といい川といい、この辺りの景色は素晴らしい。","r":"やまといいかわといい、このあたりのけしきはすばらしい。","zh":"无论是山还是河，这一带的景色都很美。"}],"note":"AといわずBといわず涵盖的范围更广，如“山といわず野といわず”。"},{"id":"g461","level":"N1","pattern":"といえども","meaning":"即使是…也…／虽说…可是…","cat":"reverse","formation":"动词终止形／体言 + といえども","examples":[{"jp":"親といえども、子供の将来を勝手に決めることはできない。","r":"おやといえども、こどものしょうらいをかってにきめることはできない。","zh":"即使是父母，也不能擅自决定孩子的未来。"},{"jp":"大企業といえども、この不況の影響を免れない。","r":"だいきぎょうといえども、このふきょうのえいきょうをまぬかれない。","zh":"即使是大企业，也难免受这次萧条的影响。"}]},{"id":"g462","level":"N1","pattern":"といったらない／といったらありはしない","meaning":"…极了／…得不得了","cat":"emote","formation":"体言 + といったらない","examples":[{"jp":"彼は不潔だといったらありゃしない。風呂は一ヶ月に1回だそうだ。","r":"かれはふけつだといったらありゃしない。ふろはひとつきにいっかいだそうだ。","zh":"他脏得不得了，听说一个月才洗一次澡。"},{"jp":"久しぶりに会えて、嬉しさといったらなかった。","r":"ひさしぶりにあえて、うれしさといったらなかった。","zh":"久别重逢，高兴得不得了。"}],"note":"表示程度很高。"},{"id":"g463","level":"N1","pattern":"ときたら／ときては／ときている","meaning":"提起…／说到…","cat":"quote","formation":"体言 + ときたら","examples":[{"jp":"最近の若者ときたら、礼儀も知らない。","r":"さいきんのわかものときたら、れいぎもしらない。","zh":"说到现在的年轻人，连礼仪都不懂。"},{"jp":"うちの息子ときたら、勉強は全然しない。","r":"うちのむすこときたら、べんきょうはぜんぜんしない。","zh":"说起我儿子，完全不用功。"}],"note":"后面一般带有一种抱怨的消极感情。"},{"id":"g464","level":"N1","pattern":"ところを","meaning":"正在…的时候（被…）／在…情况下…","cat":"time","formation":"动词连体形 + ところを","examples":[{"jp":"つまみ食いしているところを母に見つかってしまった。","r":"つまみぐいしているところをははにみつかってしまった。","zh":"偷吃的时候被妈妈发现了。"},{"jp":"お忙しいところを、わざわざ来ていただいてありがとうございます。","r":"おいそがしいところを、わざわざきていただいてありがとうございます。","zh":"百忙之中特意前来，非常感谢。"}],"note":"多与句末的すみません、ありがとう、申し訳ありません相呼应。"},{"id":"g465","level":"N1","pattern":"としたところで／としたって／にしたところで","meaning":"即使是…也…","cat":"reverse","formation":"体言 + としたところで／としたって","examples":[{"jp":"彼としたって、彼女が仕事をするのは反対ではなかった。","r":"かれとしたって、かのじょがしごとをするのははんたいではなかった。","zh":"即使是他，也不反对她去工作。"},{"jp":"専門家にしたところで、この問題は難しいだろう。","r":"せんもんかにしたところで、このもんだいはむずかしいだろう。","zh":"即使是专家，这个问题大概也很难吧。"}],"note":"としたって相当于としても。"},{"id":"g466","level":"N1","pattern":"とばかりに／と言わんばかりに","meaning":"好像要说…似的／显出…的样子","cat":"guess","formation":"动词未然形 + んばかりに／とばかりに","examples":[{"jp":"日曜日なのに妻は早く起きろとばかりに、掃除機をかけ始めた。","r":"にちようびなのにつまははやくおきろとばかりに、そうじきをかけはじめた。","zh":"明明是星期天，妻子却像催人早起似的开始用吸尘器。"},{"jp":"彼は「早く来い」と言わんばかりに手を振った。","r":"かれは「はやくこい」といわんばかりにてをふった。","zh":"他拼命挥手，好像在说“快点来”。"}]},{"id":"g467","level":"N1","pattern":"Aともなく／ともなしに","meaning":"无意之中…／漫不经心地…","cat":"state","formation":"动词原形 + ともなく／ともなしに","examples":[{"jp":"寝るともなしにベッドに横になっていたら、いつの間にかぐっすり眠っていた。","r":"ねるともなしにベッドによこになっていたら、いつのまにかぐっすりねむっていた。","zh":"无意中躺到床上，不知不觉就睡熟了。"},{"jp":"聞くともなく聞いていた会話の中に、名前が出てきた。","r":"きくともなくきいていたかいわのなかに、なまえがでてきた。","zh":"无意中听到的对话里，出现了那个名字。"}]},{"id":"g468","level":"N1","pattern":"ないものでもない","meaning":"并非不…／也有可能…","cat":"negative","formation":"动词未然形 + ないものでもない","examples":[{"jp":"一生懸命働けばマイホームが手に入らないものでもない。","r":"いっしょうけんめいはたらけばマイホームがてにはいらないものでもない。","zh":"拼命工作的话，也并非买不到自己的房子。"},{"jp":"頼まれれば、手伝わないものでもない。","r":"たのまれれば、てつだわないものでもない。","zh":"如果被拜托，也不是不能帮忙。"}]},{"id":"g469","level":"N1","pattern":"ながらに／ながらの","meaning":"…着／保持…状态","cat":"state","formation":"名词 + ながらに／ながらの","examples":[{"jp":"今回の事故で子供を失った母親は涙ながらに子供への思いを語った。","r":"こんかいのじこでこどもをうしなったははおやはなみだながらにこどもへのおもいをかたった。","zh":"在这次事故中失去孩子的母亲，流着泪讲述了对孩子的思念。"},{"jp":"彼は生まれながらにして音楽の才能に恵まれていた。","r":"かれはうまれながらにしておんがくのさいのうにめぐまれていた。","zh":"他天生就具有音乐才能。"}],"note":"涙ながら＝流着泪，居ながら＝坐在家里，生まれながら＝生来。"},{"id":"g470","level":"N1","pattern":"なくして／なくしては／なしに／なしには","meaning":"如果没有…就…","cat":"cond","formation":"名词 + なくして（は）／なしに（は）","examples":[{"jp":"皆さんの協力なくしては、完成させることはできませんでした。","r":"みなさんのきょうりょくなくしては、かんせいさせることはできませんでした。","zh":"没有大家的协助，就无法完成。"},{"jp":"彼は事前の連絡なしに休んだ。","r":"かれはじぜんのれんらくなしにやすんだ。","zh":"他事先没打招呼就请假了。"}],"note":"四个都有“不完成前项就无法完成后项”的意思；なしに还可表示“不…而…”。"},{"id":"g471","level":"N1","pattern":"なり／たなり","meaning":"一…就…／…着就…","cat":"time","formation":"动词连体形（现在形） + なり／たなり","examples":[{"jp":"帰宅するなり、また出かけてしまった。","r":"きたくするなり、またでかけてしまった。","zh":"刚回到家，就又出门了。"},{"jp":"彼はベッドに横になったなり、動かなかった。","r":"かれはベッドによこになったなり、うごかなかった。","zh":"他躺到床上就一动不动了。"}],"note":"前后必须用同一主语。"},{"id":"g472","level":"N1","pattern":"AなりBなり","meaning":"…也好…也好／或是…或是…","cat":"conj","formation":"名词／动词连体形 + なり + 名词／动词连体形 + なり","examples":[{"jp":"御用の際は、何なりとお申し付けください。","r":"ごようのさいは、なんなりとおもうしつけください。","zh":"有事的时候，请尽管吩咐。"},{"jp":"熱があるなら、薬を飲むなり氷で冷やすなりしなさい。","r":"ねつがあるなら、くすりをのむなりこおりでひやすなりしなさい。","zh":"如果发烧，就吃药或者用冰敷吧。"}],"note":"AなりBなり有从中择一的意思；AとかBとか没有选择的意思。"},{"id":"g473","level":"N1","pattern":"にあたらない／にはあたらない","meaning":"用不着…／不必…","cat":"negative","formation":"动词连体形 + にあたらない","examples":[{"jp":"今度の試験が悪かったといって、悲観するにあたらない。","r":"こんどのしけんがわるかったといって、ひかんするにあたらない。","zh":"虽说这次考得不好，也不必悲观。"},{"jp":"彼が優勝したからといって、驚くにあたらない。日頃の努力の結果だ。","r":"かれがゆうしょうしたからといって、おどろくにあたらない。ひごろのどりょくのけっかだ。","zh":"他夺冠并不值得惊讶，那是他平时努力的结果。"}]},{"id":"g474","level":"N1","pattern":"にあって","meaning":"在…下／处于…情况下","cat":"state","formation":"体言 + にあって","examples":[{"jp":"どんなに厳しい状況にあって、彼は笑顔を絶やさない。","r":"どんなにきびしいじょうきょうにあって、かれはえがおをたやさない。","zh":"无论身处多么严峻的情况，他都不失去笑容。"},{"jp":"忙しい毎日にあっても、運動の時間だけは確保している。","r":"いそがしいまいにちにあっても、うんどうのじかんだけはかくほしている。","zh":"即使在忙碌的每一天里，也确保运动的时间。"}],"note":"用于抽象情况，很多场合可换成“で”或“おいて”。"},{"id":"g475","level":"N1","pattern":"に至る／に至るまで／に至って","meaning":"到…为止／直至…","cat":"time","formation":"体言／动词连体形 + に至る（まで）","examples":[{"jp":"登山口から頂上に至る道路は、よく整備されていて歩きやすい。","r":"とざんぐちからちょうじょうにいたるどうろは、よくせいびされていてあるきやすい。","zh":"从登山口通往山顶的道路维护得很好，很好走。"},{"jp":"今日に至るまで、彼の行方はわかっていない。","r":"きょうにいたるまで、かれのゆくえはわかっていない。","zh":"直至今日，他的下落仍不明。"}],"note":"这里的に至って有“直到发生了A，才被迫做了B”之意，常含不满和愤怒。"},{"id":"g476","level":"N1","pattern":"に至っては／に至ると／に至っても","meaning":"至于…／到了…的地步","cat":"limit","formation":"体言／动词连体形 + に至っては","examples":[{"jp":"孫に至っては、祖母の年齢どころか名前も知らない。","r":"まごにいたっては、そぼのねんれいどころかなまえもしらない。","zh":"至于孙子，别说祖母的年龄，连名字都不知道。"},{"jp":"資金難に至っては、とても一人では解決できない。","r":"しきんなんにいたっては、とてもひとりではかいけつできない。","zh":"到了资金困难的地步，一个人根本无法解决。"}],"note":"句末一般都是否定。"},{"id":"g477","level":"N1","pattern":"にかかわる／にかかわらず","meaning":"关系到…／不管…","cat":"view","formation":"体言 + にかかわる／にかかわらず","examples":[{"jp":"あなたの将来にかかわることだから、進路についてはよく考えなさい。","r":"あなたのしょうらいにかかわることだから、しんろについてはよくかんがえなさい。","zh":"因为关系到你的将来，关于前途要认真考虑。"},{"jp":"晴雨にかかわらず、運動会は予定通り行う。","r":"せいうにかかわらず、うんどうかいはよていどおりおこなう。","zh":"无论晴雨，运动会都按计划举行。"}],"note":"にかかわらず前面一般有两种情况，如“晴雨にかかわらず”。"},{"id":"g478","level":"N1","pattern":"にかたくない","meaning":"不难…／很容易就…","cat":"potential","formation":"动词连体形 + にかたくない","examples":[{"jp":"田舎に住んでいる人が都会に憧れる心情は理解にかたくない。","r":"いなかにすんでいるひとがとかいにあこがれるしんじょうはりかいにかたくない。","zh":"住在乡下的人向往城市的心情不难理解。"},{"jp":"彼がどれほど悔しかったかは、想像にかたくない。","r":"かれがどれほどくやしかったかは、そうぞうにかたくない。","zh":"他当时多么懊悔，不难想象。"}],"note":"不用于客观事实的陈述，多表达心理想法，如想像にかたくない。"},{"id":"g479","level":"N1","pattern":"にして","meaning":"1) 只有…才… 2) 就连…都…","cat":"limit","formation":"体言 + にして","examples":[{"jp":"先生にして解けない問題なのだから、私にできるわけがない。","r":"せんせいにしてとけないもんだいなのだから、わたしにできるわけがない。","zh":"既然是连老师都解不出的题，我当然不会。"},{"jp":"彼は一瞬にして姿を消した。","r":"かれはいっしゅんにしてすがたをけした。","zh":"他一瞬间就消失了。"}],"note":"幸いにして＝幸而，一瞬にして＝一瞬间，緊急にして＝紧急之中。"},{"id":"g480","level":"N1","pattern":"に即して／即しては／即しても","meaning":"按照…／根据…","cat":"view","formation":"体言 + に即して","examples":[{"jp":"現実に即して考える。","r":"げんじつにそくしてかんがえる。","zh":"根据现实来考虑。"},{"jp":"現場の状況に即して、臨機応変に対応した。","r":"げんばのじょうきょうにそくして、りんきおうへんにたいおうした。","zh":"根据现场情况灵活应对。"}]},{"id":"g481","level":"N1","pattern":"にたえる／にたえない","meaning":"值得…／（不）堪…","cat":"potential","formation":"动词连体形 + にたえる／にたえない","examples":[{"jp":"彼のスピーチは聞くにたえないものだった。","r":"かれのスピーチはきくにたえないものだった。","zh":"他的演讲不堪入耳。"},{"jp":"彼の演奏は、何度でも聴くにたえるものだった。","r":"かれのえんそうは、なんどでもきくにたえるものだった。","zh":"他的演奏百听不厌。"}],"note":"用于主观评价。"},{"id":"g482","level":"N1","pattern":"に足る／に足りる／に値する","meaning":"值得…／足以…","cat":"potential","formation":"动词连体形 + に足る／に値する","examples":[{"jp":"彼は信頼するに足る人物だ。","r":"かれはしんらいするにたるじんぶつだ。","zh":"他是值得信赖的人。"},{"jp":"これは一見の価値に値する作品だ。","r":"これはいっけんのかちにあたいするさくひんだ。","zh":"这是值得一看的作品。"}],"note":"对外部对象作客观评价。"},{"id":"g483","level":"N1","pattern":"に引き換え／にひきかえて","meaning":"与…相反／与…完全不同","cat":"reverse","formation":"体言 + に引き換え","examples":[{"jp":"何事にも娘に甘い父に引き換え、母は厳しい。","r":"なにごとにもむすめにあまいちちにひきかえ、はははきびしい。","zh":"与对女儿事事宠爱的父亲相反，母亲很严厉。"},{"jp":"兄が活発なのに引き換え、弟はおとなしい。","r":"あにがかっぱつなのにひきかえ、おとうとはおとなしい。","zh":"哥哥活泼好动，与之相反弟弟很文静。"}],"note":"是对比手法的应用，前后情况相反。"},{"id":"g484","level":"N1","pattern":"に（も）まして","meaning":"比…更加…","cat":"compare","formation":"体言 + に（も）まして","examples":[{"jp":"12月になり、前にもまして寒くなってきた。","r":"じゅうにがつになり、まえにもましてさむくなってきた。","zh":"进入12月，比以前更冷了。"},{"jp":"兄にもまして、弟のほうが勉強熱心だ。","r":"あににもまして、おとうとのほうがべんきょうねっしんだ。","zh":"弟弟比哥哥更用功。"}]},{"id":"g485","level":"N1","pattern":"の至り","meaning":"…之至／无比…","cat":"emote","formation":"体言 + の至り","examples":[{"jp":"こんなに親切にしていただき、恐縮の至りです。","r":"こんなにしんせつにしていただき、きょうしゅくのいたりです。","zh":"承蒙如此厚待，实在惶恐之至。"},{"jp":"このような名誉をいただき、光栄の至りです。","r":"このようなめいよをいただき、こうえいのいたりです。","zh":"获得如此殊荣，无比荣幸。"}],"note":"感情用语，一般用于好的事情。"},{"id":"g486","level":"N1","pattern":"ばそれまでだ／たらそれまでだ","meaning":"那就完了／就无话可说","cat":"cond","formation":"动词假定形 + ばそれまでだ","examples":[{"jp":"一生懸命勉強しても、試験に落ちてしまえばそれまでだ。","r":"いっしょうけんめいべんきょうしても、しけんにおちてしまえばそれまでだ。","zh":"即使拼命学习，一旦考试不及格也就完了。"},{"jp":"どんなにいいアイデアでも、実行できなければそれまでだ。","r":"どんなにいいアイデアでも、じっこうできなければそれまでだ。","zh":"再好的点子，如果无法实行也就白搭。"}],"note":"と是必然的结果，ば是一般的判断，なら适用于一次性的事情。"},{"id":"g487","level":"N1","pattern":"べからず／べからざる／べきではない","meaning":"不可…／不应该…／禁止…","cat":"order","formation":"动词终止形（する・す） + べからず／べからざる","examples":[{"jp":"彼の行った不正は許すべからざる不法行為だ。","r":"かれのおこなったふせいはゆるすべからざるふほうこういだ。","zh":"他做的不正当行为是不可饶恕的违法行为。"},{"jp":"芝生に入るべからず。","r":"しばふにはいるべからず。","zh":"禁止踏入草坪。"}],"note":"禁止的内容不是个人的判断，而是社会的通念。"},{"id":"g488","level":"N1","pattern":"べく／べくもない","meaning":"为了…／不可能…","cat":"purpose","formation":"动词终止形（する・す） + べく／べくもない","examples":[{"jp":"英国へ留学するべく、貯金をしている。","r":"えいこくへりゅうがくするべく、ちょきんをしている。","zh":"为了去英国留学，正在攒钱。"},{"jp":"彼の実力は、私の及ぶべくもない。","r":"かれのじつりょくは、わたしのおよぶべくもない。","zh":"他的实力是我望尘莫及的。"}]},{"id":"g489","level":"N1","pattern":"まじ／まじき／あるまじき","meaning":"不应该／不可以","cat":"order","formation":"动词终止形 + まじき／あるまじき + 名词","examples":[{"jp":"ビールを飲んで騒ぐなんて、高校生にあるまじきことだ。","r":"ビールをのんでさわぐなんて、こうこうせいにあるまじきことだ。","zh":"喝着啤酒胡闹，是高中生不该做的事。"},{"jp":"教師にあるまじき発言だ。","r":"きょうしにあるまじきはつげんだ。","zh":"那是有失教师身份的发言。"}],"note":"まじ是终止形；まじき、あるまじき连接体言，用“…にあるまじき”。"},{"id":"g490","level":"N1","pattern":"までだ／までのことだ","meaning":"只好…／只是…罢了","cat":"state","formation":"动词原形 + までだ","examples":[{"jp":"給料が上がらないなら、会社をやめるまでだ。","r":"きゅうりょうがあがらないなら、かいしゃをやめるまでだ。","zh":"如果工资不涨，那只好辞职了。"},{"jp":"電車が来なければ、歩いて行くまでのことだ。","r":"でんしゃがこなければ、あるいていくまでのことだ。","zh":"如果电车不来，那就走着去吧。"}]},{"id":"g491","level":"N1","pattern":"めく","meaning":"显出…的样子／渐有…的气息","cat":"change","formation":"名词 + めく","examples":[{"jp":"日一日と春めいてきて、梅の花も咲き出した。","r":"ひいちにちとはるめいてきて、うめのはなもさきだした。","zh":"一天天春意渐浓，梅花也开了。"},{"jp":"彼女の言葉には、少し皮肉めいた響きがあった。","r":"かのじょのことはには、すこしひにくめいたひびきがあった。","zh":"她的话里带着一丝讽刺的意味。"}],"note":"春めく＝春意盎然，色めく＝活跃，皮肉めく＝带讽刺意味。"},{"id":"g492","level":"N1","pattern":"もさることながら","meaning":"…自不必说／不仅…","cat":"conj","formation":"体言 + もさることながら","examples":[{"jp":"タクシーの運転手さんは運転技術もさることながら、お客様への応対も丁寧だ。","r":"タクシーのうんてんしゅさんはうんてんぎじゅつもさることながら、おきゃくさまへのおうたいもていねいだ。","zh":"出租车司机不仅驾驶技术好，接待客人也很周到。"},{"jp":"この店は料理の味もさることながら、雰囲気が抜群だ。","r":"このみせはりょうりのあじもさることながら、ふんいきがばつぐんだ。","zh":"这家店不仅菜的味道好，氛围也极佳。"}],"note":"有转折的意思，后面的事项更重要。"},{"id":"g493","level":"N1","pattern":"ものを","meaning":"明明…却…","cat":"reverse","formation":"动词连体形 + ものを","examples":[{"jp":"もう少し勉強すれば、合格できたものを。","r":"もうすこしべんきょうすれば、ごうかくできたものを。","zh":"要是再努力一点就能及格了（可惜没有）。"},{"jp":"早く言ってくれれば、手伝ったものを。","r":"はやくいってくれれば、てつだったものを。","zh":"早点说的话，我就帮你了（可是你没说）。"}],"note":"表达对对方的不满、谴责、惋惜等心情。"},{"id":"g494","level":"N1","pattern":"や／否や","meaning":"一…就马上…","cat":"time","formation":"动词原形 + や／や否や","examples":[{"jp":"ラッシュ時のホームではドアが開くや否や、乗客がどっと電車から雪崩れ出た。","r":"ラッシュじのホームではドアがひらくやいなや、じょうきゃくがどっとでんしゃからなだれでた。","zh":"高峰时段的车站月台上，门一开乘客就一拥而出。"},{"jp":"彼は家に着くや否や、シャワーを浴びた。","r":"かれはいえにつくやいなや、シャワーをあびた。","zh":"他一到家就冲了个澡。"}],"note":"前后可以不是同一主语，也可以是同一主语；后面一般是人物的动作。"},{"id":"g495","level":"N1","pattern":"ゆえ／ゆえに／ゆえの","meaning":"因为…／由于…之故","cat":"reason","formation":"体言 + がゆえに／动词连体形 + ゆえに","examples":[{"jp":"日本は天然資源に乏しいがゆえに、工業原材料を海外からの輸入に依存している。","r":"にほんはてんねんしげんにとぼしいがゆえに、こうぎょうげんざいりょうをかいがいからのゆにゅうにいぞんしている。","zh":"日本因缺乏天然资源，工业原料依赖从国外进口。"},{"jp":"若さゆえの失敗もある。","r":"わかさゆえのしっぱいもある。","zh":"也有因年轻而犯下的失败。"}],"note":"强调一般性的真理。"},{"id":"g496","level":"N1","pattern":"をおいて／を除いて","meaning":"除了…之外（没有）","cat":"limit","formation":"体言 + をおいて","examples":[{"jp":"結婚相手は彼をおいてほかにはいないと思ったから、彼との結婚を決めた。","r":"けっこんあいてはかれをおいてほかにはいないとおもったから、かれとのけっこんをきめた。","zh":"因为觉得结婚对象除了他没有别人，所以决定与他结婚。"},{"jp":"この問題を解けるのは、彼をおいて他にいない。","r":"このもんだいをとけるのは、かれをおいてほかにいない。","zh":"能解开这道题的，除他之外没有别人。"},{"jp":"当店では、商品欠陥がある場合を除いて、返品及び交換はお受けできません。","r":"とうてんでは、しょうひんけっかんがあるばあいをのぞいて、へんぴんおよびこうかんはおうけできません。","zh":"本店除商品有瑕疵的情况外，恕不接受退货及换货。","src":"2022年12月真题"}],"note":"后项接否定，表达除这个之外没有合适的对象。","srcs":["2022年12月真题"]},{"id":"g497","level":"N1","pattern":"を限りに／を潮に","meaning":"到…为止／以…为最后","cat":"time","formation":"体言 + を限りに／を潮に","examples":[{"jp":"今日を限りに、会社を辞めます。","r":"きょうをかぎりに、かいしゃをやめます。","zh":"今天是我在公司上班的最后一天。"},{"jp":"あの事故を潮に、彼はバイクに乗らなくなった。","r":"あのじこをしおに、かれはバイクにのらなくなった。","zh":"以那次事故为转折，他不再骑摩托车了。"}],"note":"を潮に一般用于不好的事情停止做。"},{"id":"g498","level":"N1","pattern":"を皮切りに／を皮切りにして／を皮切りとして","meaning":"以…为开端","cat":"time","formation":"体言 + を皮切りに","examples":[{"jp":"担当者の逮捕を皮切りに、汚職事件の真相が次々と明らかになった。","r":"たんとうしゃのたいほをかわきりに、おしょくじけんのしんそうがつぎつぎとあきらかになった。","zh":"以责任人被捕为开端，贪污事件的真相接连被查明。"},{"jp":"東京公演を皮切りに、全国ツアーが始まる。","r":"とうきょうこうえんをかわきりに、ぜんこくツアーがはじまる。","zh":"以东京公演为开端，全国巡演即将开始。"}],"note":"前后指同一类行动；如果后项是新的行动，一般用“をきっかけに”。"},{"id":"g499","level":"N1","pattern":"を禁じ得ない","meaning":"不禁…／忍不住…","cat":"emote","formation":"体言 + を禁じ得ない","examples":[{"jp":"詐欺にあい土地まで取られてしまったそうだ。同情を禁じ得ない。","r":"さぎにあいとちまでとられてしまったそうだ。どうじょうをきんじえない。","zh":"听说被诈骗连土地都被夺走了，不禁深感同情。"},{"jp":"彼の突然の辞任には、驚きを禁じ得なかった。","r":"かれのとつぜんのじにんには、おどろきをきんじえなかった。","zh":"对于他突然辞职，不禁感到惊讶。"}],"note":"表达一种感情，如禁不住哭、同情、失望、高兴、悲伤等。"},{"id":"g500","level":"N1","pattern":"をものともせずに","meaning":"不顾…／不在乎…","cat":"reverse","formation":"体言 + をものともせず（に）","examples":[{"jp":"彼は周囲の反対をものともせず、自分が正しいと思う道を歩み続けた。","r":"かれはしゅういのはんたいをものともせず、じぶんがただしいとおもうみちをあゆみつづけた。","zh":"他不顾周围人的反对，继续走自己认为正确的路。"},{"jp":"台風をものともせずに、船は港を出航した。","r":"たいふうをものともせずに、ふねはみなとをしゅっこうした。","zh":"无视台风，船驶出了港口。"}],"note":"在知道困难障碍的情况下依然不顾，表达对行为者勇气的赞赏。"},{"id":"g501","level":"N1","pattern":"んがため／んがために／んがための","meaning":"为了要…／打算…","cat":"purpose","formation":"动词未然形 + んがため（に／の）","examples":[{"jp":"試合に勝たんがため、日夜練習に励んでいる。","r":"しあいにかったんがため、にちやれんしゅうにはげんでいる。","zh":"为了赢得比赛，日夜苦练。"},{"jp":"夢を実現せんがために、彼は必死に働いた。","r":"ゆめをじつげんせんがために、かれはひっしにはたらいた。","zh":"为了实现梦想，他拼命工作。"}],"note":"口语一般不用，多用于书面语。"},{"id":"g502","level":"N1","pattern":"んばかりだ／んばかりに／んばかりの","meaning":"几乎要…／眼看就要…","cat":"guess","formation":"动词未然形（サ变动词为せ） + んばかり（だ／に／の）","examples":[{"jp":"今にも雨が降り出さんばかりの空模様になった。","r":"いまにもあめがふりださんばかりのそらもようになった。","zh":"天空一副眼看就要下雨的样子。"},{"jp":"彼は今にも泣き出さんばかりの顔をしていた。","r":"かれはいまにもなきださんばかりのかおをしていた。","zh":"他一副马上就要哭出来的表情。"}]},{"id":"g503","level":"N1","pattern":"…か、さもなければ…だ","meaning":"不是…的话就是…／否则就…","cat":"cond","formation":"体言 + か、さもなければ + 体言 + だ","examples":[{"jp":"そんなことをするのは、天才か、さもなければ狂人だ。","r":"そんなことをするのは、てんさいか、さもなければきょうじんだ。","zh":"能做这种事的人，不是天才就是疯子。"},{"jp":"彼が来ないなら、さもなければ電話をかけてみよう。","r":"かれがこないなら、さもなければでんわをかけてみよう。","zh":"如果他还不来，那就打个电话试试吧。"}]},{"id":"g504","level":"N1","pattern":"…きって","meaning":"…中最…／…中的第一","cat":"limit","formation":"范围名词 + きって","examples":[{"jp":"彼はクラスきっての成績を取った。","r":"かれはクラスきってのせいせきをとった。","zh":"他取得了全班第一的成绩。"},{"jp":"この町きっての料理店は、あの老舗だ。","r":"このまちきってのりょうりてんは、あのしにせだ。","zh":"这座城里数一数二的料理店，就是那家老店。"}]},{"id":"g505","level":"N1","pattern":"くらいなら","meaning":"与其…不如…","cat":"compare","formation":"动词连体形 + くらいなら","examples":[{"jp":"あいつに助けてもらうくらいなら、死んだほうがましだ。","r":"あいつにたすけてもらうくらいなら、しんだほうがましだ。","zh":"与其求那家伙帮忙，还不如死了痛快。"},{"jp":"途中でやめるくらいなら、最初からやらないほうがいい。","r":"とちゅうでやめるくらいなら、さいしょからやらないほうがいい。","zh":"与其半途而废，还不如一开始就不做。"}]},{"id":"g506","level":"N1","pattern":"…こそすれ…ない／…こそあれ…ない","meaning":"只…而决不…／即使…也绝不…","cat":"reverse","formation":"动词ます形 + こそすれ／名词 + でこそあれ","examples":[{"jp":"あなたのその言い方は、皮肉でこそあれ、決してユーモアとはならない。","r":"あなたのそのいいかたは、ひにくでこそあれ、けしてユーモアとはならない。","zh":"你那种说法只能算是讽刺，绝算不上幽默。"},{"jp":"彼は恩を忘れはこそすれ、仇で返すようなことはしない。","r":"かれはおんをわすれはこそすれ、あだでかえすようなことはしない。","zh":"他即使会忘记恩情，也绝不会以怨报德。"}]},{"id":"g507","level":"N1","pattern":"…ずじまい","meaning":"最终没能…／不了了之","cat":"negative","formation":"动词未然形 + ずじまい","examples":[{"jp":"出張で香港へ行ったが、忙しくて友達には会わずじまいだった。","r":"しゅっちょうでほんこんへいったが、いそがしくてともだちにはあわずじまいだった。","zh":"出差去了香港，但因为忙，结果连朋友都没见成。"},{"jp":"せっかく買った本も、結局最後まで読まずじまいだった。","r":"せっかくかったほんも、けっきょくさいごまでよまずじまいだった。","zh":"特意买的书，结果还是没读到最后一页。"}],"note":"带有后悔、遗憾的口气。"},{"id":"g508","level":"N1","pattern":"だけのことはある","meaning":"值得…／没有白…","cat":"state","formation":"动词连体形 + だけのことはある","examples":[{"jp":"うまい魚だ。取れたてを送ってもらっただけのことはある。","r":"うまいさかなだ。とれたてをおくってもらっただけのことはある。","zh":"这鱼真好吃，没白让人特意送来新鲜的。"},{"jp":"苦労しただけのことはあって、努力が報われた。","r":"くろうしただけのことはあって、どりょくがむくわれた。","zh":"辛苦没有白费，努力得到了回报。"}]},{"id":"g509","level":"N1","pattern":"〜なり〜なり","meaning":"…也好…也好／或是…或是…","cat":"conj","formation":"名词／动词连体形 + なり + 名词／动词连体形 + なり","examples":[{"jp":"彼の父親なり母親なりに相談しなければならないだろう。","r":"かれのちちおやなりははおやなりにそうだんしなければならないだろう。","zh":"必须和他的父亲或母亲商量一下吧。"},{"jp":"叱るなり褒めるなり、はっきり態度を示してほしい。","r":"しかるなりほめるなり、はっきりたいどをしめしてほしい。","zh":"批评也好表扬也好，希望明确表明态度。"}]},{"id":"g510","level":"N1","pattern":"…のなんのって／なんのなんの","meaning":"别提有多…／…得不得了","cat":"emote","formation":"动词简体／形容词 + のなんのって","examples":[{"jp":"驚いたのなんのって、すっかり変わっちゃってるんだ。","r":"おどろいたのなんのって、すっかりかわちゃってるんだ。","zh":"别提多惊讶了，简直完全变了个人。"},{"jp":"新しい仕事は忙しいのなんのって、休む暇もない。","r":"あたらしいしごとはいそがしいのなんのって、やすむひまもない。","zh":"新工作忙得不得了，连休息的空闲都没有。"}]},{"id":"g511","level":"N1","pattern":"…ふう／ふうだ／ふうをする","meaning":"…的样子／…似的","cat":"state","formation":"名词、形容词、动词简体（形容动词 + な） + ふう","examples":[{"jp":"あの男は何気ないふうを装って近づいてきた。","r":"あのおとこはなにげないふうをよそおってちかづいてきた。","zh":"那个男人装出若无其事的样子靠近过来。"},{"jp":"彼は知っているふうな顔をしている。","r":"かれはしっているふうなかおをしている。","zh":"他摆出一副好像知道的样子。"}]},{"id":"g512","level":"N1","pattern":"ほかない／ほかはない","meaning":"只好…／只得…","cat":"oblig","formation":"动词简体 + ほかない／ほかはない","examples":[{"jp":"もうあきらめるほかない。","r":"もうあきらめるほかない。","zh":"只能放弃了。"},{"jp":"彼が行かないなら、私が行くほかはない。","r":"かれがいかないなら、わたしがいくほかはない。","zh":"如果他不去，那就只好我去了。"}]},{"id":"g513","level":"N1","pattern":"…ほど（のこと）ではない","meaning":"没有达到…的地步／不至于…","cat":"compare","formation":"动词连体形 + ほどではない","examples":[{"jp":"医者に行くほどのけがではない。","r":"いしゃにいくほどのけがではない。","zh":"这伤还没到要去看医生的地步。"},{"jp":"怒るほどのことではないよ。","r":"おこるほどのことではないよ。","zh":"还没到值得生气的程度。"}]},{"id":"g514","level":"N1","pattern":"…まがい","meaning":"近乎…／近似…","cat":"guess","formation":"名词 + まがい（の）","examples":[{"jp":"機械まがいにスタッフを取り扱う。","r":"きかいまがいにスタッフをとりあつかう。","zh":"像对待机器一样对待员工。"},{"jp":"恐喝まがいの手段を取るのはやめるべきだ。","r":"きょうかつまがいのしゅだんをとるのはやめるべきだ。","zh":"应该停止近乎恐吓的手段。"}]},{"id":"g515","level":"N1","pattern":"…まくる","meaning":"一个劲儿地…／反复地…","cat":"state","formation":"动词ます形 + まくる","examples":[{"jp":"おいしくて食べまくっている。","r":"おいしくてたべまくっている。","zh":"因为好吃，所以一个劲儿地吃。"},{"jp":"二人はしゃべりまくって話が弾んだ。","r":"ふたりはしゃべりまくってはなしがはずんだ。","zh":"两人聊个不停，谈得热火朝天。"}]},{"id":"g516","level":"N1","pattern":"…もあろうに","meaning":"竟然…／偏偏就是…（意外语气）","cat":"emote","formation":"名词 + もあろうに","examples":[{"jp":"時もあろうに、試験中、トイレに行きたくなってしまった。","r":"ときもあろうに、しけんちゅう、トイレにいきたくなってしまった。","zh":"偏偏在考试的时候想上厕所。"},{"jp":"人が大勢いる所もあろうに、そこで大声で叫ぶなんて。","r":"ひとがおおぜいいるところもあろうに、そこでおおごえでさけぶなんて。","zh":"偏偏在人多的地方大声喊叫。"}]},{"id":"g517","level":"N1","pattern":"よりほかはない／よりほかない","meaning":"除…之外没有…／只好…","cat":"oblig","formation":"动词简体 + よりほかはない","examples":[{"jp":"彼までもう言うなら、僕も黙っているよりほかはない。","r":"かれまでもういうなら、ぼくもだまっているよりほかはない。","zh":"连他都这么说了，我也只好沉默。"},{"jp":"こうなった以上、謝るよりほかない。","r":"こうなったいじょう、あやまるよりほかない。","zh":"事已至此，只能道歉。"}]},{"id":"g518","level":"N1","pattern":"をピークにして／を境にして","meaning":"以…为顶峰／以…为转折","cat":"time","formation":"体言 + をピークに／を境に","examples":[{"jp":"選挙の勝利をピークに、彼の政治生涯は花盛りとなった。","r":"せんきょのしょうりをピークに、かれのせいじしょうがいははなざかりとなった。","zh":"以选举胜利为巅峰，他的政治生涯如日中天。"},{"jp":"この曲を境に、彼らの人気は急上昇した。","r":"このきょくをさかいに、かれらのにんきはきゅうじょうしょうした。","zh":"以这首歌为转折点，他们的人气急剧上升。"}]},{"id":"g519","level":"N1","pattern":"…たると…たるとを問わず","meaning":"无论是…还是…都","cat":"reverse","formation":"名词 + たると + 名词 + たるとを問わず","examples":[{"jp":"この法律は市民たると外国人たるとを問わず、等しく適用される。","r":"このほうりつはしみんたるとがいこくじんたるとをとわず、ひとしくてきようされる。","zh":"这部法律无论对市民还是外国人都一律适用。"},{"jp":"経験者たると初心者たるとを問わず、誰でも参加できます。","r":"けいけんしゃたるとしょしんしゃたるとをとわず、だれでもさんかできます。","zh":"无论老手还是新手，谁都可以参加。"}]},{"id":"g520","level":"N1","pattern":"た拍子に","meaning":"一…就…／…的瞬间","cat":"time","formation":"动词た形 + 拍子に","examples":[{"jp":"立ち上がった拍子に頭をぶつけた。","r":"たちあがったひょうしにあたまをぶつけた。","zh":"站起来的一瞬间撞了头。"},{"jp":"バランスを崩した拍子に、花瓶を倒してしまった。","r":"バランスをくずしたひょうしに、かびんをたおしてしまった。","zh":"失去平衡的一瞬间，把花瓶碰倒了。"}]},{"id":"g521","level":"N1","pattern":"…てしょうがない","meaning":"…得不得了","cat":"emote","formation":"形容词く形／动词て形 + しょうがない","examples":[{"jp":"赤ちゃんが朝から泣いてしょうがない。","r":"あかちゃんがあさからないてしょうがない。","zh":"婴儿从早上就哭个不停。"},{"jp":"試験の結果が気になってしょうがない。","r":"しけんのけっかがきになってしょうがない。","zh":"特别在意考试结果，静不下心来。"}]},{"id":"g522","level":"N1","pattern":"…て（は）たまらない","meaning":"…得不得了／非常…","cat":"emote","formation":"形容词く形／动词て形／形容动词 + てたまらない","examples":[{"jp":"彼女に会いたくてたまらない。","r":"かのじょにあいたくてたまらない。","zh":"非常想见她。"},{"jp":"初めての海外旅行が中止になって、残念でたまらない。","r":"はじめてのかいがいりょこうがちゅうしになって、ざんねんでたまらない。","zh":"第一次出国旅行被取消了，遗憾得不得了。"}]},{"id":"g523","level":"N1","pattern":"…て（は）いられない／で（は）いられない","meaning":"不能继续…／不能维持现有状态","cat":"negative","formation":"动词て形 + いられない","examples":[{"jp":"この事態を傍観してはいられない。","r":"このじたいをぼうかんしてはいられない。","zh":"不能再对这种事态袖手旁观了。"},{"jp":"ずっと大学にいたいが、いつまでもそうしてはいられない。","r":"ずっとだいがくにいたいが、いつまでもそうしてはいられない。","zh":"虽然想一直待在学校，但不能永远这样下去。"},{"jp":"アルバイトを終えて帰ってきたが、のんびりしてはいられない。明日提出するレポートを完成させなければならない。","r":"アルバイトをおえてかえってきたが、のんびりしてはいられない。あしたていしゅつするレポートをかんせいさせなければならない。","zh":"打完零工回到家，可不能悠闲。必须完成明天要交的报告。","src":"2022年7月真题"}],"srcs":["2022年7月真题"]},{"id":"g524","level":"N1","pattern":"…てでも","meaning":"即便…也…","cat":"reverse","formation":"动词て形 + でも","examples":[{"jp":"仕事をやめてでも、親の介護をしなければならない。","r":"しごとをやめてでも、おやのかいごをしなければならない。","zh":"即便辞掉工作，也必须照顾父母。"},{"jp":"借金をしてでも、子供に教育を受けさせたい。","r":"しゃっきんをしてでも、こどもにきょういくをうけさせたい。","zh":"即便借钱，也想让孩子接受教育。"}],"note":"前后主语一致。"},{"id":"g525","level":"N1","pattern":"…てまで","meaning":"甚至…／不惜…","cat":"limit","formation":"动词て形 + まで","examples":[{"jp":"借金をしてまで、車を買う必要があるもんか。","r":"しゃっきんをしてまで、くるまをかうひつようがあるもんか。","zh":"没有必要借钱去买车吧。"},{"jp":"体を壊してまで、仕事を続けるべきではない。","r":"からだをこわしてまで、しごとをつづけるべきではない。","zh":"不该不惜弄坏身体也要继续工作。"}]},{"id":"g526","level":"N1","pattern":"…ても始まらない","meaning":"…也无济于事","cat":"negative","formation":"动词て形 + も始まらない","examples":[{"jp":"こういうところに至っては、どう悔やんでも始まらない。","r":"こういうところにいたっては、どうくやんでもはじまらない。","zh":"事已至此，再怎么后悔也无济于事。"},{"jp":"今さら泣いても始まらない。次に進もう。","r":"いまさらないてもはじまらない。つぎにすすもう。","zh":"事到如今哭也没用，向前看吧。"}]},{"id":"g527","level":"N1","pattern":"…ところだった","meaning":"几乎…／差点就…","cat":"guess","formation":"动词原形 + ところだった","examples":[{"jp":"もう少しで原稿の締め切りに間に合わなくなるところだった。","r":"もうすこしでげんこうのしめきりにまにあわなくなるところだった。","zh":"差点没赶上截稿日期。"},{"jp":"もう少しで階段から落ちるところだった。","r":"もうすこしでかいだんからおちるところだった。","zh":"差一点就从楼梯上摔下去。"}]},{"id":"g528","level":"N1","pattern":"…としたら、…とすると、…とすれば","meaning":"如果…（纯属假设）","cat":"cond","formation":"名词／简体句 + としたら／とすると／とすれば","examples":[{"jp":"ここに二百万あるとしたら、どう使いますか。","r":"ここににひゃくまんあるとしたら、どうつかいますか。","zh":"假如这里有二百万，你会怎么用呢？"},{"jp":"その話が本当だとしたら、大変なことだ。","r":"そのはなしがほんとうだとしたら、たいへんなことだ。","zh":"如果那件事是真的，那就麻烦了。"}]},{"id":"g529","level":"N1","pattern":"…とやら","meaning":"叫做…的（指不确定的传闻内容）","cat":"quote","formation":"名词／动词简体 + とやら","examples":[{"jp":"模擬試験とやらをやるそうだ。","r":"もぎしけんとやらをやるそうだ。","zh":"听说要进行什么模拟考试。"},{"jp":"委員長とやらがやってきた。","r":"いいんちょうとやらがやってきた。","zh":"来了个什么委员长。"}]},{"id":"g530","level":"N1","pattern":"…ならいざ知らず、…ならともかく","meaning":"如果是…的话就另当别论","cat":"cond","formation":"名词（+の） + ならいざ知らず","examples":[{"jp":"新入社員ならいざ知らず、入社8年にもなる君がこんなミスをするとは信じられない。","r":"しんにゅうしゃいんならいざしらず、にゅうしゃはちねんにもなるきみがこんなミスをするとはしんじられない。","zh":"若是新员工还情有可原，入社8年的你竟犯这种错误，实在难以置信。"},{"jp":"子供ならいざ知らず、大人がそんなことをしてはいけない。","r":"こどもならいざしらず、おとながそんなことをしてはいけない。","zh":"孩子的话还另当别论，大人不能做那种事。"}]},{"id":"g531","level":"N1","pattern":"…たかいもなく","meaning":"虽做了努力，却没…／白费…","cat":"negative","formation":"动词た形 + かいもなく","examples":[{"jp":"無理して早起きしたかいもなく、始発の電車に間に合わなかった。","r":"むりしてはやおきしたかいもなく、しはつのでんしゃにまにあわなかった。","zh":"勉强起了个大早，结果还是没能赶上头班车。"},{"jp":"一生懸命練習したかいもなく、試合には負けてしまった。","r":"いっしょうけんめいれんしゅうしたかいもなく、しあいにはまけてしまった。","zh":"拼命练习却付诸东流，比赛还是输了。"}]},{"id":"g532","level":"N1","pattern":"～そのもの","meaning":"…本身就是…／…本身（加强语气，名词后接表示该名词所代表的性质、状态的最典型表现）","cat":"limit","formation":"名词 + そのもの","examples":[{"jp":"合唱コンクールで歌っている子供たちの表情は、真剣そのものだった。","r":"がっしょうコンクールでうたっているこどもたちのひょうじょうは、しんけんそのものだった。","zh":"在合唱比赛中唱歌的孩子们的表情，本身就如认真二字（认真极了）。","src":"2023年7月真题"},{"jp":"彼の態度は、無関心そのものだった。","r":"かれのたいどは、むかんしんそのものだった。","zh":"他的态度本身就是漠不关心。"}],"srcs":["2023年7月真题"],"note":"多用于「真剣そのもの」「無関心そのもの」等，表示前接名词所代表的性质达到极致。"},{"id":"g533","level":"N1","pattern":"～たはいいが","meaning":"…倒是…（，可是却）／做了…，结果反而…","cat":"reverse","formation":"动词た形 + はいいが","examples":[{"jp":"せっかく新しく買うのならと高性能のパソコンを買ったはいいが、全く使いこなせていない。","r":"せっかくあたらしくかうのならとこうせいのうのパソコンをかったはいいが、まったくつかいこなせていない。","zh":"想着既然要买就买好的，于是买了高性能电脑，可买了却完全用不上。"},{"jp":"早めに家を出たはいいが、道に迷って遅刻してしまった。","r":"はやめにいえをでたはいいが、みちにまよってちこくしてしまった。","zh":"早早出了门倒是好，结果迷了路反而迟到了。","src":"2023年12月真题"}],"srcs":["2023年12月真题"],"note":"表示虽然做了前项，但结果不理想、白费工夫。"},{"id":"g534","level":"N1","pattern":"～（よ）うとしている","meaning":"正要…／即将…（表示动作、变化即将发生的状态）","cat":"change","formation":"动词意志形 + としている","examples":[{"jp":"今日から12月だ。早いもので、今年ももうすぐ終わろうとしている。","r":"きょうからじゅうにがつだ。はやいもので、ことしももうすぐおわろうとしている。","zh":"今天进入12月了。时间过得真快，今年也即将结束了。","src":"2023年12月真题"},{"jp":"夕日が海に沈もうとしている。","r":"ゆうひがうみにしずもうとしている。","zh":"夕阳正沉入大海。"}],"srcs":["2023年12月真题"]},{"id":"g535","level":"N1","pattern":"～なくもない","meaning":"也不是不…／并非不…（委婉的肯定）","cat":"negative","formation":"动词ない形 + なくもない","examples":[{"jp":"いつも駅から大学までバスを使っているが、2キロほどなので、歩こうとして歩けなくもない。","r":"いつもえきからだいがくまでバスをつかっているが、にキロほどなので、あるこうとしてあるけなくもない。","zh":"平时总是从车站坐公交去大学，但也就两公里左右，想走也不是不能走。","src":"2023年7月真题"},{"jp":"彼の意見に、理解できなくもない。","r":"かれのいけんに、りかいできなくもない。","zh":"对他的意见，也不是不能理解。"}],"srcs":["2023年7月真题"]},{"id":"g536","level":"N1","pattern":"～にもほどがある","meaning":"…也要有个限度／…太过分了","cat":"emote","formation":"名词 + にもほどがある","examples":[{"jp":"家族から「猫好きにもほどがあるだろう」って言われたりする。","r":"かぞくから「ねこずきにもほどがあるだろう」っていわれたりする。","zh":"有时会被家人说“你爱猫也要有个限度吧”。","src":"2023年12月真题"},{"jp":"冗談にもほどがある。","r":"じょうだんにもほどがある。","zh":"开玩笑也要有个度。"}],"srcs":["2023年12月真题"],"note":"表示某事、某行为超出了合理限度，带责备语气。"},{"id":"g537","level":"N1","pattern":"～からしか～ない","meaning":"只有从…才能…／非从…不可","cat":"limit","formation":"体言 + からしか + 否定形","examples":[{"jp":"失敗は誰でも避けたいのだが、失敗からしか学べないこともある。","r":"しっぱいはだれでもさけたいのだが、しっぱいからしかまなべないこともある。","zh":"谁都希望避免失败，但有些东西只有从失败中才能学到。","src":"2023年7月真题"},{"jp":"この事実は、当事者からしか知り得ない。","r":"このじじつは、とうじしゃからしかしりえない。","zh":"这个事实，只有当事人才能得知。"}],"srcs":["2023年7月真题"],"note":"表示只能通过唯一的途径获得。"},{"id":"g538","level":"N2","pattern":"～んだもん","meaning":"因为…嘛／…嘛（以任性的理由反驳，多用于小孩或口语）","cat":"reason","formation":"动词/形容词简体 + んだもん","examples":[{"jp":"図書館っていいね。だって、自分で買わなくてもこんなにたくさんの本が読めるんだもん。","r":"としょかんっていいね。だって、じぶんでかわなくてもこんなにたくさんのほんがよめるんだもん。","zh":"图书馆真好呀。因为呀，不用自己买也能读到这么多书嘛。","src":"2023年7月真题"},{"jp":"宿題を忘れたんだもん。ゲームが楽しすぎたんだもん。","r":"しゅくだいをわすれたんだもん。ゲームがたのしすぎたんだもん。","zh":"我忘了作业嘛。因为游戏太好玩了嘛。"}],"srcs":["2023年7月真题"]},{"id":"g539","level":"N1","pattern":"～といたしましては","meaning":"作为…来说／从…的立场来说（郑重的敬语表达）","cat":"view","formation":"名词 + といたしましては","examples":[{"jp":"私個人といたしましては、その必要性を感じておりますが、市民の皆さんは納得しにくいのではないかと思います。","r":"わたしこじんといたしましては、そのひつようせいをかんじておりますが、しみんのみなさんはなっとくしにくいのではないかとおもいます。","zh":"就我个人而言，我感到有必要，但市民们恐怕很难接受吧。","src":"2023年12月真题"},{"jp":"当社といたしましては、今回の決定を受け入れざるを得ません。","r":"とうしゃといたしましては、こんかいのけっていをうけいれざるをえません。","zh":"就本公司而言，不得不接受这次的决定。"}],"srcs":["2023年12月真题"]},{"id":"g540","level":"N2","pattern":"～もんか","meaning":"怎么会…呢／绝不可能…（强烈否定反问，口语）","cat":"emote","formation":"动词基本形 + もんか","examples":[{"jp":"あんなひどい店に、二度と行くもんか。","r":"あんなひどいみせに、にどといくもんか。","zh":"那么差劲的店，我怎么可能再去第二次。"},{"jp":"そんなに簡単に諦めるもんか。","r":"そんなにかんたんにあきらめるもんか。","zh":"我怎么可能那么轻易就放弃。"}],"srcs":["2023年12月真题"]},{"id":"g541","level":"N1","pattern":"～得る（うる／える）","meaning":"能够…／有可能…（书面语）","cat":"potential","formation":"动词ます形（去ます） + 得る","examples":[{"jp":"この事故は、誰にでも起こり得ることだ。","r":"このじこは、だれにでもおこりうることだ。","zh":"这种事故，谁都有可能遭遇。"},{"jp":"今後の状況によっては、計画は変更し得る。","r":"こんごのじょうきょうによっては、けいかくはへんこうしうる。","zh":"视今后的情况，计划也有可能变更。"}],"srcs":["2023年12月真题"]},{"id":"g542","level":"N2","pattern":"～もんじゃない","meaning":"何止是…／岂止是…（程度远超一般认识）","cat":"emote","formation":"名词/形容动词 + なんてもんじゃない","examples":[{"jp":"あの遊園地は広いなんてもんじゃないよ。1日じゃ全部回れなかったよ。","r":"あのゆうえんちはひろいなんてもんじゃないよ。いちにちじゃぜんぶまわれなかったよ。","zh":"那个游乐园岂止是宽敞啊，一天根本转不完。","src":"2022年12月真题"},{"jp":"疲れたなんてもんじゃない。もう動けないよ。","r":"つかれたなんてもんじゃない。もううごけないよ。","zh":"岂止是累，简直动不了了。"}],"srcs":["2022年12月真题"],"note":"口语，强调程度之高，相当于「～というものではない」。"},{"id":"g543","level":"N3","pattern":"～たがる","meaning":"（第三人称）想…，总想…","cat":"desire","formation":"动词ます形（去ます） + たがる","examples":[{"jp":"小さい頃は、よく父のバイクの後ろに乗りたがったものだ。","r":"ちいさいころは、よくちちのバイクのうしろにのりたがったものだ。","zh":"小时候总想坐父亲的摩托车后座。","src":"2022年12月真题"},{"jp":"子供たちは、ゲームをしたがってやまない。","r":"こどもたちは、ゲームをしたがってやまない。","zh":"孩子们总想玩游戏。"}],"srcs":["2022年12月真题"],"note":"表示第三人称的愿望，多用「～たがっている」。"},{"id":"g544","level":"N1","pattern":"～につけ","meaning":"每当…就…／一…就（不由地）…","cat":"time","formation":"动词基本形 + につけ","examples":[{"jp":"ふるさとの美しい海を見るにつけ、この美しい海がいつまでもこのままあってほしいと思 c":"2022年12月真题"},{"word":"底力","r":"そこぢから","g":"潜在实力，潜藏的力量","p":"名词","level":"N1","src":"2022年12月真题"},{"word":"絶大","r":"ぜつだい","g":"极大，巨大（权力等）","p":"形容动词","level":"N1","src":"2022年12月真题"},{"word":"手痛い","r":"ていたい","g":"痛切的，沉重的（打击）","p":"い形容词","level":"N1","src":"2022年12月真题"},{"word":"誘致","r":"ゆうち","g":"招揽，引进（企业等）","p":"名词/サ变","level":"N1","src":"2022年12月真题"},{"word":"勇敢","r":"ゆうかん","g":"勇敢","p":"形容动词","level":"N1","src":"2022年7月真题"},{"word":"忠告","r":"ちゅうこく","g":"忠告，劝告","p":"名词/サ变","level":"N1","src":"2022年7月真题"},{"word":"慕う","r":"したう","g":"仰慕，爱慕，追随","p":"动词","level":"N1","src":"2022年7月真题"},{"word":"施錠","r":"せじょう","g":"上锁，锁闭","p":"名词/サ变","level":"N1","src":"2022年7月真题"},{"word":"食い止める","r":"くいとめる","g":"阻止，遏制","p":"动词","level":"N1","src":"2022年7月真题"},{"word":"阻む","r":"はばむ","g":"阻挡，阻碍","p":"动词","level":"N1","src":"2022年7月真题"},{"word":"軽快","r":"けいかい","g":"轻快，轻捷","p":"形容动词","level":"N1","src":"2022年7月真题"},{"word":"サイクル","r":"サイクル","g":"周期，循环","p":"名词","level":"N1","src":"2022年7月真题"},{"word":"仲裁","r":"ちゅうさい","g":"仲裁，调解","p":"名词/サ变","level":"N1","src":"2022年7月真题"},{"word":"しわざ","r":"しわざ","g":"（坏事）所为，勾当","p":"名词","level":"N1","src":"2022年7月真题"},{"word":"発覚","r":"はっかく","g":"暴露，败露","p":"名词/サ变","level":"N1","src":"2022年7月真题"},{"word":"すべすべ","r":"すべすべ","g":"光滑，滑嫩","p":"副词/サ变","level":"N1","src":"2022年7月真题"},{"word":"かみ合う","r":"かみあう","g":"（齿轮）咬合；吻合，协调","p":"动词","level":"N1","src":"2022年7月真题"},{"word":"触発","r":"しょくはつ","g":"触发，激发","p":"名词/サ变","level":"N1","src":"2022年7月真题"},{"word":"閉口","r":"へいこう","g":"吃不消，无话可说","p":"名词/サ变","level":"N1","src":"2022年7月真题"},{"word":"気まま","r":"きまま","g":"任性，随心所欲","p":"形容动词","level":"N1","src":"2022年7月真题"},{"word":"若干","r":"じゃっかん","g":"若干，一些","p":"名词/副词","level":"N1","src":"2022年7月真题"},{"word":"手分け","r":"てわけ","g":"分工","p":"名词/サ变","level":"N1","src":"2022年7月真题"},{"word":"てきぱき","r":"てきぱき","g":"麻利地，干脆地","p":"副词/サ变","level":"N1","src":"2022年7月真题"},{"word":"結末","r":"けつまつ","g":"结局，结尾","p":"名词","level":"N1","src":"2022年7月真题"},{"word":"そそる","r":"そそる","g":"勾起，引起（兴趣/食欲）","p":"动词","level":"N1","src":"2022年7月真题"},{"word":"遮断","r":"しゃだん","g":"遮断，隔绝","p":"名词/サ变","level":"N1","src":"2022年7月真题"},{"word":"要請","r":"ようせい","g":"请求，要求","p":"名词/サ变","level":"N1","src":"2022年7月真题"},{"word":"ぎこちない","r":"ぎこちない","g":"生硬的，不自然的","p":"い形容词","level":"N1","src":"2022年7月真题"},{"word":"断じて","r":"だんじて","g":"决（不），绝对（不）","p":"副词","level":"N1","src":"2022年7月真题"}]}</script>
<script>
(function () {
  'use strict';
  const DATA = JSON.parse(document.getElementById('app-data').textContent);
  const articles = DATA.articles || [];
  const grammar  = DATA.grammar  || [];
  const vocabAll = DATA.vocab    || [];

  // ===== Storage =====
  const K = {
    vocab:  'jpread.vocab.v1',
    stats:  'jpread.stats.v1',
    done:   'jpread.done.v1',
    theme:  'jpread.theme.v1',
    size:   'jpread.size.v1',
    furi:   'jpread.furi.v1',
    view:   'jpread.view.v1',
    flv:    'jpread.flv.v1',
    fcat:   'jpread.fcat.v1',
    gcat:   'jpread.gcat.v1'
  };
  let vocab = JSON.parse(localStorage.getItem(K.vocab) || '{}');
  let stats = JSON.parse(localStorage.getItem(K.stats) || '{"read":0,"words":0}');
  let done  = JSON.parse(localStorage.getItem(K.done)  || '{}');
  let fontSize = Number(localStorage.getItem(K.size) || 19);
  let showFuri = localStorage.getItem(K.furi) !== '0';
  let currentView = localStorage.getItem(K.view) || 'read';
  let filterLv  = localStorage.getItem(K.flv)  || 'all';
  let filterCat = localStorage.getItem(K.fcat) || 'all';
  let filterGcat = localStorage.getItem(K.gcat) || 'all';

  const CAT_LABEL = { life:'生活', culture:'文化', society:'社会', work:'仕事', study:'学習', nature:'自然', mind:'心理', tech:'技術', literature:'文学' };

  // ===== Helpers =====
  function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function kanjiIn(s){ return /[㐀-鿿]/.test(s); }
  function diffOf(level){ return {N5:1,N4:2,N3:3,N2:4,N1:5}[level] || 3; }
  function starStr(level){ const d=diffOf(level); let s=''; for(let i=1;i<=5;i++) s+= i<=d?'★':'<span class="empty">★</span>'; return '<span class="diff-stars">'+s+'</span>'; }
  function speak(text){
    if(!('speechSynthesis' in window)) return;
    try { const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; u.rate=0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){}
  }
  function save(){ localStorage.setItem(K.vocab, JSON.stringify(vocab)); localStorage.setItem(K.stats, JSON.stringify(stats)); localStorage.setItem(K.done, JSON.stringify(done)); }
  function vocabKey(w){ return (w.word||w.t)+'｜'+(w.r||w.reading||''); }

  // ===== Render article list =====
  const listEl = document.getElementById('article-list');
  const countEl = document.getElementById('visible-count');
  function renderArticles(){
    const f = articles.filter(a =>
      (filterLv==='all' || a.level===filterLv) &&
      (filterCat==='all' || a.cat===filterCat)
    );
    countEl.textContent = f.length;
    if(!f.length){ listEl.innerHTML = '<div class="empty">没有符合条件的篇章。</div>'; return; }
    listEl.innerHTML = f.map(a => `
      <div class="article-card" data-id="${a.id}">
        <div class="meta">
          <span class="lv-badge ${a.level}">${a.level}</span>
          <span class="cat">${CAT_LABEL[a.cat]||a.cat}</span>
          ${a.src?`<span class="src">${escapeHtml(a.src)}</span>`:''}
          <span>·</span><span>${starStr(a.level)}</span>
          <span>·</span><span>${a.words||''} 字 · 约 ${a.read||2} 分钟</span>
        </div>
        <h3>${rubyTitle(a.title, a.titleR)}</h3>
        <div class="dek">${escapeHtml(a.dek||'')}</div>
        <div class="stats">
          <span>${a.words||0} 字</span><span>·</span><span>约 ${a.read||2} 分钟</span>
          ${done[a.id]?'<span>·</span><span class="done">✓ 已读</span>':''}
        </div>
      </div>`).join('');
    listEl.querySelectorAll('.article-card').forEach(el=>{
      el.addEventListener('click', ()=> openArticle(el.dataset.id));
    });
  }
  function rubyTitle(t, r){
    if(!r || !kanjiIn(t)) return escapeHtml(t);
    return '<ruby>'+escapeHtml(t)+'<rt>'+escapeHtml(r)+'</rt></ruby>';
  }

  // ===== Reader =====
  const readerEl = document.getElementById('reader');
  const viewRead = document.getElementById('view-read');
  function renderToken(tok){
    const t = tok.t;
    const r = tok.r, g = tok.g, p = tok.p;
    if(!g && !r) return escapeHtml(t);
    const dataAttrs = `data-r="${escapeHtml(r||'')}" data-g="${escapeHtml(g||'')}" data-p="${escapeHtml(p||'')}"`;
    let inner;
    if(r && kanjiIn(t)) inner = '<ruby>'+escapeHtml(t)+'<rt>'+escapeHtml(r)+'</rt></ruby>';
    else inner = escapeHtml(t);
    return `<span class="w" ${dataAttrs}>${inner}</span>`;
  }
  // ===== Article grammar detection =====
  // Build matchable Japanese substrings from a pattern like "～てしまいます".
  function grammarMatchForms(p){
    const s = (p||'')
      .replace(/～/g,'')
      .replace(/名[0-9]?（[^）]*）/g,'')   // 名1（人）、名（时间）…
      .replace(/[（()）]/g,'')
      .replace(/名词|动词|形容词|一类|二类|简体形|敬体形|基本形|ない形|た形|ます形|意志形|命令形|场所|时间|数量|疑问|小句|对象|目的/g,'');
    return s.split(/[／/和、，。・…]/).map(x=>x.trim()).filter(x=>x.length>=4);
  }
  function articleGrammar(a){
    const raw = (a.body||[]).flat().map(t=>t.t||'').join('');
    const skip = new Set(['ました','です','ません','います','あります','ですか','でした','ましょう','ます','には','では']);
    const seen = new Set(); const hits = [];
    for (const g of grammar){
      // curated keys (初级) are reliable; derived substrings (中高级) can be noisy
      const curated = !!(g.keys && g.keys.length);
      const ks = curated ? g.keys : grammarMatchForms(g.pattern);
      let best = '';
      for (const f of ks){
        if (f.length < 3) continue;
        if (!curated && skip.has(f)) continue;
        if (raw.includes(f) && f.length > best.length) best = f;
      }
      if (best && !seen.has(g.id)){ seen.add(g.id); hits.push({g, f:best}); }
    }
    hits.sort((x,y)=> y.f.length - x.f.length);
    return hits.slice(0,10);
  }
  function gotoGrammar(pattern){
    setLevel('all');
    setGcat('all');
    document.getElementById('grammar-search').value = pattern;
    switchView('grammar');
    renderGrammar();
    grammarListEl.querySelectorAll('.grammar-card').forEach(c=>{
      const p = c.querySelector('.pattern');
      if (p && p.textContent === pattern) c.scrollIntoView({behavior:'smooth', block:'center'});
    });
  }

  function openArticle(id){
    const a = articles.find(x=>x.id===id);
    if(!a) return;
    document.getElementById('r-lv').textContent = a.level;
    document.getElementById('r-lv').className = 'lv-badge '+a.level;
    document.getElementById('r-cat').textContent = CAT_LABEL[a.cat]||a.cat;
    document.getElementById('r-meta').innerHTML = `${starStr(a.level)} · ${a.words||0} 字 · 约 ${a.read||2} 分钟${a.src?` · ${escapeHtml(a.src)}`:''}`;
    document.getElementById('r-title').innerHTML = rubyTitle(a.title, a.titleR);
    document.getElementById('r-dek').textContent = a.dek||'';
    const body = (a.body||[]).map(p => '<p>'+ (Array.isArray(p)? p.map(renderToken).join('') : escapeHtml(p)) +'</p>').join('');
    document.getElementById('r-body').innerHTML = body;
    const isDone = !!done[a.id];
    document.getElementById('r-post').innerHTML = `
      <span>${a.words||0} 字</span><span>·</span><span>约 ${a.read||2} 分钟</span><span>·</span>
      <span class="mark ${isDone?'done':''}" id="mark-read">${isDone?'✓ 已读':'标记为已读'}</span>`;
    viewRead.style.display = 'none';
    readerEl.classList.add('on');
    window.scrollTo({top:0, behavior:'smooth'});
    const m = document.getElementById('mark-read');
    m.addEventListener('click', ()=>{
      if(done[a.id]) return;
      done[a.id] = 1; stats.read = Object.keys(done).length; save();
      updateStats(); renderArticles();
      m.textContent='✓ 已读'; m.classList.add('done');
    });
    // article grammar panel: 重点练习 (gk) first, then auto-detected
    const gtags = document.getElementById('r-gtags');
    const gkTags = (a.gk||[]).map(p => {
      // exact match, or combined "X/Y" pattern that starts/contains the gk
      let g = grammar.find(x => x.pattern === p);
      if (!g) g = grammar.find(x => x.pattern.startsWith(p));
      if (!g) g = grammar.find(x => p.startsWith(x.pattern) && x.pattern.length >= 3);
      return g;
    }).filter(Boolean)
      .map(g => `<span class="g-tag key" data-p="${escapeHtml(g.pattern)}"><span class="lv ${g.level}">★${g.level}</span>${escapeHtml(g.pattern)}</span>`)
      .join('');
    const hits = articleGrammar(a);
    let ghtml = gkTags;
    if (hits.length){
      ghtml += hits.map(h=>
        `<span class="g-tag" data-p="${escapeHtml(h.g.pattern)}"><span class="lv ${h.g.level}">${h.g.level}</span>${escapeHtml(h.g.pattern)}</span>`
      ).join('');
    }
    if(!ghtml){
      gtags.innerHTML = '<span class="g-empty">未检测到明显语法点，可到「文法」页按级别浏览。</span>';
    } else {
      gtags.innerHTML = ghtml;
      gtags.querySelectorAll('.g-tag').forEach(t=> t.addEventListener('click', ()=> gotoGrammar(t.dataset.p)));
    }
    readerEl.querySelectorAll('.w').forEach(span=>{
      span.addEventListener('click', e=>{ e.stopPropagation(); showTooltip(span); });
      if(vocab[vocabKey({word:span.textContent, r:span.dataset.r})]) span.classList.add('saved');
    });
  }
  document.getElementById('back-btn').addEventListener('click', ()=>{
    readerEl.classList.remove('on');
    viewRead.style.display = '';
    hideTooltip();
    window.scrollTo({top:0, behavior:'smooth'});
  });

  // ===== Tooltip =====
  const tip = document.getElementById('tooltip');
  let tipSaved = null;
  function showTooltip(span){
    const surface = span.textContent;
    const r = span.dataset.r, g = span.dataset.g, p = span.dataset.p;
    const key = vocabKey({word:surface, r});
    const saved = !!vocab[key];
    const headInner = kanjiIn(surface) && r ? `<ruby>${escapeHtml(surface)}<rt>${escapeHtml(r)}</rt></ruby>` : escapeHtml(surface);
    let html = `<div class="head"><span>${headInner}</span><span class="spk" title="朗读">🔊</span></div>`;
    if(r && !kanjiIn(surface)) html += `<div class="r-line">${escapeHtml(r)}</div>`;
    if(p) html += `<span class="pos">${escapeHtml(p)}</span>`;
    html += `<div class="g">${g?escapeHtml(g):'<span style="color:var(--ink-faint);font-style:italic;">未收录释义（仍可收藏）</span>'}</div>`;
    html += `<div class="actions">
      <button class="act" id="tip-close">关闭</button>
      <button class="act primary" id="tip-save">${saved?'✓ 已收藏':'+ 收藏'}</button>
    </div>`;
    tip.innerHTML = html;
    tip.style.display = 'block';
    tipSaved = {key, surface, r, g, p};
    // position
    const rect = span.getBoundingClientRect();
    const tw = Math.min(280, window.innerWidth-20);
    let left = rect.left + rect.width/2 - tw/2;
    left = Math.max(10, Math.min(window.innerWidth - tw - 10, left));
    let top = rect.bottom + 8;
    tip.style.left = left+'px'; tip.style.top = top+'px'; tip.style.maxWidth = tw+'px';
    // flip if overflow
    requestAnimationFrame(()=>{ if(tip.getBoundingClientRect().bottom > window.innerHeight-10){ tip.style.top = Math.max(10, rect.top - tip.getBoundingClientRect().height - 8)+'px'; } });
    document.getElementById('tip-close').addEventListener('click', hideTooltip);
    document.getElementById('tip-save').addEventListener('click', ()=>{ toggleSave(tipSaved); showTooltip(span); });
    tip.querySelector('.spk').addEventListener('click', ()=> speak(surface));
  }
  function hideTooltip(){ tip.style.display='none'; tipSaved=null; }
  document.addEventListener('click', e=>{ if(tip.style.display==='block' && !tip.contains(e.target) && !e.target.classList.contains('w')) hideTooltip(); });
  document.addEventListener('scroll', hideTooltip, {passive:true});

  // ===== Save / vocab =====
  function toggleSave(info){
    if(!info) return;
    if(vocab[info.key]){ delete vocab[info.key]; }
    else { vocab[info.key] = { word:info.surface, r:info.r, g:info.g, p:info.p, ts: Date.now() }; }
    stats.words = Object.keys(vocab).length;
    save(); updateStats(); renderSaved();
    // refresh saved styling in reader
    readerEl.querySelectorAll('.w').forEach(sp=>{
      const k = vocabKey({word:sp.textContent, r:sp.dataset.r});
      sp.classList.toggle('saved', !!vocab[k]);
    });
  }
  const savedListEl = document.getElementById('saved-list');
  function renderSaved(){
    const keys = Object.keys(vocab);
    if(!keys.length){ savedListEl.innerHTML = '<li class="vocab-empty">阅读时点击单词即可收藏到这里。</li>'; return; }
    keys.sort((a,b)=> (vocab[b].ts||0)-(vocab[a].ts||0));
    savedListEl.innerHTML = keys.map(k=>{
      const v = vocab[k];
      const head = kanjiIn(v.word) && v.r ? `<ruby>${escapeHtml(v.word)}<rt>${escapeHtml(v.r)}</rt></ruby>` : escapeHtml(v.word);
      return `<li>
        <div class="row1">
          <span class="vw" data-w="${escapeHtml(v.word)}" data-r="${escapeHtml(v.r||'')}">${head}</span>
          <button class="rm" data-k="${escapeHtml(k)}" title="删除">×</button>
        </div>
        ${v.r && !kanjiIn(v.word) ? `<span class="v-r">${escapeHtml(v.r)}</span>`:''}
        <span class="vg">${escapeHtml(v.g||'')}</span>
        <div class="v-act">
          <button data-spk="${escapeHtml(v.word)}">🔊 朗读</button>
        </div>
      </li>`;
    }).join('');
    savedListEl.querySelectorAll('.rm').forEach(b=> b.addEventListener('click', ()=>{
      delete vocab[b.dataset.k]; stats.words=Object.keys(vocab).length; save(); updateStats(); renderSaved();
      readerEl.querySelectorAll('.w').forEach(sp=>{ const kk=vocabKey({word:sp.textContent,r:sp.dataset.r}); sp.classList.toggle('saved', !!vocab[kk]); });
    }));
    savedListEl.querySelectorAll('[data-spk]').forEach(b=> b.addEventListener('click', ()=> speak(b.dataset.spk)));
    savedListEl.querySelectorAll('.vw').forEach(w=> w.addEventListener('click', ()=> speak(w.dataset.w)));
  }
  function updateStats(){
    document.getElementById('stat-read').textContent = Object.keys(done).length;
    document.getElementById('stat-saved').textContent = Object.keys(vocab).length;
  }
  document.getElementById('clear-vocab').addEventListener('click', ()=>{
    if(!Object.keys(vocab).length) return;
    if(confirm('确定清空生词本吗？')){ vocab={}; stats.words=0; save(); updateStats(); renderSaved();
      readerEl.querySelectorAll('.w').forEach(sp=> sp.classList.remove('saved')); }
  });

  // ===== Grammar =====
  const grammarListEl = document.getElementById('grammar-list');
  const grammarCountEl = document.getElementById('grammar-count');
  let grammarAllOpen = false;   // collapse-all toggle state
  function renderGrammar(){
    const q = (document.getElementById('grammar-search').value||'').trim().toLowerCase();
    const f = grammar.filter(g =>
      (filterLv==='all' || g.level===filterLv) &&
      (filterGcat==='all' || (g.cat||'')===filterGcat) &&
      (!q || (g.pattern||'').toLowerCase().includes(q) || (g.meaning||'').toLowerCase().includes(q) || (g.note||'').toLowerCase().includes(q))
    );
    grammarCountEl.textContent = f.length;
    const foldBtn = document.getElementById('grammar-fold');
    if(foldBtn){ foldBtn.textContent = grammarAllOpen ? '全部收起' : '全部展开'; }
    if(!f.length){ grammarListEl.innerHTML = '<div class="empty">没有符合条件的文法。</div>'; return; }
    // when filtering by search we open the matching cards automatically
    const open = grammarAllOpen || !!q;
    grammarListEl.innerHTML = f.map(g=>{
      const exs = (g.examples||[]).map(ex=>`
        <div class="ex">
          <div class="ex-jp"><span>${escapeHtml(ex.jp)}</span><span class="spk" data-spk="${escapeHtml(ex.jp)}">🔊</span></div>
          ${ex.r?`<div class="ex-r">${escapeHtml(ex.r)}</div>`:''}
          ${ex.zh?`<div class="ex-zh">${escapeHtml(ex.zh)}</div>`:''}
          ${ex.src?`<div class="ex-src">◇ ${escapeHtml(ex.src)}</div>`:''}
        </div>`).join('');
      const detail =
        (g.formation?`<div class="formation">${escapeHtml(g.formation)}</div>`:'') +
        (g.note?`<div class="note">${escapeHtml(g.note)}</div>`:'') +
        exs;
      return `<div class="grammar-card ${g.level} ${open?'open':''}">
        <div class="g-head">
          <span class="lv-badge ${g.level}">${g.level}</span>
          <span class="pattern">${escapeHtml(g.pattern)}</span>${(g.srcs||(g.src?[g.src]:[])).map(s=>`<span class="src g-src">${escapeHtml(s)}</span>`).join("")}}
          <span class="meaning">${escapeHtml(g.meaning||'')}</span>
          <span class="g-chev">▶</span>
        </div>
        ${detail?`<div class="g-detail">${detail}</div>`:''}
      </div>`;
    }).join('');
    // click header toggles detail
    grammarListEl.querySelectorAll('.grammar-card').forEach(card=>{
      const head = card.querySelector('.g-head');
      head.addEventListener('click', ()=> card.classList.toggle('open'));
    });
    grammarListEl.querySelectorAll('[data-spk]').forEach(b=> b.addEventListener('click', ()=> speak(b.dataset.spk)));
  }
  document.getElementById('grammar-search').addEventListener('input', renderGrammar);
  const grammarFoldBtn = document.getElementById('grammar-fold');
  if(grammarFoldBtn) grammarFoldBtn.addEventListener('click', ()=>{
    grammarAllOpen = !grammarAllOpen;
    renderGrammar();
  });

  // ===== Vocab browse =====
  const vocabGridEl = document.getElementById('vocab-grid');
  const vocabCountEl = document.getElementById('vocab-count');
  function renderVocab(){
    const q = (document.getElementById('vocab-search').value||'').trim().toLowerCase();
    const f = vocabAll.filter(v =>
      (filterLv==='all' || v.level===filterLv) &&
      (!q || (v.word||'').toLowerCase().includes(q) || (v.r||'').toLowerCase().includes(q) || (v.g||'').toLowerCase().includes(q))
    );
    vocabCountEl.textContent = f.length;
    if(!f.length){ vocabGridEl.innerHTML = '<div class="empty">没有符合条件的单词。</div>'; return; }
    vocabGridEl.innerHTML = f.map(v=>{
      const key = vocabKey({word:v.word, r:v.r});
      const saved = !!vocab[key];
      const head = kanjiIn(v.word) && v.r ? `<ruby>${escapeHtml(v.word)}<rt>${escapeHtml(v.r)}</rt></ruby>` : escapeHtml(v.word);
      return `<div class="vocab-card">
        <div class="v-top">
          <span class="v-word">${head}</span>
          <div class="v-btns">
            <button class="v-btn" data-spk="${escapeHtml(v.word)}" title="朗读">🔊</button>
            <button class="v-btn save ${saved?'on':''}" data-k="${escapeHtml(key)}" data-w="${escapeHtml(v.word)}" data-r="${escapeHtml(v.r||'')}" data-g="${escapeHtml(v.g||'')}" data-p="${escapeHtml(v.p||'')}" title="收藏">${saved?'✓':'＋'}</button>
          </div>
        </div>
        ${v.r && !kanjiIn(v.word)?`<div class="v-r">${escapeHtml(v.r)}</div>`:''}
        <div class="v-g">${escapeHtml(v.g||'')}</div>
        <div class="v-pos">${escapeHtml(v.p||'')} · ${v.level}${v.src?` · <span class="src">${escapeHtml(v.src)}</span>`:''}</div>
      </div>`;
    }).join('');
    vocabGridEl.querySelectorAll('[data-spk]').forEach(b=> b.addEventListener('click', ()=> speak(b.dataset.spk)));
    vocabGridEl.querySelectorAll('.v-btn.save').forEach(b=> b.addEventListener('click', ()=>{
      const info={key:b.dataset.k, surface:b.dataset.w, r:b.dataset.r, g:b.dataset.g, p:b.dataset.p};
      toggleSave(info); renderVocab();
    }));
  }
  document.getElementById('vocab-search').addEventListener('input', renderVocab);

  // ===== Views / filters / chrome =====
  function switchView(v){
    currentView = v;
    localStorage.setItem(K.view, v);
    document.querySelectorAll('.tab').forEach(t=> t.classList.toggle('on', t.dataset.view===v));
    document.querySelectorAll('.view').forEach(s=> s.classList.remove('on'));
    document.getElementById('view-'+v).classList.add('on');
    readerEl.classList.remove('on');
    document.getElementById('view-read').style.display = (v==='read') ? '' : 'none';
    document.getElementById('cat-filter').style.display = (v==='read') ? '' : 'none';
    hideTooltip();
  }
  document.querySelectorAll('.tab').forEach(t=> t.addEventListener('click', ()=> switchView(t.dataset.view)));

  function setLevel(lv){
    filterLv = lv; localStorage.setItem(K.flv, lv);
    document.querySelectorAll('#level-filter .chip').forEach(c=> c.classList.toggle('on', c.dataset.lv===lv));
    renderArticles(); renderGrammar(); renderVocab();
  }
  document.querySelectorAll('#level-filter .chip').forEach(c=> c.addEventListener('click', ()=> setLevel(c.dataset.lv)));
  function setCat(cat){
    filterCat = cat; localStorage.setItem(K.fcat, cat);
    document.querySelectorAll('#cat-filter .chip').forEach(c=> c.classList.toggle('on', c.dataset.cat===cat));
    renderArticles();
  }
  document.querySelectorAll('#cat-filter .chip').forEach(c=> c.addEventListener('click', ()=> setCat(c.dataset.cat)));
  function setGcat(g){
    filterGcat = g; localStorage.setItem(K.gcat, g);
    document.querySelectorAll('#gcat-filter .chip').forEach(c=> c.classList.toggle('on', c.dataset.gcat===g));
    renderGrammar();
  }
  document.querySelectorAll('#gcat-filter .chip').forEach(c=> c.addEventListener('click', ()=> setGcat(c.dataset.gcat)));

  function setTheme(t){
    document.body.className = 'theme-'+t + (showFuri?'':' no-furi');
    localStorage.setItem(K.theme, t);
    document.querySelectorAll('.theme-dot').forEach(d=> d.classList.toggle('on', d.dataset.theme===t));
  }
  document.querySelectorAll('.theme-dot').forEach(d=> d.addEventListener('click', ()=> setTheme(d.dataset.theme)));
  function applyFont(){
    document.documentElement.style.setProperty('--reading-size', fontSize+'px');
    localStorage.setItem(K.size, fontSize);
  }
  document.getElementById('font-up').addEventListener('click', ()=>{ fontSize=Math.min(30,fontSize+1); applyFont(); });
  document.getElementById('font-down').addEventListener('click', ()=>{ fontSize=Math.max(14,fontSize-1); applyFont(); });
  function setFuri(on){
    showFuri = on; localStorage.setItem(K.furi, on?'1':'0');
    document.body.classList.toggle('no-furi', !on);
    document.getElementById('furi-toggle').classList.toggle('on', on);
  }
  document.getElementById('furi-toggle').addEventListener('click', ()=> setFuri(!showFuri));

  // ===== Init =====
  function init(){
    // restore chrome
    setTheme(localStorage.getItem(K.theme) || 'paper');
    applyFont();
    setFuri(showFuri);
    // restore filters
    document.querySelectorAll('#level-filter .chip').forEach(c=> c.classList.toggle('on', c.dataset.lv===filterLv));
    document.querySelectorAll('#cat-filter .chip').forEach(c=> c.classList.toggle('on', c.dataset.cat===filterCat));
    document.querySelectorAll('#gcat-filter .chip').forEach(c=> c.classList.toggle('on', c.dataset.gcat===filterGcat));
    // render
    renderArticles(); renderGrammar(); renderVocab(); renderSaved(); updateStats();
    switchView(currentView);
  }
  init();
})();
</script>
</body>
</html>

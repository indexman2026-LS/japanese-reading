"r":"そのそうだんはしゃちょうがのりだすまでもない。","zh":"那件事用不着社长亲自出马。"},{"jp":"言うまでもなく、健康が何より大切だ。","r":"いうまでもなく、けんこうがなによりたいせつだ。","zh":"不用说，健康比什么都重要。"}]},{"id":"g257","level":"N2","pattern":"～に決まっている","meaning":"“简体小句/名词/二类形容词+に決まっている”表示说话人根据经验或客观情况的判断，对于自己没有直接确认的事情下断言。","cat":"guess"},{"id":"g258","level":"N2","pattern":"～うえで","meaning":"“AうえでB”有两种用法，一是前接动词基本形，表示“为了A，在此之前先做B”。","cat":"time","note":"二是前接动词“た形”，表示先做A，然后做B，有为某事做准备的意思。"},{"id":"g259","level":"N2","pattern":"～とはいうものの","meaning":"“简体小句+ものの”“二类形容词+なものの”表示转折关系，多用于书面语。","cat":"reverse","note":"“とはいうものの”还可做连词，独立于句首。"},{"id":"g260","level":"N2","pattern":"～にあたって","meaning":"“AにあたってB”表示“在…之际”。","cat":"time","note":"前多接动词基本性和名词。"},{"id":"g261","level":"N2","pattern":"～が望ましい","meaning":"“望ましい”意为“希望…”“最好…”，是正式的书面语，可用于委婉的命令。","cat":"oblig","note":"前多接“が”，使用“～が望ましい”的形式。"},{"id":"g262","level":"N2","pattern":"～に先立って","meaning":"“Aに先立ってB”意为在A之前先进行B动作，用于B是为A做准备或练习的场合，是很正式的表达。","cat":"time"},{"id":"g263","level":"N2","pattern":"～をかける","meaning":"“Aをかける”表示做事情时要花费A，A可以是表示时间、金钱、工夫等的名词。","cat":"count"},{"id":"g264","level":"N3","pattern":"～にしたがって","meaning":"“动词基本形/名词+にしたがって”表示随动作的或状况的发展而发生变化。","cat":"state","formation":"动词辞书形/名词 + にしたがって／につれて","examples":[{"jp":"時間が経つにつれて、痛みが和らいできた。","r":"じかんがたつにつれて、いたみがやわらいできた。","zh":"随着时间推移，疼痛减轻了。"},{"jp":"都市が発展するにしたがって、人口も増えた。","r":"としがはってんするにしたがって、じんこうもふえた。","zh":"随着城市发展，人口也增加了。"}]},{"id":"g265","level":"N2","pattern":"～にすぎない","meaning":"“动词简体形/名词+にすぎない”用于限定行为、事件、数量等，表示没什么大不了的。","cat":"limit","formation":"动词普通形／名词 + にすぎない","examples":[{"jp":"これは始まりにすぎない。","r":"これははじまりにすぎない。","zh":"这不过是开始而已。"},{"jp":"彼は一作家にすぎない。","r":"かれはいっさっかにすぎない。","zh":"他不过是个作家。"}]},{"id":"g266","level":"N2","pattern":"～にほかならない","meaning":"前接名词意为“绝对是…”“除…以外难以考虑”，表示强烈的断定。","cat":"limit","formation":"动词普通形／名词 + にほかならない","examples":[{"jp":"これは努力の結果にほかならない。","r":"これはどりょくのけっかにほかならない。","zh":"这正是努力的结果。"},{"jp":"この問題の原因は、早すぎる判断にほかならない。","r":"このもんだいのげんいんは、はやすぎるはんだんにほかならない。","zh":"这个问题的原因正是过早的判断。"}]},{"id":"g267","level":"N2","pattern":"～くせに","meaning":"“AくせにB”表示不具备进行B的必要条件，常常带有批评A的语气。","cat":"reverse","note":"接续为“简体小句/名词の/二类形容词词な+くせに”。"},{"id":"g268","level":"N3","pattern":"～どころではない","meaning":"前接动词或名词，表示强烈否定或没有空余做某事，接形容词时表示强烈否定。","cat":"reverse","formation":"动词辞书形/名词 + どころではない","examples":[{"jp":"仕事が忙しくて、旅行どころではない。","r":"しごとがいそがしくて、りょこうどころではない。","zh":"工作太忙，根本顾不上旅行。"},{"jp":"今は食事するどころではない。","r":"いまはしょくじするどころではない。","zh":"现在根本不是吃饭的时候。"}]},{"id":"g269","level":"N2","pattern":"～て仕方がない","meaning":"表示感情、感觉自然产生、无法控制。","cat":"emote","note":"口语中也用“～てしょうがない”。"},{"id":"g270","level":"N2","pattern":"～なりに","meaning":"“名词（表示人的名词）+なりに”意为“站在～的立场上”。","cat":"view","note":"常用“～は（も）～なりに”的表达方式。","examples":[{"jp":"私は私なりに将来のことを真剣に考えているつもりだ。","r":"わたしはわたしなりにしょうらいのことをしんけんにかんがえているつもりだ。","zh":"我打算按自己的方式认真考虑将来的事。"},{"jp":"子供なりに一生懸命考えた答えだ。","r":"こどもなりにいっしょうけんめいかんがえたこたえだ。","zh":"这是孩子按自己的方式拼命想出的答案。"}]},{"id":"g271","level":"N3","pattern":"～おそれがある","meaning":"“动词基本形/名词の+おそれがある”表示不希望发生的事、不好的事有可能出现，是一种客观推测。","cat":"guess","formation":"名词の/动词辞书形 + おそれがある","examples":[{"jp":"このままでは、台風が直撃するおそれがある。","r":"このままでは、たいふうがちょくげきするおそれがある。","zh":"这样下去，台风有可能直接袭击。"},{"jp":"早く治療しないと、悪化するおそれがある。","r":"はやくちりょうしないと、あっかするおそれがある。","zh":"不早点治疗的话，有恶化的危险。"}]},{"id":"g272","level":"N2","pattern":"～かたわら","meaning":"用“AかたわらB”的形式表示A和B同时进行。","cat":"state","note":"A是职业或本职等主要活动或行为，B是次要行为。","examples":[{"jp":"彼は勉学のかたわら、アルバイトをしている。","r":"かれはべんがくのかたわら、アルバイトをしている。","zh":"他一面学习，一面打工。"},{"jp":"彼女は仕事のかたわら、週末に陶芸を習っている。","r":"かのじょはしごとのかたわら、しゅうまつにとうげいをならっている。","zh":"她工作之余，周末还在学陶艺。"}]},{"id":"g273","level":"N2","pattern":"～をもって","meaning":"“时间名词+をもって”一般表示成为分水岭的时间，常用于表示某种状态结束的时间。","cat":"time","examples":[{"jp":"あの小説家は名文をもって知られる。","r":"あのしょうせつかはめいぶんをもってしられる。","zh":"那位小说家以优美的文笔著称。"},{"jp":"以上をもって、会議を終わります。","r":"いじょうをもって、かいぎをおわります。","zh":"以上，会议到此结束。"}]},{"id":"g274","level":"N2","pattern":"～に際して","meaning":"“动作性名词（三类动词的汉字部分）+に際して”用于表示某事的起始时刻或进行过程中的某时刻，为书面语。","cat":"time"},{"id":"g275","level":"N2","pattern":"～ところがある","meaning":"多用于描述人的性格、为人等，而且大多时候用于负面描述。","cat":"view","note":"表示其他部分没有问题，但后句这一部分不好。"},{"id":"g276","level":"N1","pattern":"～に限らず","meaning":"“不限于，不仅”的意思。","cat":"limit","note":"前接名词，主要用于书面语。"},{"id":"g277","level":"N1","pattern":"もはや","meaning":"“已经”的意思。","cat":"time","note":"副词，是“もう”的书面语，常用于事物发生很大变化的上下文中。"},{"id":"g278","level":"N1","pattern":"～といってもいい","meaning":"用于阐述近乎言过其实的见解。","cat":"guess","note":"“可以说”的意思。"},{"id":"g279","level":"N1","pattern":"“見える”和“見られる”","meaning":"「見える」用于肉眼直接能够确认的事物，是“能看到”“看得见”的意思。","cat":"potential","note":"“見られる”除了表示满足条件才能看见的含义外，还有表示自然现象的用法。"},{"id":"g280","level":"N1","pattern":"一旦","meaning":"“暂且”的意思。","cat":"time","note":"表示①暂时中断此前进行的事，待做完其他事后，在回过头来继续做。②表示此前一直持续的状态暂时停止，过了一段时间后有重新开始。"},{"id":"g281","level":"N1","pattern":"～も～ば、～も～","meaning":"相当于汉语的“又……又……”“也……也……”。","cat":"conj","note":"可替换为“～も～し、～も～”"},{"id":"g282","level":"N1","pattern":"せめて","meaning":"在自己希望的事情难以实现时，用以提出最底线的条件。","cat":"desire","note":"副词，句尾多用表达愿望要求、请求的表达。相当于汉语的“至少”的意思。"},{"id":"g283","level":"N1","pattern":"～たところ","meaning":"表示以某件事的发生为契机，或某件事发生的同时又发生了另外一件事。","cat":"time","note":"前接动词的“た”形，后句也多用过去式。可译为“在……之后”。"},{"id":"g284","level":"N1","pattern":"にしてみたら","meaning":"表示“按照该人的想法或站在其角度的意思”。","cat":"view","note":"后续成分为该人的感受或想法。可译为“在……看来”。"},{"id":"g285","level":"N1","pattern":"ということは","meaning":"用于以对方的话或某种信息为基础，经过自己思考引出推断。","cat":"quote","note":"可译为“也就是说”。"},{"id":"g286","level":"N1","pattern":"～つもりで","meaning":"①接在动词基本型及“ない”形后，表示打算做某事的意图。","cat":"desire","note":"②接在动词“た”形“～ている”形及表状态动词基本型之后，表示自己的想法。"},{"id":"g287","level":"N1","pattern":"～ていく/～てくる","meaning":"接在表移动的动词“て”形之后，表示空间移动的方向。","cat":"change","note":"表示“……去……来”。"},{"id":"g288","level":"N1","pattern":"～だの、～だの","meaning":"常用于“名词1＋だの＋名词2＋だの”“小句1（简体形式）＋だの＋小句2（简体形式）＋だの”两个句型，表示列举。","cat":"conj","note":"可译为“……啦……啦”。","examples":[{"jp":"彼は、やれ給料が安いだの、休みが少ないだのと文句がある。","r":"かれは、やれきゅうりょうがやすいだの、やすみがすくないだのともんくがある。","zh":"他老是抱怨，一会儿说工资低啦，一会儿说休息日少啦。"},{"jp":"高いだの安いだのと、文句ばかり言っている。","r":"たかいだのやすいだのと、もんくばかりいっている。","zh":"一会儿说贵啦一会儿说便宜啦，光发牢骚。"}]},{"id":"g289","level":"N1","pattern":"“傾向にある”和“傾向がある","meaning":"表示“事态向某一方倾斜”的意思。","cat":"change","note":"前者有变化、发展的意思，而后者倾向于陈述状态。"},{"id":"g290","level":"N1","pattern":"～には当たらない","meaning":"表示“与……不相当”，多用“名词/一类动词/二类动词的基本型には当たらない”","cat":"compare"},{"id":"g291","level":"N1","pattern":"～からなる","meaning":"多用于书面语，表示“有……构成”的意思。","cat":"count"},{"id":"g292","level":"N1","pattern":"～とみられる","meaning":"“动词（简体形式）/名词＋とみられる”，表示以观察到的事情、事实为基础，由此进行推测。","cat":"guess","note":"可译为“有可能、有望”。"},{"id":"g293","level":"N1","pattern":"～に見る/～に見られる","meaning":"用“名1＋に＋名2＋を見る”表示“名2的特征表现在名1”的意思，这里的“に”与表示场所的“に”用法相同。","cat":"view","note":"表示“可看出”的意思。"},{"id":"g294","level":"N1","pattern":"～は～に限られる","meaning":"常用“名1＋は＋名2＋に限られる”，“名1所做的事限于名2”的意思。","cat":"limit"},{"id":"g295","level":"N1","pattern":"～というより（は）、～ということだ","meaning":"“小句1（简体形式）＋というより（は）、小句2（简体形式）＋ということだ”表示“对小句1的轻微否定，与小句1相比小句2的状态更强。","cat":"reverse","note":"”“与其说……不如说……”。的意思。"},{"id":"g296","level":"N1","pattern":"～ことのないように","meaning":"“不要那样”的意思，常用“动词基本型＋ことのないように”的形式。","cat":"negative"},{"id":"g297","level":"N1","pattern":"～たいものだ","meaning":"表达说话者的愿望，类似表达有“～てほしいものだ”。","cat":"desire","note":"“想”的意思。"},{"id":"g298","level":"N1","pattern":"“あの”和“その”","meaning":"①信息共享时用“ア”②信息不明确时用“ソ”","cat":"demo"},{"id":"g299","level":"N1","pattern":"敬语表达方式","meaning":"①动词以外的敬语表达方式。","cat":"honor","note":"在对方持有物品或动作的名词、形容词前加“お”。名词二类形容词词干及汉字词前加“ご”。②“お＋动词ます形去掉‘ます’的形式＋になる”敬语表达形式。“ご＋サ变动词词干＋になる”的敬语表达形式。③与被动同形的“～れる（一类动词）”“～られる（二类动词）”“サ变动词”的尊他语表达方式。④表达尊敬意义的特殊动词。如“召し上がる”“いらっしゃる”等。⑤“お＋动词ます形去掉‘ます’的形式＋ください”敬语表达形式。“ご＋サ变动词词干＋ください”的敬语表达形式。⑥“动词て形＋いただく”“お＋动词ます形去掉‘ます’的形式＋いただく”敬语表达形式。“ご＋サ变动词词干＋いただく”的敬语表达形式。"},{"id":"g300","level":"N1","pattern":"～わりに（は）","meaning":"表示以它前面所给出的条件，实际所达到的程度低于或高于人们的推论。","cat":"compare","note":"常用“名词＋の＋わりに”“二类形容词＋な＋わりに”“动词/一类形容词（简体形式）＋わりに”的句型。表示“虽然”的意思。"},{"id":"g301","level":"N1","pattern":"～かねる","meaning":"表示“即使想这么做也不能”的意思。","cat":"potential","note":"接续为“动词ます形去掉ます＋かねる”，语气比较委婉、郑重。","examples":[{"jp":"この席は遠くて聞きづらい。","r":"このせきはとおくてききづらい。","zh":"这个座位太远，很难听清。"},{"jp":"そのご意見には賛成しかねます。","r":"そのごいけんにはさんせいしかねます。","zh":"对您那个意见，我很难赞成。"}]},{"id":"g302","level":"N1","pattern":"～をめぐって","meaning":"表示“以……为中心”“与……相关联”的意思。","cat":"quote"},{"id":"g303","level":"N1","pattern":"～はもとより","meaning":"列举事项时，先把理所当然的事项用“～はもとより”举出来，后面再推而广之。","cat":"limit","note":"多用于书面语，表示“自不必说”的意思。"},{"id":"g304","level":"N1","pattern":"～に及ぶ","meaning":"谈到事态的影响及程度之大时用“～に及ぶ”的说法。","cat":"time","note":"主要接在数字后面，有时也用于广度、大小等具体内容。表示“达到”的意思。"},{"id":"g305","level":"N1","pattern":"～ならではの～","meaning":"表示“非它不可的……”，常用句型“名词＋ならではの～”。","cat":"limit"},{"id":"g306","level":"N1","pattern":"思わず","meaning":"副词，表示“情不自禁”“不知不觉”的意思。","cat":"emote"},{"id":"g307","level":"N1","pattern":"～ずくめ","meaning":"“名词＋ずくめ”表示“类似情况有很多”“没有例外”。","cat":"limit","examples":[{"jp":"黒ずくめのファッションが流行した。","r":"くろずくめのファッションがりゅうこうした。","zh":"一身黑色的打扮流行了起来。"},{"jp":"今日は朝からいいことずくめだ。","r":"きょうはあさからいいことずくめだ。","zh":"今天从早上开始就净是好事。"}]},{"id":"g308","level":"N1","pattern":"～た後/のち、～","meaning":"表示前项事件之后又发生了后项的动作、事态。","cat":"time","note":"这里的“後”既可以读作“のち”，又可以读作“あと”。但“～た後で”的“”只读“あと”。“……之后”的意思。"},{"id":"g309","level":"N1","pattern":"～にとどまらず","meaning":"表示不限定对象。","cat":"limit","note":"“不仅”的意思。"},{"id":"g310","level":"N1","pattern":"～に応えて","meaning":"表示“采取所期待、要求的行动”的意思。","cat":"guess","note":"前接名词。"},{"id":"g311","level":"N1","pattern":"“～といわれる”、“といわれている”「不明确指出主体的例子」","meaning":"两者均表示“人们都那样说”的意思。","cat":"guess","note":"这些表达往往不明确指出动作主体。可翻译为“人们都说”。"},{"id":"g312","level":"N1","pattern":"～こともあって","meaning":"“小句（简体形式）＋こともあって”是表示只举出其中之一加以叙述，暗含其他原因的用法。","cat":"reason","note":"“因为”的意思。"},{"id":"g313","level":"N1","pattern":"～にも増して","meaning":"表示“比……更加”的意思，与表示时间的名词一起使用。","cat":"compare"},{"id":"g314","level":"N1","pattern":"～きる","meaning":"解说;接续为“动词ます形去ます＋きる”的形式。","cat":"potential","note":"表示①某种状态程度很高，即“完全……”“极其……”②将某种行为进行到底，即“把……做完”。"},{"id":"g315","level":"N1","pattern":"～を数える","meaning":"表示“合计数量为……”，主要用于强调数量之多。","cat":"count"},{"id":"g316","level":"N1","pattern":"～に関係なく","meaning":"常用“A＋に関係なく＋B”的句型，表示“A对B的实现没有影响。","cat":"negative","note":"”"},{"id":"g317","level":"N1","pattern":"～ないまでも、～","meaning":"前面接动词的否定形式，表示“即使不……，也……”。","cat":"cond","examples":[{"jp":"億万長者だとは言わないまでも、彼はかなりのお金持ちらしい。","r":"おくまんちょうじゃだとはいわないまでも、かれはかなりのおかねもちらしい。","zh":"即使不能说他是亿万富翁，他似乎也相当有钱。"},{"jp":"毎日でないまでも、週に三回は運動したい。","r":"まいにちでないまでも、しゅうにさんかいはうんどうしたい。","zh":"即便不能每天，也希望一周运动三次。"}]},{"id":"g318","level":"N1","pattern":"あえて","meaning":"副词，表示“不顾困难而有意地”。","cat":"desire"},{"id":"g319","level":"N1","pattern":"～と並ぶ～","meaning":"表示“与……比肩”的意思。","cat":"compare","note":"前面列举比较对象，后面表明比较的内容。"},{"id":"g320","level":"N1","pattern":"～抜く","meaning":"“动词ます形去掉ます＋抜く”。","cat":"potential","note":"表示①“……到底”②“彻底……”“极其……”。"},{"id":"g321","level":"N1","pattern":"～込む","meaning":"接续为“动词ます形去掉ます＋込む”。","cat":"state","note":"表示①动作者本人“进入”（中心动词为自动词）②作为动作的结果“进入”（中心动词为他动词）③充分进行④保持状态"},{"id":"g322","level":"N1","pattern":"かけがえのない","meaning":"表示“没有可替换的东西”“十分宝贵”。","cat":"limit"},{"id":"g323","level":"N1","pattern":"～ものなら","meaning":"“动词的可能形式＋ものなら”表示说话人或文章作者提出一种很难实现的假设，其后多为表示愿望的说法。","cat":"cond","note":"“假如”的意思。"},{"id":"g324","level":"N1","pattern":"～てみせる","meaning":"表示①“把自己做的事展示给别人看”，②“表明自己的强烈意志或决心。","cat":"desire","note":"”","examples":[{"jp":"ばかにしないでください。今度、勝ってみせます。","r":"ばかにしないでください。こんど、かってみせます。","zh":"别小看我。这次一定赢给你看。"},{"jp":"必ず夢を叶えてみせる。","r":"かならずゆめをかなえてみせる。","zh":"我一定要实现梦想给你看。"}]},{"id":"g325","level":"N1","pattern":"もう少しで～ところだった","meaning":"“动词基本型＋ところだった”表示与现实相反的假设。","cat":"time","note":"“差点儿……”的意思。"},{"id":"g326","level":"N1","pattern":"～に達する/～に上る「数值表达方式」","meaning":"二者都是说明数值的表达方式，表示说话人对该数值的评价。","cat":"count","note":"都是“达到”的意思。“～に達する”表示该数值或数量达到了一定的地步或级别。“～に上る”则表示作为结果该数量是一个较大的数值。"},{"id":"g327","level":"N1","pattern":"～ず","meaning":"“～ず”是书面语，意思语“～ないで”相同，接续为“动词ない形去ない＋ず”的形式。","cat":"negative","note":"サ变动词在后续接“ず”时变成“せず”的形式。“不……”的意思。"},{"id":"g328","level":"N1","pattern":"目の当たりにする","meaning":"表示“直接看到”。","cat":"emote","note":"多用于人们较少能看到的灾难或事故情况。"},{"id":"g329","level":"N1","pattern":"～ばかりは","meaning":"前接名词，表示限定，“别的且不论，就只……”意思。","cat":"limit"},{"id":"g330","level":"N1","pattern":"～（よ）うがない","meaning":"“动词ます形去掉ます＋（よ）うがない”“サ变动词＋の＋しようがない”，表示“虽然想那样，但是做不到”。","cat":"potential"},{"id":"g331","level":"N1","pattern":"なるべく","meaning":"副词，表示“如果可能的话希望那样做”“希望如此”。","cat":"desire"},{"id":"g332","level":"N1","pattern":"～に恵まれた～","meaning":"前接名词，表示幸运地获得了很好地机会、才干、环境等。","cat":"view","note":"“被……眷顾”的意思。"},{"id":"g333","level":"N1","pattern":"～にも～","meaning":"前接含疑问词的动词小句，表示在疑问词所包含的所有场合后续部分都成立。","cat":"cond","note":"其中“にも”前的动词要用基本型。"},{"id":"g334","level":"N1","pattern":"仮に～とする","meaning":"表示“假设～”“假定～”。","cat":"cond","note":"“とする”前多用动词的た形。"},{"id":"g335","level":"N1","pattern":"～を除くと、～","meaning":"“除く”是动词，意思是“除去”，多用于书面语。","cat":"limit","note":"“～を除くと、～”前接名词。"},{"id":"g336","level":"N1","pattern":"すなわち","meaning":"用于将名词替换为其他说法，意思相当于“即”“换言之”。","cat":"quote"},{"id":"g337","level":"N1","pattern":"～は言うに及ばず","meaning":"相当于“不要说……”，是书面语表达。","cat":"limit"},{"id":"g338","level":"N1","pattern":"～てはならない","meaning":"“动词て形＋はならない”式表示禁止的表达方式。","cat":"order","note":"此句型为书面语表达。“不能、不得”的含义。"},{"id":"g339","level":"N1","pattern":"～（よ）うにも～ない","meaning":"“动词意志形＋にも＋动词可能形式的ない形”意思是“尽量必要却无法办到”“想做却做不到”。","cat":"potential"},{"id":"g340","level":"N1","pattern":"～たきり","meaning":"“动词た形＋きり”意思是“在实施前一动作、行为后，没有实施下一步的相应行为或动作”。","cat":"time"},{"id":"g341","level":"N1","pattern":"～極まりない","meaning":"意思是“极为……”。","cat":"limit","note":"前接名词或二类形容词。用于特别有意外性的词语，多表示不好的意思。","examples":[{"jp":"彼のしたことは、卑劣極まる。","r":"かれのしたことは、ひれつきわまる。","zh":"他的所作所为极其卑鄙。"},{"jp":"無事に帰国できて、感激の極みです。","r":"ぶじにきこくできて、かんげきのきわみです。","zh":"平安回国，感激之至。"}]},{"id":"g342","level":"N1","pattern":"～途中で","meaning":"“名词＋の＋途中で”“动词基本型＋途中で”的形式，表示某种行为正在进行期间发生了别的行为。","cat":"time","note":"“在……的中途”的意思。"},{"id":"g343","level":"N1","pattern":"“反面、～”和“他方、～”","meaning":"“反面”表示“同一事物存在不同的两个方面”，可以用在句中连接下文，还可以用在句首。","cat":"reverse","note":"用于句中时，使用“小句（简体形）＋反面”的形式。语法“他方”一般采用“一方～、他方～”的形式，是对照两方面情况时使用的连词，多数情况下前后主语不同。"},{"id":"g344","level":"N1","pattern":"～向けて","meaning":"前接名词，表示“朝着……方向”，“以……为对象或目标”。","cat":"purpose"},{"id":"g345","level":"N1","pattern":"～に伴い","meaning":"表示“由于一方面的变化，另一方面也跟着变化”。","cat":"state","note":"使用“名词＋に伴い”“动词基本型＋（の）＋に伴い”的句型。“随着……”的意思。"},{"id":"g346","level":"N1","pattern":"～についで","meaning":"前接名词，表示“紧随其后”“紧接着”。","cat":"time"},{"id":"g347","level":"N1","pattern":"～済み","meaning":"部分サ变动词词干后接“済み”表示已经完成。","cat":"tense","note":"“……完”的意思。"},{"id":"g348","level":"N1","pattern":"～（よ）うというものだ","meaning":"用“动词意志形＋というもの”的形式表示“以……为目的（想出来的东西）”。","cat":"desire"},{"id":"g349","level":"N1","pattern":"～が見込める","meaning":"“～を見込める”的意思是“预测推算”。","cat":"guess","note":"“～が見込める”是其可能形式。"},{"id":"g350","level":"N1","pattern":"ご覧にいれる","meaning":"“ご覧にいれる”是“”的自谦形式。","cat":"honor","note":"表示“给……看”的意思。"},{"id":"g351","level":"N1","pattern":"いまいち","meaning":"表示“与本来期待的结果或状况稍有差距”，既可以做副词，又可以做名词。","cat":"compare","note":"“差一点儿”的意思。"},{"id":"g352","level":"N1","pattern":"～とはいえ～","meaning":"表示用于在承认前项叙述的同时，叙述与之相反的事项。","cat":"reverse","formation":"名词/动词/い形容词普通体 + とはいえ","note":"相当于汉语的“虽说……但是……”。","examples":[{"jp":"春とはいえ、朝晩はまだ肌寒い。","r":"はるとはいえ、あさばんはまだはださむい。","zh":"虽说是春天，早晚还是微寒。"},{"jp":"準備万端とはいえ、いざ本番となると緊張するものだ。","r":"じゅんびばんたんとはいえ、いざほんばんとなるときんちょうするものだ。","zh":"虽说准备周全，一旦正式上场还是会紧张。"},{"jp":"4月になったとはいえ、まだ寒い日もある。","r":"しがつになったとはいえ、まださむいひもある。","zh":"虽说已到四月，但仍有寒冷的日子。"},{"jp":"便利になったとはいえ、やはり値段が高い。","r":"べんりになったとはいえ、やはりねだんがたかい。","zh":"虽说变得方便了，但价格还是高。"}]},{"id":"g353","level":"N1","pattern":"いかんなく","meaning":"表示“把一切毫无保留地”的意思。","cat":"state","note":"前面多为能力、才能、经验等名词。"},{"id":"g354","level":"N1","pattern":"こんな（に）～ことはない","meaning":"表示程度非常高，“没有比……再……的了”。","cat":"compare","note":"“～”部分一般为表示情感的一类形容词、二类形容词以及动词。"},{"id":"g355","level":"N1","pattern":"～ようによっては","meaning":"接在“动词ます形去掉ます”的形式后，表示“根据不同的做法会产生不同的结果”。","cat":"cond"},{"id":"g356","level":"N1","pattern":"たとえ～だけでも～","meaning":"表示“即使……也……”的意思。","cat":"cond"},{"id":"g357","level":"N1","pattern":"～て間もない","meaning":"接在动词て形后，用于修饰后面的名词。","cat":"time","note":"“……不久之后”的意思。"},{"id":"g358","level":"N1","pattern":"～ともなると、～","meaning":"“名词＋ともなると、～”表示时间或人、物处于区别于其他的特别状态。","cat":"cond","note":"“一旦到了……就……”的意思。","examples":[{"jp":"世界的な俳優ともなると、さすがに演技力が違うようだ。","r":"せかいてきなはいゆうともなると、さすがにえんぎりょくがちがうようだ。","zh":"一旦成了世界级演员，演技果然就不一样了。"},{"jp":"夏休みともなれば、観光地はどこも混む。","r":"なつやすみともなれば、かんこうちはどこもこむ。","zh":"一到暑假，旅游景点哪里都拥挤。"}]},{"id":"g359","level":"N1","pattern":"～をよそに、～","meaning":"书面语，表示“不顾”的意思。","cat":"reverse","formation":"名词 + をよそに","examples":[{"jp":"親の心配をよそに、彼は毎晩遅くまで遊び歩いている。","r":"おやのしんぱいをよそに、かれはまいばんおそくまであそびあるいている。","zh":"他不顾父母的担心，每晚都玩到很晚。"},{"jp":"周囲の反対をよそに、彼女は独断で計画を進めた。","r":"しゅういのはんたいをよそに、かのじょはどくだんでけいかくをすすめた。","zh":"她无视周围的反对，独断地推进了计划。"},{"jp":"大学は学生の反対運動をよそに、学費の値上げを強行した。","r":"だいがくはがくせいのはんたいうんどうをよそに、がくひのねあげをきょうこうした。","zh":"大学无视学生的抗议运动，强行提高了学费。"},{"jp":"彼は家族の心配をよそに、海外へ旅立っていった。","r":"かれはかぞくのしんぱいをよそに、かいがいへたびだっていった。","zh":"他不顾家人的担心，动身去了海外。"}]},{"id":"g360","level":"N1","pattern":"～はおろか、～","meaning":"表示“不用说的事情”“当然的事情”，强调后项事情的表达方式，不用于论文等客观性文章。","cat":"limit","examples":[{"jp":"事故でけがをして、走ることはおろか歩くこともできない。","r":"じこでけがをして、はしることはおろかあるくこともできない。","zh":"因为事故受伤，别说跑了，连走路都不行。"},{"jp":"彼は漢字はおろか、ひらがなも読めない。","r":"かれはかんじはおろか、ひらがなもよめない。","zh":"他别说是汉字，连平假名都不会读。"}]},{"id":"g361","level":"N1","pattern":"～てもかまわない","meaning":"前接动词て形，表示“别管……”的意思。","cat":"order"},{"id":"g362","level":"N1","pattern":"～てならない","meaning":"表示“那种情绪不可抑制”，接在表自发意义的动词及表示情感的一类形容词和二类形容词后。","cat":"emote"},{"id":"g363","level":"N1","pattern":"～により～","meaning":"意思与“～によって”相同，但书面语色彩更强些。","cat":"reason","note":"“根据”的意思。"},{"id":"g364","level":"N1","pattern":"なぜ～かというと～からだ/なぜかというと～からだ","meaning":"在陈述某事项相关的理由时，使句子简短结束，并实现对理由的强调。","cat":"reason","note":"“为什么……呢？这是因为……”"},{"id":"g365","level":"N1","pattern":"～によらず","meaning":"前接名词，表示“与……无关”。","cat":"negative"},{"id":"g366","level":"N1","pattern":"～に限り","meaning":"“Aに限り，B”意思是“把范围仅仅现定于……”，表示B部分的状态只有在A的条件下才能成立。","cat":"limit"},{"id":"g367","level":"N1","pattern":"～あたり","meaning":"接在表示单位的名词后，表示在该单位的范围内，相当于“每……”。","cat":"count","examples":[{"jp":"来週あたりでき上がると思います。","r":"らいしゅうあたりできあがるとおもいます。","zh":"我想大致下周就能完成。"},{"jp":"その質問の答えは、部長あたりが知っているだろう。","r":"そのしつもんのこたえは、ぶちょうあたりがしっているだろう。","zh":"那个问题的答案，部长之类的人大概知道吧。"}]},{"id":"g368","level":"N1","pattern":"～のに対して、～","meaning":"针对某个事项，对比两种不同情况时使用。","cat":"reverse","note":"接续形式为“小句（简体形式）＋の＋に対し”“名词/二类形容词＋である＋の＋に対して”或“名词/二类形容词＋な＋の＋に対して”的形式。“与此相对”的意思。"},{"id":"g369","level":"N1","pattern":"～を余儀なくされる","meaning":"表示自己并不想这么做，但因各种原因不得不这么做。","cat":"oblig","formation":"名词 + を余儀なくされる（被迫）／を余儀なくさせる（迫使）","note":"“不得不……”的意思。","examples":[{"jp":"台風により、出発の延期を余儀なくされた。","r":"たいふうにより、しゅっぱつのえんきをよぎなくされた。","zh":"因台风，被迫延期出发。"},{"jp":"社長は担当者に責任を取らせ、辞任を余儀なくさせた。","r":"しゃちょうはたんとうしゃにせきにんをとらせ、じにんをよぎなくさせた。","zh":"社长让负责人承担责任，迫使其辞职。"},{"jp":"震災で家を失った人々は避難所暮らしを余儀なくされた。","r":"しんさいでいえをうしなったひとびとはひなんじょぐらしをよぎなくされた。","zh":"因震灾失去家园的人们被迫在避难所生活。"},{"jp":"大雨のため、試合の中止を余儀なくされた。","r":"おおあめのため、しあいのちゅうしをよぎなくされた。","zh":"由于大雨，比赛被迫中止。"}]},{"id":"g370","level":"N1","pattern":"～（よ）う","meaning":"动词的意志形可以表示说话人的推测，主要用于书面语。","cat":"guess"},{"id":"g371","level":"N1","pattern":"～を機に","meaning":"表示“以……为契机”。","cat":"time","note":"接续为“名词＋を機に”“动词（简体形式）＋の＋を機に”。"},{"id":"g372","level":"N1","pattern":"～を強いる","meaning":"表示“强迫别人做某事”。","cat":"view"},{"id":"g373","level":"N1","pattern":"～と～では","meaning":"用于两项事物进行比较，并能发现较大差异。","cat":"compare"},{"id":"g374","level":"N1","pattern":"お手数をおかけしました","meaning":"“お手数”表示做某事需要的动作、工作和数量，用于请求对方协助或对对方的帮助表示感谢。","cat":"honor","note":"“给您添麻烦了”的意思。"},{"id":"g375","level":"N1","pattern":"～てからというもの","meaning":"表示某个行为、发生某种变化后一直持续的某种状态。","cat":"time","note":"“从那以后”的意思。","examples":[{"jp":"祖母が死んでからというもの、祖父はお酒ばかり飲んでいる。","r":"そぼがしんでからというもの、そふはおさけばかりのんでいる。","zh":"自从祖母去世以后，祖父就整天喝酒。"},{"jp":"スマホを買ってからというもの、本を読まなくなった。","r":"スマホをかってからというもの、ほんをよまなくなった。","zh":"自从买了智能手机，就不怎么读书了。"}]},{"id":"g376","level":"N1","pattern":"さながら","meaning":"与“まるで”一样，表示比喻，意思是“正如……”。","cat":"compare","note":"接续为“さながら＋名词＋のようだ/のように”“名词＋さながらに＋动词”。"},{"id":"g377","level":"N1","pattern":"～といったところだ","meaning":"意思是“可以表达为……”，多于“まるで”“さながら”等搭配使用，用于某种比喻或改换一种更通俗的说法。","cat":"quote","examples":[{"jp":"私の成績ではその大学には、合格ラインぎりぎりといったところだ。","r":"わたしのせいせきではそのだいがくには、ごうかくラインぎりぎりといったところだ。","zh":"以我的成绩进那所大学，大概也就刚好够合格线。"},{"jp":"毎日の勉強時間は、二時間といったところだ。","r":"まいにちのべんきょうじかんは、にじかんといったところだ。","zh":"每天的学习时间，最多也就是两个小时左右。"}]},{"id":"g378","level":"N1","pattern":"どうやら","meaning":"表示“不太确定但总觉得……”。","cat":"guess","note":"多用于“どうやら～らしい/ようだ”的形式。"},{"id":"g379","level":"N1","pattern":"～がたい","meaning":"“动词ます形去掉ます＋がたい”意思是“难以进行某种动作。","cat":"potential","note":"”"},{"id":"g380","level":"N1","pattern":"～てこそ","meaning":"“动词/动词可能形式的て形＋こそ”后接正面评价内容，表示“因做了某事才有意义，才产生好的结果。","cat":"cond","note":"”"},{"id":"g381","level":"N1","pattern":"～と思いきや","meaning":"接续为“名词＋と思いきや”“小句（简体形式）＋と思いきや”，表示“以为……，但实际上不是”的意思。","cat":"reverse","note":"强调结果出乎意料。","examples":[{"jp":"田中先生が作るテストだから難しいと思いきや、案外易しかった。","r":"たなかせんせいがつくるテストだからむずかしいとおもいきや、あんがいやさしかった。","zh":"原以为田中老师出的考卷很难，没想到却意外地容易。"},{"jp":"雨がやむかと思いきや、ますます激しくなった。","r":"あめがやむかとおもいきや、ますますはげしくなった。","zh":"原以为雨会停，没想到反而下得更大了。"}]},{"id":"g382","level":"N1","pattern":"～とも、～","meaning":"用于书面语，表示逆接的假定条件。","cat":"cond","note":"接续为“动词意志形＋とも”、一类形容词将词尾的“い”变为“く”＋とも，动词ない形也用“～なくとも”的形式。“即使、即便”的意思。"},{"id":"g383","level":"N1","pattern":"～を怠る","meaning":"“名词＋怠る”的意思是“不做自己必须做的事情”。","cat":"oblig"},{"id":"g384","level":"N1","pattern":"一口に～といっても、～","meaning":"表示提到的词语所表达的含义深而广。","cat":"quote","note":"“虽说都是……，但……”的意思。"},{"id":"g385","level":"N1","pattern":"～に対応する","meaning":"表示“根据状况的变化及对象采取相应的行动。","cat":"view","note":"”状况的变化及对象用“に”表示。“应对……”的意思。"},{"id":"g386","level":"N1","pattern":"～べき～","meaning":"“动词基本型＋べき＋名词”表示“适当”“有那样做的价值”。","cat":"oblig"},{"id":"g387","level":"N1","pattern":"～は～に（は）欠かせない","meaning":"“欠かせない”以可能形式的否定形式表示“必要”的意思。","cat":"oblig","note":"这个语法表示不可欠缺的意思。"},{"id":"g388","level":"N1","pattern":"～に優しい","meaning":"表示温和对待，从而引申出比喻不会产生不良影响的用法。","cat":"view","note":"“对……有益”的意思。"},{"id":"g389","level":"N1","pattern":"～にしても","meaning":"前接名词，表示“从某一角度考虑问题也……”的意思。","cat":"cond"},{"id":"g390","level":"N1","pattern":"遅かれ早かれ","meaning":"相当于汉语的“迟早”的意思。","cat":"time"},{"id":"g391","level":"N1","pattern":"一向～ない","meaning":"与否定形式一起使用，表示“完全（不）……”。","cat":"negative"},{"id":"g392","level":"N1","pattern":"～ならまだしも","meaning":"“名词/动词基本型＋ならまだしも”，表示“前面的事还能应付，后面的事项就难对付了。","cat":"cond","note":"”","examples":[{"jp":"単なる冗談ならまだしも、彼の話はたまに人を傷つける。","r":"たんなるじょうだんならまだしも、かれのはなしはたまにひとをきずつける。","zh":"如果只是玩笑倒也罢了，他的话有时会伤人。"},{"jp":"遅刻一回ならまだしも、三回も続くのは問題だ。","r":"ちこくいっかいならまだしも、さんかいもつづくのはもんだいだ。","zh":"迟到一次还好，连续迟到三次就是问题了。"}]},{"id":"g393","level":"N1","pattern":"この分だと、～","meaning":"表示“这样下去的话，……”。","cat":"guess"},{"id":"g394","level":"N2","pattern":"～っぱなしにする","meaning":"“动词ます形去ます＋っぱなしにする”，表示动作结束后维持在该状态。","cat":"state","formation":"动词ます形 + っぱなし","note":"“一直……”的意思。","examples":[{"jp":"テレビをつけっぱなしにしないで。","r":"テレビをつけっぱなしにしないで。","zh":"别让电视一直开着。"},{"jp":"水を出しっぱなしにするのはもったいない。","r":"みずをだしっぱなしにするのはもったいない。","zh":"一直开着水龙头太浪费。"}]},{"id":"g395","level":"N1","pattern":"～まま","meaning":"接续为“一类形容词＋まま”“二类形容词＋な＋まま”“动词た形/ない形＋まま”“名词＋の＋まま”，表示该状态保持不变。","cat":"state","note":"“依旧，仍旧”的意思。“～に連なる”和“～につながる”“連なる”有三个含义。①排成一列没有间断。②为某集体的一员③出席某会议。“つながる”也有三个意思。①几个互相分开的事物聚集到一起，成了一个事物。②两个以上的事物由于某种关系而联系到了一起。③几个事物连成一串的状态。"},{"id":"g396","level":"N1","pattern":"あながち～ない","meaning":"“あながち”与句尾否定形式相呼应，表示“某主张或判断不能完全肯定”。","cat":"negative"},{"id":"g397","level":"N1","pattern":"“～を～として”“～を～に”","meaning":"“名1を名2とする”与“名1を名2にする”都表示“把名1按照名2的性质来对待”。","cat":"view","note":"可译为“把……当做……”。"},{"id":"g398","level":"N1","pattern":"～させられる（使役被动形式）","meaning":"使役形式表达的内容进一步加上被动叫做“使役被动形式”。","cat":"passive","note":"表示自己本不希望做某事，但被迫做了某事。"},{"id":"g399","level":"N1","pattern":"～を受けて、～","meaning":"用于听取了针对自己的意见后，在此基础上经过研究采取行动。","cat":"reason","note":"可译为“根据，接受”。"},{"id":"g400","level":"N1","pattern":"～か否かで～","meaning":"书面语，表示“以是否……为理由”。","cat":"cond"},{"id":"g401","level":"N1","pattern":"～まみれ","meaning":"接在名词后面，表示整体都沾满的意思。","cat":"limit","note":"带有因此被弄脏，或呈现不好状态的意思。可译为“满是，沾满”。","examples":[{"jp":"先日父は家の蔵から、ほこりまみれの家系図を見つけ出した。","r":"せんじつちちはうちのくらから、ほこりまみれのかけいずをみつけだした。","zh":"前几天，父亲从家里的仓库找出了一份满是灰尘的家谱。"},{"jp":"子供たちは泥まみれになって遊んでいる。","r":"こどもたちはどろまみれになってあそんでいる。","zh":"孩子们玩得满身是泥。"}]},{"id":"g402","level":"N1","pattern":"だが","meaning":"连词。表示转折，主要用于书面语。","cat":"conj","note":"“可是”的意思。"},{"id":"g403","level":"N1","pattern":"～に満たない","meaning":"“名词”表示达不到高名词所示基准或数值。","cat":"count","note":"“不满”的意思。"},{"id":"g404","level":"N1","pattern":"～ほど～ない","meaning":"表示“没有比……更……了”","cat":"compare"},{"id":"g405","level":"N1","pattern":"難儀する","meaning":"多以“名词＋に/で難儀する”“动词て形＋難儀する”的形式出现，表示颇费周折的意思。","cat":"state"},{"id":"g406","level":"N1","pattern":"～たとしても、～","meaning":"“动词た形＋としても～”相当于汉语的“即使……也……”。","cat":"cond"},{"id":"g407","level":"N1","pattern":"～（よ）うとしない","meaning":"“动词意志形”相当于汉语的“不想……”“不肯……”。","cat":"negative"},{"id":"g408","level":"N1","pattern":"息をつく","meaning":"①大口喘气②喘口气（放松）","cat":"state"},{"id":"g409","level":"N1","pattern":"～と題する","meaning":"意思是“以……为标题的……”。","cat":"quote"},{"id":"g410","level":"N1","pattern":"～を務める","meaning":"表示“担当某项职务”的意思，多用“～を務める”的形式。","cat":"view"},{"id":"g411","level":"N1","pattern":"～や（否や）","meaning":"表示“一……立刻”的意思。","cat":"time","note":"多用“动词基本型＋や（否や）”的形式。"},{"id":"g412","level":"N1","pattern":"なんの～も～","meaning":"“なんの”可写成“何の”用“なんの～も～ない”的形式强调否定。","cat":"negative"},{"id":"g413","level":"N1","pattern":"～ほかない/～ほかはない","meaning":"表示“除了……没有别的办法”，前面多接动词的基本型。","cat":"oblig"},{"id":"g414","level":"N1","pattern":"わりに","meaning":"副词，表示程度稍微超过预想。","cat":"compare","note":"“比较的”的意思。"},{"id":"g415","level":"N1","pattern":"こうして","meaning":"用于承前启后，叙述后项。","cat":"conj","note":"多用在讲故事或回忆时用作归纳。“就这样”的意思。"},{"id":"g416","level":"N2","pattern":"～ことか","meaning":"表示感动或感叹。","cat":"emote","formation":"动词／い形／な形普通形 + ことか","note":"以“小句（简体形式）＋ことか”的形式，多于“どんなに”搭配使用。","examples":[{"jp":"あの時どんなに嬉しかったことか。","r":"あのときどんなにうれしかったことか。","zh":"那时多么高兴啊。"},{"jp":"彼がどれほど苦労したことか、想像もできない。","r":"かれがどれほどくろうしたことか、そうぞうもできない。","zh":"他吃了多少苦，难以想象。"}]},{"id":"g417","level":"N1","pattern":"～のゆえに","meaning":"多用于书面语，用“名词/二类形容词＋（の）ゆえに”的形式，表示“由于……”“因为……”。","cat":"reason","note":"也用“动词/一类形容词（简体形式）＋（が）ゆえに”。"},{"id":"g418","level":"N1","pattern":"～に過ぎる","meaning":"表示“过于……”的意思。","cat":"compare"},{"id":"g419","level":"N1","pattern":"またの～","meaning":"“また”是副词，用“またの＋名词”的形式，表示别的、下次、其他的意思。","cat":"time"},{"id":"g420","level":"N1","pattern":"逆に～","meaning":"“逆に”用作副词，表示与预想或期待的相反，可译为“反而”。","cat":"reverse"},{"id":"g421","level":"N1","pattern":"～とは思ってもみなかった/～なんて考えてもみなかった","meaning":"表示对已经形成的实际情况以前完全没有想到的意思。","cat":"emote","note":"用于“动词/一类形容词（简体形式）＋とは思ってもみなかった/～なんて考えてもみなかった“名词/二类形容词＋だ＋とは思ってもみなかった/なんて考えてもみなかった”的形式。可译为“没想到”。"},{"id":"g422","level":"N1","pattern":"～ばこそ","meaning":"使用“动词ば形＋こそ”的形式，强调理由。","cat":"reason","note":"句尾多伴随“～のだ”，“正因为”的意思。","examples":[{"jp":"お金があればこそ、留学できるのです。","r":"おかねがあればこそ、りゅうがくできるのです。","zh":"正因为有钱，才能留学。"},{"jp":"健康であればこそ、仕事に打ち込めるのだ。","r":"けんこうであればこそ、しごとにうちこめるのだ。","zh":"正因为健康，才能全身心投入工作。"}]},{"id":"g423","level":"N1","pattern":"あっての","meaning":"因为有…才有…／没有…就没有…","cat":"reason","formation":"名词 + あっての + 名词","examples":[{"jp":"今の安定した生活も若い時の苦労あってのものです。","r":"いまのあんていしたせいかつもわかいときのくろうあってのものです。","zh":"如今安定的生活，也是因为有年轻时的辛苦打拼。"},{"jp":"この成功は、長年の努力あってのものだ。","r":"このせいこうは、ながねんのどりょくあってのものだ。","zh":"这次成功是靠多年的努力才取得的。"}],"note":"表示前面的存在是后面成立的前提，多用于书面语。"},{"id":"g424","level":"N1","pattern":"いかんで／いかんでは／いかんによって","meaning":"根据…／取决于…／要看…","cat":"cond","formation":"名词 + いかん（で／では／によって）","examples":[{"jp":"成績が伸びるかどうかは、本人の今後の努力いかんだ。","r":"せいせきがのびるかどうかは、ほんにんのこんごのどりょくいかんだ。","zh":"成绩能否提高，要看本人今后的努力。"},{"jp":"合格できるかどうかは、試験当日の出来いかんにかかっている。","r":"ごうかくできるかどうかは、しけんとうじつのできいかんにかかっている。","zh":"能否合格，取决于考试当天的发挥。"}],"note":"いかんで后面可能有两种结果，いかんでは后面一般只是一种结果。"},{"id":"g425","level":"N1","pattern":"いかんによらず／いかんにかかわらず","meaning":"不管…／不论…","cat":"reverse","formation":"名词 + のいかんによらず／にかかわらず","examples":[{"jp":"結果のいかんにかかわらず、必ず報告してください。","r":"けっかのいかんにかかわらず、かならずほうこくしてください。","zh":"不管结果如何，请务必报告。"},{"jp":"理由のいかんによらず、遅刻は認められない。","r":"りゆうのいかんによらず、ちこくはみとめられない。","zh":"无论什么理由，迟到都不被允许。"}],"note":"いかんせん＝无奈；いかんともしがたい＝怎么也不好办。"},{"id":"g426","level":"N1","pattern":"动词意志形＋が／と","meaning":"无论…都…／不管…","cat":"reverse","formation":"动词意志形 + が／と","examples":[{"jp":"彼が困ろうが、私には関係がない。","r":"かれがこまろうが、わたしにはかんけいがない。","zh":"他无论多为难，都与我无关。"},{"jp":"雨が降ろうが風が吹こうが、試合は行われる。","r":"あめがふろうがかぜがふこうが、しあいはおこなわれる。","zh":"无论刮风下雨，比赛都会照常举行。"}],"note":"后面的情况与前面的条件无关。"},{"id":"g427","level":"N1","pattern":"动词意志形＋が／と＋同一动词＋まいが／まいと","meaning":"是…还是…／不管…是否…","cat":"reverse","formation":"动词意志形 + が／と + 同一动词 + まいが／まいと","examples":[{"jp":"親が反対しようとしまいと、私は彼と結婚します。","r":"おやがはんたいしようとしまいと、わたしはかれとけっこんします。","zh":"不管父母反对与否，我都要和他结婚。"},{"jp":"周りが認めようが認めまいが、私は自分の信念を貫く。","r":"まわりがみとめようがみとめまいが、わたしはじぶんのしんねんをつらぬく。","zh":"不管周围的人承认与否，我都要坚持自己的信念。"}]},{"id":"g428","level":"N1","pattern":"动词意志形＋にも＋同一动词ない形","meaning":"即使想…也不能…","cat":"negative","formation":"动词意志形 + にも + 同一动词ない形","examples":[{"jp":"仕事が終わらないから、帰ろうにも帰れない。","r":"しごとがおわらないから、かえろうにもかえれない。","zh":"因为工作还没做完，想回也回不去。"},{"jp":"お金がなくて、買おうにも買えない。","r":"おかねがなくて、かおうにもかえない。","zh":"因为没有钱，想买也买不起。"}]},{"id":"g429","level":"N1","pattern":"限りだ","meaning":"…极了／无比…","cat":"emote","formation":"形容动词词干／い形容词 + 限りだ","examples":[{"jp":"こんなに盛大な結婚式を挙げることができて、羨ましい限りです。","r":"こんなにせいだいなけっこんしきをあげることができて、うらやましいかぎりです。","zh":"能举办如此盛大的婚礼，真是羡慕极了。"},{"jp":"久しぶりに家族に会えて、嬉しい限りだ。","r":"ひさしぶりにかぞくにあえて、うれしいかぎりだ。","zh":"久违地与家人重逢，真是高兴极了。"}]},{"id":"g430","level":"N1","pattern":"（た）が最後","meaning":"一旦…就…／…之后…就…","cat":"time","formation":"动词た形 + が最後","examples":[{"jp":"彼はスピーチを始めたが最後、長々と話が続いて終わらない。","r":"かれはスピーチをはじめたがさいご、ながながとはなしがつづいておわらない。","zh":"他一旦开始演讲，就会滔滔不绝地说个不停。"},{"jp":"このゲームを始めたが最後、やめられなくなる。","r":"このゲームをはじめたがさいご、やめられなくなる。","zh":"一旦开始玩这个游戏，就再也停不下来了。"}],"note":"后项多为难以收拾的消极结果。"},{"id":"g431","level":"N1","pattern":"かたがた","meaning":"…（的）同时／顺便…","cat":"purpose","formation":"名词 + かたがた","examples":[{"jp":"散歩かたがた、買い物をする。","r":"さんぽかたがた、かいものをする。","zh":"一边散步，顺便买东西。"},{"jp":"ご挨拶かたがた、お伺いいたしました。","r":"ごあいさつかたがた、おうかがいいたしました。","zh":"借着问候之便，前来拜访。"}],"note":"前后两个动作的时间带相同；ついでに的前后时间带不同。"},{"id":"g432","level":"N1","pattern":"がてら","meaning":"…（的同时）顺便…／借…之便…","cat":"purpose","formation":"名词／动词ます形 + がてら","examples":[{"jp":"遊びがてら、建設中の別荘を見に行こう。","r":"あそびがてら、けんせつちゅうのべっそうをみにいこう。","zh":"趁游玩之际，顺便去看看正在建造的别墅吧。"},{"jp":"買い物がてら、駅前の新しいカフェに寄った。","r":"かいものがてら、えきまえのあたらしいカフェによった。","zh":"买东西时顺路去了车站前新开的咖啡店。"}]},{"id":"g433","level":"N1","pattern":"が早いか","meaning":"一…就立即…","cat":"time","formation":"动词连体形 + が早いか","examples":[{"jp":"ベルが鳴るが早いか、彼女は受話器を取った。","r":"ベルがなるがはやいか、かのじょはじゅわきをとった。","zh":"铃一响，她马上就拿起了听筒。"},{"jp":"ドアが開くが早いか、子供たちは外へ飛び出していった。","r":"ドアがひらくがはやいか、こどもたちはそとへとびだしていった。","zh":"门一开，孩子们就冲了出去。"}],"note":"不适用于自然现象的发生，不能用于意志和推量；表示一次性行为。"},{"id":"g434","level":"N1","pattern":"からある／からする／からの","meaning":"多达…以上／足有…","cat":"compare","formation":"数量词 + からある／からする／からの","examples":[{"jp":"ここから東京までは、100キロからある。","r":"ここからとうきょうまでは、ひゃっキロからある。","zh":"从这里到东京有一百多公里。"},{"jp":"この指輪は、百万円からするだろう。","r":"このゆびわは、ひゃくまんえんからするだろう。","zh":"这枚戒指恐怕要值一百万日元吧。"}],"note":"からある用于距离、重量、高度；からする用于金额；からの用于人数。"},{"id":"g435","level":"N1","pattern":"きらいがある","meaning":"有点儿…／总爱…／有…的倾向","cat":"guess","formation":"动词连体形 + きらいがある／名词 + のきらいがある","examples":[{"jp":"彼は人の話を聞かないきらいがある。","r":"かれはひとのはなしをきかないきらいがある。","zh":"他有点听不进别人的话。"},{"jp":"この論文は、説明が長すぎるきらいがある。","r":"このろんぶんは、せつめいがながすぎるきらいがある。","zh":"这篇论文有解释过于冗长的倾向。"}],"note":"多用于不好的倾向，不能用于回数和自然现象。"},{"id":"g436","level":"N1","pattern":"ごとき／ごとく／ごとし","meaning":"像…一样／如…","cat":"compare","formation":"名词 + のごとき／ごとく／ごとし","examples":[{"jp":"王者のごとき振る舞いに、人々は反感を抱いた。","r":"おうじゃのごときふるまいに、ひとびとははんかんをいだいた。","zh":"对他像王者一样的举止，众人怀有反感。"},{"jp":"彼は風のごとく走り去った。","r":"かれはかぜのごとくはしりさった。","zh":"他如风一般飞驰而去。"}],"note":"ごとく修饰动词相当于ように，ごとき修饰名词相当于ような，ごとし是终止形。"},{"id":"g437","level":"N1","pattern":"ことだから／こととて／ことだし","meaning":"正因为…所以…／由于…","cat":"reason","formation":"体言 + のこととて／ことだから","examples":[{"jp":"10年ぶりのこととて、すぐにはわからなかった。","r":"じゅうねんぶりのこととて、すぐにはわからなかった。","zh":"因为相隔十年，所以没能立刻认出来。"},{"jp":"慣れない土地のことだから、少し不安だ。","r":"なれないとちのことだから、すこしふあんだ。","zh":"因为是不熟悉的土地，所以有点不安。"}],"note":"表示“即使是…（であっても）”时只能用こととて。"},{"id":"g438","level":"N1","pattern":"ことなく／ことなしに（は）","meaning":"不…而…／没有…","cat":"negative","formation":"动词连体形 + ことなく／ことなしに","examples":[{"jp":"日曜日も休むことなしに働いた。","r":"にちようびもやすむことなしにはたらいた。","zh":"星期天也不休息地工作。"},{"jp":"彼は一度も弱音を吐くことなく、最後まで走り抜いた。","r":"かれはいちどもよわねをはくことなく、さいごまではしりぬいた。","zh":"他从没叫过一声苦，一直跑到了最后。"}],"note":"ことなしには、ことなくして（は）表示“（如果）不…就不能…”。"},{"id":"g439","level":"N1","pattern":"始末だ","meaning":"（消极的）结果／落得…的下场","cat":"state","formation":"动词连体形 + 始末だ","examples":[{"jp":"事業を始めたが失敗して、借金だけが残る始末だった。","r":"じぎょうをはじめたがしっぱいして、しゃっきんだけがのこるしまつだった。","zh":"事业刚开始就失败了，结果只剩下债务。"},{"jp":"彼は怒りすぎて、机を叩く始末だ。","r":"かれはおこりすぎて、つくえをたたくしまつだ。","zh":"他气到极点，竟落得拍桌子（的下场）。"}],"note":"表示事情、经过的结果，一般指不好的结果。"},{"id":"g440","level":"N1","pattern":"ずにはおかない／ないではおかない","meaning":"必定…／必然…","cat":"oblig","formation":"动词未然形 + ずにはおかない","examples":[{"jp":"神は罪を犯したものには、罰を与えずにはおかない。","r":"かみはつみをおかしたものには、ばつをあたえずにはおかない。","zh":"神对犯了罪的人必定会给予惩罚。"},{"jp":"その映画は、見る者を感動させずにはおかない。","r":"そのえいがは、みるものをかんどうさせずにはおかない。","zh":"那部电影必定会让观众感动。"}],"note":"与“ずにはいられない（不由得…）”相区别。"},{"id":"g441","level":"N1","pattern":"ずにはすまない／ないではすまない","meaning":"不得不…／不…不行","cat":"oblig","formation":"动词未然形 + ずにはすまない","examples":[{"jp":"学校の規則を破った私は、反省文を書かずにはすまない。","r":"がっこうのきそくをやぶったわたしは、はんせいぶんをかかずにはすまない。","zh":"违反了校规的我，不得不写检讨书。"},{"jp":"お世話になった恩人には、お礼を言わずにはすまない。","r":"おせわになったおんじんには、おれいをいわずにはすまない。","zh":"对关照过自己的恩人，不能不道谢。"}],"note":"与“ずにはいられない（不由得…）”相区别，此处指不得不做。"},{"id":"g442","level":"N1","pattern":"すら／さえ","meaning":"连…都…／甚至…","cat":"limit","formation":"名词（+ 助词） + すら／さえ","examples":[{"jp":"あの子は、自分の名前すら書けない。","r":"あのこは、じぶんのなまえすらかけない。","zh":"那个孩子连自己的名字都不会写。"},{"jp":"彼は忙しくて、食事をする時間さえなかった。","r":"かれはいそがしくて、しょくじをするじかんさえなかった。","zh":"他忙得连吃饭的时间都没有。"}],"note":"すら带有轻视口气，多用于不好的情况；さえ好坏皆可用。"},{"id":"g443","level":"N1","pattern":"そばから","meaning":"刚…就…／紧接着…","cat":"time","formation":"动词连体形 + そばから","examples":[{"jp":"春の雪は冬の雪と違って、降るそばから溶けてしまって、積もらない。","r":"はるのゆきはふゆのゆきとちがって、ふるそばからとけてしまって、つもらない。","zh":"春雪不同于冬雪，一边下一边就化了，积不起来。"},{"jp":"掃除するそばから、子供が散らかす。","r":"そうじするそばから、こどもがちらかす。","zh":"刚打扫完，孩子又弄乱了。"}],"note":"表示重复性的行为；が早いか表示一次性的行为。"},{"id":"g444","level":"N1","pattern":"ただ…のみだ／ただ…だけだ","meaning":"仅仅…／只有…","cat":"limit","formation":"动词连体形 + のみだ／だけだ","examples":[{"jp":"ただ女性のみが子供を産むことができる。","r":"ただじょせいのみがこどもをうむことができる。","zh":"只有女性才能生孩子。"},{"jp":"今はただ祈るのみだ。","r":"いまはただいのるのみだ。","zh":"现在唯有祈祷。"}]},{"id":"g445","level":"N1","pattern":"ただ…のみならず／ただ…だけでなく","meaning":"不仅…而且…","cat":"conj","formation":"动词连体形 + のみならず／だけでなく","examples":[{"jp":"彼はただ外見のみならず、性格もいい。","r":"かれはただがいけんのみならず、せいかくもいい。","zh":"他不仅外表好，性格也好。"},{"jp":"この本はただ面白いのみならず、ためになる。","r":"このほんはただおもしろいのみならず、ためになる。","zh":"这本书不仅有趣，而且有益。"}]},{"id":"g446","level":"N1","pattern":"たところで","meaning":"即使…也…","cat":"reverse","formation":"动词た形 + ところで","examples":[{"jp":"何回やったところで、勝てないよ。相手は強すぎるんだから。","r":"なんかいやったところで、かてないよ。あいてはつよすぎるんだから。","zh":"即使做多少次也赢不了，因为对手太强了。"},{"jp":"今さら後悔したところで、時間は戻らない。","r":"いまさらこうかいしたところで、じかんはもどらない。","zh":"事到如今再后悔，时间也不会倒流。"}],"note":"句末一般接否定，表示前面的条件即使成立也不起作用。"},{"id":"g447","level":"N1","pattern":"だに","meaning":"连…都…／仅…","cat":"limit","formation":"动词连体形 + だに","examples":[{"jp":"彼のことは、もうすっかり忘れた。夢にだに見ない。","r":"かれのことは、もうすっかりわすれた。ゆめにだにみない。","zh":"他的事我早已忘光，连梦里都不曾出现。"},{"jp":"あの日の光景は、思い出すだに胸が痛む。","r":"あのひのこうけいは、おもいだすだにむねがいたむ。","zh":"那天的一幕，光是想起就心痛。"}],"note":"后接否定较多，也可用于“连想都不敢想”等。"},{"id":"g448","level":"N1","pattern":"たりとも","meaning":"即使…也…","cat":"limit","formation":"数量词 + たりとも","examples":[{"jp":"父から送金してもらったお金は、1円たりとも無駄にはできない。","r":"ちちからそうきんしてもらったおかねは、いちえんたりともむだにはできない。","zh":"父亲寄来的钱，一分也不能浪费。"},{"jp":"一瞬たりとも目を離すな。","r":"いっしゅんたりともめをはなすな。","zh":"一刻也不能移开目光。"}],"note":"后接否定，文末也常用表示禁止的“な”。"},{"id":"g449","level":"N1","pattern":"たるもの（者）","meaning":"身为…就…／作为…","cat":"view","formation":"名词 + たるもの","examples":[{"jp":"「男たる者、女の前で涙は流せない」と彼は強がりを言った。","r":"「おとこたるもの、おんなのまえでなみだはながせない」とかれはつよがりをいった。","zh":"他逞强地说：“身为男人，不能在女人面前流泪。”"},{"jp":"学生たるもの、勉強を第一に考えるべきだ。","r":"がくせいたるもの、べんきょうをだいいちにかんがえるべきだ。","zh":"身为学生，应该把学习放在第一位。"}],"note":"たるもの表示“作为…，应该或必须…”；ともあろうものが表示“身为…竟然…”。"},{"id":"g450","level":"N1","pattern":"っぱなし","meaning":"一直…着不管／放任…","cat":"state","formation":"动词ます形 + っぱなし","examples":[{"jp":"玄関のドアを開けっぱなしにしないでください。虫が入ってくるから。","r":"げんかんのドアをあけっぱなしにしないでください。むしがはいってくるから。","zh":"请不要把玄关的门一直开着，虫子会进来的。"},{"jp":"テレビをつけっぱなしにして寝てしまった。","r":"テレビをつけっぱなしにしてねてしまった。","zh":"开着电视就睡着了。"}],"note":"多用于不好的情况，前面不接名词和否定形。"},{"id":"g451","level":"N1","pattern":"AつBつ","meaning":"一会儿…一会儿…／互相…","cat":"state","formation":"动词ます形 + つ + 动词ます形（相反动词） + つ","examples":[{"jp":"Aさんと私の成績は毎回抜きつ抜かれつで、お互いにいいライバルだ。","r":"Aさんとわたしのせいせきはまいかいぬきつぬかれつで、おたがいにいいライバルだ。","zh":"我和小A的成绩每次都是你追我赶，是很好的竞争对手。"},{"jp":"二人は持ちつ持たれつの関係だ。","r":"ふたりはもちつもたれつのかんけいだ。","zh":"两人是互相扶持、彼此帮助的关系。"}],"note":"如行きつ戻りつ、浮きつ沈みつ、持ちつ持たれつ。"},{"id":"g452","level":"N1","pattern":"…であれ／…であろうと","meaning":"不管…／即使…","cat":"reverse","formation":"名词 + であれ／であろうと","examples":[{"jp":"お金持ちであれ悩みはある。","r":"おかねもちであれなやみはある。","zh":"即使是有钱人，也有烦恼。"},{"jp":"結果がどうであれ、最後までやるしかない。","r":"けっかがどうであれ、さいごまでやるしかない。","zh":"不管结果如何，只能坚持到最后。"}]},{"id":"g453","level":"N1","pattern":"…であれ…であれ","meaning":"无论…还是…","cat":"reverse","formation":"名词 + であれ + 名词 + であれ","examples":[{"jp":"男であれ女であれ、不況の今は就職することは難しい。","r":"おとこであれおんなであれ、ふきょうのいまはしゅうしょくすることはむずかしい。","zh":"无论男女，在不景气的现在找工作都很难。"},{"jp":"晴れであれ雨であれ、明日の遠足は決行する。","r":"はれであれあめであれ、あしたのえんそくはけっこうする。","zh":"无论晴雨，明天的远足都照常举行。"}]},{"id":"g454","level":"N1","pattern":"…でなくて何だろう／…といわずして…だ","meaning":"这不是…又是什么…／不…又怎能…","cat":"emote","formation":"体言 + でなくて何だろう","examples":[{"jp":"最近とてもさびしい。これがホームシックでなくて何だろう。","r":"さいきんとてもさびしい。これがホームシックでなくてなんだろう。","zh":"最近非常寂寞。这不是想家又是什么呢？"},{"jp":"こんなに苦しいのは、努力不足でなくて何だろう。","r":"こんなにくるしいのは、どりょくぶそくでなくてなんだろう。","zh":"这么痛苦，不是努力不够又是什么呢？"}],"note":"一般用于书面语。"},{"id":"g455","level":"N1","pattern":"ではあるまいし／ではあるまいに","meaning":"又不是…所以…","cat":"reason","formation":"体言 + ではあるまいし","examples":[{"jp":"赤ちゃんではあるまいし、自分のことは自分でしなさい。","r":"あかちゃんではあるまいし、じぶんのことはじぶんでしなさい。","zh":"又不是小孩子，自己的事情自己做。"},{"jp":"学生ではあるまいし、そんな簡単な問題がわからないはずがない。","r":"がくせいではあるまいし、そんなかんたんなもんだいがわからないはずがない。","zh":"又不是学生，这种简单的问题不可能不会。"}]},{"id":"g456","level":"N1","pattern":"てやまない","meaning":"衷心…／非常…","cat":"emote","formation":"动词て形 + やまない","examples":[{"jp":"事業の成功を祈ってやまない。","r":"じぎょうのせいこうをいのってやまない。","zh":"衷心祝愿事业成功。"},{"jp":"皆様のご健康をお祈りしてやみません。","r":"みなさまのごけんこうをおいのりしてやみません。","zh":"衷心祝愿大家身体健康。"}]},{"id":"g457","level":"N1","pattern":"と相まって","meaning":"与…相结合／加上…","cat":"reason","formation":"名词 + と相まって","examples":[{"jp":"昨日は日曜だったので、好天と相まって人出が多かった。","r":"きのうはにちようだったので、こうてんとあいまってひとでがおおかった。","zh":"昨天是星期天，加上天气晴好，外出的人很多。"},{"jp":"若さと経験が相まって、彼は見事な演技を見せた。","r":"わかさとけいけんがあいまって、かれはみごとなえんぎをみせた。","zh":"年轻与经验相结合，他展现了精彩的表演。"}],"note":"一般用于好的事情，不适用于不好的事情。"},{"id":"g458","level":"N1","pattern":"とあって","meaning":"正因为是…／因为…","cat":"reason","formation":"动词连体形／体言 + とあって","examples":[{"jp":"今朝は寒かったとあって、出勤する人たちは皆、厚いコートを着ている。","r":"けさはさむかったとあって、しゅっきんするひとたちはみな、あついコートをきている。","zh":"正因为今早很冷，上班的人们都穿着厚外套。"},{"jp":"人気の店とあって、開店前から行列ができている。","r":"にんきのみせとあって、かいてんまえからぎょうれつができている。","zh":"因为是有名的店，开店前就排起了长队。"}],"note":"表示已经发生的事，句末不用でしょう、かもしれない等推量。"},{"id":"g459","level":"N1","pattern":"とあっては、とあれば","meaning":"如果…就…／假如…","cat":"cond","formation":"动词连体形／体言 + とあっては／とあれば","examples":[{"jp":"社長の命令とあっては、聞かないわけにはいかない。","r":"しゃちょうのめいれいとあっては、きかないわけにはいかない。","zh":"如果是社长的命令，就不能不听。"},{"jp":"彼女の頼みとあれば、断れない。","r":"かのじょのたのみとあれば、ことわれない。","zh":"如果是她的请求，就无法拒绝。"}],"note":"とあっては常与“しないわけにはいかない”“するほかない”等呼应。"},{"id":"g460","level":"N1","pattern":"AといいBといい／AといわずBといわず","meaning":"不论…还是…／…也好…也好","cat":"conj","formation":"名词 + といい + 名词 + といい","examples":[{"jp":"そのレストランは料理といいサービスといい、申し分なかった。","r":"そのレストランはりょうりといいサービスといい、もうしぶんなかった。","zh":"那家餐厅无论是菜还是服务都无可挑剔。"},{"jp":"山といい川といい、この辺りの景色は素晴らしい。","r":"やまといいかわといい、このあたりのけしきはすばらしい。","zh":"无论是山还是河，这一带的景色都很美。"}],"note":"AといわずBといわず涵盖的范围更广，如“山といわず野といわず”。"},{"id":"g461","level":"N1","pattern":"といえども","meaning":"即使是…也…／虽说…可是…","cat":"reverse","formation":"动词终止形／体言 + といえども","examples":[{"jp":"親といえども、子供の将来を勝手に決めることはできない。","r":"おやといえども、こどものしょうらいをかってにきめることはできない。","zh":"即使是父母，也不能擅自决定孩子的未来。"},{"jp":"大企業といえども、この不況の影響を免れない。","r":"だいきぎょうといえども、このふきょうのえいきょうをまぬかれない。","zh":"即使是大企业，也难免受这次萧条的影响。"}]},{"id":"g462","level":"N1","pattern":"といったらない／といったらありはしない","meaning":"…极了／…得不得了","cat":"emote","formation":"体言 + といったらない","examples":[{"jp":"彼は不潔だといったらありゃしない。風呂は一ヶ月に1回だそうだ。","r":"かれはふけつだといったらありゃしない。ふろはひとつきにいっかいだそうだ。","zh":"他脏得不得了，听说一个月才洗一次澡。"},{"jp":"久しぶりに会えて、嬉しさといったらなかった。","r":"ひさしぶりにあえて、うれしさといったらなかった。","zh":"久别重逢，高兴得不得了。"}],"note":"表示程度很高。"},{"id":"g463","level":"N1","pattern":"ときたら／ときては／ときている","meaning":"提起…／说到…","cat":"quote","formation":"体言 + ときたら","examples":[{"jp":"最近の若者ときたら、礼儀も知らない。","r":"さいきんのわかものときたら、れいぎもしらない。","zh":"说到现在的年轻人，连礼仪都不懂。"},{"jp":"うちの息子ときたら、勉強は全然しない。","r":"うちのむすこときたら、べんきょうはぜんぜんしない。","zh":"说起我儿子，完全不用功。"}],"note":"后面一般带有一种抱怨的消极感情。"},{"id":"g464","level":"N1","pattern":"ところを","meaning":"正在…的时候（被…）／在…情况下…","cat":"time","formation":"动词连体形 + ところを","examples":[{"jp":"つまみ食いしているところを母に見つかってしまった。","r":"つまみぐいしているところをははにみつかってしまった。","zh":"偷吃的时候被妈妈发现了。"},{"jp":"お忙しいところを、わざわざ来ていただいてありがとうございます。","r":"おいそがしいところを、わざわざきていただいてありがとうございます。","zh":"百忙之中特意前来，非常感谢。"}],"note":"多与句末的すみません、ありがとう、申し訳ありません相呼应。"},{"id":"g465","level":"N1","pattern":"としたところで／としたって／にしたところで","meaning":"即使是…也…","cat":"reverse","formation":"体言 + としたところで／としたって","examples":[{"jp":"彼としたって、彼女が仕事をするのは反対ではなかった。","r":"かれとしたって、かのじょがしごとをするのははんたいではなかった。","zh":"即使是他，也不反对她去工作。"},{"jp":"専門家にしたところで、この問題は難しいだろう。","r":"せんもんかにしたところで、このもんだいはむずかしいだろう。","zh":"即使是专家，这个问题大概也很难吧。"}],"note":"としたって相当于としても。"},{"id":"g466","level":"N1","pattern":"とばかりに／と言わんばかりに","meaning":"好像要说…似的／显出…的样子","cat":"guess","formation":"动词未然形 + んばかりに／とばかりに","examples":[{"jp":"日曜日なのに妻は早く起きろとばかりに、掃除機をかけ始めた。","r":"にちようびなのにつまははやくおきろとばかりに、そうじきをかけはじめた。","zh":"明明是星期天，妻子却像催人早起似的开始用吸尘器。"},{"jp":"彼は「早く来い」と言わんばかりに手を振った。","r":"かれは「はやくこい」といわんばかりにてをふった。","zh":"他拼命挥手，好像在说“快点来”。"}]},{"id":"g467","level":"N1","pattern":"Aともなく／ともなしに","meaning":"无意之中…／漫不经心地…","cat":"state","formation":"动词原形 + ともなく／ともなしに","examples":[{"jp":"寝るともなしにベッドに横になっていたら、いつの間にかぐっすり眠っていた。","r":"ねるともなしにベッドによこになっていたら、いつのまにかぐっすりねむっていた。","zh":"无意中躺到床上，不知不觉就睡熟了。"},{"jp":"聞くともなく聞いていた会話の中に、名前が出てきた。","r":"きくともなくきいていたかいわのなかに、なまえがでてきた。","zh":"无意中听到的对话里，出现了那个名字。"}]},{"id":"g468","level":"N1","pattern":"ないものでもない","meaning":"并非不…／也有可能…","cat":"negative","formation":"动词未然形 + ないものでもない","examples":[{"jp":"一生懸命働けばマイホームが手に入らないものでもない。","r":"いっしょうけんめいはたらけばマイホームがてにはいらないものでもない。","zh":"拼命工作的话，也并非买不到自己的房子。"},{"jp":"頼まれれば、手伝わないものでもない。","r":"たのまれれば、てつだわないものでもない。","zh":"如果被拜托，也不是不能帮忙。"}]},{"id":"g469","level":"N1","pattern":"ながらに／ながらの","meaning":"…着／保持…状态","cat":"state","formation":"名词 + ながらに／ながらの","examples":[{"jp":"今回の事故で子供を失った母親は涙ながらに子供への思いを語った。","r":"こんかいのじこでこどもをうしなったははおやはなみだながらにこどもへのおもいをかたった。","zh":"在这次事故中失去孩子的母亲，流着泪讲述了对孩子的思念。"},{"jp":"彼は生まれながらにして音楽の才能に恵まれていた。","r":"かれはうまれながらにしておんがくのさいのうにめぐまれていた。","zh":"他天生就具有音乐才能。"}],"note":"涙ながら＝流着泪，居ながら＝坐在家里，生まれながら＝生来。"},{"id":"g470","level":"N1","pattern":"なくして／なくしては／なしに／なしには","meaning":"如果没有…就…","cat":"cond","formation":"名词 + なくして（は）／なしに（は）","examples":[{"jp":"皆さんの協力なくしては、完成させることはできませんでした。","r":"みなさんのきょうりょくなくしては、かんせいさせることはできませんでした。","zh":"没有大家的协助，就无法完成。"},{"jp":"彼は事前の連絡なしに休んだ。","r":"かれはじぜんのれんらくなしにやすんだ。","zh":"他事先没打招呼就请假了。"}],"note":"四个都有“不完成前项就无法完成后项”的意思；なしに还可表示“不…而…”。"},{"id":"g471","level":"N1","pattern":"なり／たなり","meaning":"一…就…／…着就…","cat":"time","formation":"动词连体形（现在形） + なり／たなり","examples":[{"jp":"帰宅するなり、また出かけてしまった。","r":"きたくするなり、またでかけてしまった。","zh":"刚回到家，就又出门了。"},{"jp":"彼はベッドに横になったなり、動かなかった。","r":"かれはベッドによこになったなり、うごかなかった。","zh":"他躺到床上就一动不动了。"}],"note":"前后必须用同一主语。"},{"id":"g472","level":"N1","pattern":"AなりBなり","meaning":"…也好…也好／或是…或是…","cat":"conj","formation":"名词／动词连体形 + なり + 名词／动词连体形 + なり","examples":[{"jp":"御用の際は、何なりとお申し付けください。","r":"ごようのさいは、なんなりとおもうしつけください。","zh":"有事的时候，请尽管吩咐。"},{"jp":"熱があるなら、薬を飲むなり氷で冷やすなりしなさい。","r":"ねつがあるなら、くすりをのむなりこおりでひやすなりしなさい。","zh":"如果发烧，就吃药或者用冰敷吧。"}],"note":"AなりBなり有从中择一的意思；AとかBとか没有选择的意思。"},{"id":"g473","level":"N1","pattern":"にあたらない／にはあたらない","meaning":"用不着…／不必…","cat":"negative","formation":"动词连体形 + にあたらない","examples":[{"jp":"今度の試験が悪かったといって、悲観するにあたらない。","r":"こんどのしけんがわるかったといって、ひかんするにあたらない。","zh":"虽说这次考得不好，也不必悲观。"},{"jp":"彼が優勝したからといって、驚くにあたらない。日頃の努力の結果だ。","r":"かれがゆうしょうしたからといって、おどろくにあたらない。ひごろのどりょくのけっかだ。","zh":"他夺冠并不值得惊讶，那是他平时努力的结果。"}]},{"id":"g474","level":"N1","pattern":"にあって","meaning":"在…下／处于…情况下","cat":"state","formation":"体言 + にあって","examples":[{"jp":"どんなに厳しい状況にあって、彼は笑顔を絶やさない。","r":"どんなにきびしいじょうきょうにあって、かれはえがおをたやさない。","zh":"无论身处多么严峻的情况，他都不失去笑容。"},{"jp":"忙しい毎日にあっても、運動の時間だけは確保している。","r":"いそがしいまいにちにあっても、うんどうのじかんだけはかくほしている。","zh":"即使在忙碌的每一天里，也确保运动的时间。"}],"note":"用于抽象情况，很多场合可换成“で”或“おいて”。"},{"id":"g475","level":"N1","pattern":"に至る／に至るまで／に至って","meaning":"到…为止／直至…","cat":"time","formation":"体言／动词连体形 + に至る（まで）","examples":[{"jp":"登山口から頂上に至る道路は、よく整備されていて歩きやすい。","r":"とざんぐちからちょうじょうにいたるどうろは、よくせいびされていてあるきやすい。","zh":"从登山口通往山顶的道路维护得很好，很好走。"},{"jp":"今日に至るまで、彼の行方はわかっていない。","r":"きょうにいたるまで、かれのゆくえはわかっていない。","zh":"直至今日，他的下落仍不明。"}],"note":"这里的に至って有“直到发生了A，才被迫做了B”之意，常含不满和愤怒。"},{"id":"g476","level":"N1","pattern":"に至っては／に至ると／に至っても","meaning":"至于…／到了…的地步","cat":"limit","formation":"体言／动词连体形 + に至っては","examples":[{"jp":"孫に至っては、祖母の年齢どころか名前も知らない。","r":"まごにいたっては、そぼのねんれいどころかなまえもしらない。","zh":"至于孙子，别说祖母的年龄，连名字都不知道。"},{"jp":"資金難に至っては、とても一人では解決できない。","r":"しきんなんにいたっては、とてもひとりではかいけつできない。","zh":"到了资金困难的地步，一个人根本无法解决。"}],"note":"句末一般都是否定。"},{"id":"g477","level":"N1","pattern":"にかかわる／にかかわらず","meaning":"关系到…／不管…","cat":"view","formation":"体言 + にかかわる／にかかわらず","examples":[{"jp":"あなたの将来にかかわることだから、進路についてはよく考えなさい。","r":"あなたのしょうらいにかかわることだから、しんろについてはよくかんがえなさい。","zh":"因为关系到你的将来，关于前途要认真考虑。"},{"jp":"晴雨にかかわらず、運動会は予定通り行う。","r":"せいうにかかわらず、うんどうかいはよていどおりおこなう。","zh":"无论晴雨，运动会都按计划举行。"}],"note":"にかかわらず前面一般有两种情况，如“晴雨にかかわらず”。"},{"id":"g478","level":"N1","pattern":"にかたくない","meaning":"不难…／很容易就…","cat":"potential","formation":"动词连体形 + にかたくない","examples":[{"jp":"田舎に住んでいる人が都会に憧れる心情は理解にかたくない。","r":"いなかにすんでいるひとがとかいにあこがれるしんじょうはりかいにかたくない。","zh":"住在乡下的人向往城市的心情不难理解。"},{"jp":"彼がどれほど悔しかったかは、想像にかたくない。","r":"かれがどれほどくやしかったかは、そうぞうにかたくない。","zh":"他当时多么懊悔，不难想象。"}],"note":"不用于客观事实的陈述，多表达心理想法，如想像にかたくない。"},{"id":"g479","level":"N1","pattern":"にして","meaning":"1) 只有…才… 2) 就连…都…","cat":"limit","formation":"体言 + にして","examples":[{"jp":"先生にして解けない問題なのだから、私にできるわけがない。","r":"せんせいにしてとけないもんだいなのだから、わたしにできるわけがない。","zh":"既然是连老师都解不出的题，我当然不会。"},{"jp":"彼は一瞬にして姿を消した。","r":"かれはいっしゅんにしてすがたをけした。","zh":"他一瞬间就消失了。"}],"note":"幸いにして＝幸而，一瞬にして＝一瞬间，緊急にして＝紧急之中。"},{"id":"g480","level":"N1","pattern":"に即して／即しては／即しても","meaning":"按照…／根据…","cat":"view","formation":"体言 + に即して","examples":[{"jp":"現実に即して考える。","r":"げんじつにそくしてかんがえる。","zh":"根据现实来考虑。"},{"jp":"現場の状況に即して、臨機応変に対応した。","r":"げんばのじょうきょうにそくして、りんきおうへんにたいおうした。","zh":"根据现场情况灵活应对。"}]},{"id":"g481","level":"N1","pattern":"にたえる／にたえない","meaning":"值得…／（不）堪…","cat":"potential","formation":"动词连体形 + にたえる／にたえない","examples":[{"jp":"彼のスピーチは聞くにたえないものだった。","r":"かれのスピーチはきくにたえないものだった。","zh":"他的演讲不堪入耳。"},{"jp":"彼の演奏は、何度でも聴くにたえるものだった。","r":"かれのえんそうは、なんどでもきくにたえるものだった。","zh":"他的演奏百听不厌。"}],"note":"用于主观评价。"},{"id":"g482","level":"N1","pattern":"に足る／に足りる／に値する","meaning":"值得…／足以…","cat":"potential","formation":"动词连体形 + に足る／に値する","examples":[{"jp":"彼は信頼するに足る人物だ。","r":"かれはしんらいするにたるじんぶつだ。","zh":"他是值得信赖的人。"},{"jp":"これは一見の価値に値する作品だ。","r":"これはいっけんのかちにあたいするさくひんだ。","zh":"这是值得一看的作品。"}],"note":"对外部对象作客观评价。"},{"id":"g483","level":"N1","pattern":"に引き換え／にひきかえて","meaning":"与…相反／与…完全不同","cat":"reverse","formation":"体言 + に引き換え","examples":[{"jp":"何事にも娘に甘い父に引き換え、母は厳しい。","r":"なにごとにもむすめにあまいちちにひきかえ、はははきびしい。","zh":"与对女儿事事宠爱的父亲相反，母亲很严厉。"},{"jp":"兄が活発なのに引き換え、弟はおとなしい。","r":"あにがかっぱつなのにひきかえ、おとうとはおとなしい。","zh":"哥哥活泼好动，与之相反弟弟很文静。"}],"note":"是对比手法的应用，前后情况相反。"},{"id":"g484","level":"N1","pattern":"に（も）まして","meaning":"比…更加…","cat":"compare","formation":"体言 + に（も）まして","examples":[{"jp":"12月になり、前にもまして寒くなってきた。","r":"じゅうにがつになり、まえにもましてさむくなってきた。","zh":"进入12月，比以前更冷了。"},{"jp":"兄にもまして、弟のほうが勉強熱心だ。","r":"あににもまして、おとうとのほうがべんきょうねっしんだ。","zh":"弟弟比哥哥更用功。"}]},{"id":"g485","level":"N1","pattern":"の至り","meaning":"…之至／无比…","cat":"emote","formation":"体言 + の至り","examples":[{"jp":"こんなに親切にしていただき、恐縮の至りです。","r":"こんなにしんせつにしていただき、きょうしゅくのいたりです。","zh":"承蒙如此厚待，实在惶恐之至。"},{"jp":"このような名誉をいただき、光栄の至りです。","r":"このようなめいよをいただき、こうえいのいたりです。","zh":"获得如此殊荣，无比荣幸。"}],"note":"感情用语，一般用于好的事情。"},{"id":"g486","level":"N1","pattern":"ばそれまでだ／たらそれまでだ","meaning":"那就完了／就无话可说","cat":"cond","formation":"动词假定形 + ばそれまでだ","examples":[{"jp":"一生懸命勉強しても、試験に落ちてしまえばそれまでだ。","r":"いっしょうけんめいべんきょうしても、しけんにおちてしまえばそれまでだ。","zh":"即使拼命学习，一旦考试不及格也就完了。"},{"jp":"どんなにいいアイデアでも、実行できなければそれまでだ。","r":"どんなにいいアイデアでも、じっこうできなければそれまでだ。","zh":"再好的点子，如果无法实行也就白搭。"}],"note":"と是必然的结果，ば是一般的判断，なら适用于一次性的事情。"},{"id":"g487","level":"N1","pattern":"べからず／べからざる／べきではない","meaning":"不可…／不应该…／禁止…","cat":"order","formation":"动词终止形（する・す） + べからず／べからざる","examples":[{"jp":"彼の行った不正は許すべからざる不法行為だ。","r":"かれのおこなったふせいはゆるすべからざるふほうこういだ。","zh":"他做的不正当行为是不可饶恕的违法行为。"},{"jp":"芝生に入るべからず。","r":"しばふにはいるべからず。","zh":"禁止踏入草坪。"}],"note":"禁止的内容不是个人的判断，而是社会的通念。"},{"id":"g488","level":"N1","pattern":"べく／べくもない","meaning":"为了…／不可能…","cat":"purpose","formation":"动词终止形（する・す） + べく／べくもない","examples":[{"jp":"英国へ留学するべく、貯金をしている。","r":"えいこくへりゅうがくするべく、ちょきんをしている。","zh":"为了去英国留学，正在攒钱。"},{"jp":"彼の実力は、私の及ぶべくもない。","r":"かれのじつりょくは、わたしのおよぶべくもない。","zh":"他的实力是我望尘莫及的。"}]},{"id":"g489","level":"N1","pattern":"まじ／まじき／あるまじき","meaning":"不应该／不可以","cat":"order","formation":"动词终止形 + まじき／あるまじき + 名词","examples":[{"jp":"ビールを飲んで騒ぐなんて、高校生にあるまじきことだ。","r":"ビールをのんでさわぐなんて、こうこうせいにあるまじきことだ。","zh":"喝着啤酒胡闹，是高中生不该做的事。"},{"jp":"教師にあるまじき発言だ。","r":"きょうしにあるまじきはつげんだ。","zh":"那是有失教师身份的发言。"}],"note":"まじ是终止形；まじき、あるまじき连接体言，用“…にあるまじき”。"},{"id":"g490","level":"N1","pattern":"までだ／までのことだ","meaning":"只好…／只是…罢了","cat":"state","formation":"动词原形 + までだ","examples":[{"jp":"給料が上がらないなら、会社をやめるまでだ。","r":"きゅうりょうがあがらないなら、かいしゃをやめるまでだ。","zh":"如果工资不涨，那只好辞职了。"},{"jp":"電車が来なければ、歩いて行くまでのことだ。","r":"でんしゃがこなければ、あるいていくまでのことだ。","zh":"如果电车不来，那就走着去吧。"}]},{"id":"g491","level":"N1","pattern":"めく","meaning":"显出…的样子／渐有…的气息","cat":"change","formation":"名词 + めく","examples":[{"jp":"日一日と春めいてきて、梅の花も咲き出した。","r":"ひいちにちとはるめいてきて、うめのはなもさきだした。","zh":"一天天春意渐浓，梅花也开了。"},{"jp":"彼女の言葉には、少し皮肉めいた響きがあった。","r":"かのじょのことはには、すこしひにくめいたひびきがあった。","zh":"她的话里带着一丝讽刺的意味。"}],"note":"春めく＝春意盎然，色めく＝活跃，皮肉めく＝带讽刺意味。"},{"id":"g492","level":"N1","pattern":"もさることながら","meaning":"…自不必说／不仅…","cat":"conj","formation":"体言 + もさることながら","examples":[{"jp":"タクシーの運転手さんは運転技術もさることながら、お客様への応対も丁寧だ。","r":"タクシーのうんてんしゅさんはうんてんぎじゅつもさることながら、おきゃくさまへのおうたいもていねいだ。","zh":"出租车司机不仅驾驶技术好，接待客人也很周到。"},{"jp":"この店は料理の味もさることながら、雰囲気が抜群だ。","r":"このみせはりょうりのあじもさることながら、ふんいきがばつぐんだ。","zh":"这家店不仅菜的味道好，氛围也极佳。"}],"note":"有转折的意思，后面的事项更重要。"},{"id":"g493","level":"N1","pattern":"ものを","meaning":"明明…却…","cat":"reverse","formation":"动词连体形 + ものを","examples":[{"jp":"もう少し勉強すれば、合格できたものを。","r":"もうすこしべんきょうすれば、ごうかくできたものを。","zh":"要是再努力一点就能及格了（可惜没有）。"},{"jp":"早く言ってくれれば、手伝ったものを。","r":"はやくいってくれれば、てつだったものを。","zh":"早点说的话，我就帮你了（可是你没说）。"}],"note":"表达对对方的不满、谴责、惋惜等心情。"},{"id":"g494","level":"N1","pattern":"や／否や","meaning":"一…就马上…","cat":"time","formation":"动词原形 + や／や否や","examples":[{"jp":"ラッシュ時のホームではドアが開くや否や、乗客がどっと電車から雪崩れ出た。","r":"ラッシュじのホームではドアがひらくやいなや、じょうきゃくがどっとでんしゃからなだれでた。","zh":"高峰时段的车站月台上，门一开乘客就一拥而出。"},{"jp":"彼は家に着くや否や、シャワーを浴びた。","r":"かれはいえにつくやいなや、シャワーをあびた。","zh":"他一到家就冲了个澡。"}],"note":"前后可以不是同一主语，也可以是同一主语；后面一般是人物的动作。"},{"id":"g495","level":"N1","pattern":"ゆえ／ゆえに／ゆえの","meaning":"因为…／由于…之故","cat":"reason","formation":"体言 + がゆえに／动词连体形 + ゆえに","examples":[{"jp":"日本は天然資源に乏しいがゆえに、工業原材料を海外からの輸入に依存している。","r":"にほんはてんねんしげんにとぼしいがゆえに、こうぎょうげんざいりょうをかいがいからのゆにゅうにいぞんしている。","zh":"日本因缺乏天然资源，工业原料依赖从国外进口。"},{"jp":"若さゆえの失敗もある。","r":"わかさゆえのしっぱいもある。","zh":"也有因年轻而犯下的失败。"}],"note":"强调一般性的真理。"},{"id":"g496","level":"N1","pattern":"をおいて／を除いて","meaning":"除了…之外（没有）","cat":"limit","formation":"体言 + をおいて","examples":[{"jp":"結婚相手は彼をおいてほかにはいないと思ったから、彼との結婚を決めた。","r":"けっこんあいてはかれをおいてほかにはいないとおもったから、かれとのけっこんをきめた。","zh":"因为觉得结婚对象除了他没有别人，所以决定与他结婚。"},{"jp":"この問題を解けるのは、彼をおいて他にいない。","r":"このもんだいをとけるのは、かれをおいてほかにいない。","zh":"能解开这道题的，除他之外没有别人。"}],"note":"后项接否定，表达除这个之外没有合适的对象。"},{"id":"g497","level":"N1","pattern":"を限りに／を潮に","meaning":"到…为止／以…为最后","cat":"time","formation":"体言 + を限りに／を潮に","examples":[{"jp":"今日を限りに、会社を辞めます。","r":"きょうをかぎりに、かいしゃをやめます。","zh":"今天是我在公司上班的最后一天。"},{"jp":"あの事故を潮に、彼はバイクに乗らなくなった。","r":"あのじこをしおに、かれはバイクにのらなくなった。","zh":"以那次事故为转折，他不再骑摩托车了。"}],"note":"を潮に一般用于不好的事情停止做。"},{"id":"g498","level":"N1","pattern":"を皮切りに／を皮切りにして／を皮切りとして","meaning":"以…为开端","cat":"time","formation":"体言 + を皮切りに","examples":[{"jp":"担当者の逮捕を皮切りに、汚職事件の真相が次々と明らかになった。","r":"たんとうしゃのたいほをかわきりに、おしょくじけんのしんそうがつぎつぎとあきらかになった。","zh":"以责任人被捕为开端，贪污事件的真相接连被查明。"},{"jp":"東京公演を皮切りに、全国ツアーが始まる。","r":"とうきょうこうえんをかわきりに、ぜんこくツアーがはじまる。","zh":"以东京公演为开端，全国巡演即将开始。"}],"note":"前后指同一类行动；如果后项是新的行动，一般用“をきっかけに”。"},{"id":"g499","level":"N1","pattern":"を禁じ得ない","meaning":"不禁…／忍不住…","cat":"emote","formation":"体言 + を禁じ得ない","examples":[{"jp":"詐欺にあい土地まで取られてしまったそうだ。同情を禁じ得ない。","r":"さぎにあいとちまでとられてしまったそうだ。どうじょうをきんじえない。","zh":"听说被诈骗连土地都被夺走了，不禁深感同情。"},{"jp":"彼の突然の辞任には、驚きを禁じ得なかった。","r":"かれのとつぜんのじにんには、おどろきをきんじえなかった。","zh":"对于他突然辞职，不禁感到惊讶。"}],"note":"表达一种感情，如禁不住哭、同情、失望、高兴、悲伤等。"},{"id":"g500","level":"N1","pattern":"をものともせずに","meaning":"不顾…／不在乎…","cat":"reverse","formation":"体言 + をものともせず（に）","examples":[{"jp":"彼は周囲の反対をものともせず、自分が正しいと思う道を歩み続けた。","r":"かれはしゅういのはんたいをものともせず、じぶんがただしいとおもうみちをあゆみつづけた。","zh":"他不顾周围人的反对，继续走自己认为正确的路。"},{"jp":"台風をものともせずに、船は港を出航した。","r":"たいふうをものともせずに、ふねはみなとをしゅっこうした。","zh":"无视台风，船驶出了港口。"}],"note":"在知道困难障碍的情况下依然不顾，表达对行为者勇气的赞赏。"},{"id":"g501","level":"N1","pattern":"んがため／んがために／んがための","meaning":"为了要…／打算…","cat":"purpose","formation":"动词未然形 + んがため（に／の）","examples":[{"jp":"試合に勝たんがため、日夜練習に励んでいる。","r":"しあいにかったんがため、にちやれんしゅうにはげんでいる。","zh":"为了赢得比赛，日夜苦练。"},{"jp":"夢を実現せんがために、彼は必死に働いた。","r":"ゆめをじつげんせんがために、かれはひっしにはたらいた。","zh":"为了实现梦想，他拼命工作。"}],"note":"口语一般不用，多用于书面语。"},{"id":"g502","level":"N1","pattern":"んばかりだ／んばかりに／んばかりの","meaning":"几乎要…／眼看就要…","cat":"guess","formation":"动词未然形（サ变动词为せ） + んばかり（だ／に／の）","examples":[{"jp":"今にも雨が降り出さんばかりの空模様になった。","r":"いまにもあめがふりださんばかりのそらもようになった。","zh":"天空一副眼看就要下雨的样子。"},{"jp":"彼は今にも泣き出さんばかりの顔をしていた。","r":"かれはいまにもなきださんばかりのかおをしていた。","zh":"他一副马上就要哭出来的表情。"}]},{"id":"g503","level":"N1","pattern":"…か、さもなければ…だ","meaning":"不是…的话就是…／否则就…","cat":"cond","formation":"体言 + か、さもなければ + 体言 + だ","examples":[{"jp":"そんなことをするのは、天才か、さもなければ狂人だ。","r":"そんなことをするのは、てんさいか、さもなければきょうじんだ。","zh":"能做这种事的人，不是天才就是疯子。"},{"jp":"彼が来ないなら、さもなければ電話をかけてみよう。","r":"かれがこないなら、さもなければでんわをかけてみよう。","zh":"如果他还不来，那就打个电话试试吧。"}]},{"id":"g504","level":"N1","pattern":"…きって","meaning":"…中最…／…中的第一","cat":"limit","formation":"范围名词 + きって","examples":[{"jp":"彼はクラスきっての成績を取った。","r":"かれはクラスきってのせいせきをとった。","zh":"他取得了全班第一的成绩。"},{"jp":"この町きっての料理店は、あの老舗だ。","r":"このまちきってのりょうりてんは、あのしにせだ。","zh":"这座城里数一数二的料理店，就是那家老店。"}]},{"id":"g505","level":"N1","pattern":"くらいなら","meaning":"与其…不如…","cat":"compare","formation":"动词连体形 + くらいなら","examples":[{"jp":"あいつに助けてもらうくらいなら、死んだほうがましだ。","r":"あいつにたすけてもらうくらいなら、しんだほうがましだ。","zh":"与其求那家伙帮忙，还不如死了痛快。"},{"jp":"途中でやめるくらいなら、最初からやらないほうがいい。","r":"とちゅうでやめるくらいなら、さいしょからやらないほうがいい。","zh":"与其半途而废，还不如一开始就不做。"}]},{"id":"g506","level":"N1","pattern":"…こそすれ…ない／…こそあれ…ない","meaning":"只…而决不…／即使…也绝不…","cat":"reverse","formation":"动词ます形 + こそすれ／名词 + でこそあれ","examples":[{"jp":"あなたのその言い方は、皮肉でこそあれ、決してユーモアとはならない。","r":"あなたのそのいいかたは、ひにくでこそあれ、けしてユーモアとはならない。","zh":"你那种说法只能算是讽刺，绝算不上幽默。"},{"jp":"彼は恩を忘れはこそすれ、仇で返すようなことはしない。","r":"かれはおんをわすれはこそすれ、あだでかえすようなことはしない。","zh":"他即使会忘记恩情，也绝不会以怨报德。"}]},{"id":"g507","level":"N1","pattern":"…ずじまい","meaning":"最终没能…／不了了之","cat":"negative","formation":"动词未然形 + ずじまい","examples":[{"jp":"出張で香港へ行ったが、忙しくて友達には会わずじまいだった。","r":"しゅっちょうでほんこんへいったが、いそがしくてともだちにはあわずじまいだった。","zh":"出差去了香港，但因为忙，结果连朋友都没见成。"},{"jp":"せっかく買った本も、結局最後まで読まずじまいだった。","r":"せっかくかったほんも、けっきょくさいごまでよまずじまいだった。","zh":"特意买的书，结果还是没读到最后一页。"}],"note":"带有后悔、遗憾的口气。"},{"id":"g508","level":"N1","pattern":"だけのことはある","meaning":"值得…／没有白…","cat":"state","formation":"动词连体形 + だけのことはある","examples":[{"jp":"うまい魚だ。取れたてを送ってもらっただけのことはある。","r":"うまいさかなだ。とれたてをおくってもらっただけのことはある。","zh":"这鱼真好吃，没白让人特意送来新鲜的。"},{"jp":"苦労しただけのことはあって、努力が報われた。","r":"くろうしただけのことはあって、どりょくがむくわれた。","zh":"辛苦没有白费，努力得到了回报。"}]},{"id":"g509","level":"N1","pattern":"〜なり〜なり","meaning":"…也好…也好／或是…或是…","cat":"conj","formation":"名词／动词连体形 + なり + 名词／动词连体形 + なり","examples":[{"jp":"彼の父親なり母親なりに相談しなければならないだろう。","r":"かれのちちおやなりははおやなりにそうだんしなければならないだろう。","zh":"必须和他的父亲或母亲商量一下吧。"},{"jp":"叱るなり褒めるなり、はっきり態度を示してほしい。","r":"しかるなりほめるなり、はっきりたいどをしめしてほしい。","zh":"批评也好表扬也好，希望明确表明态度。"}]},{"id":"g510","level":"N1","pattern":"…のなんのって／なんのなんの","meaning":"别提有多…／…得不得了","cat":"emote","formation":"动词简体／形容词 + のなんのって","examples":[{"jp":"驚いたのなんのって、すっかり変わっちゃってるんだ。","r":"おどろいたのなんのって、すっかりかわちゃってるんだ。","zh":"别提多惊讶了，简直完全变了个人。"},{"jp":"新しい仕事は忙しいのなんのって、休む暇もない。","r":"あたらしいしごとはいそがしいのなんのって、やすむひまもない。","zh":"新工作忙得不得了，连休息的空闲都没有。"}]},{"id":"g511","level":"N1","pattern":"…ふう／ふうだ／ふうをする","meaning":"…的样子／…似的","cat":"state","formation":"名词、形容词、动词简体（形容动词 + な） + ふう","examples":[{"jp":"あの男は何気ないふうを装って近づいてきた。","r":"あのおとこはなにげないふうをよそおってちかづいてきた。","zh":"那个男人装出若无其事的样子靠近过来。"},{"jp":"彼は知っているふうな顔をしている。","r":"かれはしっているふうなかおをしている。","zh":"他摆出一副好像知道的样子。"}]},{"id":"g512","level":"N1","pattern":"ほかない／ほかはない","meaning":"只好…／只得…","cat":"oblig","formation":"动词简体 + ほかない／ほかはない","examples":[{"jp":"もうあきらめるほかない。","r":"もうあきらめるほかない。","zh":"只能放弃了。"},{"jp":"彼が行かないなら、私が行くほかはない。","r":"かれがいかないなら、わたしがいくほかはない。","zh":"如果他不去，那就只好我去了。"}]},{"id":"g513","level":"N1","pattern":"…ほど（のこと）ではない","meaning":"没有达到…的地步／不至于…","cat":"compare","formation":"动词连体形 + ほどではない","examples":[{"jp":"医者に行くほどのけがではない。","r":"いしゃにいくほどのけがではない。","zh":"这伤还没到要去看医生的地步。"},{"jp":"怒るほどのことではないよ。","r":"おこるほどのことではないよ。","zh":"还没到值得生气的程度。"}]},{"id":"g514","level":"N1","pattern":"…まがい","meaning":"近乎…／近似…","cat":"guess","formation":"名词 + まがい（の）","examples":[{"jp":"機械まがいにスタッフを取り扱う。","r":"きかいまがいにスタッフをとりあつかう。","zh":"像对待机器一样对待员工。"},{"jp":"恐喝まがいの手段を取るのはやめるべきだ。","r":"きょうかつまがいのしゅだんをとるのはやめるべきだ。","zh":"应该停止近乎恐吓的手段。"}]},{"id":"g515","level":"N1","pattern":"…まくる","meaning":"一个劲儿地…／反复地…","cat":"state","formation":"动词ます形 + まくる","examples":[{"jp":"おいしくて食べまくっている。","r":"おいしくてたべまくっている。","zh":"因为好吃，所以一个劲儿地吃。"},{"jp":"二人はしゃべりまくって話が弾んだ。","r":"ふたりはしゃべりまくってはなしがはずんだ。","zh":"两人聊个不停，谈得热火朝天。"}]},{"id":"g516","level":"N1","pattern":"…もあろうに","meaning":"竟然…／偏偏就是…（意外语气）","cat":"emote","formation":"名词 + もあろうに","examples":[{"jp":"時もあろうに、試験中、トイレに行きたくなってしまった。","r":"ときもあろうに、しけんちゅう、トイレにいきたくなってしまった。","zh":"偏偏在考试的时候想上厕所。"},{"jp":"人が大勢いる所もあろうに、そこで大声で叫ぶなんて。","r":"ひとがおおぜいいるところもあろうに、そこでおおごえでさけぶなんて。","zh":"偏偏在人多的地方大声喊叫。"}]},{"id":"g517","level":"N1","pattern":"よりほかはない／よりほかない","meaning":"除…之外没有…／只好…","cat":"oblig","formation":"动词简体 + よりほかはない","examples":[{"jp":"彼までもう言うなら、僕も黙っているよりほかはない。","r":"かれまでもういうなら、ぼくもだまっているよりほかはない。","zh":"连他都这么说了，我也只好沉默。"},{"jp":"こうなった以上、謝るよりほかない。","r":"こうなったいじょう、あやまるよりほかない。","zh":"事已至此，只能道歉。"}]},{"id":"g518","level":"N1","pattern":"をピークにして／を境にして","meaning":"以…为顶峰／以…为转折","cat":"time","formation":"体言 + をピークに／を境に","examples":[{"jp":"選挙の勝利をピークに、彼の政治生涯は花盛りとなった。","r":"せんきょのしょうりをピークに、かれのせいじしょうがいははなざかりとなった。","zh":"以选举胜利为巅峰，他的政治生涯如日中天。"},{"jp":"この曲を境に、彼らの人気は急上昇した。","r":"このきょくをさかいに、かれらのにんきはきゅうじょうしょうした。","zh":"以这首歌为转折点，他们的人气急剧上升。"}]},{"id":"g519","level":"N1","pattern":"…たると…たるとを問わず","meaning":"无论是…还是…都","cat":"reverse","formation":"名词 + たると + 名词 + たるとを問わず","examples":[{"jp":"この法律は市民たると外国人たるとを問わず、等しく適用される。","r":"このほうりつはしみんたるとがいこくじんたるとをとわず、ひとしくてきようされる。","zh":"这部法律无论对市民还是外国人都一律适用。"},{"jp":"経験者たると初心者たるとを問わず、誰でも参加できます。","r":"けいけんしゃたるとしょしんしゃたるとをとわず、だれでもさんかできます。","zh":"无论老手还是新手，谁都可以参加。"}]},{"id":"g520","level":"N1","pattern":"た拍子に","meaning":"一…就…／…的瞬间","cat":"time","formation":"动词た形 + 拍子に","examples":[{"jp":"立ち上がった拍子に頭をぶつけた。","r":"たちあがったひょうしにあたまをぶつけた。","zh":"站起来的一瞬间撞了头。"},{"jp":"バランスを崩した拍子に、花瓶を倒してしまった。","r":"バランスをくずしたひょうしに、かびんをたおしてしまった。","zh":"失去平衡的一瞬间，把花瓶碰倒了。"}]},{"id":"g521","level":"N1","pattern":"…てしょうがない","meaning":"…得不得了","cat":"emote","formation":"形容词く形／动词て形 + しょうがない","examples":[{"jp":"赤ちゃんが朝から泣いてしょうがない。","r":"あかちゃんがあさからないてしょうがない。","zh":"婴儿从早上就哭个不停。"},{"jp":"試験の結果が気になってしょうがない。","r":"しけんのけっかがきになってしょうがない。","zh":"特别在意考试结果，静不下心来。"}]},{"id":"g522","level":"N1","pattern":"…て（は）たまらない","meaning":"…得不得了／非常…","cat":"emote","formation":"形容词く形／动词て形／形容动词 + てたまらない","examples":[{"jp":"彼女に会いたくてたまらない。","r":"かのじょにあいたくてたまらない。","zh":"非常想见她。"},{"jp":"初めての海外旅行が中止になって、残念でたまらない。","r":"はじめてのかいがいりょこうがちゅうしになって、ざんねんでたまらない。","zh":"第一次出国旅行被取消了，遗憾得不得了。"}]},{"id":"g523","level":"N1","pattern":"…て（は）いられない／で（は）いられない","meaning":"不能继续…／不能维持现有状态","cat":"negative","formation":"动词て形 + いられない","examples":[{"jp":"この事態を傍観してはいられない。","r":"このじたいをぼうかんしてはいられない。","zh":"不能再对这种事态袖手旁观了。"},{"jp":"ずっと大学にいたいが、いつまでもそうしてはいられない。","r":"ずっとだいがくにいたいが、いつまでもそうしてはいられない。","zh":"虽然想一直待在学校，但不能永远这样下去。"}]},{"id":"g524","level":"N1","pattern":"…てでも","meaning":"即便…也…","cat":"reverse","formation":"动词て形 + でも","examples":[{"jp":"仕事をやめてでも、親の介護をしなければならない。","r":"しごとをやめてでも、おやのかいごをしなければならない。","zh":"即便辞掉工作，也必须照顾父母。"},{"jp":"借金をしてでも、子供に教育を受けさせたい。","r":"しゃっきんをしてでも、こどもにきょういくをうけさせたい。","zh":"即便借钱，也想让孩子接受教育。"}],"note":"前后主语一致。"},{"id":"g525","level":"N1","pattern":"…てまで","meaning":"甚至…／不惜…","cat":"limit","formation":"动词て形 + まで","examples":[{"jp":"借金をしてまで、車を買う必要があるもんか。","r":"しゃっきんをしてまで、くるまをかうひつようがあるもんか。","zh":"没有必要借钱去买车吧。"},{"jp":"体を壊してまで、仕事を続けるべきではない。","r":"からだをこわしてまで、しごとをつづけるべきではない。","zh":"不该不惜弄坏身体也要继续工作。"}]},{"id":"g526","level":"N1","pattern":"…ても始まらない","meaning":"…也无济于事","cat":"negative","formation":"动词て形 + も始まらない","examples":[{"jp":"こういうところに至っては、どう悔やんでも始まらない。","r":"こういうところにいたっては、どうくやんでもはじまらない。","zh":"事已至此，再怎么后悔也无济于事。"},{"jp":"今さら泣いても始まらない。次に進もう。","r":"いまさらないてもはじまらない。つぎにすすもう。","zh":"事到如今哭也没用，向前看吧。"}]},{"id":"g527","level":"N1","pattern":"…ところだった","meaning":"几乎…／差点就…","cat":"guess","formation":"动词原形 + ところだった","examples":[{"jp":"もう少しで原稿の締め切りに間に合わなくなるところだった。","r":"もうすこしでげんこうのしめきりにまにあわなくなるところだった。","zh":"差点没赶上截稿日期。"},{"jp":"もう少しで階段から落ちるところだった。","r":"もうすこしでかいだんからおちるところだった。","zh":"差一点就从楼梯上摔下去。"}]},{"id":"g528","level":"N1","pattern":"…としたら、…とすると、…とすれば","meaning":"如果…（纯属假设）","cat":"cond","formation":"名词／简体句 + としたら／とすると／とすれば","examples":[{"jp":"ここに二百万あるとしたら、どう使いますか。","r":"ここににひゃくまんあるとしたら、どうつかいますか。","zh":"假如这里有二百万，你会怎么用呢？"},{"jp":"その話が本当だとしたら、大変なことだ。","r":"そのはなしがほんとうだとしたら、たいへんなことだ。","zh":"如果那件事是真的，那就麻烦了。"}]},{"id":"g529","level":"N1","pattern":"…とやら","meaning":"叫做…的（指不确定的传闻内容）","cat":"quote","formation":"名词／动词简体 + とやら","examples":[{"jp":"模擬試験とやらをやるそうだ。","r":"もぎしけんとやらをやるそうだ。","zh":"听说要进行什么模拟考试。"},{"jp":"委員長とやらがやってきた。","r":"いいんちょうとやらがやってきた。","zh":"来了个什么委员长。"}]},{"id":"g530","level":"N1","pattern":"…ならいざ知らず、…ならともかく","meaning":"如果是…的话就另当别论","cat":"cond","formation":"名词（+の） + ならいざ知らず","examples":[{"jp":"新入社員ならいざ知らず、入社8年にもなる君がこんなミスをするとは信じられない。","r":"しんにゅうしゃいんならいざしらず、にゅうしゃはちねんにもなるきみがこんなミスをするとはしんじられない。","zh":

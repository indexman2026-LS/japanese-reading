<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語読書館 · N5→N1 読む・学ぶ</title>
<meta name="description" content="日语分级阅读与文法学习网站。覆盖 JLPT N5-N1 文法，点击单词即时查义，振假名可切换，朗读发音。">
<style>
  :root {
    --bg: #F7F4EE;
    --paper: #FFFFFF;
    --ink: #2A2A2A;
    --ink-soft: #5A5A5A;
    --ink-faint: #999;
    --line: #E5E0D5;
    --accent: #7A4A2E;
    --accent-soft: #F2E8DA;
    --green: #3F7A4E;
    --green-soft: #E5F0E0;
    --blue: #2C5F7C;
    --blue-soft: #DCE9F0;
    --amber: #B08020;
    --amber-soft: #F5EBD0;
    --purple: #6B4A8E;
    --purple-soft: #ECE3F2;
    --ruby: #8B3A3A;
    --ruby-soft: #F4E0E0;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
    --serif: 'Hiragino Mincho ProN','Yu Mincho','YuMincho','MS Mincho','Songti SC',Georgia,serif;
    --sans: 'Hiragino Sans','Yu Gothic','Meiryo','PingFang SC','Microsoft YaHei',sans-serif;
  }

  /* Themes */
  body.theme-paper { --bg:#F7F4EE; --paper:#FFFFFF; --ink:#2A2A2A; --line:#E5E0D5; }
  body.theme-sepia { --bg:#F4ECD8; --paper:#FBF3DF; --ink:#3B2F1E; --ink-soft:#5C4A30; --line:#E2D6B8; --accent-soft:#EFE3C8; }
  body.theme-dark  { --bg:#1B1B1F; --paper:#25252A; --ink:#E5E2DA; --ink-soft:#B5B0A4; --ink-faint:#777271; --line:#3A3A40; --accent:#C9A87A; --accent-soft:#3A2F22; --green-soft:#2A3528; --blue-soft:#243038; --amber-soft:#3A2F1A; --purple-soft:#2E2740; --ruby-soft:#3A2326; }

  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; }
  body {
    font-family: var(--serif);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.8;
    font-size: 17px;
  }
  ruby rt { font-family: var(--sans); }
  body.no-furi rt { display:none; }
  body.no-furi .ex-r, body.no-furi .v-r { display:none; }

  /* ===== Top bar ===== */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    box-shadow: var(--shadow);
  }
  .brand {
    font-family: var(--serif); font-weight: 700; font-size: 19px;
    color: var(--accent); letter-spacing: .02em; white-space: nowrap;
  }
  .brand .sub { font-size: 11px; color: var(--ink-faint); font-weight: 400; margin-left: 8px; letter-spacing: .06em; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    background: transparent; border: 1px solid transparent;
    color: var(--ink-soft); padding: 6px 14px; border-radius: 9px;
    cursor: pointer; font-family: var(--serif); font-size: 15px;
    transition: all .12s;
  }
  .tab:hover { color: var(--accent); background: var(--accent-soft); }
  .tab.on { background: var(--accent); color: #fff; }
  .topbar .spacer { flex: 1; }

  .filter-group { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); flex-wrap:wrap; }
  .filter-group .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin-right:2px; }
  .chip {
    background: transparent; border:1px solid var(--line); color:var(--ink-soft);
    padding:4px 10px; border-radius:14px; font-size:12.5px; cursor:pointer;
    font-family:var(--sans); transition:all .12s;
  }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chip.lv { font-weight:600; }
  .chip.lv.on[data-lv="N5"] { background:var(--green); border-color:var(--green); }
  .chip.lv.on[data-lv="N4"] { background:var(--blue); border-color:var(--blue); }
  .chip.lv.on[data-lv="N3"] { background:var(--amber); border-color:var(--amber); }
  .chip.lv.on[data-lv="N2"] { background:var(--purple); border-color:var(--purple); }
  .chip.lv.on[data-lv="N1"] { background:var(--ruby); border-color:var(--ruby); }

  .font-controls { display:flex; gap:4px; align-items:center; }
  .icon-btn {
    background:transparent; border:1px solid var(--line); width:32px; height:32px;
    border-radius:8px; cursor:pointer; color:var(--ink-soft); font-size:14px;
    display:flex; align-items:center; justify-content:center; font-family:var(--sans);
    transition:all .12s;
  }
  .icon-btn:hover { color:var(--accent); border-color:var(--accent); }
  .icon-btn.on { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
  .search-box {
    background:transparent; border:1px solid var(--line); border-radius:9px;
    padding:6px 12px; font-family:var(--sans); font-size:13px; color:var(--ink);
    width: 180px; transition:border-color .12s;
  }
  .search-box::placeholder { color:var(--ink-faint); }
  .search-box:focus { outline:none; border-color:var(--accent); }

  .theme-pick { display:flex; gap:4px; align-items:center; }
  .theme-dot { width:22px; height:22px; border-radius:50%; cursor:pointer; border:2px solid var(--line); transition:all .12s; }
  .theme-dot.paper { background:#F7F4EE; }
  .theme-dot.sepia { background:#F4ECD8; }
  .theme-dot.dark  { background:#25252A; }
  .theme-dot.on { border-color:var(--accent); transform:scale(1.15); }

  /* ===== Layout ===== */
  .layout {
    display: grid; grid-template-columns: 1fr 300px; gap: 28px;
    max-width: 1240px; margin: 24px auto; padding: 0 24px;
  }
  @media (max-width: 920px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { order: -1; position: static !important; height: auto !important; }
  }

  .view { display: none; }
  .view.on { display: block; }

  .toolbar {
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--line);
  }
  .toolbar .count { font-size:13px; color:var(--ink-soft); font-family:var(--sans); }
  .toolbar .count b { color:var(--accent); font-weight:700; }
  .toolbar .grow { flex:1; }

  /* ===== Article cards ===== */
  .article-card {
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:20px 24px; margin-bottom:13px; cursor:pointer;
    transition:transform .12s, box-shadow .12s, border-color .12s; box-shadow:var(--shadow);
  }
  .article-card:hover { transform:translateY(-2px); border-color:var(--accent); box-shadow:0 2px 4px rgba(0,0,0,.05),0 8px 20px rgba(0,0,0,.06); }
  .article-card .meta { display:flex; gap:10px; align-items:center; font-size:12px; color:var(--ink-faint); margin-bottom:8px; font-family:var(--sans); text-transform:uppercase; letter-spacing:.05em; flex-wrap:wrap; }
  .lv-badge { font-weight:700; padding:2px 9px; border-radius:10px; font-size:11px; color:#fff; }
  .lv-badge.N5 { background:var(--green); } .lv-badge.N4 { background:var(--blue); }
  .lv-badge.N3 { background:var(--amber); } .lv-badge.N2 { background:var(--purple); } .lv-badge.N1 { background:var(--ruby); }
  .article-card .meta .cat { color:var(--accent); font-weight:700; }
  .src { color:var(--accent); background:rgba(211,47,47,.08); border:1px solid rgba(211,47,47,.25); border-radius:999px; padding:1px 8px; font-size:11px; font-weight:700; letter-spacing:.02em; }
  .vocab-card .src, .g-src { display:inline-block; }
  .ex-src { font-size:11px; color:var(--accent); margin-top:3px; font-family:var(--sans); }
  .g-src { margin-left:8px; vertical-align:middle; }
  .article-card h3 { font-family:var(--serif); font-size:22px; font-weight:700; color:var(--ink); line-height:1.35; margin-bottom:6px; }
  .article-card h3 rt { font-size:11px; }
  .article-card .dek { font-size:14.5px; color:var(--ink-soft); line-height:1.55; margin-bottom:10px; font-family:var(--sans); }
  .article-card .stats { display:flex; gap:14px; font-size:12px; color:var(--ink-faint); font-family:var(--sans); align-items:center; }
  .article-card .stats .done { color:var(--green); font-weight:700; }
  .diff-stars { color:var(--amber); letter-spacing:1px; }
  .diff-stars .empty { color:var(--line); }

  /* ===== Reader ===== */
  .reader { display:none; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:36px 46px 42px; box-shadow:var(--shadow); }
  .reader.on { display:block; }
  .reader .back-btn {
    background:transparent; border:1px solid var(--line); color:var(--ink-soft);
    padding:6px 14px; border-radius:8px; cursor:pointer; font-family:var(--sans); font-size:13px; margin-bottom:16px; transition:all .12s;
  }
  .reader .back-btn:hover { border-color:var(--accent); color:var(--accent); }
  .reader .meta { font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px; display:flex; gap:10px; align-items:center; font-family:var(--sans); flex-wrap:wrap; }
  .reader h1 { font-family:var(--serif); font-size:32px; font-weight:700; line-height:1.3; color:var(--ink); margin-bottom:12px; }
  .reader h1 rt { font-size:13px; }
  .reader .dek { font-size:16px; color:var(--ink-soft); line-height:1.6; margin-bottom:22px; font-family:var(--sans); }
  .reader .body { font-size:var(--reading-size,19px); line-height:2.0; color:var(--ink); }
  .reader .body p { margin-bottom:1.2em; }
  .reader .body p:first-of-type::first-letter { font-size:3em; float:left; line-height:.92; margin:8px 8px 0 0; color:var(--accent); font-weight:700; }
  .reader .end-mark { text-align:center; color:var(--ink-faint); font-size:18px; margin:30px 0 12px; letter-spacing:.4em; }
  .reader .post-stats { margin-top:20px; padding-top:18px; border-top:1px dashed var(--line); font-size:13px; color:var(--ink-soft); display:flex; gap:16px; flex-wrap:wrap; font-family:var(--sans); align-items:center; }
  .reader .post-stats .mark { color:var(--green); cursor:pointer; font-weight:700; }
  .reader .post-stats .mark:hover { text-decoration:underline; }
  .reader .post-stats .mark.done { color:var(--ink-faint); cursor:default; font-weight:400; }

  /* clickable words */
  .w {
    cursor:pointer; border-bottom:1px dotted var(--ink-faint);
    transition:background .08s, border-color .08s; border-radius:2px;
  }
  .w:hover { background:var(--accent-soft); border-bottom-color:var(--accent); }
  .w.saved { border-bottom:1px solid var(--green); }
  .w.saved ruby, .w.saved { color:var(--green); }
  .w.saved:hover { background:var(--green-soft); }

  /* tooltip */
  #tooltip {
    position:fixed; z-index:1000; background:var(--paper); border:1px solid var(--accent);
    border-radius:11px; padding:11px 14px; font-size:14px; max-width:280px;
    box-shadow:0 6px 22px rgba(0,0,0,.2); display:none; line-height:1.55; font-family:var(--sans);
  }
  #tooltip .head { font-weight:700; color:var(--accent); margin-bottom:4px; font-size:17px; font-family:var(--serif); display:flex; align-items:center; gap:8px; }
  #tooltip .head ruby rt { font-size:10px; }
  #tooltip .head .spk { font-size:15px; color:var(--ink-faint); cursor:pointer; }
  #tooltip .head .spk:hover { color:var(--accent); }
  #tooltip .pos { font-size:11px; color:#fff; background:var(--accent); padding:1px 8px; border-radius:9px; display:inline-block; margin-bottom:6px; }
  #tooltip .g { color:var(--ink); margin-bottom:8px; }
  #tooltip .r-line { color:var(--ink-faint); font-size:12px; margin-bottom:6px; }
  #tooltip .actions { display:flex; gap:6px; margin-top:4px; }
  #tooltip .act { flex:1; background:transparent; border:1px solid var(--line); color:var(--ink-soft); padding:5px 8px; border-radius:7px; cursor:pointer; font-size:12px; font-family:var(--sans); transition:all .12s; }
  #tooltip .act.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #tooltip .act:hover { border-color:var(--accent); color:var(--accent); }
  #tooltip .act.primary:hover { filter:brightness(1.08); color:#fff; }

  /* ===== Grammar cards ===== */
  .grammar-card {
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:20px 24px; margin-bottom:13px; box-shadow:var(--shadow);
    border-left:4px solid var(--accent);
  }
  .grammar-card.N5 { border-left-color:var(--green); } .grammar-card.N4 { border-left-color:var(--blue); }
  .grammar-card.N3 { border-left-color:var(--amber); } .grammar-card.N2 { border-left-color:var(--purple); } .grammar-card.N1 { border-left-color:var(--ruby); }
  .grammar-card .g-head { display:flex; align-items:baseline; gap:12px; margin-bottom:8px; flex-wrap:wrap; }
  .grammar-card .pattern { font-family:var(--serif); font-size:22px; font-weight:700; color:var(--ink); }
  .grammar-card .meaning { font-family:var(--sans); font-size:14px; color:var(--accent); font-weight:600; }
  .grammar-card .formation { font-family:var(--sans); font-size:13px; color:var(--ink-soft); background:var(--accent-soft); padding:6px 12px; border-radius:7px; margin-bottom:12px; display:inline-block; }
  .grammar-card .note { font-size:14px; color:var(--ink-soft); line-height:1.7; margin-bottom:12px; font-family:var(--sans); }
  .grammar-card .ex { margin-top:8px; padding:10px 14px; background:var(--bg); border-radius:9px; border:1px solid var(--line); }
  .grammar-card .ex-jp { font-family:var(--serif); font-size:17px; color:var(--ink); line-height:1.7; display:flex; align-items:center; gap:8px; }
  .grammar-card .ex-jp .spk { font-size:14px; color:var(--ink-faint); cursor:pointer; font-family:var(--sans); }
  .grammar-card .ex-jp .spk:hover { color:var(--accent); }
  .grammar-card .ex-r { font-family:var(--sans); font-size:12.5px; color:var(--ink-faint); margin-top:2px; }
  .grammar-card .ex-zh { font-family:var(--sans); font-size:13.5px; color:var(--ink-soft); margin-top:3px; }

  /* collapsible grammar cards */
  .grammar-card .g-head { cursor:pointer; user-select:none; }
  .grammar-card .g-chev {
    margin-left:auto; color:var(--ink-faint); font-family:var(--sans); font-size:12px;
    transition:transform .15s; flex:none; align-self:center;
  }
  .grammar-card.open .g-chev { transform:rotate(90deg); }
  .grammar-card .g-detail { display:none; }
  .grammar-card.open .g-detail { display:block; animation:gopen .15s ease; }
  @keyframes gopen { from{opacity:.3; transform:translateY(-3px);} to{opacity:1; transform:none;} }
  .grammar-card:hover { border-color:var(--accent); }
  .small-btn {
    background:transparent; border:1px solid var(--line); color:var(--ink-soft);
    padding:4px 10px; border-radius:8px; cursor:pointer; font-family:var(--sans);
    font-size:12px; transition:all .12s;
  }
  .small-btn:hover { color:var(--accent); border-color:var(--accent); }

  /* reader grammar panel */
  .reader .g-panel { margin-top:22px; padding-top:16px; border-top:1px dashed var(--line); }
  .reader .g-panel h4 {
    font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint);
    font-family:var(--serif); font-weight:700; margin-bottom:8px;
  }
  .reader .g-panel .g-hint { font-size:12px; color:var(--ink-faint); font-family:var(--sans); margin-bottom:8px; }
  .reader .g-tags { display:flex; flex-wrap:wrap; gap:7px; }
  .reader .g-tag {
    font-family:var(--sans); font-size:12.5px; padding:4px 12px; border:1px solid var(--line);
    border-radius:14px; color:var(--ink-soft); cursor:pointer; background:var(--paper);
    transition:all .12s;
  }
  .reader .g-tag:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .reader .g-tag .lv { font-size:10px; font-weight:700; margin-right:5px; }
  .reader .g-tag .lv.N5 { color:var(--green); } .reader .g-tag .lv.N4 { color:var(--blue); }
  .reader .g-tag .lv.N3 { color:var(--amber); } .reader .g-tag .lv.N2 { color:var(--purple); }
  .reader .g-tag .lv.N1 { color:var(--ruby); }
  .reader .g-tag.key { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600; }
  .reader .g-empty { font-size:12.5px; color:var(--ink-faint); font-family:var(--sans); font-style:italic; }

  /* ===== Vocab list ===== */
  .vocab-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
  .vocab-card {
    background:var(--paper); border:1px solid var(--line); border-radius:11px; padding:13px 15px;
    transition:border-color .12s, box-shadow .12s;
  }
  .vocab-card:hover { border-color:var(--accent); box-shadow:var(--shadow); }
  .vocab-card .v-top { display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .vocab-card .v-word { font-family:var(--serif); font-size:19px; font-weight:700; color:var(--ink); }
  .vocab-card .v-word rt { font-size:10px; }
  .vocab-card .v-r { font-family:var(--sans); font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .vocab-card .v-g { font-family:var(--sans); font-size:13px; color:var(--ink-soft); margin-top:3px; }
  .vocab-card .v-pos { font-family:var(--sans); font-size:11px; color:var(--accent); margin-top:3px; }
  .vocab-card .v-btns { display:flex; gap:4px; }
  .vocab-card .v-btn { background:transparent; border:1px solid var(--line); width:26px; height:26px; border-radius:7px; cursor:pointer; color:var(--ink-soft); font-size:13px; font-family:var(--sans); display:flex; align-items:center; justify-content:center; transition:all .12s; }
  .vocab-card .v-btn:hover { color:var(--accent); border-color:var(--accent); }
  .vocab-card .v-btn.save.on { background:var(--green); color:#fff; border-color:var(--green); }

  /* ===== Sidebar ===== */
  .sidebar { position:sticky; top:84px; align-self:start; height:calc(100vh - 104px); display:flex; flex-direction:column; gap:14px; }
  .panel { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); }
  .panel h4 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); margin-bottom:10px; font-family:var(--serif); font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  .stats-row { display:flex; gap:18px; font-size:13px; color:var(--ink-soft); margin-bottom:10px; font-family:var(--sans); }
  .stats-row b { color:var(--accent); font-size:22px; font-family:var(--serif); display:block; line-height:1.1; }
  .panel .hint { font-size:12.5px; color:var(--ink-soft); line-height:1.55; font-family:var(--sans); }
  .panel .hint b { color:var(--accent); }

  .vocab-list { list-style:none; overflow-y:auto; flex:1; max-height:55vh; padding-right:4px; }
  .vocab-list li { padding:10px 0; border-bottom:1px dashed var(--line); font-size:13.5px; line-height:1.5; font-family:var(--sans); position:relative; }
  .vocab-list li:last-child { border-bottom:none; }
  .vocab-list .row1 { display:flex; justify-content:space-between; gap:8px; align-items:baseline; margin-bottom:2px; }
  .vocab-list .vw { font-family:var(--serif); color:var(--accent); font-weight:700; font-size:16px; cursor:pointer; }
  .vocab-list .vw rt { font-size:10px; }
  .vocab-list .vr { color:var(--ink-faint); font-size:11px; margin-left:6px; }
  .vocab-list .v-r { color:var(--ink-faint); font-size:11.5px; display:block; }
  .vocab-list .vg { color:var(--ink-soft); font-size:12.5px; display:block; margin-top:2px; }
  .vocab-list .rm { background:transparent; border:none; color:var(--ink-faint); cursor:pointer; font-size:16px; padding:0 4px; font-family:var(--sans); line-height:1; }
  .vocab-list .rm:hover { color:var(--ruby); }
  .vocab-list .v-act { display:flex; gap:4px; margin-top:4px; }
  .vocab-list .v-act button { background:transparent; border:1px solid var(--line); border-radius:6px; cursor:pointer; color:var(--ink-soft); font-size:11px; padding:2px 7px; font-family:var(--sans); }
  .vocab-list .v-act button:hover { color:var(--accent); border-color:var(--accent); }
  .vocab-empty { font-size:13px; color:var(--ink-faint); font-style:italic; padding:14px 0; text-align:center; font-family:var(--sans); }
  .small-link { font-size:12px; color:var(--accent); cursor:pointer; background:none; border:none; padding:0; font-family:var(--sans); text-decoration:underline; }

,"r":"つくえのうえにほんがあります。","zh":"桌子上有书。"},{"jp":"公園に犬がいます。","r":"こうえんにいぬがいます。","zh":"公园里有狗。"}],"keys":["があります","がいます"]},{"id":"g004","level":"N5","pattern":"だれですか/何ですか/どれですか/どの～ですか/どこですか","meaning":"「だれですか」：不知道是什么人时使用。","cat":"demo","note":"「何ですか」：不知道是什么事物时使用。「どれですか」：三个以上事物中不能确定是哪一个时使用。「どの～ですか」：三个以上事物中不能确定是哪一个时使用，需要和后面的名词连用。「どこですか」：不知道在哪里时使用。","examples":[{"jp":"あの人はだれですか。","r":"あのひとはだれですか。","zh":"那个人是谁？"},{"jp":"トイレはどこですか。","r":"トイレはどこですか。","zh":"厕所在哪里？"}],"keys":["何ですか","どこですか","だれですか","どれですか"]},{"id":"g005","level":"N5","pattern":"ここ/そこ/あそこは～です","meaning":"「ここ、そこ、あそこ」用来指示场所，其表示的位置关系同「これ、それ、あれ」相同。","cat":"demo","note":"「どこですか」：不知道在哪里时使用。","examples":[{"jp":"ここは学校です。","r":"ここはがっこうです。","zh":"这里是学校。"},{"jp":"あそこは駅です。","r":"あそこはえきです。","zh":"那里（远处）是车站。"}],"keys":["ここは","そこは","あそこは"]},{"id":"g006","level":"N5","pattern":"この/その/あのは～です","meaning":"「この、その、あの」是修饰语，后面接名词。","cat":"demo","note":"其表示的位置关系同「これ、それ、あれ」相同。","examples":[{"jp":"この本は私のです。","r":"このほんはわたしのです。","zh":"这本书是我的。"},{"jp":"その鞄は新しいです。","r":"そのかばんはあたらしいです。","zh":"那个包是新的。"}]},{"id":"g007","level":"N5","pattern":"これ/それ/あれは～です","meaning":"「これ、それ、あれ」都是指示代词，该句型由上面的「～は～です」变化得到，意思是“这个/那个是……”。","cat":"demo","note":"（1）当说话人和听话人相隔一段距离、面对面时：「これ」指距离说话人较近的事物；「それ」指距离听话人较近的事物；「あれ」指距离说话人和听话人都比较远的事物。（2）当说话人和听话人位于同一位置、面向不同方向时：「これ」指距离说话人、听话人都较近的事物；「それ」指距离说话人、听话人都较远的事物；「あれ」指距离说话人、听话人更远的事物。","examples":[{"jp":"これは何ですか。","r":"これはなんですか。","zh":"这是什么？"},{"jp":"あれは富士山です。","r":"あれはふじさんです。","zh":"那座远处的是富士山。"}],"keys":["これは","それは","あれは"]},{"id":"g008","level":"N5","pattern":"～(物/人）は～（場所）にあります/います","meaning":"表示“（人或物）在（某处）”。","cat":"basic","examples":[{"jp":"猫は椅子の下にいます。","r":"ねこはいすのしたにいます。","zh":"猫在椅子下面。"},{"jp":"鍵は机の上にあります。","r":"かぎはつくえのうえにあります。","zh":"钥匙在桌子上。"}],"keys":["にあります","にいます"]},{"id":"g009","level":"N5","pattern":"～ます／～ません／～ました／～ませんでした","meaning":"表示动词时态的变化。","cat":"tense","note":"～ます：现在肯定～ません：现在否定～ました：过去肯定～ませんでした：过去否定","examples":[{"jp":"毎日コーヒーを飲みます。","r":"まいにちコーヒーをのみます。","zh":"每天喝咖啡。"},{"jp":"昨日は映画を見ました。","r":"きのうはえいがをみました。","zh":"昨天看了电影。"},{"jp":"朝ご飯を食べませんでした。","r":"あさごはんをたべませんでした。","zh":"没吃早饭。"}],"keys":["ます","ませんでした","ません"]},{"id":"g010","level":"N5","pattern":"～から～まで～","meaning":"「～から～まで」可以译作“从……到……”。","cat":"time","formation":"起点 + から + 终点 + まで","note":"既可以表示某动作发生的某个时期。也可以表示动作移动的范围。","examples":[{"jp":"九時から五時まで働きます。","r":"くじからごじまではたらきます。","zh":"从九点工作到五点。"},{"jp":"東京から大阪まで行きます。","r":"とうきょうからおおさかまでいきます。","zh":"从东京到大阪。"}]},{"id":"g011","level":"N5","pattern":"に/へ/から/で","meaning":"名（时间）＋に＋动：表示动作发生的时间。","cat":"particle","note":"名（场所）＋へ＋动：表示移动行为的目的地。名（场所）＋から＋动：表示动作移动的起点。名（场所）＋で＋动：表示动作进行的场所。名（工具）＋で＋动：即表示交通工具，也表示其他手段和原材料。","examples":[{"jp":"七時に起きます。","r":"しちじにおきます。","zh":"七点起床。"},{"jp":"電車で会社へ行きます。","r":"でんしゃでかいしゃへいきます。","zh":"坐电车去公司。"}]},{"id":"g012","level":"N5","pattern":"名を动","meaning":"动作的对象用助词「を」提示。","cat":"particle","examples":[{"jp":"ご飯を食べます。","r":"ごはんをたべます。","zh":"吃饭。"},{"jp":"本を読みます。","r":"ほんをよみます。","zh":"读书。"}]},{"id":"g013","level":"N5","pattern":"名1（人）は名2（人）に名3（物）をあげます","meaning":"相当于汉语的“给”。","cat":"give","note":"物品的主要移动方向是给别人，不能是给我。所以名词1可以是第一、二、三人称；名词2可以是第二、三人称。","examples":[{"jp":"私は友達に本をあげます。","r":"わたしはともだちにほんをあげます。","zh":"我把书送给朋友。"},{"jp":"弟にプレゼントをあげました。","r":"おとうとにプレゼントをあげました。","zh":"送了礼物给弟弟。"}],"keys":["あげます","あげました"]},{"id":"g014","level":"N5","pattern":"名1（人）は名2（人）に名3（物）をもらいます","meaning":"相当于汉语的“得到；接受”。","cat":"give","note":"一定是从别人那里得到，而不是从我这得到。赠送者用“に”提示，赠送者也可以看作是物品移动的起点，用助词“から”提示。","examples":[{"jp":"友達から写真をもらいました。","r":"ともだちからしゃしんをもらいました。","zh":"从朋友那里得到了照片。"},{"jp":"先生に辞書をもらいます。","r":"せんせいにじしょをもらいます。","zh":"从老师那里得到词典。"}],"keys":["もらいます","もらいました"]},{"id":"g015","level":"N5","pattern":"名1（人）は名2（人）に名3（物）をくれます","meaning":"相当于汉语的“给我”。","cat":"give","note":"这个“我”不仅指的是我，也可以指和我关系亲密的家人等。","examples":[{"jp":"友達は私に花をくれました。","r":"ともだちはわたしにはなをくれました。","zh":"朋友送了我花。"},{"jp":"母は私にセーターをくれました。","r":"はははわたしにセーターをくれました。","zh":"妈妈给我织了毛衣。"}],"keys":["くれます","くれました"]},{"id":"g016","level":"N5","pattern":"名（人）に会います","meaning":"相当于汉语的“见”。","cat":"particle","note":"所见到的对象用「に」提示。","examples":[{"jp":"駅で友達に会いました。","r":"えきでともだちにあいました。","zh":"在车站见了朋友。"},{"jp":"明日、先生に会います。","r":"あした、せんせいにあいます。","zh":"明天去见老师。"}],"keys":["に会い"]},{"id":"g017","level":"N5","pattern":"一类形容词","meaning":"一类形容词是指以“い”结尾的形容词，这类形容词在做谓语时直接在“い”后加“です”。","cat":"adj","note":"其否定式、过去式、过去否定式的表现如下图：肯定否定过去过去否定熱いです熱くないです熱くありません熱かったです熱くなかったです熱くありませんでした","examples":[{"jp":"この映画は面白いです。","r":"このえいがはおもしろいです。","zh":"这部电影有趣。"},{"jp":"このりんごは高くないです。","r":"このりんごはたかくないです。","zh":"这个苹果不贵。"}],"keys":["くないです"]},{"id":"g018","level":"N5","pattern":"二类形容词","meaning":"二类形容词是不以“い”结尾的形容词，做谓语时要在后面加上“です”。","cat":"adj","note":"过去式是“でした”。其否定式、过去式、过去否定式的表现如下图：肯定否定过去过去否定有名です有名ではありません有名でした有名ではありませんでした有名じゃありませんでした","examples":[{"jp":"この町は静かです。","r":"このまちはしずかです。","zh":"这个城镇很安静。"},{"jp":"昨日は元気ではありませんでした。","r":"きのうはげんきではありませんでした。","zh":"昨天身体不太好。"}]},{"id":"g019","level":"N5","pattern":"一类形容词＋名/二类形容词＋な＋名","meaning":"一类形容词可直接修饰名词；二类形容词修饰名词是要用“二类形容词＋な＋名词”的形式。","cat":"adj","examples":[{"jp":"これは高い山です。","r":"これはたかいやまです。","zh":"这是座高山。"},{"jp":"静かな図書館で勉強します。","r":"しずかなとしょかんでべんきょうします。","zh":"在安静的图书馆学习。"}]},{"id":"g020","level":"N5","pattern":"あまり＋否定","meaning":"「あまり」是程度副词，它与后面的否定形式搭配，表示程度不高，“不太/不怎么……”。","cat":"negative","examples":[{"jp":"私はあまり肉を食べません。","r":"わたしはあまりにくをたべません。","zh":"我不太吃肉。"},{"jp":"この映画はあまり面白くないです。","r":"このえいがはあまりおもしろくないです。","zh":"这部电影不太有趣。"}],"keys":["あまり"]},{"id":"g021","level":"N5","pattern":"どんな～ですか/どうですか","meaning":"どんな～ですか：相当于汉语的“什么样的”。","cat":"demo","note":"在询问人或事物的性质时使用。どうですか：相当于汉语的“怎么样”。在询问对方对某状态的意见或感想时使用。","examples":[{"jp":"どんな音楽が好きですか。","r":"どんなおんがくがすきですか。","zh":"你喜欢什么样的音乐？"},{"jp":"日本の生活はどうですか。","r":"にほんのせいかつはどうですか。","zh":"日本的生活怎么样？"}],"keys":["どんな","どうですか"]},{"id":"g022","level":"N5","pattern":"名1 は名2 が一类/二类形容词です","meaning":"在该句型中可以使用表示情感的形容词。","cat":"basic","note":"如“好き”“嫌い”“怖い”等等。名词1，是情感的主体；名词2，是情感的对象。","examples":[{"jp":"私は猫が好きです。","r":"わたしはねこがすきです。","zh":"我喜欢猫。"},{"jp":"私は暗い所が怖いです。","r":"わたしはくらいところがこわいです。","zh":"我怕黑的地方。"}],"keys":["が好き","が嫌い","が怖い"]},{"id":"g023","level":"N5","pattern":"名1 は名2 がわかります/できます","meaning":"该句型表示“（名1）懂……/会……”。","cat":"potential","note":"除了“わかります”“できます”外，还可以使用“上手です”“下手です”“苦手です”等表示能力的词，相当于“（名1）擅长……/不擅长……”。","examples":[{"jp":"私は日本語がわかります。","r":"わたしはにほんごがわかります。","zh":"我懂日语。"},{"jp":"彼は料理が上手です。","r":"かれはりょうりがじょうずです。","zh":"他擅长做饭。"}],"keys":["がわかります","ができます"]},{"id":"g024","level":"N5","pattern":"～から/～だから","meaning":"“～から”和“～だから”都可以用于说明原因、理由。","cat":"reason","note":"～から：用于说明原因、理由时，接在陈述原因、理由的小句句尾。通常是在说明原因、理由之外再陈述结论，但有时也可以先陈述结论再说明原因、理由。～だから：表示原因、理由的连词。相当于汉语中的“所以”，它的礼貌说法是「ですから」。这个词一般独立使用，使用于表示结果的句子前面。","examples":[{"jp":"寒いから、窓を閉めます。","r":"さむいから、まどをしめます。","zh":"因为冷，所以关上窗户。"},{"jp":"明日は試験だから、早く寝ます。","r":"あしたはしけんだから、はやくねます。","zh":"明天有考试，所以早点睡。"}],"keys":["だから","から、"]},{"id":"g025","level":"N5","pattern":"～より/～のほうが/～ほど","meaning":"三者都用来表示比较。","cat":"compare","note":"名1は名2より一类形容词/二类形容词です：表示“‘名词1’比‘名词2’更……”。名1より名2のほうが一类形容词/二类形容词です：表示“‘名词2’比‘名词1’更……”。名1は名2ほど一类形容词くないです/二类形容词ではありません：表示“‘名词1’没有‘名词2’……”。","examples":[{"jp":"夏より冬のほうが好きです。","r":"なつよりふゆのほうがすきです。","zh":"比起夏天更喜欢冬天。"},{"jp":"兄は私より背が高いです。","r":"あにはわたしよりせがたかいです。","zh":"哥哥比我高。"}],"keys":["のほうが","ほど"]},{"id":"g026","level":"N5","pattern":"名（时间）＋动","meaning":"表示时间数量的词和动词一起使用时，说明动作、状态的持续时间。","cat":"time","examples":[{"jp":"一時間勉強しました。","r":"いちじかんべんきょうしました。","zh":"学习了一个小时。"},{"jp":"日本に三年住んでいました。","r":"にほんにさんねんすんでいました。","zh":"在日本住了三年。"}]},{"id":"g027","level":"N5","pattern":"名（时间）に名（次数）＋动","meaning":"表示在一定时间内进行若干次动作。","cat":"count","note":"“に”在这里的用法是表示频率。","examples":[{"jp":"週に二回プールへ行きます。","r":"しゅうににかいプールへいきます。","zh":"一周去两次游泳池。"},{"jp":"一日に三回薬を飲みます。","r":"いちにちにさんかいくすりをのみます。","zh":"一天吃三次药。"}]},{"id":"g028","level":"N5","pattern":"名（场所) へ动に行きます/来ます","meaning":"是一个比较常用的句型。","cat":"purpose","note":"考试中出现的频率比较高。意思是“去某地做某事或来某地做某事”。表示行为目的。“に”前面接动词的“去ます形”表示目的。","examples":[{"jp":"本を買いに行きます。","r":"ほんをかいにいきます。","zh":"去买书。"},{"jp":"日本へ勉強しに来ました。","r":"にほんへべんきょうしにきました。","zh":"来日本学习。"}],"keys":["に行き","に来"]},{"id":"g029","level":"N5","pattern":"～てから","meaning":"～てから：表示两个以上的动作按照时间顺序相继发生。","cat":"time","formation":"动词て形 + から + 动词","note":"但“～てから”不能在一个句子中反复使用两次以上。","examples":[{"jp":"宿題をしてから、遊びます。","r":"しゅくだいをしてから、あそびます。","zh":"做完作业后再玩。"},{"jp":"ご飯を食べてから、寝ます。","r":"ごはんをたべてから、ねます。","zh":"吃完饭后再睡。"}],"keys":["てから"]},{"id":"g030","level":"N5","pattern":"～てもいいです/～てはいけません","meaning":"“～てもいいです”表示许可，相当于汉语的“可以……”。","cat":"order","formation":"动词て形 + は + いけません","note":"而“～てはいけません”则表示禁止，相当于汉语的“不能……”。","examples":[{"jp":"ここでタバコを吸ってはいけません。","r":"ここでタバコをすってはいけません。","zh":"不能在这里吸烟。"},{"jp":"写真を撮ってはいけません。","r":"しゃしんをとってはいけません。","zh":"不能拍照。"}],"keys":["てもいい","てはいけません"]},{"id":"g031","level":"N5","pattern":"“に”和“へ”的用法","meaning":"“に”和“へ”在表示“移动动词的目的地”时可以互换使用。","cat":"particle","note":"例如：李さんは家に/へ帰りました。（小李回家了。）除此之外，“に”还有另外五种用法，这些都无法用“へ”来替换。①表示存在的场所：公園にベンチがあります。（公园里有长椅。）②表示时间：5時に帰ります。（5点回家。）③表示动作的对象：友達に会います。（和朋友见面。）④表示移动行为的目的：本を買いに行きます。（去买书。）⑤表示附着点：車に乗ります。（乘车。）","examples":[{"jp":"家に帰ります。","r":"いえにかえります。","zh":"回家。"},{"jp":"友達に会います。","r":"ともだちにあいます。","zh":"和朋友见面。"}]},{"id":"g032","level":"N5","pattern":"～ています","meaning":"“动词て＋います”有两种表达用法。","cat":"tense","formation":"动词て形 + います","note":"一是表示动作正在进行；二是表示动作结束后留下的结果状态。","examples":[{"jp":"今、本を読んでいます。","r":"いま、ほんをよんでいます。","zh":"现在正在读书。"},{"jp":"雨が降っています。","r":"あめがふっています。","zh":"在下雨。"}],"keys":["ています"]},{"id":"g033","level":"N5","pattern":"まだ＋否定","meaning":"相当于汉语的“还没……”。","cat":"negative","note":"表示还没达到所询问的内容的程度。此外，对用“もう”提问的句子做否定回答时，使用“まだ～ていません”的表达。","examples":[{"jp":"まだ昼ご飯を食べていません。","r":"まだひるごはんをたべていません。","zh":"还没吃午饭。"},{"jp":"彼はまだ来ていません。","r":"かれはまだきていません。","zh":"他还没来。"}],"keys":["まだ"]},{"id":"g034","level":"N5","pattern":"表示“愿望”的句型","meaning":"在表示“愿望”时，有两种表达方式①名1は名2がほしいです：“名词1”是愿望主题，“名词2”是表示愿望的对象。","cat":"desire","note":"相当于汉语的“（名1）想要（名2）”。②名1は名2を动たいです：“名词1”是愿望主体，“名词2”是希望进行动作的对象。相当于汉语的“（名1）想……”。","examples":[{"jp":"私は新しい靴がほしいです。","r":"わたしはあたらしいくつがほしいです。","zh":"我想要新鞋子。"},{"jp":"日本へ旅行に行きたいです。","r":"にほんへりょこうにいきたいです。","zh":"我想去日本旅行。"}],"keys":["ほしいです","たいです"]},{"id":"g035","level":"N5","pattern":"～ませんか/～ましょう","meaning":"二者都可以表示提议。","cat":"desire","note":"“～ませんか”相当于汉语的“……怎么样？”“～ましょう”相当于汉语的“……吧”。","examples":[{"jp":"一緒に映画を見ませんか。","r":"いっしょにえいがをみませんか。","zh":"一起看电影怎么样？"},{"jp":"もう一度説明しましょう。","r":"もういちどせつめいしましょう。","zh":"再说明一遍吧。"}],"keys":["ませんか","ましょう"]},{"id":"g036","level":"N5","pattern":"形容词性质、状态发生变化的表达","meaning":"①一类形容词なります/二类形容词になります表示自然而然，不受外力作用而发生的变化。","cat":"change","note":"相当于汉语的“变得……”。②一类形容词します/二类形容词にします表示因主语的意志性动作、作用而发生的变化。相当于汉语的“把……变得……”。","examples":[{"jp":"寒くなりました。","r":"さむくなりました。","zh":"变冷了。"},{"jp":"部屋をきれいにします。","r":"へやをきれいにします。","zh":"把房间弄干净。"}],"keys":["くなりました","にします"]},{"id":"g037","level":"N4","pattern":"～ほうがいいです","meaning":"表示比较两个事物以上的性质，认为其中一个比较好。","cat":"order","formation":"动词た形／ない形 + ほうがいい","note":"一类形容词可直接和“ほうがいいです”连用，二类形容词需加上“な”后再加上“ほうがいいです”。","examples":[{"jp":"薬を飲んだほうがいいですよ。","r":"くすりをのんだほうがいいですよ。","zh":"最好吃药。"},{"jp":"無理をしないほうがいいです。","r":"むりをしないほうがいいです。","zh":"最好不要勉强。"}],"keys":["ほうがいい"]},{"id":"g038","level":"N5","pattern":"～ないでください","meaning":"动词ない形＋で＋ください，表示否定的命令。","cat":"order","formation":"动词ない形 + でください","note":"相当于汉语的“请不要……”。","examples":[{"jp":"ここで写真を撮らないでください。","r":"ここでしゃしんをとらないでください。","zh":"请不要在这里拍照。"},{"jp":"心配しないでください。","r":"しんぱいしないでください。","zh":"请不要担心。"}],"keys":["ないでください"]},{"id":"g039","level":"N4","pattern":"～なければなりません","meaning":"将动词的“ない形”换成“なければなりません”，表示必须。","cat":"oblig","note":"口语中可以用作“～ないとはいけません”“～ないと”。","examples":[{"jp":"明日は早く起きなければなりません。","r":"あしたははやくおきなければなりません。","zh":"明天必须早起。"},{"jp":"宿題をしなければなりません。","r":"しゅくだいをしなければなりません。","zh":"必须做作业。"}],"keys":["なければなりません"]},{"id":"g040","level":"N4","pattern":"动词基本形＋ことができます","meaning":"既可以表示能力，相当于汉语的“能够……；会……”；也可以用来表示可能和允许，相当于汉语的“可以……”。","cat":"potential","examples":[{"jp":"日本語を話すことができます。","r":"にほんごをはなすことができます。","zh":"会说日语。"},{"jp":"ここで写真を撮ることができます。","r":"ここでしゃしんをとることができます。","zh":"可以在这里拍照。"}],"keys":["ことができます"]},{"id":"g041","level":"N4","pattern":"名は动词基本形ことです","meaning":"当谓语部分的内容是一种动作、行为时使用这个句型。","cat":"quote","note":"“こと”其实在这里的作用是将动作名词化。","examples":[{"jp":"私の趣味は本を読むことです。","r":"わたしのしゅみはほんをよむことです。","zh":"我的爱好是读书。"},{"jp":"夢は医者になることです。","r":"ゆめはいしゃになることです。","zh":"梦想是当医生。"}],"keys":["ことです"]},{"id":"g042","level":"N4","pattern":"动词た形＋ことがあります","meaning":"表示过去的经历，相当于汉语的“（曾经）……过”。","cat":"tense","note":"通常用于至少半年以前发生的事情。其否定形式为“动词た形＋ことがありません”。","examples":[{"jp":"日本へ行ったことがあります。","r":"にほんへいったことがあります。","zh":"去过日本。"},{"jp":"富士山に登ったことがありません。","r":"ふじさんにのぼったことがありません。","zh":"没爬过富士山。"}],"keys":["たことがある","たことがあり"]},{"id":"g043","level":"N4","pattern":"动词基本形＋前に/动词た形＋後で","meaning":"这两个句型是考试中常出现的考点，可以结合记忆。","cat":"time","note":"二者除了前项可以接动词外，还可以接“名词＋の”。动词基本形＋前に：表示一个动作在另一个动作之前发生。动词た形＋後で：表示一个动作在另一个动作之后发生。","examples":[{"jp":"寝る前に、歯を磨きます。","r":"ねるまえに、はをみがきます。","zh":"睡觉前刷牙。"},{"jp":"ご飯を食べた後で、散歩します。","r":"ごはんをたべたあとで、さんぽします。","zh":"吃完饭之后散步。"}],"keys":["前に","後で"]},{"id":"g044","level":"N4","pattern":"动词た形＋ほうがいいです","meaning":"表示对人的建议、劝诫。","cat":"order","note":"相当于汉语的“……比较好；最好……”。其否定表达为“动词ない形＋ほうがいいです”，表示“不……比较好；最好不……”。","examples":[{"jp":"早く寝たほうがいいですよ。","r":"はやくねたほうがいいですよ。","zh":"最好早点睡。"},{"jp":"無理をしないほうがいいです。","r":"むりをしないほうがいいです。","zh":"最好别勉强。"}],"keys":["たほうがいい"]},{"id":"g045","level":"N4","pattern":"日语中的简体形和敬体形","meaning":"日语中的敬体形是我们常见的“です”“ます”形，表达一种礼貌，都用于正式场合。","cat":"basic","note":"在对长辈、上级、陌生人以及关系疏远者时都应该使用敬体。而日语中的简体形则是不使用“です”“ます”的形式，多用于对自己的同辈或晚辈以及关系比较密切的人之间。","examples":[{"jp":"明日、学校へ行きます。（敬体）","r":"あした、がっこうへいきます。","zh":"明天去学校。（敬体）"},{"jp":"明日、学校へ行く。（简体）","r":"あした、がっこうへいく。","zh":"明天去学校。（简体）"}]},{"id":"g046","level":"N4","pattern":"～たり～たりします/～たり～たりです","meaning":"用来表示列举若干种有代表性的事物。","cat":"conj","note":"当一类形容词、二类形容词和名词接“たり”时，句尾并不是总要后续“です”，也可以接续其他形式。","examples":[{"jp":"音楽を聞いたり、本を読んだりします。","r":"おんがくをきいたり、ほんをよんだりします。","zh":"听听音乐、看看书等。"},{"jp":"部屋はきれいだったり、汚かったりです。","r":"へやはきれいだったり、きたなかったりです。","zh":"房间时干净时脏。"}],"keys":["たりします","たりしました","たりする","たり、"]},{"id":"g047","level":"N4","pattern":"名词＋によって","meaning":"日语能力考的一个高频语法点，表示根据、依据。","cat":"reason","note":"相当于汉语的“根据……（不同）；因……（而不同）”。用在句尾时可以直接用作“～によります”。","examples":[{"jp":"国によって習慣が違います。","r":"くにによってしゅうかんがちがいます。","zh":"习惯因国家而异。"},{"jp":"人によって考え方が違います。","r":"ひとによってかんがえかたがちがいます。","zh":"想法因人而异。"}],"keys":["によって"]},{"id":"g048","level":"N4","pattern":"小句＋か/小句＋かどうか","meaning":"这个句型在日语能力考的阅读中经常出现，口语中也经常使用，是一个重点句型。","cat":"quote","note":"用来表示某种不确定的内容。相当于汉语的“是不是……；是否……”。","examples":[{"jp":"明日、雨が降るかどうかわかりません。","r":"あした、あめがふるかどうかわかりません。","zh":"不知道明天会不会下雨。"},{"jp":"彼が来るかどうか聞いてください。","r":"かれがくるかどうかきいてください。","zh":"请问问看他来不来。"}],"keys":["かどうか"]},{"id":"g049","level":"N4","pattern":"～と思います","meaning":"表示说话人的思考内容。","cat":"quote","note":"“と”前面的小句谓语必须是简体形。","examples":[{"jp":"明日はいい天気だと思います。","r":"あしたはいてんきだとおもいます。","zh":"我觉得明天是好天气。"},{"jp":"この本は面白いと思います。","r":"このほんはおもしろいとおもいます。","zh":"我觉得这本书有趣。"}],"keys":["と思います","と思う"]},{"id":"g050","level":"N4","pattern":"～のです/～んです","meaning":"表示所讲的内容与前句或前项内容有关联。","cat":"reason","note":"用于说明状况或解释原因。“～のです”多用于书面语，而“～んです”多用于口语。","examples":[{"jp":"頭が痛いんです。","r":"あたまがいたいんです。","zh":"（我）头疼。（解释原因）"},{"jp":"遅れてすみません。電車が遅れたのです。","r":"おくれてすみません。でんしゃがおくれたのです。","zh":"对不起迟到了。电车晚点了。"}],"keys":["のです","んです"]},{"id":"g051","level":"N4","pattern":"～について","meaning":"相当于汉语的“关于……”。","cat":"quote","note":"后项常接“考えます（思考）”“思います（想）”“研究します（研究）”“論議します（议论）”等表示思维活动的词语。","examples":[{"jp":"日本について話しましょう。","r":"にほんについてはなしましょう。","zh":"来聊聊关于日本的话题吧。"},{"jp":"この本は日本語について書いてあります。","r":"このほんはにほんごについてかいてあります。","zh":"这本书写的是关于日语的内容。"}],"keys":["について"]},{"id":"g052","level":"N4","pattern":"动词简体形＋名词","meaning":"动词简体形修饰名词。","cat":"quote","note":"既可以是动词的基本形，也可以是动词过去式的简体形。前者表示习惯或将要发生的动作，后者表示已经完成的动作。","examples":[{"jp":"これは昨日買った本です。","r":"これはきのうかったほんです。","zh":"这是昨天买的书。"},{"jp":"泳ぐ人を見ています。","r":"およぐひとをみています。","zh":"正在看游泳的人。"}]},{"id":"g053","level":"N4","pattern":"小句（动词简体形/一类形容词/二类形容词/名词）＋名词","meaning":"“小句＋名词”在句中可以看作是一个名词短语，既可以用作主语，也可以用作状语、宾语以及动作的对象。","cat":"quote","note":"这里要注意的是要分清大主语和小主语，小主语不能用“は”来表示。","examples":[{"jp":"これは日本製の車です。","r":"これはにほんせいのくるまです。","zh":"这是日本产的车。"},{"jp":"空が青い日は気持ちがいいです。","r":"そらがあおいひはきもちがいいです。","zh":"天空蔚蓝的日子心情舒畅。"}]},{"id":"g054","level":"N4","pattern":"小句（动词简体形）＋のは/のを","meaning":"“小句＋の”其实就是将动词名词化，表示“做某动作”的意思。","cat":"quote","note":"这种名词化形式做主语时用“のは”，做宾语时用“のを”。","examples":[{"jp":"泳ぐのは楽しいです。","r":"およぐのはたのしいです。","zh":"游泳很开心。"},{"jp":"音楽を聞くのが好きです。","r":"おんがくをきくのがすきです。","zh":"喜欢听音乐。"}],"keys":["のを","のが"]},{"id":"g055","level":"N4","pattern":"～かもしれません","meaning":"表示有可能发生某事，发生的概率一般在百分之五十左右。","cat":"guess","formation":"普通形 + かもしれません","note":"动词和一类形容词可以直接接“かもしれません”，而二类形容词和名词则把简体形的“だ”换成“かもしれません”即可。","examples":[{"jp":"明日は雪が降るかもしれません。","r":"あしたはゆきがふるかもしれません。","zh":"明天可能会下雪。"},{"jp":"彼は来ないかもしれません。","r":"かれはこないかもしれません。","zh":"他可能不来。"}],"keys":["かもしれません"]},{"id":"g056","level":"N4","pattern":"～ながら","meaning":"表示同一个主体同时进行两项动作，相当于汉语的“一边……一边……”。","cat":"state","formation":"动词ます形（去掉ます）+ ながら","note":"其中后面的动作是主要动作。其接续方式为“动词ます”形去掉“ます”加“ながら”。","examples":[{"jp":"音楽を聞きながら勉強します。","r":"おんがくをききながらべんきょうします。","zh":"我一边听音乐一边学习。"},{"jp":"テレビを見ながらご飯を食べないでください。","r":"てれびをみながらごはんをたべないでください。","zh":"请不要一边看电视一边吃饭。"}],"keys":["ながら"]},{"id":"g057","level":"N4","pattern":"～ています（反复、习惯）","meaning":"在第四单元讲到了“～ています”表示动作正在进行和动作的结果、状态。","cat":"tense","note":"除此之外，“～ています”还可以表示反复或习惯性的动作。在表示习惯性的动作时也可以用“ます形”来代替。","examples":[{"jp":"毎朝、公園を散歩しています。","r":"まいあさ、こうえんをさんぽしています。","zh":"每天早上都在公园散步。"},{"jp":"父は会社で働いています。","r":"ちちはかいしゃではたらいています。","zh":"父亲在公司上班。"}],"keys":["ています"]},{"id":"g058","level":"N4","pattern":"～てあげます/～てもらいます/～てくれます","meaning":"～てあげます：表示说话人或说话人的一方为别人做某事，不能面对尊长使用。","cat":"give","note":"～てもらいます：表示说话人请别人做某事或说话人承受了由别人的动作带来的恩惠。～てくれます：表示说话人以外的主语为说话人或说话人一方的人做某事。","examples":[{"jp":"私は弟に日本語を教えてあげます。","r":"わたしはおとうとににほんごをおしえてあげます。","zh":"我教弟弟日语。"},{"jp":"友達に本を貸してもらいました。","r":"ともだちにほんをかしてもらいました。","zh":"请朋友借了书给我。"}],"keys":["てあげ","てもらっ","てくれ"]},{"id":"g059","level":"N4","pattern":"それに","meaning":"用于前后句的内容为累加关系。","cat":"conj","note":"在能力考考试中经常出现。相当于汉语的“而且……”。","examples":[{"jp":"この店は安いです。それに、美味しいです。","r":"このみせはやすいです。それに、おいしいです。","zh":"这家店便宜，而且好吃。"},{"jp":"彼は頭がいいです。それに、優しいです。","r":"かれはあたまがいいです。それに、やさしいです。","zh":"他聪明，而且温柔。"}],"keys":["それに"]},{"id":"g060","level":"N4","pattern":"动词命令形","meaning":"表示说话人对听话人下命令时的表达方式。","cat":"order","examples":[{"jp":"早く起きろ！","r":"はやくおきろ！","zh":"快起床！"},{"jp":"静かにしろ。","r":"しずかにしろ。","zh":"安静点！"}]},{"id":"g061","level":"N4","pattern":"～なさい/～な/～て/～ないで","meaning":"这四种表达在日语会话中经常出现的表示命令、禁止的用法。","cat":"order","note":"动词“ます形”＋なさい：多用于老师对学生或父母对孩子提出要求。动词基本形＋な：表示禁止听话人做某事。动词て形、动词ない形＋で：表示命令，多用于关系亲密的人之间。","examples":[{"jp":"宿題をしなさい。","r":"しゅくだいをしなさい。","zh":"去做作业。"},{"jp":"ここにタバコを吸うな。","r":"ここにタバコをすうな。","zh":"不许在这里抽烟。"}],"keys":["なさい"]},{"id":"g062","level":"N4","pattern":"～という","meaning":"相当于汉语的“叫做……；所谓的……”。","cat":"quote","note":"前面既可以接一个单独的名词，也可以接小句。既可以表示某个对方不知道的新信息，也可以是对主语的定义或解释。","examples":[{"jp":"山田という人に会いました。","r":"やまだというひとにあいました。","zh":"见到了一位叫做山田的人。"},{"jp":"「猫」という漢字は難しいです。","r":"「ねこ」というかんじはむずかしいです。","zh":"「猫」这个汉字很难。"}],"keys":["という"]},{"id":"g063","level":"N4","pattern":"动词意志形＋と思います/と思っています","meaning":"动词的意志形表示说话人当场表示自己的决心、意志的表达方式。","cat":"desire","note":"动词意志形＋と思います：表示说话人向听话人表示自己做某事的意志，比单纯的意志形更加礼貌。动词意志形＋と思っています：表示自己已经把某种意志持续了一段时间。","examples":[{"jp":"夏休みに海へ行こうと思います。","r":"なつやすみにうみへいこうとおもいます。","zh":"我打算暑假去海边。"},{"jp":"来年、日本で働こうと思っています。","r":"らいねん、にほんではたらこうとおもっています。","zh":"我一直在想着明年去日本工作。"}],"keys":["ようと思います","ようと思い"]},{"id":"g064","level":"N4","pattern":"“～ので”和“～から”","meaning":"二者都表示原因、理由。","cat":"reason","note":"～ので：语气较为郑重，多用于正式场合，理由偏客观。既可以接在简体形后，也可接在敬体形后。前项一般是既定事实或自然界中常理性的客观事实。～から：多用于日常会话中，理由偏主观。后项多为说话人的意志、主张、推测、想象、劝诱、请求、命令、质问等。","examples":[{"jp":"雨が降っているので、出かけません。","r":"あめがふっているので、でかけません。","zh":"因为下着雨，所以不出门。"},{"jp":"寒いから、コートを着ます。","r":"さむいから、コートをきます。","zh":"因为冷，所以穿大衣。"}],"keys":["ので"]},{"id":"g065","level":"N4","pattern":"动词基本形/动词ない形＋と","meaning":"相当于汉语的“一……就……；如果……就会……”等。","cat":"cond","note":"既可以表示恒常性状态、真理、反复性状态、习惯等，也可以表示发现新情况。前项是后项的条件，后项的句子不能是自己的意志、愿望、要求等。","examples":[{"jp":"春になると、花が咲きます。","r":"はるになると、はながさきます。","zh":"一到春天花就开。"},{"jp":"このボタンを押すと、ドアが開きます。","r":"このぼたんをおすと、ドアがあきます。","zh":"一按这个按钮，门就打开。"}]},{"id":"g066","level":"N4","pattern":"动词基本形/动词ない形＋ことがあります","meaning":"这个语法点要和“动词た形＋ことがあります”区分记忆。","cat":"tense","note":"动词基本形/动词ない形＋ことがあります：表示表示偶尔会出现某种情况，时不时地会出现某种状况。经常和“たまに”“時々”等副词搭配使用。动词た形＋ことがあります：表示曾经有过某种经历。","examples":[{"jp":"時々、遅く帰ることがあります。","r":"ときどき、おそくかえることがあります。","zh":"偶尔会晚回家。"},{"jp":"たまに外で食べることがあります。","r":"たまにそとでたべることがあります。","zh":"偶尔在外面吃饭。"}],"keys":["ことがあります"]},{"id":"g067","level":"N4","pattern":"“ほど”和“ぐらい”","meaning":"“数量词＋ほど”和“数量词＋ぐらい”都表示大致的数量和分量。","cat":"count","note":"但是表示某序列中的一点时，可以用“ぐらい”，但不能用“ほど”。比如，年龄后边只能用“ぐらい”，“第……个”后边只能用“ぐらい”。","examples":[{"jp":"三時間ほど待ちました。","r":"さんじかんほどまちました。","zh":"等了大约三个小时。"},{"jp":"十分ぐらい歩きます。","r":"じゅっぷんぐらいあるきます。","zh":"走大约十分钟。"}],"keys":["ぐらい","ほど"]},{"id":"g068","level":"N4","pattern":"～つもりです","meaning":"“动词基本形/动词ない形＋つもりです”表示说话前已经形成的意志或打算。","cat":"desire","note":"相当于汉语的“打算……”。同“动词意志形＋と思っています”所表达的意思相同。","examples":[{"jp":"来年、日本へ行くつもりです。","r":"らいねん、にほんへいくつもりです。","zh":"打算明年去日本。"},{"jp":"今日は何もするつもりはありません。","r":"きょうはなにもするつもりはありません。","zh":"今天不打算做任何事。"}],"keys":["つもり"]},{"id":"g069","level":"N4","pattern":"～ことにします/～ことにしました/～ことになりました","meaning":"表示一种决定和打算。","cat":"change","note":"～ことにします/～ことにしました：表示说话人自己对某一事情做出的某种决心，属于个人的决定。～ことになりました：表示由于某种外在原因导致形成了某种决定。多用于组织等做出的决定。","examples":[{"jp":"毎日ジョギングをすることにしました。","r":"まいにちジョギングをすることにしました。","zh":"决定每天慢跑。"},{"jp":"会議は来週に開かれることになりました。","r":"かいぎはらいしゅうにひらかれることになりました。","zh":"会议定于下周召开。"}],"keys":["ことにしました","ことになり"]},{"id":"g070","level":"N4","pattern":"～そうです（传闻）","meaning":"表示某种信息不是源于自己的直接感知而是别人那里听到了。","cat":"guess","note":"相当于汉语的“据说……；听说……”。提示消息的来源时要用“によると”。前面接简体，不论是动词、一类形容词、二类形容词、名词，都是简体形，没有例外。","examples":[{"jp":"天気予報によると、明日は雨だそうです。","r":"てんきよほうによると、あしたはあめだそうです。","zh":"据天气预报说，明天会下雨。"},{"jp":"あの映画は面白いそうです。","r":"あのえいがはおもしろいそうです。","zh":"听说那部电影很有趣。"}],"keys":["そうです","によると"]},{"id":"g071","level":"N4","pattern":"～てほしい（对他人的愿望）","meaning":"表示希望别人去做某事。","cat":"desire","note":"可以同表示自己想做某事的“～たい”区分记忆。","examples":[{"jp":"手伝ってほしいです。","r":"てつだってほしいです。","zh":"希望（你）帮忙。"},{"jp":"もう少し静かにしてほしいです。","r":"もうすこししずかにしてほしいです。","zh":"希望（你）再安静一点。"}],"keys":["てほしい"]},{"id":"g072","level":"N4","pattern":"～てしまいます","meaning":"“动词て形＋しまいます”既可以单纯地表示动作的完成，也可以表示该动作产生的结果是令人不愉快的事情。","cat":"tense","examples":[{"jp":"宿題を忘れてしまいました。","r":"しゅくだいをわすれてしまいました。","zh":"把作业给忘了。"},{"jp":"ケーキを全部食べてしまいました。","r":"ケーキをぜんぶたべてしまいました。","zh":"把蛋糕全吃完了。"}],"keys":["てしまい","てしまっ"]},{"id":"g073","level":"N4","pattern":"～そうです（样态、推测）","meaning":"表示说话人对某种事物样态的观感或根据某种情形推测事态的发展。","cat":"guess","note":"相当于汉语的“看上去……；好像……”。“～そうです”不仅可以放在句尾，也可以放在名词和动词前，变为“そうな＋名詞”“そうに＋動詞”。","examples":[{"jp":"このケーキは美味しそうです。","r":"このケーキはおいしそうです。","zh":"这个蛋糕看起来很好吃。"},{"jp":"雨が降りそうです。","r":"あめがふりそうです。","zh":"好像要下雨了。"}],"keys":["そうです"]},{"id":"g074","level":"N4","pattern":"～かしら","meaning":"同“～かな”意思相近，都是一种吐露自己内心疑问的自言自语的表达方式。","cat":"emote","note":"“～かな”多为男性使用，“～かしら”多为女性使用，显得说话人比较温柔。","examples":[{"jp":"明日、来るかしら。","r":"あした、くるかしら。","zh":"明天会来吗？（女性自言自语）"},{"jp":"どうしたのかしら。","r":"どうしたのかしら。","zh":"发生什么事了呢？"}],"keys":["かしら"]},{"id":"g075","level":"N4","pattern":"～てあります","meaning":"“自動詞＋ています”表示一种结果的存续，而“他动词＋てあります”则表示有意进行的动作结果的的存续状态。","cat":"tense","note":"在这个句型里不涉及动作的主体而只涉及动作的对象。","examples":[{"jp":"壁に絵がかけてあります。","r":"かべにえがかけてあります。","zh":"墙上挂着画。（事先挂好的）"},{"jp":"窓が開けてあります。","r":"まどがあけてあります。","zh":"窗户开着。（有人特意开的）"}],"keys":["てあります"]},{"id":"g076","level":"N4","pattern":"～ておきます","meaning":"表示为做某种准备而有意识地进行的动作，可以理解为“事先……”。","cat":"time","examples":[{"jp":"友達が来る前に、部屋を掃除しておきます。","r":"ともだちがくるまえに、へやをそうじしておきます。","zh":"朋友来之前，先打扫好房间。"},{"jp":"旅行の前に、切符を予約しておきます。","r":"りょこうのまえに、きっぷをよやくしておきます。","zh":"旅行前先把票订好。"}],"keys":["ておき"]},{"id":"g077","level":"N4","pattern":"～てみます","meaning":"表示尝试着做某事。","cat":"desire","note":"相当于汉语的“试着……”。","examples":[{"jp":"この料理を食べてみてください。","r":"このりょうりをたべてみてください。","zh":"请尝尝这道菜。"},{"jp":"新しい店に行ってみたいです。","r":"あたらしいみせにいってみたいです。","zh":"想去新店试试。"}],"keys":["てみます","てみました"]},{"id":"g078","level":"N3","pattern":"～ために（目的）","meaning":"“动词基本形/名词の＋ために”表示目的，前后两句主语须保持一致。","cat":"purpose","formation":"动词辞书形/ない形 + ために（目的）；名词の + ために（原因/目的）","examples":[{"jp":"日本語を勉強するために、日本へ行った。","r":"にほんごをべんきょうするために、にほんへいった。","zh":"为了学习日语，去了日本。"},{"jp":"風邪のために、学校を休んだ。","r":"かぜのために、がっこうをやすんだ。","zh":"因为感冒，没去上学。"}],"keys":["ために"]},{"id":"g079","level":"N4","pattern":"～たら","meaning":"用于表示假定条件。","cat":"cond","formation":"动词た形 + ら","note":"相当于汉语的“要是……（的话）”。其接续方式是把过去形式的“た”换成“たら”。但当前项接二类形容词和名词的过去否定式时要用“～でなかったら”。","examples":[{"jp":"雨が降ったら出かけません。","r":"あめがふったらでかけません。","zh":"下雨的话就不出门。"},{"jp":"家に帰ったらすぐ寝ました。","r":"いえにかえったらすぐねました。","zh":"回到家马上就睡了。"}],"keys":["たら"]},{"id":"g080","level":"N4","pattern":"だけ/しか＋否定","meaning":"二者都表示“除了举出的一项外，其他都不是这样”的意思。","cat":"limit","note":"但二者细微的差别在于在于“だけ”表示客观限定，而“しか＋否定”则包含有一种主观色彩，有种稍显遗憾的心情。","examples":[{"jp":"この店は日曜日だけ開いています。","r":"このみせはにちようびだけあいています。","zh":"这家店只在星期天营业。"},{"jp":"日本語しか話せません。","r":"にほんごしかはなせません。","zh":"只会说日语。"}],"keys":["だけ","しか"]},{"id":"g081","level":"N4","pattern":"に/のに（用途、基准）","meaning":"“名词＋に”和“动词基本形＋のに”可以用来表示用途和基准。","cat":"purpose","note":"表示用途时，后项多同“使います”等动词搭配使用；表示基准时，后项一般是表示评价的形容词。","examples":[{"jp":"このお金は本を買うのに使います。","r":"このおかねはほんをかうのにつかいます。","zh":"这笔钱用于买书。"},{"jp":"このナイフはパンを切るのに便利です。","r":"このナイフはパンをきるのにべんりです。","zh":"这把刀用来切面包很方便。"}],"keys":["のに"]},{"id":"g082","level":"N4","pattern":"～ばかり/～ばかりいます","meaning":"“名词＋ばかり”表示所列举的事物全部相同，相当于汉语的“光……；尽……”；“动词て形＋ばかりいます”表示重复发生同样的事情或总是进行同样的动作。","cat":"limit","note":"相当于汉语的“净是……；总是……”。","examples":[{"jp":"甘いものばかり食べています。","r":"あまいものばかりたべています。","zh":"净吃甜食。"},{"jp":"テレビばかり見ないでください。","r":"テレビばかりみないでください。","zh":"别光看电视。"}],"keys":["ばかり"]},{"id":"g083","level":"N4","pattern":"表示假定条件的“ば”形","meaning":"表示假定条件的“ば”形仅用于动词和一类形容词。","cat":"cond","examples":[{"jp":"安ければ、買います。","r":"やすければ、かいます。","zh":"如果便宜就买。"},{"jp":"雨が降れば、出かけません。","r":"あめがふれば、でかけません。","zh":"如果下雨就不出门。"}],"keys":["ければ"]},{"id":"g084","level":"N4","pattern":"～なら","meaning":"表示根据对方的言谈或交谈时的现场情况来陈述自己的意见或想法，也可以向对方提出请求或忠告。","cat":"cond","note":"后项多为判断、命令、提议等表示说话者主观立场的内容。","examples":[{"jp":"忙しいなら、手伝ってあげます。","r":"いそがしいなら、てつだってあげます。","zh":"如果忙的话，我来帮你。"},{"jp":"行くなら、今すぐ行きなさい。","r":"いくなら、いますぐいきなさい。","zh":"如果要去，就现在立刻去。"}],"keys":["なら"]},{"id":"g085","level":"N4","pattern":"～でも","meaning":"初级课程中的“～でも”主要有以下三种用法：①表示全面肯定。","cat":"limit","note":"相当于汉语的“……都……”。②用于提示一个极端的例子。相当于汉语的“就连……；即使……”。③表示举例，举出几个选项中有代表性的一项。一般不用于表示过去时态的句子。","examples":[{"jp":"子供でもわかります。","r":"こどもでもわかります。","zh":"连孩子都懂。"},{"jp":"日曜日でも働いています。","r":"にちようびでもはたらいています。","zh":"连星期天也在工作。"}],"keys":["でも"]},{"id":"g086","level":"N4","pattern":"～とか～とか","meaning":"表示用于列举同样性质的几个例子。","cat":"conj","note":"相当于汉语的“……啦，……啦”等。前项既可以接名词，也可以接句子。只能用于口语，不能用于书面语。","examples":[{"jp":"パンとか、卵とかを買いました。","r":"パンとか、たまごとかをかいました。","zh":"买了面包啦、鸡蛋啦什么的。"},{"jp":"日曜日とか、休みの日に遊びに行きます。","r":"にちようびとか、やすみのひにあそびにいきます。","zh":"星期天啦、休息日啦去玩。"}],"keys":["とか"]},{"id":"g087","level":"N4","pattern":"动词可能形","meaning":"动词的可能形式是表示能够进行某动作的形式，同“～ことができます”的意思相同。","cat":"potential","examples":[{"jp":"日本語が話せます。","r":"にほんごがはなせます。","zh":"会说日语。"},{"jp":"ここで泳げます。","r":"ここでおよげます。","zh":"可以在这里游泳。"}]},{"id":"g088","level":"N4","pattern":"～ように","meaning":"“动词基本形/动词ない形＋ように”表示“为了使某种状态成立”的意思。","cat":"purpose","formation":"动词辞书形／可能形 + ようになる","note":"相当于汉语的“为了……”。前项一般为非意志性的变化或状态，可以是非意志动词，也可以是意志动词的可能态。且前后两句的主语可以不一致。","examples":[{"jp":"日本語が話せるようになりました。","r":"にほんごがはなせるようになりました。","zh":"变得会说日语了。"},{"jp":"最近よく歩くようになりました。","r":"さいきんよくあるくようになりました。","zh":"最近变得常走路了。"}],"keys":["ように"]},{"id":"g089","level":"N4","pattern":"～ようになります/～ようにします","meaning":"二者都表示某种行为、状态等发生了变化。","cat":"change","note":"但前项接续和所表达的意思所有不同：～ようになります：前项接非意志性动词的“基本形”“ない形”或意志性动词的可能形式的“基本形”“ない形”。表示能力、状态、习惯等变成了某种状态。相当于汉语的“变得……；能够……”。～ようにします：前项接意志性动词的“基本形”“ない形”。表示由主观意志努力使某种行为、状况变成现实。相当于汉语的“要做到……；设法做到……”。在表示平时留心做某种已经成为习惯的行为时，要用“～ようにしています”。","examples":[{"jp":"日本語が話せるようになりました。","r":"にほんごがはなせるようになりました。","zh":"变得会说日语了。"},{"jp":"毎日野菜を食べるようにしています。","r":"まいにちやさいをたべるようにしています。","zh":"我尽量做到每天吃蔬菜。"}],"keys":["ようになり","ようにし"]},{"id":"g090","level":"N4","pattern":"～ために（原因、理由）","meaning":"表示原因、理由。","cat":"reason","note":"相当于汉语的“因为……；由于……”。前项为非意志性的事态或状态。多用于书面语或比较郑重的场合。如果前项是二类形容词，要用“二类形容词+な+ために”的形式；如果前项是名词则要用“名词+の+ために”。","examples":[{"jp":"風邪のために、学校を休みました。","r":"かぜのために、がっこうをやすみました。","zh":"因为感冒，没去上学。"},{"jp":"雨のために、試合は中止になりました。","r":"あめのために、しあいはちゅうしになりました。","zh":"因为下雨，比赛取消了。"}],"keys":["ために"]},{"id":"g091","level":"N4","pattern":"～ていきます/～てきます","meaning":"有以下四种用法：①接在“帰ります”“乗ります”“走ります”等表示移动的动词后面，表示以说话人为起点的移动方向。","cat":"change","note":"“～ていきます”表示由近及远，“～てきます”表示由远及近。②表示两个相继发生的动作。③“て”前面的动词表示动作主体的状况，而“～いきます/～きます”表示一种独立的动作。④“～てきます”在口语中常常用于描述说话人或其他人去了一个地方又回到原来的地方。相当于汉语的“去……就回来”。","examples":[{"jp":"ずっと歩いていきました。","r":"ずっとあるいていきました。","zh":"一直走过去了。"},{"jp":"鳥が飛んできました。","r":"とりがとんできました。","zh":"鸟飞过来了。"}],"keys":["ていき","てきま","ていく","てきました"]},{"id":"g092","level":"N4","pattern":"～ところです","meaning":"表示动作处于某种阶段，根据前接动词形式的不同而异。","cat":"time","note":"动词基本形＋ところです：表示动作即将进行。动词ている形＋ところです：表示动作正在进行。动词た形＋ところです：表示动作或事件刚刚结束。","examples":[{"jp":"これから食事するところです。","r":"これからしょくじするところです。","zh":"正要吃饭。"},{"jp":"今、本を読んでいるところです。","r":"いま、ほんをよんでいるところです。","zh":"正在读书。"}],"keys":["ところです"]},{"id":"g093","level":"N4","pattern":"～たところです/～たばかりです","meaning":"二者都表示动作或事情刚刚结束。","cat":"time","note":"但“～たばかりです”表示动作已经结束了较长的一段时间，而“～たところです”则表示动作行为结束后经过的时间极短。","examples":[{"jp":"ちょうど着いたところです。","r":"ちょうどついたところです。","zh":"刚刚到达。"},{"jp":"ご飯を食べたばかりです。","r":"ごはんをたべたばかりです。","zh":"刚吃过饭。"}],"keys":["たばかり","たところです"]},{"id":"g094","level":"N4","pattern":"～始めます/～出します/～続けます/～終わります","meaning":"“动词ます形”去掉“ます”加上“始めます”表示动作、变化的开始；加上“出します”表示突然出现了某种情况；加上“続けます”表示动作或状态的不间断持续；加上“終わります”表示动作或行为的结束。","cat":"time","examples":[{"jp":"雨が降り始めました。","r":"あめがふりはじめました。","zh":"开始下雨了。"},{"jp":"急に泣き出しました。","r":"きゅうになきだしました。","zh":"突然哭了起来。"}],"keys":["始めました","出しました","続けました","終わりました"]},{"id":"g095","level":"N4","pattern":"动词的被动形式和使役形式","meaning":"被动形式：指做主语的人或事物承受某种动作或影响，相当于汉语的“被……”。","cat":"passive","note":"使役形式：指使役主体强制或指示动作主体进行动作，相当于汉语的“使……；让……”。被动使役形式：由使役形加被动形组成，表示一种被迫性的动作。","examples":[{"jp":"先生に褒められました。","r":"せんせいにほめられました。","zh":"被老师表扬了。"},{"jp":"母は弟にコーヒーを買わせました。","r":"はははおとうとにコーヒーをかわせました。","zh":"妈妈让弟弟去买咖啡。"}],"keys":["られました","させました"]},{"id":"g096","level":"N4","pattern":"被动形式的几种表达方式：","meaning":"①动作对象做主语的被动句：名1は名2に动（ら）れます②物主做主语的被动句：名1は名2に名3を动（ら）れます这种被动句一般表示该事物的拥有者遭到了某种麻烦或损失。","cat":"passive","note":"③纯粹表示受害的被动句：名1は名2に动（ら）れます④事物做主语的被动句。名が/は动（ら）れます这种被动句的主体一般是某一不确定的人的群体，一般不在句中出现。","examples":[{"jp":"犬に噛まれました。","r":"いぬにかまれました。","zh":"被狗咬了。"},{"jp":"雨に降られて、困りました。","r":"あめにふられて、こまりました。","zh":"被雨淋了，很困扰。"}]},{"id":"g097","level":"N4","pattern":"使役形式的几种表达方式：","meaning":"①使役主体做主语，动词为自动词时：名1は名2を自动（さ）せます②使役主体做主语，动词为他动词时：名1は名2に名3を他动（さ）せます","cat":"passive","examples":[{"jp":"子供を走らせました。","r":"こどもをはしらせました。","zh":"让孩子跑。"},{"jp":"先生は学生に作文を書かせました。","r":"せんせいはがくせいにさくぶんをかかせました。","zh":"老师让学生写作文。"}],"keys":["させました","させた"]},{"id":"g098","level":"N4","pattern":"～まま","meaning":"“动词た形/动词ない形＋まま”“名词＋の＋まま”表示将理应改变的状态保持着去进行另外的动作。","cat":"state","formation":"名词 + の + まま／动词た形・ない形 + まま","note":"相当于汉语的“……着就……”。","examples":[{"jp":"窓を開けたまま寝ました。","r":"まどをあけたままねました。","zh":"开着窗睡了。"},{"jp":"靴を履いたまま家に入りました。","r":"くつをはいたままいえにはいりました。","zh":"穿着鞋进了家门。"}],"keys":["まま"]},{"id":"g099","level":"N4","pattern":"～のに","meaning":"表示逆接，指在前项的情况下发生后项是不合常理的。","cat":"reverse","formation":"普通形 + のに（名词／な形容词：〜なのに）","note":"相当于汉语的“尽管……”。前项如果是二类形容词或名词，要用“二类形容词/名词＋な＋のに”的形式。","examples":[{"jp":"約束したのに来ませんでした。","r":"やくそくしたのにきませんでした。","zh":"明明约好了却没来。"},{"jp":"日本へ行くのにお金が要ります。","r":"にほんへいくのにおかねがいります。","zh":"去日本需要钱。"}],"keys":["のに"]},{"id":"g100","level":"N4","pattern":"～はずです/～はずがありません","meaning":"表示根据某种理由做出的某种推断，用于对所推测的内容非常有把握的情况。","cat":"guess","note":"相当于汉语的“应该……/不应该……”。前项如果是二类形容词，要用“二类形容词＋な＋はずです/はずがありません”的形式；如果前项是名词，则要用“名词＋の＋はずです/はずがありません”的形式。","examples":[{"jp":"彼はもう着いたはずです。","r":"かれはもうついたはずです。","zh":"他应该已经到了。"},{"jp":"嘘をつくはずがありません。","r":"うそをつくはずがありません。","zh":"不可能撒谎。"}],"keys":["はず"]},{"id":"g101","level":"N4","pattern":"～やすいです/～にくいです","meaning":"“动词ます形”去掉“ます”加上“やすいです”表示某种事物有“易于……”的倾向；“动词ます形”去掉“ます”加上“にくいです”表示某种事物有“难于……”的倾向。","cat":"potential","examples":[{"jp":"このペンは書きやすいです。","r":"このぺんはかきやすいです。","zh":"这支笔好写。"},{"jp":"この字は読みにくいです。","r":"このじはよみにくいです。","zh":"这个字难读。"}],"keys":["やすい","にくい"]},{"id":"g102","level":"N4","pattern":"～ようです/～みたいです（推测）","meaning":"二者都表示根据说话人感知的某种情况进行推测，相当于汉语的“好像……”。","cat":"guess","note":"“～みたいです”是较为随便的说话，多用于口语中。当二类形容词和名词要加“～ようです”时要用“二类形容词＋な＋ようです”“名词＋の＋ようです”的形式；加“～みたいです”时要把其简体形的“だ”换成“～みたいです”。","examples":[{"jp":"彼は疲れているようです。","r":"かれはつかれているようです。","zh":"他好像很累。"},{"jp":"あの人は学生みたいです。","r":"あのひとはがくせいみたいです。","zh":"那个人好像是学生。"}],"keys":["ようです","みたいです"]},{"id":"g103","level":"N4","pattern":"～らしいです","meaning":"既可以表示根据某种观察到的情况进行推测，也可以用来婉转的叙述听来的信息。","cat":"guess","note":"相当于汉语的“好像……；据说……”。前项接二类形容词或名词时要把其简体形的“だ”换成“～らしいです”。","examples":[{"jp":"外は寒いらしいです。","r":"そとはさむいらしいです。","zh":"外面好像很冷。"},{"jp":"彼は料理が上手らしいです。","r":"かれはりょうりがじょうずらしいです。","zh":"听说他擅长做饭。"}],"keys":["らしい"]},{"id":"g104","level":"N4","pattern":"～過ぎます","meaning":"“动词ます形”去掉“ます”加上“過ぎます”表示某种动作或事物的性质超过了正常的量或程度。","cat":"compare","note":"相当于汉语的“太……；过……”。","examples":[{"jp":"昨日、食べ過ぎました。","r":"きのう、たべすぎました。","zh":"昨天吃多了。"},{"jp":"この問題は難しすぎます。","r":"このもんだいはむずかしすぎます。","zh":"这个问题太难了。"}],"keys":["すぎます","すぎました","すぎた","すぎて"]},{"id":"g105","level":"N4","pattern":"～ていきます/～てきました","meaning":"表示以时间为基准，动作的持续到性质、状态的变化。","cat":"change","note":"“～ていきます”表示从现在到未来；“～てきました”表示从过去到现在。","examples":[{"jp":"これからも日本語を勉強していきます。","r":"これからもにほんごをべんきょうしていきます。","zh":"今后也会继续学下去。"},{"jp":"長い間、日本語を勉強してきました。","r":"ながいあいだ、にほんごをべんきょうしてきました。","zh":"长期以来一直在学日语。"}]},{"id":"g106","level":"N4","pattern":"～し～し","meaning":"用于叙述并列的几个事项。","cat":"conj","formation":"普通形 + し、普通形 + し","note":"其前项既可以是简体形，也可以是敬体形。前项如果是二类形容词或名词，要用“二类形容词/名词＋だ＋し”的形式。","examples":[{"jp":"この町は静かだし、空気もきれいです。","r":"このまちはしずかだし、くうきもきれいです。","zh":"这个镇子又安静，空气又干净。"},{"jp":"雨も降っているし、疲れたし、帰りましょう。","r":"あめもふっているし、つかれたし、かえりましょう。","zh":"又下雨又累，回去吧。"}]},{"id":"g107","level":"N3","pattern":"～ば～ほど","meaning":"表示某性质的程度与其相关的性质、动作等成正比例关系。","cat":"compare","formation":"动词ば形 + 同一动词辞书形 + ほど","note":"相当于汉语的“越来越……”。","examples":[{"jp":"考えれば考えるほど、分からなくなる。","r":"かんがえればかんがえるほど、わからなくなる。","zh":"越想越不明白。"},{"jp":"日本語は勉強すればするほど、面白くなる。","r":"にほんごはべんきょうすればするほど、おもしろくなる。","zh":"日语越学越有趣。"}]},{"id":"g108","level":"N4","pattern":"～ようです/～みたいです（比喻）","meaning":"二者除了可以表示推测，还可以表示比喻。","cat":"guess","note":"相当于汉语的“仿佛……；好像……”。多与副词“まるで”等搭配使用。除了可以用在句尾，也可以在句中以“～ように/～みたいに”的形式修饰名词、动词或形容词。","examples":[{"jp":"まるで雪のように白いです。","r":"まるでゆきのようにしろいです。","zh":"像雪一样白。"},{"jp":"彼はまるで鳥のように空を飛べます。","r":"かれはまるでとりのようにそらをとべます。","zh":"他简直像鸟一样能在天空飞。"}]},{"id":"g109","level":"N4","pattern":"名1＋らしい＋名2","meaning":"表示“名词2”具有“名词1”的典型特征。","cat":"guess","note":"多与副词“いかにも”等搭配使用。如果二者为同一个名词，则表示“真正意义上的……；像样的……”。","examples":[{"jp":"大人らしい行動をしましょう。","r":"おとならしいこうどうをしましょう。","zh":"做出像大人一样的行动吧。"},{"jp":"彼は男らしい人です。","r":"かれはおとこらしいひとです。","zh":"他是个有男子气概的人。"}]},{"id":"g110","level":"N4","pattern":"～間/～間に","meaning":"相当于汉语的“在……时候”。","cat":"time","note":"动词简体形/名词の＋間：表示某种行为或事态持续的时间段，后项可以跟表示动作持续的“ている/ていた”。常与副词“ずっと”搭配使用。动词简体形/名词の＋間に：表示在某段时间范围内完成了某动作或行为，所以后面一般跟瞬间性动词。","examples":[{"jp":"留守の間、犬の世話をしてください。","r":"るすのあいだ、いぬのせわをしてください。","zh":"我不在的期间，请照看一下狗。"},{"jp":"休みの間に、荷物が届きました。","r":"やすみのあいだに、にもつがとどきました。","zh":"在休息期间，行李送到了。"}],"keys":["の間"]},{"id":"g111","level":"N4","pattern":"～のではないでしょうか/～んしゃないですか","meaning":"二者都是婉转陈述意见的表达。","cat":"guess","note":"相当于汉语的“不是……吗”，表达的是一种委婉的肯定。“んしゃないですか”的礼貌程度比“のではないでしょうか”略低一些。","examples":[{"jp":"これでいいのではないでしょうか。","r":"これでいいのではないでしょうか。","zh":"这样不就可以了吗？"},{"jp":"もう一度考えてみてはどうでしょう。","r":"もういちどかんがえてみてはどうでしょう。","zh":"再考虑一下怎么样？"}],"keys":["のではないでしょうか","ではないですか"]},{"id":"g112","level":"N4","pattern":"日语中的敬语","meaning":"敬语用于对会话中涉及的人物或者听话者表示敬意。","cat":"honor","note":"现代日语的敬语可以分为下列三类：尊他语：用抬高会话中的人物或听话人或听话人一方的方式表示敬意。自谦语：用压低说话人自身或说话人一方的方式表示敬意。礼貌语：通过使用“です”“ます”等礼貌的说法，表示对听话人的敬意。","examples":[{"jp":"先生はもうお帰りになりました。（尊他）","r":"せんせいはもうおかえりになりました。","zh":"老师已经回去了。（尊他）"},{"jp":"私は先生にお礼を申し上げました。（自谦）","r":"わたしはせんせいにおれいをもうしあげました。","zh":"我向老师道了谢。（自谦）"}]},{"id":"g113","level":"N4","pattern":"“尊他语”的几种表达方式","meaning":"①お/ご＋动词ます形去掉ます+になります尊他语的一种表达形式。","cat":"honor","note":"这种句式只适用于“一类动词”和“二类动词”，且如果动词的“ます”形去掉“ます”后只剩一个音节的话，也不能使用这种形式。比如“見ます”“寝ます”等。②お＋动词ます形＋くださいご＋三类动词的汉字部分＋ください表示劝说听话人做有益于听话人或有益于公共利益的事情。一类动词和二类动词的“ます”形去掉“ます”后只剩一个音节的动词和三类动词的“します”“来ます”不能使用这种形式。③动词的被动形式表尊敬这种用法与动词的被动形式不同，这是单纯地将原句的动词改为“～（ら）れます”，不改变句子成分的位置及助词等。","examples":[{"jp":"お名前は何ですか。","r":"おなまえはなんですか。","zh":"请问您尊姓大名？"},{"jp":"どうぞ、お入りください。","r":"どうぞ、おはいりください。","zh":"请进。"}]},{"id":"g114","level":"N4","pattern":"“自谦语”表达方式","meaning":"①お＋动词ます形＋しますご＋三类动词的汉字部分＋します自谦语中用得最多的一种形式。","cat":"honor","note":"一类动词和二类动词的“ます”形去掉“ます”后只剩一个音节的动词和三类动词的“します”“来ます”不能使用这种形式。②～（さ）せていただきます表示“请允许我做某事”。日常生活中，这个句型使用的频率非常高，其自谦程度比“お/ご～します”要高。在非常礼貌地询问对方是否允许自己做某事时可以用“～（さ）せていただけますか”“～（さ）せていただけませんか”。","examples":[{"jp":"私がご案内します。","r":"わたしがごあんないします。","zh":"由我来为您带路。"},{"jp":"明日、連絡させていただきます。","r":"あした、れんらくさせていただきます。","zh":"请允许我明天联系您。"}]},{"id":"g115","level":"N4","pattern":"～ていただけますか","meaning":"表示请求对方为自己做某事。","cat":"honor","note":"更礼貌的说法为“～ていただけませんか”。","examples":[{"jp":"手伝っていただけますか。","r":"てつだっていただけますか。","zh":"能请您帮忙吗？"},{"jp":"もう一度説明していただけませんか。","r":"もういちどせつめいしていただけませんか。","zh":"能请您再说明一遍吗？"}],"keys":["ていただけませんか","ていただけますか"]},{"id":"g116","level":"N3","pattern":"～とは","meaning":"①是“～というのは”的省略形式，用于提出某个名称，并就其进行说明或询问。","cat":"quote","note":"②还表示下定义，以“～とは～のことです”的形式。117～は～の１つです。“AはBの１つです”表示A属于B范围当中的一种。","examples":[{"jp":"日本の冬がこんなに寒いとは思わなかった。","r":"にほんのふゆがこんなにさむいとはおもわなかった。","zh":"没想到日本的冬天竟然这么冷。"},{"jp":"まさか彼が優勝するとは誰も思わなかった。","r":"まさかかれがゆうしょうするとはだれもおもわなかった。","zh":"谁也没想到他竟然会夺冠。"}]},{"id":"g117","level":"N3","pattern":"～ぶり","meaning":"前接表示时间段的名词，是一种含有感叹语气的表达方式，表示离再次发生同样事情的时间较长，让人觉得已经过了那么长的时间。","cat":"time","examples":[{"jp":"10年ぶりに、故郷に帰った。","r":"じゅうねんぶりに、こきょうにかえった。","zh":"时隔十年，回到了故乡。"},{"jp":"久しぶりに友人に会って、昔話に花を咲かせた。","r":"ひさしぶりにゆうじんにあって、むかしばなしにはなをさかせた。","zh":"时隔许久见到老朋友，聊起往事谈得十分尽兴。"}]},{"id":"g118","level":"N3","pattern":"～ものです","meaning":"“简体小句+ものです”有表示说话人感叹的用法，表示对事物的性质或变化很吃惊。","cat":"emote","note":"或者与“よく”一起使用，表示对平常不会发生的事情的惊讶。","examples":[{"jp":"時がたつのは本当に早いものです。","r":"ときがたつのはほんとうにはやいものです。","zh":"时间过得可真快呀。"},{"jp":"よくもまあ、あんなに長く話せるものです。","r":"よくもまあ、あんなにながくはなせるものです。","zh":"真没想到他能说那么久。"}]},{"id":"g119","level":"N3","pattern":"～よりも","meaning":"表示比较，和“より”意思相同，加助词“も”语气更强烈。","cat":"compare","examples":[{"jp":"体の健康は、何よりも大切だ。","r":"からだのけんこうは、なによりもたいせつだ。","zh":"身体的健康比什么都重要。"},{"jp":"言葉よりも行動で示してほしい。","r":"ことばよりもこうどうでしめしてほしい。","zh":"希望用行动而不是言语来证明。"}]},{"id":"g120","level":"N3","pattern":"お辞儀をし、～","meaning":"口语中讲述事件发生的顺序时，常用“～て、～”的形式，书面语中一般用动词“ます形”去掉“ます”的形式连接。","cat":"conj","examples":[{"jp":"教室に入ると、お辞儀をし、着席した。","r":"きょうしつにはいると、おじぎをし、ちゃくせきした。","zh":"走进教室，鞠了一躬，然后坐下了。"},{"jp":"会場に到着し、受付を済ませて席についた。","r":"かいじょうにとうちゃくし、うけつけをすませてせきについた。","zh":"到达会场，办完签到后坐到了座位上。"}]},{"id":"g121","level":"N3","pattern":"～ほうがいいでしょう","meaning":"“动た形＋ほうがいい”表示向对方提出某种建议，不这样做的话会导致不好的结果。","cat":"order","note":"句尾加“でしょう”语气更委婉柔和。","examples":[{"jp":"体調が悪いなら、早めに休んだほうがいいでしょう。","r":"たいちょうがわるいなら、はやめにやすんだほうがいいでしょう。","zh":"如果身体不舒服，还是早点休息比较好。"},{"jp":"この書類は、時間があるときに確認したほうがいいでしょう。","r":"このしょるいは、じかんがあるときにかくにんしたほうがいいでしょう。","zh":"这份文件，还是等有时间的时候再确认一下比较好。"}]},{"id":"g122","level":"N3","pattern":"いくら～ても～","meaning":"“いくらAてもB”意为“无论如何努力做A，但即使那样还是B”。","cat":"reverse","examples":[{"jp":"いくら練習しても、なかなか上達しない。","r":"いくられんしゅうしても、なかなかじょうたつしない。","zh":"再怎么练习，也很难进步。"},{"jp":"いくら考えても、いい案が浮かばない。","r":"いくらかんがえても、いいあんがうかばない。","zh":"怎么想也想不出好主意。"}]},{"id":"g123","level":"N3","pattern":"～ては/～では","meaning":"“AてはB”表示出现不良情况A，就会出现B的情况或状态，B的内容多为消极评价。","cat":"reverse","examples":[{"jp":"そんなに遅くまで起きては、明日の仕事に響くよ。","r":"そんなにおそくまでおきては、あしたのしごとにひびくよ。","zh":"那么晚还不睡，会影响明天的工作哦。"},{"jp":"一日中パソコンを見ては、目が疲れてしまう。","r":"いちにちじゅうパソコンをみては、めがつかれてしまう。","zh":"整天盯着电脑，眼睛会累坏的。"}]},{"id":"g124","level":"N3","pattern":"～以上に","meaning":"“动（基本形/た形）/名＋以上に”有比较的意思，表示超出了作为基准的量或范围。","cat":"compare","note":"是比较正式的书面表达。","examples":[{"jp":"この町は、予想以上に人が多い。","r":"このまちは、よそういじょうにひとがおおい。","zh":"这个城市的人比预想的还多。"},{"jp":"値段は思った以上に安かった。","r":"ねだんはおもったいじょうにやすかった。","zh":"价格比想象的便宜。"}]},{"id":"g125","level":"N3","pattern":"～を含めて","meaning":"“～を含めて＋｢数量词｣”表示“包括～在内＋｢数量词｣”。","cat":"count","note":"需注意的是，如果说“わたしを含めて4名”则全部人数为4名；如果说“わたしほか4名”则合计人数为5名。","examples":[{"jp":"私を含めて4名で参加します。","r":"わたしをふくめてよんめいでさんかします。","zh":"包括我在内一共四人参加。"},{"jp":"送料を含めて、全部で3000円です。","r":"そうりょうをふくめて、ぜんぶでさんぜんえんです。","zh":"包括运费在内，一共三千日元。"}]},{"id":"g126","level":"N3","pattern":"～にとって、～","meaning":"接在表示人、组织或国家的名词后，表示“从～立场来看，～”的意思。","cat":"view","examples":[{"jp":"この仕事は、新人にとっては難しいかもしれない。","r":"このしごとは、しんじんにとってはむずかしいかもしれない。","zh":"这份工作，对新人来说也许很难。"},{"jp":"環境問題は、私たち全員にとって重要な課題だ。","r":"かんきょうもんだいは、わたしたちぜんいんにとってじゅうようなかだいだ。","zh":"环境问题是我们所有人面临的重要课题。"}]},{"id":"g127","level":"N3","pattern":"場合","meaning":"以“名＋の場合”“二类形容词＋な場合”“小句（简体形式）＋場合”的形式接在小句最后，表示状况、情况或事态等意义，有连接前后句子内容的功能。","cat":"cond","examples":[{"jp":"雨の場合は、試合を中止します。","r":"あめのばあいは、しあいをちゅうしします。","zh":"下雨的话，就中止比赛。"},{"jp":"具合が悪い場合は、早退してもかまいません。","r":"ぐあいがわるいばあいは、そうたいしてもかまいません。","zh":"如果身体不舒服，早退也没关系。"}]},{"id":"g128","level":"N3","pattern":"～わけにはいきません","meaning":"“动词（基本形/ない形）＋わけにはいきません”表示依据社会常识或经验等来看是不可能的事情，并不表示没有能力做这件事。","cat":"oblig","examples":[{"jp":"友人の前では、本音を言うわけにはいきません。","r":"ゆうじんのまえでは、ほんねをいうわけにはいきません。","zh":"在朋友面前，不能说真心话。"},{"jp":"約束があるので、今日はもう帰るわけにはいきません。","r":"やくそくがあるので、きょうはもうかえるわけにはいきません。","zh":"因为有约，今天不能就这么回去。"}]},{"id":"g129","level":"N3","pattern":"～といわれています","meaning":"“小句（简体形式）+といわれています/と考えられています”，表示普遍认为的看法，评价。","cat":"guess","note":"“大家都认为”“据说”等。","examples":[{"jp":"日本の生活は、礼儀を重んじる社会だといわれています。","r":"にほんのせいかつは、れいぎをおもんじるしゃかいだといわれています。","zh":"人们都说日本是重视礼仪的社会。"},{"jp":"この地方の冬は、雪が多いといわれています。","r":"このちほうのふゆは、ゆきがおおいといわれています。","zh":"据说这一带的冬天雪很多。"}]},{"id":"g130","level":"N3","pattern":"一方で","meaning":"用于句首，表明所述内容与前述内容是对立或对比关系。","cat":"conj","examples":[{"jp":"都会は便利な一方で、自然が少ない。","r":"とかいはべんりないっぽうで、しぜんがすくない。","zh":"城市固然方便，但另一方面自然很少。"},{"jp":"彼は仕事ができる。一方で、体を壊しやすい。","r":"かれはしごとができる。いっぽうで、からだをこわしやすい。","zh":"他很能干，另一方面，也容易累垮身体。"}]},{"id":"g131","level":"N3","pattern":"～ところ","meaning":"意为“在那种情况下”，表示给对方添麻烦或向对方提出勉为其难的请求时对对方状况的体谅。","cat":"view","note":"还可以用“ところを”。","examples":[{"jp":"お忙しいところ、すみませんが、ちょっとお聞きしたいことがあります。","r":"おいそがしいところ、すみませんが、ちょっとおききしたいことがあります。","zh":"百忙之中打扰您，不好意思，想问您一点事情。"},{"jp":"お休みのところを、急に呼び出してしまって申し訳ありません。","r":"おやすみのところを、きゅうによびだしてしまってもうしわけありません。","zh":"在您休息的时候突然把您叫出来，非常抱歉。"}]},{"id":"g132","level":"N3","pattern":"～といえば","meaning":"“名词＋といえば”用于提出话题，进而叙述由此而联想到的事情或对该话题进行说明。","cat":"quote","examples":[{"jp":"日本の食べ物といえば、やはり寿司が思い浮かぶ。","r":"にほんのたべものといえば、やはりすしがおもいうかぶ。","zh":"说到日本的食物，果然会想起寿司。"},{"jp":"この大学といえば、経済学部が有名だ。","r":"このだいがくといえば、けいざいがくぶがゆうめいだ。","zh":"说到这所大学，经济学部很有名。"}]},{"id":"g133","level":"N3","pattern":"～てきます","meaning":"“动词て形＋きます”表示某种变化或动作不断发展或处于某种状态。","cat":"change","note":"也可使用“动词て形＋きています/きました”的形式表示从过去一直持续到现在。","examples":[{"jp":"だんだん寒くなってきましたね。","r":"だんだんさむくなってきましたね。","zh":"渐渐冷起来了呢。"},{"jp":"最近、日本語が上達してきました。","r":"さいきん、にほんごがじょうたつしてきました。","zh":"最近日语进步了。"}]},{"id":"g134","level":"N3","pattern":"～（の）ではないか","meaning":"表示说话人不完全肯定的语气，用于以个人看法的方式提出建议。","cat":"guess","note":"接续为“动词/一类形容词/二类形容词＋のではないか”“名词＋ではないか”。","examples":[{"jp":"このままでは、遅れてしまうのではないか。","r":"このままでは、おくれてしまうのではないか。","zh":"这样下去，恐怕会迟到吧。"},{"jp":"彼の話は、少し誇張されているのではないかと思う。","r":"かれのはなしは、すこしこちょうされているのではないかとおもう。","zh":"我觉得他的话是不是有点夸张了。"}]},{"id":"g135","level":"N3","pattern":"このように","meaning":"常用作连词连接前后句子，用于指示前述内容，意为“如前文所述”。","cat":"conj","examples":[{"jp":"このように、健康には毎日の生活習慣が大切です。","r":"このように、けんこうにはまいにちのせいかつしゅうかんがたいせつです。","zh":"如上所述，健康离不开每天的日常习惯。"},{"jp":"このようにして、少しずつ技術を身につけていった。","r":"このようにして、すこしずつぎじゅつをみにつけていった。","zh":"就这样，一点点掌握了技术。"}]},{"id":"g136","level":"N3","pattern":"～をきっかけにして","meaning":"“きっかけ”是指引起事情发生的事或机会。","cat":"time","note":"使用“～を＋特定名词＋にして”的形式，表示方式，类似还有“～を頼りにして（借助～）”，“して”有时可省略。","examples":[{"jp":"留学をきっかけにして、世界が広がった。","r":"りゅうがくをきっかけにして、せかいがひろがった。","zh":"以留学为契机，眼界开阔了。"},{"jp":"友人の言葉をきっかけにして、転職を決めた。","r":"ゆうじんのことばをきっかけにして、てんしょくをきめた。","zh":"以朋友的一番话为契机，决定换工作。"}]},{"id":"g137","level":"N3","pattern":"～に受ける","meaning":"“表示人的名词+に受ける”，表示“该人”对此很中意、评价好、喜欢等意思。","cat":"view","examples":[{"jp":"この曲は若者に受けている。","r":"このきょくはわかものにうけている。","zh":"这首歌很受年轻人欢迎。"},{"jp":"彼の冗談は同僚に受けなかった。","r":"かれのじょうだんはどうりょうにうけなかった。","zh":"他的玩笑没有逗乐同事。"}]},{"id":"g138","level":"N3","pattern":"～って","meaning":"是“～と/とは/という人は”等在会话中的缩略形式。","cat":"quote","note":"常用于提出对方说过的词语，或者只知道名称但不知道意思等情形。","examples":[{"jp":"「課長」って、何と読むんですか。","r":"「かちょう」って、なんとよむんですか。","zh":"“課長”这个词怎么读？"},{"jp":"明日の会議って、何時からでしたっけ。","r":"あしたのかいぎって、なんじからでしたっけ。","zh":"明天的会议是几点开始来着？"}]},{"id":"g139","level":"N3","pattern":"～のは間違いない","meaning":"表示说话人持有某种依据，做出确信不疑的判断。","cat":"guess","note":"“の”可以用“こと”替代。","examples":[{"jp":"彼が遅れるのは、間違いない。","r":"かれがおくれるのは、まちがいない。","zh":"他肯定会迟到。"},{"jp":"このままでは値上がりするのは間違いない。","r":"このままではねあがりするのはまちがいない。","zh":"照这样下去，肯定会涨价。"}]},{"id":"g140","level":"N3","pattern":"～に基づいた～","meaning":"表示依据某种判断或消息来源实施某种行为时使用“～に基づいた＋名词”“～に基づいて＋谓语”“～に基づく＋名词”等表达方式。","cat":"view","examples":[{"jp":"調査結果に基づいた報告書を作成した。","r":"ちょうさけっかにもとづいたほうこくしょをさくせいした。","zh":"制作了基于调查结果的报告。"},{"jp":"実際の経験に基づいて話してください。","r":"じっさいのけいけんにもとづいてはなしてください。","zh":"请根据实际经验来谈。"}]},{"id":"g141","level":"N3","pattern":"～を中心とした～","meaning":"表示举出主要要素或中心要素、代表性事例的表达方式，与“～を中心とする～”意思相同","cat":"view","examples":[{"jp":"この地域は農業を中心とした町だ。","r":"このちいきはのうぎょうをちゅうしんとしたまちだ。","zh":"这一带是以农业为中心的城镇。"},{"jp":"この大学は理工系を中心とした研究を行っている。","r":"このだいがくはりこうけいをちゅうしんとしたけんきゅうをおこなっている。","zh":"这所大学以理工科为中心开展研究。"}]},{"id":"g142","level":"N3","pattern":"～による/～によって","meaning":"“名词＋による/によって”表示“不同情况”，后续多接“違う（不同、有差别）”“変わる（变化、不同等）”等表达方式。","cat":"reason","examples":[{"jp":"人によって、考え方が違う。","r":"ひとによって、かんがえかたがちがう。","zh":"想法因人而异。"},{"jp":"国によって、習慣が異なる。","r":"くにによって、しゅうかんがことなる。","zh":"风俗习惯因国家而不同。"}]},{"id":"g143","level":"N3","pattern":"～といっても","meaning":"“名词/简体小句+といっても”表示转折关系，意为虽然大体上能够那样认定，但其性质不一样。","cat":"reverse","examples":[{"jp":"便利になったといっても、やはり田舎では車がなければ困る。","r":"べんりになったといっても、やはりいなかではくるまがなければこまる。","zh":"虽说方便了，但在乡下没有车还是不行。"},{"jp":"日本語ができるといっても、日常会話程度だ。","r":"にほんごができるといっても、にちじょうかいわていどだ。","zh":"虽说会日语，但也只是日常会话的程度。"}]},{"id":"g144","level":"N3","pattern":"～をしている","meaning":"“～+名词+をしている”是表示状态的表达方式。","cat":"state","note":"名词部分可用“形”“色”等词，“～”的部分使用表示颜色或形状的形容词或“名词+の”的形式。","examples":[{"jp":"彼女は青い目をしている。","r":"かのじょはあおいめをしている。","zh":"她有一双蓝色的眼睛。"},{"jp":"この建物は変わった形をしている。","r":"このたてものはかわったかたちをしている。","zh":"这座建筑形状很奇特。"}]},{"id":"g145","level":"N3","pattern":"～のうえで（の）","meaning":"用“名词+のうえで”的形式表示范围、状况，名词多为“付き合い（交往）/仕事/生活”等日常生活用语。","cat":"view","examples":[{"jp":"仕事のうえでは、上司の指示に従う。","r":"しごとのうえでは、じょうしのしじにしたがう。","zh":"在工作上，要听从上司的指示。"},{"jp":"付き合いのうえでは、礼儀を大切にする。","r":"つきあいのうえでは、れいぎをたいせつにする。","zh":"在交往中，注重礼节。"}]},{"id":"g146","level":"N3","pattern":"～さえ～ば","meaning":"“さえ”用于“～ば”等表示条件的小句中，表示后项成立的最低条件。","cat":"cond","examples":[{"jp":"体が丈夫でさえあれば、あとは何とかなる。","r":"からだがじょうぶでさえあれば、あとはなんとかなる。","zh":"只要身体结实，其他总会有办法。"},{"jp":"辞書さえあれば、この本は読める。","r":"じしょさえあれば、このほんはよめる。","zh":"只要有词典，这本书就能读。"}]},{"id":"g147","level":"N3","pattern":"などという","meaning":"举出具有代表性的两个以上的事例，暗示还有其他多个事例时使用的表达方式。","cat":"conj","examples":[{"jp":"忙しいとか疲れたなどという理由で、勉強をやめてはいけない。","r":"いそがしいとかつかれたなどというりゆうで、べんきょうをやめてはいけない。","zh":"不能以忙啊累啊之类的理由放弃学习。"},{"jp":"日本や中国などという国の留学生が多く集まった。","r":"にほんやちゅうごくなどというくにのりゅうがくせいがおおくあつまった。","zh":"聚集了日本、中国等许多国家的留学生。"}]},{"id":"g148","level":"N3","pattern":"～ごとに","meaning":"表示事物有规则地反复时的间隔，前接动词基本型时，大多可以替换为“たびに”。","cat":"count","examples":[{"jp":"この電車は1時間ごとに来る。","r":"このでんしゃはいちじかんごとにくる。","zh":"这趟电车每小时一班。"},{"jp":"季節が変わるごとに、服装も変わる。","r":"きせつがかわるごとに、ふくそうもかわる。","zh":"每到季节变换，衣着也随之改变。"}]},{"id":"g149","level":"N3","pattern":"～だけではすまない/だけですむ","meaning":"“简体小句+だけだ”表示影响或意义不大，后续“すまない”表示影响或意义不可能在某种水平以下，情况严重，通常用于不好的事情。","cat":"limit","note":"后续“すむ”则刚好相反，表示影响轻微。","examples":[{"jp":"お金を払えば、それだけで済む問題ではない。","r":"おかねをはらえば、それだけですむもんだいではない。","zh":"这并非付了钱就能了事的问题。"},{"jp":"今回のミスは、謝るだけで済まないだろう。","r":"こんかいのミスは、あやまるだけですまないだろう。","zh":"这次的失误，恐怕不是道个歉就能了事的。"}]},{"id":"g150","level":"N3","pattern":"～代わりに～/～代わって/～に代わる～","meaning":"“代わり”是“代わる”的名词形式。","cat":"view","note":"前面都是接续名词。表示应由某人或物做的事改由其他代替来做。“代替，替…”。","examples":[{"jp":"社長の代わりに、私が会議に出席します。","r":"しゃちょうのかわりに、わたしがかいぎにしゅっせきします。","zh":"我代替社长出席会议。"},{"jp":"歩く代わりに、自転車を使うことにした。","r":"あるくかわりに、じてんしゃをつかうことにした。","zh":"决定不走路，改骑自行车。"}]},{"id":"g151","level":"N3","pattern":"～末","meaning":"“名＋の末”“动词（た形）＋末”表示在经历某个过程之后，最终取得某种结果或成功。","cat":"time","examples":[{"jp":"長い話し合いの末、ようやく合意に達した。","r":"ながいはなしあいのすえ、ようやくごういにたっした。","zh":"经过长久的协商，终于达成了一致。"},{"jp":"苦労した末に、夢を実現することができた。","r":"くろうしたすえに、ゆめをじつげんすることができた。","zh":"历经辛苦之后，终于实现了梦想。"}]},{"id":"g152","level":"N3","pattern":"～にて","meaning":"“～にて”与助词“で”意思相同，是比较郑重的说法，主要用于书面语。","cat":"particle","examples":[{"jp":"会議は明日10時にて行われます。","r":"かいぎはあしたじゅうじにておこなわれます。","zh":"会议于明天十点举行。"},{"jp":"本件につきましては、別途書面にてご連絡いたします。","r":"ほんけんにつきましては、べっとしょめんにてごれんらくいたします。","zh":"关于此事，将另行以书面形式联系。"}]},{"id":"g153","level":"N3","pattern":"拟声词后续“する”","meaning":"日语中的拟声词非常多，后续“する”可以构成表现心理活动或事物与状态的动词。","cat":"state","note":"有两种表现方式：一是描写从外部看到的样子、形态。如“ふわふわする（轻飘飘、软绵绵）”“にこにこする（笑眯眯）”等。二是描写从外部看不到的心理活动或心理状态，如“いらいらする”“ぼんやりする”等。","examples":[{"jp":"子供たちがにこにこしながら遊んでいる。","r":"こどもたちがにこにこしながらあそんでいる。","zh":"孩子们笑眯眯地玩耍。"},{"jp":"試験の結果を待つ間、いらいらして落ち着かない。","r":"しけんのけっかをまつあいだ、いらいらしておちつかない。","zh":"等待考试结果的这段时间，焦躁得静不下心来。"}]},{"id":"g154","level":"N3","pattern":"～かと思ったら","meaning":"“かと思ったら”常与各种疑问词一起使用，后句使用过去形式“～た”，表示意外发现或察觉到某事。","cat":"time","examples":[{"jp":"雨が降るかと思ったら、すぐに晴れ間が見えてきた。","r":"あめがふるかとおもったら、すぐにはれまがみえてきた。","zh":"刚以为要下雨，马上又看到了放晴。"},{"jp":"家を出るかと思ったら、また戻ってきた。","r":"いえをでるとおもったら、またもどってきた。","zh":"刚以为他要出门，又折回来了。"}]},{"id":"g155","level":"N3","pattern":"～のだろうか","meaning":"用于描述说话人感到疑惑的心情，与“～だろうか”表示单纯的疑问相比，“～のだろうか”是基于信息或某种状况得出的疑问。","cat":"guess","examples":[{"jp":"本当にこの計画はうまくいくのだろうか。","r":"ほんとうにこのけいかくはうまくいくのだろうか。","zh":"这个计划真的能顺利进行吗？"},{"jp":"彼はどうして今日来なかったのだろうか。","r":"かれはどうしてきょうこなかったのだろうか。","zh":"他今天为什么没来呢？"}]},{"id":"g156","level":"N3","pattern":"～なんて","meaning":"“小句（基本形/简体形式）或二类形容词/名词+なんて”后续“すごい”“羨ましい”等表示评价的词语，用于评价对象，表达说话人感到出乎意料、不同寻常的心情。","cat":"emote","examples":[{"jp":"一人で世界一周したなんて、すごい。","r":"ひとりでせかいいっしゅうしたなんて、すごい。","zh":"一个人环游世界，真了不起。"},{"jp":"彼がそんなに上手に歌えるなんて、驚いた。","r":"かれがそんなにじょうずにうたえるなんて、おどろいた。","zh":"他唱歌竟然那么拿手，真让人惊讶。"}]},{"id":"g157","level":"N3","pattern":"～くらい/ぐらい","meaning":"“名词+くらい/ぐらい”有表示概数和强调程度的用法，还有表示最低限度的用法，此时一般用“～くらい”。","cat":"count","examples":[{"jp":"ここから駅までは、10分ぐらいです。","r":"ここからえきまでは、じゅっぷんぐらいです。","zh":"从这儿到车站大约十分钟。"},{"jp":"忙しい時は、お茶を飲むくらいの時間もない。","r":"いそがしいときは、おちゃをのむくらいのじかんもない。","zh":"忙的时候，连喝杯茶的时间都没有。"},{"jp":"マラソン大会から帰るとき、電車はすいていたが、一度座ったら立ち上がれそうにないぐらい疲れていた。","r":"マラソンたいかいからかえるとき、でんしゃはすいていたが、いちどすわったらたちあがれそうにないぐらいつかれていた。","zh":"从马拉松大会回来时电车很空，但一坐下就累得站不起来。","src":"2022年7月真题"}],"srcs":["2022年7月真题"]},{"id":"g158","level":"N3","pattern":"～による/～によって","meaning":"“名词+による/によって”可表示动作主体，情况差异，此外还有表示方法或手段的用法。","cat":"reason","examples":[{"jp":"メールによって、資料を送りました。","r":"メールによって、しりょうをおくりました。","zh":"通过邮件发送了资料。"},{"jp":"この商品は、新しい技術によって作られました。","r":"このしょうひんは、あたらしいぎじゅつによってつくられました。","zh":"这个商品是用新技术制造的。"}]},{"id":"g159","level":"N3","pattern":"“結構です”的两种含义","meaning":"一是表示肯定意义。","cat":"emote","note":"另一种是表示拒绝别人的邀请或劝告，因为容易混淆，前面常加上“はい”“いいえ”或副词“もう”，使意思更明确。","examples":[{"jp":"「コーヒーはいかがですか。」「はい、結構です。」","r":"「コーヒーはいかがですか。」「はい、けっこうです。」","zh":"“来杯咖啡怎么样？”“好的，谢谢。”"},{"jp":"「もう一杯いかがですか。」「いいえ、結構です。もう十分いただきました。」","r":"「もういっぱいいかがですか。」「いいえ、けっこうです。もうじゅうぶんいただきました。」","zh":"“再来一杯怎么样？”“不了，谢谢，已经喝够了。”"}]},{"id":"g160","level":"N3","pattern":"～見込みです","meaning":"表示“很可能”“有希望”等意思，客观陈述未来变成某种状态的可能性非常高。","cat":"guess","note":"前接简体小句，接名词时加“の”，接动词时用动词的现在将来形式。","examples":[{"jp":"来月には完成する見込みです。","r":"らいげつにはかんせいするみこみです。","zh":"预计下个月能完成。"},{"jp":"今年の売り上げは、昨年を上回る見込みです。","r":"ことしのうりあげは、さくねんをうわまわるみこみです。","zh":"今年的销售额预计会超过去年。"},{"jp":"この遊園地はオープンからまもなく1年を迎える。総来場者数は先月末の時点で850万人に上り、1周年となる来月には1000万人を超える見込みだ。","r":"このゆうえんちはオープンからまもなくいちねんをむかえる。そうらいじょうしゃすうはせんげつまつのじてんではっぴゃくごじゅうまんにんにのぼり、いっしゅうねんとなるらいげつにはせんまんにんをこえるみこみだ。","zh":"这座游乐园开业将满一年。总入园人数上月末已达850万，预计下月满周年时将突破1000万。","src":"2022年7月真题"}],"srcs":["2022年7月真题"]},{"id":"g161","level":"N3","pattern":"～わけではない","meaning":"前接简体小句表示对依据某种情况附带推测出来的情况的否定。","cat":"negative","note":"接二类形容词和名词时，形式分别为“二类形容词+なわけではない”和“名词+である（であった）+なわけではない”。另外还有“～というわけではない”的形式。","examples":[{"jp":"嫌いなわけではないが、あまり食べない。","r":"きらいなわけではないが、あまりたべない。","zh":"倒也不是不喜欢，只是不怎么吃。"},{"jp":"彼が悪いわけではない。私にも責任がある。","r":"かれがわるいわけではない。わたしにもせきにんがある。","zh":"并不是他的错，我也有责任。"}]},{"id":"g162","level":"N3","pattern":"～関する","meaning":"“名词+に関して”表示“关于”“与…相关连”等意思。","cat":"quote","note":"后续名词时用“～に関する＋名词”的形式。比“～について”更为郑重一些。","examples":[{"jp":"この本は、環境に関する研究をまとめたものだ。","r":"このほんは、かんきょうにかんするけんきゅうをまとめたものだ。","zh":"这本书汇集了关于环境的研究。"},{"jp":"健康に関しては、気をつけていることが多い。","r":"けんこうにかんしては、きをつけていることがおおい。","zh":"关于健康，需要注意的地方很多。"}]},{"id":"g163","level":"N3","pattern":"～だけで（は）なく～も","meaning":"“简体小句/名词＋だけでなく～も”意为“除了A之外B也…”。","cat":"conj","note":"“のみならず～も”是其书面语。","examples":[{"jp":"この店は味だけでなく、サービスもいい。","r":"このみせはあじだけでなく、サービスもいい。","zh":"这家店不仅味道好，服务也好。"},{"jp":"彼は日本語だけでなく、英語も話せる。","r":"かれはにほんごだけでなく、えいごもはなせる。","zh":"他不仅会日语，也会英语。"}]},{"id":"g164","level":"N3","pattern":".～とともに、～","meaning":"接续为“动词（基本形）/名词+とともに”。","cat":"state","note":"有两种用法：①随着原因A的动作、变化，B的动作、变化同步进行；②A与B同时进行。","examples":[{"jp":"時代の変化とともに、社会も変わってきた。","r":"じだいのへんかとともに、しゃかいもかわってきた。","zh":"随着时代的变化，社会也发生了变化。"},{"jp":"技術の発展とともに、生活は便利になった。","r":"ぎじゅつのはってんとともに、せいかつはべんりになった。","zh":"随着技术的发展，生活变得方便了。"}]},{"id":"g165","level":"N3","pattern":"～とはくらべものにならない","meaning":"表示“相差很大”的惯用表达方式。","cat":"compare","note":"使用“（Aは）Bと（は）比べものにならない”的形式，由于使用助词“と”，所以必须明示比较对象。","examples":[{"jp":"昔の生活は、今とは比べものにならないほど大変だった。","r":"むかしのせいかつは、いまとはくらべものにならないほどたいへんだった。","zh":"过去的生活，辛苦得与现在无法相比。"},{"jp":"彼の実力は、私とは比べものにならない。","r":"かれのじつりょくは、わたしとはくらべものにならない。","zh":"他的实力与我不在一个量级。"}]},{"id":"g166","level":"N3","pattern":"～せい/～せいで/～せいか","meaning":"陈述令人不快或不满意的事情的原因或理由，接续为“简体小句+せい”“二类形容词+なせい”“名词＋のせい”。","cat":"reason","note":"表示原因不明时，用“～せいか”。","examples":[{"jp":"昨日徹夜したせいで、今日は眠くてたまらない。","r":"きのうてつやしたせいで、きょうはねむくてたまらない。","zh":"因为昨天熬夜，今天困得不得了。"},{"jp":"ストレスのせいか、最近食欲がない。","r":"ストレスのせいか、さいきんしょくよくがない。","zh":"或许是压力的缘故，最近没有食欲。"},{"jp":"連休中どこにも出かけずに寝てばかりいたせいか、今日は朝からどうも体がだるい。","r":"れんきゅうちゅうどこにもでかけずにねてばかりいたせいか、きょうはあさからどうもからだがだるい。","zh":"也许是因为连休期间哪儿也没去光睡觉，今天从早上起身体就发懒。","src":"2023年12月真题"}],"srcs":["2023年12月真题"]},{"id":"g167","level":"N3","pattern":"～その代わり","meaning":"表示不能同意，无法答应某个提议或意见而提出一个替代方案。","cat":"conj","examples":[{"jp":"週末の会合には行けないが、その代わりに昼食をごちそうしよう。","r":"しゅうまつのかいごうにはいけないが、そのかわりにちゅうしょくをごちそうしよう。","zh":"周末的聚会去不了，作为代替请你吃午饭吧。"},{"jp":"値段は高いが、その代わりに品質がいい。","r":"ねだんはたかいが、そのかわりにひんしつがいい。","zh":"价格虽贵，但质量好。"}]},{"id":"g168","level":"N3","pattern":"～においても","meaning":"“～において”表示“对于～”“在～方面”“就～而言”，后续可接“も”或“は”。","cat":"view","examples":[{"jp":"この規則は、家庭においても守るべきだ。","r":"このきそくは、かていにおいてもまもるべきだ。","zh":"这条规则在家里也应该遵守。"},{"jp":"スポーツにおいても、チームワークが大切だ。","r":"スポーツにおいても、チームワークがたいせつだ。","zh":"在体育运动中，团队协作也很重要。"}]},{"id":"g169","level":"N3","pattern":"～（という）ことになる","meaning":"“动词（基本形）/名词+（という）ことになる”表示逻辑推理的结果。","cat":"change","examples":[{"jp":"毎日練習すれば、上達することになる。","r":"まいにちれんしゅうすれば、じょうたつすることになる。","zh":"每天练习的话，就会取得进步。"},{"jp":"この電車に乗れば、30分で着くことになる。","r":"このでんしゃにのれば、さんじゅっぷんでつくことになる。","zh":"坐上这趟电车，三十分钟就能到。"}]},{"id":"g170","level":"N3","pattern":"もしかして","meaning":"用于尽管不能确定但是认为应该是那样，或者提出疑问等场合。","cat":"guess","note":"近似表达还有“もしかすると”“もしかしたら”。","examples":[{"jp":"もしかして、彼は風邪をひいたのかもしれない。","r":"もしかして、かれはかぜをひいたのかもしれない。","zh":"说不定他感冒了。"},{"jp":"もしかしたら、明日は雪が降るかもしれない。","r":"もしかしたら、あしたはゆきがふるかもしれない。","zh":"说不定明天会下雪。"}]},{"id":"g171","level":"N3","pattern":"～どうしても～ない","meaning":"表示尽管采用了各种各样的方法还是不能做成某事。","cat":"negative","examples":[{"jp":"何度も説明したが、どうしても納得してくれない。","r":"なんどもせつめいしたが、どうしてもなっとくしてくれない。","zh":"解释了很多次，他还是怎么都不肯接受。"},{"jp":"この問題は、どうしても解けない。","r":"このもんだいは、どうしてもとけない。","zh":"这道题怎么也解不出来。"}]},{"id":"g172","level":"N3","pattern":"～一方だ","meaning":"使用“动词（基本形）+一方だ”的形式，表示“向着一个方向不断发展”。","cat":"change","examples":[{"jp":"物価は上がる一方だ。","r":"ぶっかはあがるいっぽうだ。","zh":"物价一路在涨。"},{"jp":"都市の人口は増える一方だ。","r":"としのじんこうはふえるいっぽうだ。","zh":"城市人口不断增加。"}]},{"id":"g173","level":"N3","pattern":"～に対する","meaning":"“Aに対するB”表示动作、感情、态度针对的对象，A为对象，B是动作、感情、态度等。","cat":"view","examples":[{"jp":"先生は学生の質問に対する答えを丁寧に説明した。","r":"せんせいはがくせいのしつもんにたいするこたえをていねいにせつめいした。","zh":"老师耐心地解答了学生提出的问题。"},{"jp":"彼の仕事に対する態度は真面目だ。","r":"かれのしごとにたいするたいどはまじめだ。","zh":"他对工作的态度很认真。"}]},{"id":"g174","level":"N3","pattern":"～わけがない","meaning":"意思是“没有理由那样考虑”，表示强烈的否定。","cat":"negative","note":"“わけ”表示理由。“が”可以换成“は”。","examples":[{"jp":"あんなに練習したのだから、失敗するわけがない。","r":"あんなにれんしゅうしたのだから、しっぱいするわけがない。","zh":"练了那么多，不可能失败。"},{"jp":"彼がうそをつくわけがない。","r":"かれがうそをつくわけがない。","zh":"他不可能会撒谎。"}]},{"id":"g175","level":"N3","pattern":"～ており","meaning":"是“～ていて”连接两个句子时的郑重说法，通常用于书面语。","cat":"conj","examples":[{"jp":"当社は環境に配慮しており、再生紙を利用しております。","r":"とうしゃはかんきょうにはいりょしており、さいせいしをりようしております。","zh":"我公司注重环保，使用再生纸。"},{"jp":"この地域は交通が便利であり、生活しやすい。","r":"このちいきはこうつうがべんりであり、せいかつしやすい。","zh":"这一带交通便利，生活很方便。"}]},{"id":"g176","level":"N3","pattern":"～こと","meaning":"向对方吩咐必要的事情或书写注意事项等，常在句尾使用“动词（基本形/ない形）+こと”的形式，多用于书面语或正式文体的文章里。","cat":"order","note":"加“だ”用于口语中表示忠告。","examples":[{"jp":"会議中は、携帯電話の電源を切ること。","r":"かいぎちゅうは、けいたいでんわのでんげんをきること。","zh":"会议期间请关闭手机电源。"},{"jp":"出かける前には、火の元を確認すること。","r":"でかけるまえには、ひのもとをかくにんすること。","zh":"出门前要确认火源安全。"}]},{"id":"g177","level":"N3","pattern":"～を問わず","meaning":"意思是“不论～”，“を”前面大多用“男女”“昼夜”等正反意义成对的词语，通常作书面语。","cat":"limit","examples":[{"jp":"年齢を問わず、誰でも参加できます。","r":"ねんれいをとわず、だれでもさんかできます。","zh":"不论年龄，谁都可以参加。"},{"jp":"昼夜を問わず、相談を受け付けています。","r":"ちゅうやをとわず、そうだんをうけつけています。","zh":"不分昼夜受理咨询。"}]},{"id":"g178","level":"N3","pattern":"～て初めて","meaning":"表示某事项成立之后，与之关联的下一阶段的事才会发生。","cat":"time","note":"用于注意到以前没有注意到的事或能够完成以前无法完成的事等情形。","examples":[{"jp":"病気になって初めて、健康のありがたさがわかった。","r":"びょうきになってはじめて、けんこうのありがたさがわかった。","zh":"生了病才懂得健康的可贵。"},{"jp":"海外で生活して初めて、母国のよさを実感した。","r":"かいがいでせいかつしてはじめて、ぼこくのよさをじっかんした。","zh":"在海外生活之后，才真正体会到祖国的好。"}]},{"id":"g179","level":"N3","pattern":"～である","meaning":"用于书面语的简体，根据谓语形式，可以分为“～だ”和“～である”两种。","cat":"basic","note":"“～だ”用于与关系密切的人之间的谈话或者日记。“～である”作为书面语比“～だ”更正式，用于论文或者评论文章，过去形式是“～であった”。","examples":[{"jp":"この論文は、環境問題について述べたものである。","r":"このろんぶんは、かんきょうもんだいについてのべたものである。","zh":"这篇论文论述了环境问题。"},{"jp":"人間は一人では生きていけない存在である。","r":"にんげんはひとりではいきていけないそんざいである。","zh":"人是一种无法独自生存的存在。"}]},{"id":"g180","level":"N3","pattern":"～ことから","meaning":"是说明事由的表达方式，所表示的因果关系不是说话人自己认为的，而是别人认为的或是一般看法。","cat":"reason","formation":"动词普通形/名词普通形 + ことから","examples":[{"jp":"彼は毎日図書館にいることから、勉強家だと言われている。","r":"かれはまいにちとしょかんにいることから、べんきょうかだといわれている。","zh":"从他每天都在图书馆这一点来看，他被称为好学的人。"},{"jp":"この町は雪が多いことから、スキーが盛んだ。","r":"このまちはゆきがおおいことから、スキーがさかんだ。","zh":"从这小镇雪多这一点来看，滑雪很盛行。"}]},{"id":"g181","level":"N3","pattern":"決して～ない","meaning":"副词“決して”与否定表达连用，是对否定的强调。","cat":"negative","note":"表示否定判断，一般不用于观察事实。","examples":[{"jp":"彼は決して約束を破らない。","r":"かれはけっしてやくそくをやぶらない。","zh":"他绝不会毁约。"},{"jp":"この事実は決して忘れてはならない。","r":"このじじつはけっしてわすれてはならない。","zh":"这个事实绝不能忘记。"}]},{"id":"g182","level":"N3","pattern":"～からといって～とは限らない","meaning":"“简体小句+とは限らない”表示部分否定，说明存在例外情况。","cat":"reverse","examples":[{"jp":"お金持ちだからといって、幸せとは限らない。","r":"おかねもちだからといって、しあわせとはかぎらない。","zh":"有钱人不一定就幸福。"},{"jp":"日本語が上手だからといって、すぐに通訳ができるとは限らない。","r":"にほんごがじょうずだからといって、すぐにつうやくができるとはかぎらない。","zh":"日语好的人未必马上就能做翻译。"}]},{"id":"g183","level":"N3","pattern":"～を占める","meaning":"“数量词+を占める”表示某人或某物在整体当中所占的数量比例。","cat":"count","examples":[{"jp":"女性はこの会社の社員の半数を占める。","r":"じょせいはこのかいしゃのしゃいんのはんすうをしめる。","zh":"女性占这家公司员工的一半。"},{"jp":"輸出はこの国の経済の大きな部分を占めている。","r":"ゆしゅつはこのくにのけいざいのおおきなぶぶんをしめている。","zh":"出口占这个国家经济的很大部分。"}]},{"id":"g184","level":"N3","pattern":"～のに","meaning":"用于说明事情的结果与说话人的想法相反的情形，此时“のに”后的部分经常省略。","cat":"reverse","examples":[{"jp":"せっかく来たのに、店は休みだった。","r":"せっかくきたのに、みせはやすみだった。","zh":"特意来了，店却休息。"},{"jp":"熱心に勉強したのに、試験に落ちてしまった。","r":"ねっしんにべんきょうしたのに、しけんにおちてしまった。","zh":"明明很用功，考试却没及格。"}]},{"id":"g185","level":"N3","pattern":"ご～いただく","meaning":"“ご/お＋动词（去ます形）+いただく”是抬高动作实施者的表达方式，，表示说话人从动作实施者那里得到好处。","cat":"honor","note":"动词如果是和语词，前面用“お”，是汉字名词的话就用“ご”。","examples":[{"jp":"ご協力いただき、誠にありがとうございます。","r":"ごきょうりょくいただき、まことにありがとうございます。","zh":"承蒙协助，非常感谢。"},{"jp":"先生にご指導いただいて、論文を書き上げた。","r":"せんせいにごしどういただいて、ろんぶんをかきあげた。","zh":"在老师的指导下完成了论文。"},{"jp":"先日の第三回さくら市教育講演会には、沢山の方がお越しいただきました。","r":"せんじつのだいさんかいさくらしきょういくこうえんかいには、たくさんのかたがおこしいただきました。","zh":"前几天的第三届樱市教育讲座，承蒙众多人士莅临。","src":"2023年7月真题"}],"srcs":["2023年7月真题"]},{"id":"g186","level":"N3","pattern":"～抜きで","meaning":"动词“抜く”是去除的意思，“名词+抜き”表示平常总伴随的东西不在一起了。","cat":"limit","note":"还可以用“～は抜きにして”的表达。","examples":[{"jp":"時間のない時は、朝食抜きで出かけることもある。","r":"じかんのないときは、ちょうしょくぬきででかけることもある。","zh":"没时间的时候，也有不吃早饭就出门的情况。"},{"jp":"冗談は抜きにして、本題に入りましょう。","r":"じょうだんはぬきにして、ほんだいにはいりましょう。","zh":"别说笑了，进入正题吧。"}]},{"id":"g187","level":"N3","pattern":"ほかにも","meaning":"副词性表达方式“ほかに”后续“も”，表示除了话题中谈的以外还有其他事物。","cat":"conj","examples":[{"jp":"日本料理のほかにも、この店では中華料理も味わえます。","r":"にほんりょうりのほかにも、このみせではちゅうかりょうりもあじわえます。","zh":"除了日本料理，这家店还能品尝到中餐。"},{"jp":"本を読むほかにも、音楽を聴くのも好きだ。","r":"ほんをよむほかにも、おんがくをきくのもすきだ。","zh":"除了读书，我也喜欢听音乐。"}]},{"id":"g188","level":"N3","pattern":"ことに","meaning":"

","g":"内心","p":"名词","level":"N1"},{"word":"反映","r":"はんえい","g":"反映","p":"名词","level":"N1"},{"word":"充実","r":"じゅうじつ","g":"充实","p":"名词","level":"N1"},{"word":"伝統","r":"でんとう","g":"传统","p":"名词","level":"N1"},{"word":"向き合う","r":"むきあう","g":"面对","p":"动词","level":"N1"},{"word":"成熟","r":"せいじゅく","g":"成熟","p":"名词","level":"N1"},{"word":"余裕","r":"よゆう","g":"余裕","p":"名词","level":"N1"},{"word":"忌避","r":"きひ","g":"忌避","p":"名词","level":"N1"},{"word":"沈黙","r":"ちんもく","g":"沉默","p":"名词","level":"N1"},{"word":"価値観","r":"かちかん","g":"价值观","p":"名词","level":"N1"},{"word":"孤独","r":"こどく","g":"孤独","p":"名词","level":"N1"},{"word":"承認","r":"しょうにん","g":"认可","p":"名词","level":"N1"},{"word":"枠組み","r":"わくぐみ","g":"框架","p":"名词","level":"N1"},{"word":"物語る","r":"ものがたる","g":"说明","p":"动词","level":"N1"},{"word":"育む","r":"はぐくむ","g":"培育","p":"动词","level":"N1"},{"word":"契機","r":"けいき","g":"契机","p":"名词","level":"N1"},{"word":"思想","r":"しそう","g":"思想","p":"名词","level":"N1"},{"word":"指摘","r":"してき","g":"指出","p":"名词","level":"N1"},{"word":"流入","r":"りゅうにゅう","g":"流入","p":"名词","level":"N1"},{"word":"営み","r":"いとなみ","g":"活动","p":"名词","level":"N1"},{"word":"習得","r":"しゅうとく","g":"习得","p":"名词","level":"N1"},{"word":"訳語","r":"やくご","g":"译语","p":"名词","level":"N1"},{"word":"魂","r":"たましい","g":"灵魂","p":"名词","level":"N1"},{"word":"翻訳","r":"ほんやく","g":"翻译","p":"名词","level":"N1"},{"word":"繋ぐ","r":"つなぐ","g":"连接","p":"动词","level":"N1"}]}</script>
<script>
(function () {
  'use strict';
  const DATA = JSON.parse(document.getElementById('app-data').textContent);
  const articles = DATA.articles || [];
  const grammar  = DATA.grammar  || [];
  const vocabAll = DATA.vocab    || [];

  // ===== Storage =====
  const K = {
    vocab:  'jpread.vocab.v1',
    stats:  'jpread.stats.v1',
    done:   'jpread.done.v1',
    theme:  'jpread.theme.v1',
    size:   'jpread.size.v1',
    furi:   'jpread.furi.v1',
    view:   'jpread.view.v1',
    flv:    'jpread.flv.v1',
    fcat:   'jpread.fcat.v1',
    gcat:   'jpread.gcat.v1'
  };
  let vocab = JSON.parse(localStorage.getItem(K.vocab) || '{}');
  let stats = JSON.parse(localStorage.getItem(K.stats) || '{"read":0,"words":0}');
  let done  = JSON.parse(localStorage.getItem(K.done)  || '{}');
  let fontSize = Number(localStorage.getItem(K.size) || 19);
  let showFuri = localStorage.getItem(K.furi) !== '0';
  let currentView = localStorage.getItem(K.view) || 'read';
  let filterLv  = localStorage.getItem(K.flv)  || 'all';
  let filterCat = localStorage.getItem(K.fcat) || 'all';
  let filterGcat = localStorage.getItem(K.gcat) || 'all';

  const CAT_LABEL = { life:'生活', culture:'文化', ideas:'随想', story:'故事', news:'新闻' };

  // ===== Helpers =====
  function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function kanjiIn(s){ return /[㐀-鿿]/.test(s); }
  function diffOf(level){ return {N5:1,N4:2,N3:3,N2:4,N1:5}[level] || 3; }
  function starStr(level){ const d=diffOf(level); let s=''; for(let i=1;i<=5;i++) s+= i<=d?'★':'<span class="empty">★</span>'; return '<span class="diff-stars">'+s+'</span>'; }
  function speak(text){
    if(!('speechSynthesis' in window)) return;
    try { const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; u.rate=0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){}
  }
  function save(){ localStorage.setItem(K.vocab, JSON.stringify(vocab)); localStorage.setItem(K.stats, JSON.stringify(stats)); localStorage.setItem(K.done, JSON.stringify(done)); }
  function vocabKey(w){ return (w.word||w.t)+'｜'+(w.r||w.reading||''); }

  // ===== Render article list =====
  const listEl = document.getElementById('article-list');
  const countEl = document.getElementById('visible-count');
  function renderArticles(){
    const f = articles.filter(a =>
      (filterLv==='all' || a.level===filterLv) &&
      (filterCat==='all' || a.cat===filterCat)
    );
    countEl.textContent = f.length;
    if(!f.length){ listEl.innerHTML = '<div class="empty">没有符合条件的篇章。</div>'; return; }
    listEl.innerHTML = f.map(a => `
      <div class="article-card" data-id="${a.id}">
        <div class="meta">
          <span class="lv-badge ${a.level}">${a.level}</span>
          <span class="cat">${CAT_LABEL[a.cat]||a.cat}</span>
          <span>·</span><span>${starStr(a.level)}</span>
          <span>·</span><span>${a.words||''} 字 · 约 ${a.read||2} 分钟</span>
        </div>
        <h3>${rubyTitle(a.title, a.titleR)}</h3>
        <div class="dek">${escapeHtml(a.dek||'')}</div>
        <div class="stats">
          <span>${a.words||0} 字</span><span>·</span><span>约 ${a.read||2} 分钟</span>
          ${done[a.id]?'<span>·</span><span class="done">✓ 已读</span>':''}
        </div>
      </div>`).join('');
    listEl.querySelectorAll('.article-card').forEach(el=>{
      el.addEventListener('click', ()=> openArticle(el.dataset.id));
    });
  }
  function rubyTitle(t, r){
    if(!r || !kanjiIn(t)) return escapeHtml(t);
    return '<ruby>'+escapeHtml(t)+'<rt>'+escapeHtml(r)+'</rt></ruby>';
  }

  // ===== Reader =====
  const readerEl = document.getElementById('reader');
  const viewRead = document.getElementById('view-read');
  function renderToken(tok){
    const t = tok.t;
    const r = tok.r, g = tok.g, p = tok.p;
    if(!g && !r) return escapeHtml(t);
    const dataAttrs = `data-r="${escapeHtml(r||'')}" data-g="${escapeHtml(g||'')}" data-p="${escapeHtml(p||'')}"`;
    let inner;
    if(r && kanjiIn(t)) inner = '<ruby>'+escapeHtml(t)+'<rt>'+escapeHtml(r)+'</rt></ruby>';
    else inner = escapeHtml(t);
    return `<span class="w" ${dataAttrs}>${inner}</span>`;
  }
  // ===== Article grammar detection =====
  // Build matchable Japanese substrings from a pattern like "～てしまいます".
  function grammarMatchForms(p){
    const s = (p||'')
      .replace(/～/g,'')
      .replace(/名[0-9]?（[^）]*）/g,'')   // 名1（人）、名（时间）…
      .replace(/[（()）]/g,'')
      .replace(/名词|动词|形容词|一类|二类|简体形|敬体形|基本形|ない形|た形|ます形|意志形|命令形|场所|时间|数量|疑问|小句|对象|目的/g,'');
    return s.split(/[／/和、，。・…]/).map(x=>x.trim()).filter(x=>x.length>=4);
  }
  function articleGrammar(a){
    const raw = (a.body||[]).flat().map(t=>t.t||'').join('');
    const skip = new Set(['ました','です','ません','います','あります','ですか','でした','ましょう','ます','には','では']);
    const seen = new Set(); const hits = [];
    for (const g of grammar){
      // curated keys (初级) are reliable; derived substrings (中高级) can be noisy
      const curated = !!(g.keys && g.keys.length);
      const ks = curated ? g.keys : grammarMatchForms(g.pattern);
      let best = '';
      for (const f of ks){
        if (f.length < 3) continue;
        if (!curated && skip.has(f)) continue;
        if (raw.includes(f) && f.length > best.length) best = f;
      }
      if (best && !seen.has(g.id)){ seen.add(g.id); hits.push({g, f:best}); }
    }
    hits.sort((x,y)=> y.f.length - x.f.length);
    return hits.slice(0,10);
  }
  function gotoGrammar(pattern){
    setLevel('all');
    setGcat('all');
    document.getElementById('grammar-search').value = pattern;
    switchView('grammar');
    renderGrammar();
    grammarListEl.querySelectorAll('.grammar-card').forEach(c=>{
      const p = c.querySelector('.pattern');
      if (p && p.textContent === pattern) c.scrollIntoView({behavior:'smooth', block:'center'});
    });
  }

  function openArticle(id){
    const a = articles.find(x=>x.id===id);
    if(!a) return;
    document.getElementById('r-lv').textContent = a.level;
    document.getElementById('r-lv').className = 'lv-badge '+a.level;
    document.getElementById('r-cat').textContent = CAT_LABEL[a.cat]||a.cat;
    document.getElementById('r-meta').innerHTML = `${starStr(a.level)} · ${a.words||0} 字 · 约 ${a.read||2} 分钟`;
    document.getElementById('r-title').innerHTML = rubyTitle(a.title, a.titleR);
    document.getElementById('r-dek').textContent = a.dek||'';
    const body = (a.body||[]).map(p => '<p>'+ (Array.isArray(p)? p.map(renderToken).join('') : escapeHtml(p)) +'</p>').join('');
    document.getElementById('r-body').innerHTML = body;
    const isDone = !!done[a.id];
    document.getElementById('r-post').innerHTML = `
      <span>${a.words||0} 字</span><span>·</span><span>约 ${a.read||2} 分钟</span><span>·</span>
      <span class="mark ${isDone?'done':''}" id="mark-read">${isDone?'✓ 已读':'标记为已读'}</span>`;
    viewRead.style.display = 'none';
    readerEl.classList.add('on');
    window.scrollTo({top:0, behavior:'smooth'});
    const m = document.getElementById('mark-read');
    m.addEventListener('click', ()=>{
      if(done[a.id]) return;
      done[a.id] = 1; stats.read = Object.keys(done).length; save();
      updateStats(); renderArticles();
      m.textContent='✓ 已读'; m.classList.add('done');
    });
    // article grammar panel: 重点练习 (gk) first, then auto-detected
    const gtags = document.getElementById('r-gtags');
    const gkTags = (a.gk||[]).map(p => {
      // exact match, or combined "X/Y" pattern that starts/contains the gk
      let g = grammar.find(x => x.pattern === p);
      if (!g) g = grammar.find(x => x.pattern.startsWith(p));
      if (!g) g = grammar.find(x => p.startsWith(x.pattern) && x.pattern.length >= 3);
      return g;
    }).filter(Boolean)
      .map(g => `<span class="g-tag key" data-p="${escapeHtml(g.pattern)}"><span class="lv ${g.level}">★${g.level}</span>${escapeHtml(g.pattern)}</span>`)
      .join('');
    const hits = articleGrammar(a);
    let ghtml = gkTags;
    if (hits.length){
      ghtml += hits.map(h=>
        `<span class="g-tag" data-p="${escapeHtml(h.g.pattern)}"><span class="lv ${h.g.level}">${h.g.level}</span>${escapeHtml(h.g.pattern)}</span>`
      ).join('');
    }
    if(!ghtml){
      gtags.innerHTML = '<span class="g-empty">未检测到明显语法点，可到「文法」页按级别浏览。</span>';
    } else {
      gtags.innerHTML = ghtml;
      gtags.querySelectorAll('.g-tag').forEach(t=> t.addEventListener('click', ()=> gotoGrammar(t.dataset.p)));
    }
    readerEl.querySelectorAll('.w').forEach(span=>{
      span.addEventListener('click', e=>{ e.stopPropagation(); showTooltip(span); });
      if(vocab[vocabKey({word:span.textContent, r:span.dataset.r})]) span.classList.add('saved');
    });
  }
  document.getElementById('back-btn').addEventListener('click', ()=>{
    readerEl.classList.remove('on');
    viewRead.style.display = '';
    hideTooltip();
    window.scrollTo({top:0, behavior:'smooth'});
  });

  // ===== Tooltip =====
  const tip = document.getElementById('tooltip');
  let tipSaved = null;
  function showTooltip(span){
    const surface = span.textContent;
    const r = span.dataset.r, g = span.dataset.g, p = span.dataset.p;
    const key = vocabKey({word:surface, r});
    const saved = !!vocab[key];
    const headInner = kanjiIn(surface) && r ? `<ruby>${escapeHtml(surface)}<rt>${escapeHtml(r)}</rt></ruby>` : escapeHtml(surface);
    let html = `<div class="head"><span>${headInner}</span><span class="spk" title="朗读">🔊</span></div>`;
    if(r && !kanjiIn(surface)) html += `<div class="r-line">${escapeHtml(r)}</div>`;
    if(p) html += `<span class="pos">${escapeHtml(p)}</span>`;
    html += `<div class="g">${g?escapeHtml(g):'<span style="color:var(--ink-faint);font-style:italic;">未收录释义（仍可收藏）</span>'}</div>`;
    html += `<div class="actions">
      <button class="act" id="tip-close">关闭</button>
      <button class="act primary" id="tip-save">${saved?'✓ 已收藏':'+ 收藏'}</button>
    </div>`;
    tip.innerHTML = html;
    tip.style.display = 'block';
    tipSaved = {key, surface, r, g, p};
    // position
    const rect = span.getBoundingClientRect();
    const tw = Math.min(280, window.innerWidth-20);
    let left = rect.left + rect.width/2 - tw/2;
    left = Math.max(10, Math.min(window.innerWidth - tw - 10, left));
    let top = rect.bottom + 8;
    tip.style.left = left+'px'; tip.style.top = top+'px'; tip.style.maxWidth = tw+'px';
    // flip if overflow
    requestAnimationFrame(()=>{ if(tip.getBoundingClientRect().bottom > window.innerHeight-10){ tip.style.top = Math.max(10, rect.top - tip.getBoundingClientRect().height - 8)+'px'; } });
    document.getElementById('tip-close').addEventListener('click', hideTooltip);
    document.getElementById('tip-save').addEventListener('click', ()=>{ toggleSave(tipSaved); showTooltip(span); });
    tip.querySelector('.spk').addEventListener('click', ()=> speak(surface));
  }
  function hideTooltip(){ tip.style.display='none'; tipSaved=null; }
  document.addEventListener('click', e=>{ if(tip.style.display==='block' && !tip.contains(e.target) && !e.target.classList.contains('w')) hideTooltip(); });
  document.addEventListener('scroll', hideTooltip, {passive:true});

  // ===== Save / vocab =====
  function toggleSave(info){
    if(!info) return;
    if(vocab[info.key]){ delete vocab[info.key]; }
    else { vocab[info.key] = { word:info.surface, r:info.r, g:info.g, p:info.p, ts: Date.now() }; }
    stats.words = Object.keys(vocab).length;
    save(); updateStats(); renderSaved();
    // refresh saved styling in reader
    readerEl.querySelectorAll('.w').forEach(sp=>{
      const k = vocabKey({word:sp.textContent, r:sp.dataset.r});
      sp.classList.toggle('saved', !!vocab[k]);
    });
  }
  const savedListEl = document.getElementById('saved-list');
  function renderSaved(){
    const keys = Object.keys(vocab);
    if(!keys.length){ savedListEl.innerHTML = '<li class="vocab-empty">阅读时点击单词即可收藏到这里。</li>'; return; }
    keys.sort((a,b)=> (vocab[b].ts||0)-(vocab[a].ts||0));
    savedListEl.innerHTML = keys.map(k=>{
      const v = vocab[k];
      const head = kanjiIn(v.word) && v.r ? `<ruby>${escapeHtml(v.word)}<rt>${escapeHtml(v.r)}</rt></ruby>` : escapeHtml(v.word);
      return `<li>
        <div class="row1">
          <span class="vw" data-w="${escapeHtml(v.word)}" data-r="${escapeHtml(v.r||'')}">${head}</span>
          <button class="rm" data-k="${escapeHtml(k)}" title="删除">×</button>
        </div>
        ${v.r && !kanjiIn(v.word) ? `<span class="v-r">${escapeHtml(v.r)}</span>`:''}
        <span class="vg">${escapeHtml(v.g||'')}</span>
        <div class="v-act">
          <button data-spk="${escapeHtml(v.word)}">🔊 朗读</button>
        </div>
      </li>`;
    }).join('');
    savedListEl.querySelectorAll('.rm').forEach(b=> b.addEventListener('click', ()=>{
      delete vocab[b.dataset.k]; stats.words=Object.keys(vocab).length; save(); updateStats(); renderSaved();
      readerEl.querySelectorAll('.w').forEach(sp=>{ const kk=vocabKey({word:sp.textContent,r:sp.dataset.r}); sp.classList.toggle('saved', !!vocab[kk]); });
    }));
    savedListEl.querySelectorAll('[data-spk]').forEach(b=> b.addEventListener('click', ()=> speak(b.dataset.spk)));
    savedListEl.querySelectorAll('.vw').forEach(w=> w.addEventListener('click', ()=> speak(w.dataset.w)));
  }
  function updateStats(){
    document.getElementById('stat-read').textContent = Object.keys(done).length;
    document.getElementById('stat-saved').textContent = Object.keys(vocab).length;
  }
  document.getElementById('clear-vocab').addEventListener('click', ()=>{
    if(!Object.keys(vocab).length) return;
    if(confirm('确定清空生词本吗？')){ vocab={}; stats.words=0; save(); updateStats(); renderSaved();
      readerEl.querySelectorAll('.w').forEach(sp=> sp.classList.remove('saved')); }
  });

  // ===== Grammar =====
  const grammarListEl = document.getElementById('grammar-list');
  const grammarCountEl = document.getElementById('grammar-count');
  let grammarAllOpen = false;   // collapse-all toggle state
  function renderGrammar(){
    const q = (document.getElementById('grammar-search').value||'').trim().toLowerCase();
    const f = grammar.filter(g =>
      (filterLv==='all' || g.level===filterLv) &&
      (filterGcat==='all' || (g.cat||'')===filterGcat) &&
      (!q || (g.pattern||'').toLowerCase().includes(q) || (g.meaning||'').toLowerCase().includes(q) || (g.note||'').toLowerCase().includes(q))
    );
    grammarCountEl.textContent = f.length;
    const foldBtn = document.getElementById('grammar-fold');
    if(foldBtn){ foldBtn.textContent = grammarAllOpen ? '全部收起' : '全部展开'; }
    if(!f.length){ grammarListEl.innerHTML = '<div class="empty">没有符合条件的文法。</div>'; return; }
    // when filtering by search we open the matching cards automatically
    const open = grammarAllOpen || !!q;
    grammarListEl.innerHTML = f.map(g=>{
      const exs = (g.examples||[]).map(ex=>`
        <div class="ex">
          <div class="ex-jp"><span>${escapeHtml(ex.jp)}</span><span class="spk" data-spk="${escapeHtml(ex.jp)}">🔊</span></div>
          ${ex.r?`<div class="ex-r">${escapeHtml(ex.r)}</div>`:''}
          ${ex.zh?`<div class="ex-zh">${escapeHtml(ex.zh)}</div>`:''}
        </div>`).join('');
      const detail =
        (g.formation?`<div class="formation">${escapeHtml(g.formation)}</div>`:'') +
        (g.note?`<div class="note">${escapeHtml(g.note)}</div>`:'') +
        exs;
      return `<div class="grammar-card ${g.level} ${open?'open':''}">
        <div class="g-head">
          <span class="lv-badge ${g.level}">${g.level}</span>
          <span class="pattern">${escapeHtml(g.pattern)}</span>
          <span class="meaning">${escapeHtml(g.meaning||'')}</span>
          <span class="g-chev">▶</span>
        </div>
        ${detail?`<div class="g-detail">${detail}</div>`:''}
      </div>`;
    }).join('');
    // click header toggles detail
    grammarListEl.querySelectorAll('.grammar-card').forEach(card=>{
      const head = card.querySelector('.g-head');
      head.addEventListener('click', ()=> card.classList.toggle('open'));
    });
    grammarListEl.querySelectorAll('[data-spk]').forEach(b=> b.addEventListener('click', ()=> speak(b.dataset.spk)));
  }
  document.getElementById('grammar-search').addEventListener('input', renderGrammar);
  const grammarFoldBtn = document.getElementById('grammar-fold');
  if(grammarFoldBtn) grammarFoldBtn.addEventListener('click', ()=>{
    grammarAllOpen = !grammarAllOpen;
    renderGrammar();
  });

  // ===== Vocab browse =====
  const vocabGridEl = document.getElementById('vocab-grid');
  const vocabCountEl = document.getElementById('vocab-count');
  function renderVocab(){
    const q = (document.getElementById('vocab-search').value||'').trim().toLowerCase();
    const f = vocabAll.filter(v =>
      (filterLv==='all' || v.level===filterLv) &&
      (!q || (v.word||'').toLowerCase().includes(q) || (v.r||'').toLowerCase().includes(q) || (v.g||'').toLowerCase().includes(q))
    );
    vocabCountEl.textContent = f.length;
    if(!f.length){ vocabGridEl.innerHTML = '<div class="empty">没有符合条件的单词。</div>'; return; }
    vocabGridEl.innerHTML = f.map(v=>{
      const key = vocabKey({word:v.word, r:v.r});
      const saved = !!vocab[key];
      const head = kanjiIn(v.word) && v.r ? `<ruby>${escapeHtml(v.word)}<rt>${escapeHtml(v.r)}</rt></ruby>` : escapeHtml(v.word);
      return `<div class="vocab-card">
        <div class="v-top">
          <span class="v-word">${head}</span>
          <div class="v-btns">
            <button class="v-btn" data-spk="${escapeHtml(v.word)}" title="朗读">🔊</button>
            <button class="v-btn save ${saved?'on':''}" data-k="${escapeHtml(key)}" data-w="${escapeHtml(v.word)}" data-r="${escapeHtml(v.r||'')}" data-g="${escapeHtml(v.g||'')}" data-p="${escapeHtml(v.p||'')}" title="收藏">${saved?'✓':'＋'}</button>
          </div>
        </div>
        ${v.r && !kanjiIn(v.word)?`<div class="v-r">${escapeHtml(v.r)}</div>`:''}
        <div class="v-g">${escapeHtml(v.g||'')}</div>
        <div class="v-pos">${escapeHtml(v.p||'')} · ${v.level}</div>
      </div>`;
    }).join('');
    vocabGridEl.querySelectorAll('[data-spk]').forEach(b=> b.addEventListener('click', ()=> speak(b.dataset.spk)));
    vocabGridEl.querySelectorAll('.v-btn.save').forEach(b=> b.addEventListener('click', ()=>{
      const info={key:b.dataset.k, surface:b.dataset.w, r:b.dataset.r, g:b.dataset.g, p:b.dataset.p};
      toggleSave(info); renderVocab();
    }));
  }
  document.getElementById('vocab-search').addEventListener('input', renderVocab);

  // ===== Views / filters / chrome =====
  function switchView(v){
    currentView = v;
    localStorage.setItem(K.view, v);
    document.querySelectorAll('.tab').forEach(t=> t.classList.toggle('on', t.dataset.view===v));
    document.querySelectorAll('.view').forEach(s=> s.classList.remove('on'));
    document.getElementById('view-'+v).classList.add('on');
    readerEl.classList.remove('on');
    document.getElementById('view-read').style.display = (v==='read') ? '' : 'none';
    document.getElementById('cat-filter').style.display = (v==='read') ? '' : 'none';
    hideTooltip();
  }
  document.querySelectorAll('.tab').forEach(t=> t.addEventListener('click', ()=> switchView(t.dataset.view)));

  function setLevel(lv){
    filterLv = lv; localStorage.setItem(K.flv, lv);
    document.querySelectorAll('#level-filter .chip').forEach(c=> c.classList.toggle('on', c.dataset.lv===lv));
    renderArticles(); renderGrammar(); renderVocab();
  }
  document.querySelectorAll('#level-filter .chip').forEach(c=> c.addEventListener('click', ()=> setLevel(c.dataset.lv)));
  function setCat(cat){
    filterCat = cat; localStorage.setItem(K.fcat, cat);
    document.querySelectorAll('#cat-filter .chip').forEach(c=> c.classList.toggle('on', c.dataset.cat===cat));
    renderArticles();
  }
  document.querySelectorAll('#cat-filter .chip').forEach(c=> c.addEventListener('click', ()=> setCat(c.dataset.cat)));
  function setGcat(g){
    filterGcat = g; localStorage.setItem(K.gcat, g);
    document.querySelectorAll('#gcat-filter .chip').forEach(c=> c.classList.toggle('on', c.dataset.gcat===g));
    renderGrammar();
  }
  document.querySelectorAll('#gcat-filter .chip').forEach(c=> c.addEventListener('click', ()=> setGcat(c.dataset.gcat)));

  function setTheme(t){
    document.body.className = 'theme-'+t + (showFuri?'':' no-furi');
    localStorage.setItem(K.theme, t);
    document.querySelectorAll('.theme-dot').forEach(d=> d.classList.toggle('on', d.dataset.theme===t));
  }
  document.querySelectorAll('.theme-dot').forEach(d=> d.addEventListener('click', ()=> setTheme(d.dataset.theme)));
  function applyFont(){
    document.documentElement.style.setProperty('--reading-size', fontSize+'px');
    localStorage.setItem(K.size, fontSize);
  }
  document.getElementById('font-up').addEventListener('click', ()=>{ fontSize=Math.min(30,fontSize+1); applyFont(); });
  document.getElementById('font-down').addEventListener('click', ()=>{ fontSize=Math.max(14,fontSize-1); applyFont(); });
  function setFuri(on){
    showFuri = on; localStorage.setItem(K.furi, on?'1':'0');
    document.body.classList.toggle('no-furi', !on);
    document.getElementById('furi-toggle').classList.toggle('on', on);
  }
  document.getElementById('furi-toggle').addEventListener('click', ()=> setFuri(!showFuri));

  // ===== Init =====
  function init(){
    // restore chrome
    setTheme(localStorage.getItem(K.theme) || 'paper');
    applyFont();
    setFuri(showFuri);
    // restore filters
    document.querySelectorAll('#level-filter .chip').forEach(c=> c.classList.toggle('on', c.dataset.lv===filterLv));
    document.querySelectorAll('#cat-filter .chip').forEach(c=> c.classList.toggle('on', c.dataset.cat===filterCat));
    document.querySelectorAll('#gcat-filter .chip').forEach(c=> c.classList.toggle('on', c.dataset.gcat===filterGcat));
    // render
    renderArticles(); renderGrammar(); renderVocab(); renderSaved(); updateStats();
    switchView(currentView);
  }
  init();
})();
</script>
</body>
</html>
